<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tecnomath · Acceso Supabase</title><style>body{font-family:Arial,sans-serif;background:#080812;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}.card{width:min(420px,92vw);background:#111124;border:1px solid #00ffff;border-radius:18px;padding:28px;box-shadow:0 0 30px #00ffff22}h1{text-align:center;color:#00ffff}input,button{width:100%;padding:13px;margin:6px 0;border-radius:9px;box-sizing:border-box}input{background:#080812;color:#fff;border:1px solid #444}button{border:0;background:#ff00aa;color:#fff;font-weight:bold;cursor:pointer}button.secondary{background:transparent;border:1px solid #00ffff;color:#00ffff}.msg{min-height:30px;color:#ff77cc;text-align:center;margin-top:10px}</style></head><body><main class="card"><h1>🧮 Tecnomath</h1><p>Acceso migrado a Supabase</p><div id="login"><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="enter">Entrar</button><button class="secondary" id="create">Crear cuenta</button><button class="secondary" id="recover">Recuperar contraseña</button></div><div id="register" hidden><input id="username" placeholder="Usuario"><input id="rEmail" type="email" placeholder="Correo"><input id="rPassword" type="password" placeholder="Contraseña"><button id="signup">Crear cuenta</button><button class="secondary" id="back">Volver</button></div><div class="msg" id="msg"></div></main><script src="../js/tecnomath-auth.js"></script><script>(async()=>{const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t;const home=()=>location.href='../index.html';$('create').onclick=()=>{$('login').hidden=true;$('register').hidden=false};$('back').onclick=()=>{$('register').hidden=true;$('login').hidden=false};$('enter').onclick=async()=>{try{const r=await TecnomathAuth.signIn($('email').value,$('password').value);msg('Bienvenido '+r.profile.username);setTimeout(home,500)}catch(e){msg(e.message)}};$('signup').onclick=async()=>{try{const r=await TecnomathAuth.signUp($('rEmail').value,$('rPassword').value,$('username').value);msg(r.session?'Cuenta creada':'Revisa tu correo para confirmar');if(r.session)setTimeout(home,500)}catch(e){msg(e.message)}};$('recover').onclick=async()=>{try{await TecnomathAuth.sendRecovery($('email').value);msg('Revisa tu correo para recuperar el acceso')}catch(e){msg(e.message)}};})();</script></body></html>
