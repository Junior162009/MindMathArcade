<style>
/* ═══════════════════════════════════════════════════════
   MINDFMATH ARCADE · RETRO-ELEGANT DESIGN SYSTEM
   ═══════════════════════════════════════════════════════ */
:root{
  /* Base */
  --bg-0:#06060c;
  --bg-1:#0b0b16;
  --bg-2:#111120;

  /* Surfaces — glassmorphism refinado */
  --surface:rgba(22,22,38,.72);
  --surface-2:rgba(30,30,52,.55);
  --surface-3:rgba(38,38,62,.4);
  --surface-solid:#13131f;

  /* Bordes — cálidos, sutiles, dobles */
  --border:rgba(210,210,235,.08);
  --border-strong:rgba(220,220,245,.16);
  --border-warm:rgba(255,200,120,.14);

  /* Neon palette refinada */
  --cyan:#5ee7ff;
  --pink:#ff5ed4;
  --purple:#b18cff;
  --green:#5affa0;
  --orange:#ffb158;
  --red:#ff5470;
  --gold:#ffd57a;
  --yellow:#ffe98a;

  /* Text */
  --t-1:#f6f5ff;
  --t-2:#b4b2c9;
  --t-3:#77748e;

  /* Sizing */
  --r-sm:9px;
  --r-md:14px;
  --r-lg:20px;
  --r-xl:28px;
  --tap:46px;
  --fs-xs:11px; --fs-sm:13px; --fs-md:15px;
  --fs-lg:19px; --fs-xl:26px; --fs-2xl:36px;

  /* Motion */
  --ease-out:cubic-bezier(.22,.86,.34,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);

  /* Glow constants (refinados, elegantes) */
  --glow-cyan:0 0 24px rgba(94,231,255,.22);
  --glow-pink:0 0 24px rgba(255,94,212,.22);
  --glow-gold:0 0 24px rgba(255,213,122,.25);
  --glow-green:0 0 24px rgba(90,255,160,.22);
}

/* ─── Temas alternativos ─── */
body[data-theme="gold"]{
  --cyan:#ffd57a; --pink:#ff9460; --purple:#e8636a; --green:#a8ff8a;
  --bg-0:#0a0705; --bg-1:#150f08; --bg-2:#1c140a;
}
body[data-theme="matrix"]{
  --cyan:#5affa0; --pink:#4dffd6; --purple:#22dba8; --green:#a8ffc4;
  --bg-0:#03100a; --bg-1:#051a10; --bg-2:#07241a;
}
body[data-theme="aurora"]{
  --cyan:#6dccff; --pink:#b18cff; --purple:#8d6ee8; --green:#7ce6a4;
  --bg-0:#050912; --bg-1:#0a1124; --bg-2:#0e1730;
}

body.a11y{
  --fs-xs:14px; --fs-sm:16px; --fs-md:18px;
  --fs-lg:22px; --fs-xl:30px; --fs-2xl:42px;
  --tap:56px;
  --t-2:#d4d4e2; --t-3:#a8a8c0;
  --border:rgba(255,255,255,.16);
  --border-strong:rgba(255,255,255,.3);
}

/* ═══════════════════════════════════════════════════════
   RESET · BASE
   ═══════════════════════════════════════════════════════ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',-apple-system,system-ui,sans-serif;color:var(--t-1);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* Fondo principal: gradientes ricos + malla sutil + scanlines + viñeta */
body{
  background:var(--bg-0);
  background-image:
    radial-gradient(1100px 700px at 12% -8%,rgba(94,231,255,.10),transparent 55%),
    radial-gradient(900px 600px at 100% 8%,rgba(255,94,212,.09),transparent 50%),
    radial-gradient(1200px 900px at 50% 120%,rgba(177,140,255,.10),transparent 60%),
    linear-gradient(180deg,var(--bg-0),var(--bg-1));
  font-size:var(--fs-sm);
  line-height:1.5;
}
/* Malla retro sutil */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(210,210,235,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(210,210,235,.028) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%);
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%);
}
/* Scanlines CRT + viñeta */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.09) 3px,rgba(0,0,0,.09) 4px),
    radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55) 120%);
  mix-blend-mode:multiply;
  opacity:.85;
}

/* ═══════════════════════════════════════════════════════
   APP SHELL
   ═══════════════════════════════════════════════════════ */
#app{
  position:relative;z-index:1;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  max-width:560px;margin:0 auto;
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}

/* ═══════════════════════════════════════════════════════
   HEADER — arcade cabinet top
   ═══════════════════════════════════════════════════════ */
header{
  position:relative;
  padding:14px 16px 12px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(12,12,22,.85),rgba(10,10,20,.6));
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  flex-shrink:0;
}
header::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--pink),transparent);
  opacity:.5;
}
.header-mid{flex:1;min-width:0;text-align:center;padding:0 4px}
.header-title{
  font-family:'Orbitron',sans-serif;
  font-size:13px;font-weight:800;letter-spacing:3px;
  background:linear-gradient(90deg,var(--cyan) 0%,var(--pink) 55%,var(--purple) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(94,231,255,.3));
}
.header-rank{
  margin-top:4px;
  font-family:'Press Start 2P',monospace;
  font-size:8px;color:var(--pink);
  text-shadow:0 0 10px rgba(255,94,212,.55);
  letter-spacing:1.5px;
}
.header-rank.admin-glow{
  color:var(--gold);
  text-shadow:0 0 12px rgba(255,213,122,.7);
}

.icon-btn{
  width:36px;height:36px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:10px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,.04),transparent),var(--surface-2);
  font-size:15px;line-height:1;cursor:pointer;color:var(--t-1);
  transition:all .25s var(--ease-out);
  flex-shrink:0;
  position:relative;overflow:hidden;
}
.icon-btn::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at center,rgba(94,231,255,.22),transparent 70%);
  opacity:0;transition:opacity .25s var(--ease-out);
}
.icon-btn:hover{
  border-color:var(--border-strong);
  transform:translateY(-1px);
  box-shadow:0 8px 24px -10px rgba(94,231,255,.35);
}
.icon-btn:hover::before{opacity:1}
.icon-btn:active{transform:scale(.94)}
.icon-btn.active{
  border-color:var(--cyan);
  color:var(--cyan);
  box-shadow:inset 0 0 0 1px rgba(94,231,255,.4),0 0 20px -6px rgba(94,231,255,.5);
}

.coins-display{
  display:flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:100px;
  border:1px solid var(--border-warm);
  background:linear-gradient(180deg,rgba(255,213,122,.04),transparent),var(--surface-2);
  font-size:12px;font-weight:600;
  color:var(--gold);
  flex-shrink:0;
  font-variant-numeric:tabular-nums;
}
.coins-display.global{color:var(--cyan);border-color:rgba(94,231,255,.16)}
.coins-display span{font-family:'Orbitron',sans-serif;letter-spacing:.5px}

.btn-exit-admin-game{
  font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
  background:linear-gradient(180deg,rgba(255,84,112,.22),rgba(255,84,112,.10));
  color:#ffb4c1;
  border:1px solid rgba(255,84,112,.45);
  padding:8px 14px;border-radius:100px;cursor:pointer;
  transition:all .25s var(--ease-out);
  white-space:nowrap;
  letter-spacing:.3px;
}
.btn-exit-admin-game:hover{
  background:linear-gradient(180deg,rgba(255,84,112,.35),rgba(255,84,112,.18));
  color:#fff;
  box-shadow:0 0 20px -6px rgba(255,84,112,.6);
}

/* ═══════════════════════════════════════════════════════
   HUD — Instrumentación
   ═══════════════════════════════════════════════════════ */
.hud{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(10,10,20,.5),transparent);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  flex-shrink:0;
}
.hud-stat{
  position:relative;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px;
  border-radius:var(--r-sm);
  background:linear-gradient(180deg,rgba(255,255,255,.025),transparent);
  border:1px solid rgba(255,255,255,.05);
  overflow:hidden;
}
.hud-stat::before{
  content:'';position:absolute;top:0;left:14%;right:14%;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:.4;
}
.hud-label{
  font-family:'Press Start 2P',monospace;
  font-size:7px;color:var(--t-3);letter-spacing:.8px;
}
.hud-val{
  font-family:'Orbitron',sans-serif;
  font-size:16px;font-weight:800;color:var(--cyan);
  text-shadow:0 0 12px rgba(94,231,255,.45);
  transition:transform .3s var(--ease-spring);
  font-variant-numeric:tabular-nums;
}
.hud-val.lose{animation:lifeLoss .8s var(--ease-out)}
@keyframes lifeLoss{
  0%,100%{color:var(--cyan);transform:scale(1);text-shadow:0 0 12px rgba(94,231,255,.45)}
  25%{color:var(--red);transform:scale(1.5);text-shadow:0 0 22px rgba(255,84,112,.9)}
  60%{color:var(--red);transform:scale(.85)}
}

/* ═══════════════════════════════════════════════════════
   VIEWS
   ═══════════════════════════════════════════════════════ */
.view{
  flex:1;display:flex;flex-direction:column;
  overflow-y:auto;min-height:0;
  animation:viewIn .45s var(--ease-out) both;
}
.view.hidden{display:none!important}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Scrollbar refinada */
.view::-webkit-scrollbar{width:8px}
.view::-webkit-scrollbar-track{background:transparent}
.view::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,rgba(94,231,255,.3),rgba(255,94,212,.2));
  border-radius:100px;
  border:2px solid transparent;background-clip:padding-box;
}

/* ═══════════════════════════════════════════════════════
   SEARCH
   ═══════════════════════════════════════════════════════ */
.search-wrap{padding:14px 14px 0;flex-shrink:0;position:relative}
.search-input{
  width:100%;padding:13px 18px 13px 44px;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:500;
  color:var(--t-1);
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent),var(--surface);
  border:1px solid var(--border);
  border-radius:100px;outline:none;
  transition:all .25s var(--ease-out);
  backdrop-filter:blur(12px);
}
.search-input::placeholder{color:var(--t-3)}
.search-input:focus{
  border-color:rgba(94,231,255,.5);
  box-shadow:0 0 0 3px rgba(94,231,255,.12),0 0 24px -6px rgba(94,231,255,.35);
  background:linear-gradient(180deg,rgba(94,231,255,.06),transparent),var(--surface);
}
.search-wrap::before{
  content:'🔍';
  position:absolute;
  top:calc(14px + 13px);
  left:calc(14px + 18px);
  font-size:14px;
  z-index:1;pointer-events:none;
  opacity:.7;
}

/* ═══════════════════════════════════════════════════════
   CATEGORY TABS
   ═══════════════════════════════════════════════════════ */
.cat-tabs{
  display:flex;gap:6px;padding:14px 14px 10px;
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;
}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{
  white-space:nowrap;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
  padding:9px 15px;border-radius:100px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--surface);
  color:var(--t-2);cursor:pointer;
  transition:all .3s var(--ease-out);
  flex-shrink:0;
  backdrop-filter:blur(12px);
  position:relative;
}
.cat-tab:hover{
  color:var(--t-1);
  border-color:var(--border-strong);
  transform:translateY(-1px);
}
.cat-tab.active{
  color:#fff;border-color:transparent;
  background:linear-gradient(135deg,rgba(94,231,255,.22),rgba(255,94,212,.16));
  box-shadow:
    0 6px 22px -8px rgba(94,231,255,.55),
    inset 0 0 0 1px rgba(94,231,255,.45);
}
.cat-tab.ods-tab.active{
  background:linear-gradient(135deg,rgba(255,213,122,.26),rgba(255,177,88,.16));
  box-shadow:
    0 6px 22px -8px rgba(255,213,122,.55),
    inset 0 0 0 1px rgba(255,213,122,.5);
}

/* ═══════════════════════════════════════════════════════
   MENU GRID
   ═══════════════════════════════════════════════════════ */
#menu-view .game-grid{
  flex:1;overflow-y:auto;
  padding:10px 14px 24px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:12px;
  align-content:start;
}
.game-slot{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:16px 10px;min-height:104px;
  border-radius:var(--r-md);
  border:1px solid var(--border);
  background:
    linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,0)),
    var(--surface);
  backdrop-filter:blur(14px) saturate(130%);
  -webkit-backdrop-filter:blur(14px) saturate(130%);
  cursor:pointer;overflow:hidden;
  transition:all .35s var(--ease-out);
  animation:cardIn .5s var(--ease-out) both;
}
/* Esquinas de arcade */
.game-slot::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    linear-gradient(135deg,var(--cyan) 0 6px,transparent 6px) top left/14px 14px no-repeat,
    linear-gradient(-135deg,var(--cyan) 0 6px,transparent 6px) top right/14px 14px no-repeat,
    linear-gradient(45deg,var(--cyan) 0 6px,transparent 6px) bottom left/14px 14px no-repeat,
    linear-gradient(-45deg,var(--cyan) 0 6px,transparent 6px) bottom right/14px 14px no-repeat;
  opacity:0;transition:opacity .35s var(--ease-out);
}
.game-slot::after{
  content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;
  background:linear-gradient(135deg,rgba(94,231,255,.5),transparent 40%,rgba(255,94,212,.4));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .35s var(--ease-out);pointer-events:none;
}
.game-slot:hover:not(.locked){
  transform:translateY(-4px) scale(1.02);
  border-color:var(--border-strong);
  box-shadow:
    0 24px 48px -18px rgba(94,231,255,.4),
    0 0 0 1px rgba(94,231,255,.15) inset;
}
.game-slot:hover:not(.locked)::before,
.game-slot:hover:not(.locked)::after{opacity:1}
.game-slot:active:not(.locked){transform:translateY(-1px) scale(.99)}
@keyframes cardIn{
  from{opacity:0;transform:translateY(14px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.game-slot.locked{opacity:.3;filter:grayscale(.9);cursor:not-allowed}
.game-slot .slot-emoji{
  font-size:30px;
  filter:drop-shadow(0 4px 14px rgba(94,231,255,.28));
  transition:transform .35s var(--ease-spring);
  line-height:1;
}
.game-slot:hover:not(.locked) .slot-emoji{transform:scale(1.16) rotate(-4deg)}
.game-slot .slot-name{
  font-size:11px;font-weight:600;color:var(--t-2);
  line-height:1.25;text-align:center;letter-spacing:.25px;
  text-transform:uppercase;
}
.game-slot .slot-lvl{
  font-family:'Press Start 2P',monospace;
  font-size:7px;color:var(--t-3);letter-spacing:1px;
}
.game-slot.completed{
  border-color:rgba(90,255,160,.4);
  background:linear-gradient(160deg,rgba(90,255,160,.09),rgba(90,255,160,.01)),var(--surface);
}
.game-slot.completed::before{
  content:'✓';
  position:absolute;top:9px;right:10px;
  width:20px;height:20px;border-radius:50%;
  background:linear-gradient(135deg,var(--green),#26b870);
  color:#002e18;font-size:12px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 16px rgba(90,255,160,.55),inset 0 1px 0 rgba(255,255,255,.3);
  opacity:1;
  background-image:linear-gradient(135deg,var(--green),#26b870);
  /* override corner brackets */
  inset:auto;right:10px;top:9px;
  -webkit-mask:none;mask:none;
}
.game-slot.ods-slot{border-color:rgba(255,213,122,.26)}
.game-slot.ods-slot.completed{
  border-color:rgba(255,213,122,.55);
  background:linear-gradient(160deg,rgba(255,213,122,.11),rgba(255,213,122,.01)),var(--surface);
  box-shadow:0 0 26px -8px rgba(255,213,122,.35);
}
.game-slot .fav-btn{
  position:absolute;top:8px;left:8px;
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);
  border:1px solid var(--border);
  font-size:12px;cursor:pointer;
  opacity:0;transition:opacity .25s var(--ease-out),transform .25s var(--ease-spring);
  color:var(--t-3);
  z-index:2;
}
.game-slot:hover .fav-btn{opacity:1}
.game-slot .fav-btn:hover{transform:scale(1.15)}
.game-slot .fav-btn.on{
  opacity:1;
  color:var(--gold);
  border-color:rgba(255,213,122,.55);
  background:rgba(255,213,122,.18);
  box-shadow:0 0 14px -2px rgba(255,213,122,.6);
}
.game-slot.daily-slot{
  border-color:rgba(255,177,88,.5);
  box-shadow:0 0 32px -6px rgba(255,177,88,.45);
}
.game-slot.daily-slot::before{
  content:'📅';
  position:absolute;top:8px;right:8px;
  font-size:14px;
  animation:dailyPulse 2s ease-in-out infinite;
  inset:auto;
  background:none;
  -webkit-mask:none;mask:none;
}
@keyframes dailyPulse{50%{transform:scale(1.25)}}

/* ═══════════════════════════════════════════════════════
   GAME VIEW
   ═══════════════════════════════════════════════════════ */
#game-view{
  padding:0;
  background:
    radial-gradient(800px 500px at 50% -10%,rgba(94,231,255,.08),transparent 55%),
    transparent;
}
#game-content{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;
  overflow-y:auto;
  padding:22px 16px 10px;
}
.game-topbar{
  width:100%;max-width:460px;
  display:flex;flex-direction:column;gap:12px;
  animation:slideInUp .55s var(--ease-out) both;
}
@keyframes slideInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.game-title{
  font-family:'Orbitron',sans-serif;
  font-size:17px;font-weight:800;letter-spacing:2px;
  text-align:center;
  background:linear-gradient(90deg,var(--cyan),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(94,231,255,.3));
}
.game-meta{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--t-2);font-weight:500;
  padding:0 4px;
}
.game-meta b{color:var(--t-1);font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.5px}

.progress-wrap{
  width:100%;height:6px;
  background:rgba(255,255,255,.05);
  border-radius:100px;overflow:hidden;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.progress-fill{
  height:100%;border-radius:100px;
  background:linear-gradient(90deg,var(--cyan),var(--pink),var(--purple));
  background-size:200% 100%;
  animation:gradientShift 3s linear infinite;
  transition:width .5s var(--ease-out);
  box-shadow:0 0 14px rgba(94,231,255,.5);
}
@keyframes gradientShift{to{background-position:200% 0}}
.game-timer-bar{
  width:100%;height:8px;
  background:rgba(255,255,255,.05);
  border-radius:100px;overflow:hidden;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.game-timer-fill{
  height:100%;border-radius:100px;
  background:linear-gradient(90deg,var(--green),var(--cyan));
  transition:width .12s linear,background .35s var(--ease-out);
  box-shadow:0 0 14px rgba(90,255,160,.5);
  position:relative;
}
.game-timer-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  animation:shine 2.2s linear infinite;
}
@keyframes shine{to{transform:translateX(100%)}}
.game-timer-fill.warn{
  background:linear-gradient(90deg,var(--orange),var(--yellow));
  box-shadow:0 0 14px rgba(255,177,88,.6);
}
.game-timer-fill.danger{
  background:linear-gradient(90deg,var(--red),#ff90a8);
  box-shadow:0 0 18px rgba(255,84,112,.75);
  animation:dangerFlash .5s ease-in-out infinite;
}
@keyframes dangerFlash{50%{opacity:.55}}

/* ═══════════════════════════════════════════════════════
   PROBLEM CARD
   ═══════════════════════════════════════════════════════ */
.math-problem{
  width:100%;max-width:460px;
  padding:30px 22px;
  text-align:center;
  font-family:'Orbitron',sans-serif;
  font-size:var(--fs-2xl);font-weight:800;letter-spacing:3px;
  color:var(--t-1);
  text-shadow:0 0 24px rgba(94,231,255,.45),0 2px 0 rgba(0,0,0,.6);
  border-radius:var(--r-lg);
  border:1px solid var(--border);
  background:
    linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,0)),
    var(--surface);
  backdrop-filter:blur(18px) saturate(130%);
  -webkit-backdrop-filter:blur(18px) saturate(130%);
  position:relative;overflow:hidden;
  animation:slideInUp .55s var(--ease-out) .05s both;
  box-shadow:
    0 24px 60px -30px rgba(0,0,0,.9),
    inset 0 1px 0 rgba(255,255,255,.06);
}
.math-problem::before{
  content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(94,231,255,.45),transparent 40%,rgba(255,94,212,.35));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.65;
}
.math-problem::after{
  content:'';position:absolute;top:0;left:14%;right:14%;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:.5;
}
.math-problem.small{
  font-family:'Inter',sans-serif;
  font-size:var(--fs-md);font-weight:600;
  letter-spacing:.1px;line-height:1.65;
  padding:24px 20px;
}
.math-input{
  font-family:'Orbitron',sans-serif;
  font-size:36px;font-weight:800;letter-spacing:5px;
  color:var(--cyan);
  text-shadow:0 0 22px rgba(94,231,255,.65);
  min-height:48px;
  text-align:center;
  animation:slideInUp .55s var(--ease-out) .1s both;
  font-variant-numeric:tabular-nums;
}

/* ═══════════════════════════════════════════════════════
   NUMPAD
   ═══════════════════════════════════════════════════════ */
.numpad{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;width:100%;max-width:320px;
  animation:slideInUp .55s var(--ease-out) .15s both;
}
.key{
  display:flex;align-items:center;justify-content:center;
  min-height:var(--tap);padding:14px 6px;
  font-family:'Orbitron',sans-serif;
  font-size:19px;font-weight:700;
  color:var(--t-1);cursor:pointer;user-select:none;
  border-radius:var(--r-md);
  border:1px solid var(--border);
  background:
    linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0)),
    var(--surface);
  backdrop-filter:blur(12px);
  transition:all .18s var(--ease-out);
  position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  font-variant-numeric:tabular-nums;
}
.key:hover{
  border-color:var(--border-strong);
  background:linear-gradient(180deg,rgba(94,231,255,.14),rgba(94,231,255,.02)),var(--surface);
  transform:translateY(-2px);
  box-shadow:
    0 12px 26px -10px rgba(94,231,255,.5),
    inset 0 1px 0 rgba(255,255,255,.1);
}
.key:active{transform:translateY(0) scale(.96);transition-duration:.06s}
.key.special{
  background:linear-gradient(135deg,rgba(90,255,160,.22),rgba(94,231,255,.14));
  border-color:rgba(90,255,160,.45);
  color:#bcffe0;
}
.key.special:hover{
  background:linear-gradient(135deg,rgba(90,255,160,.35),rgba(94,231,255,.22));
  box-shadow:0 12px 30px -10px rgba(90,255,160,.6);
}

/* ═══════════════════════════════════════════════════════
   MCQ
   ═══════════════════════════════════════════════════════ */
.mcq-options{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;width:100%;max-width:460px;
}
@media (max-width:400px){.mcq-options{grid-template-columns:1fr}}
.mcq-btn{
  display:flex;align-items:center;justify-content:center;
  min-height:var(--tap);padding:16px 14px;
  font-family:'Inter',sans-serif;font-size:15px;font-weight:600;
  text-align:center;line-height:1.4;letter-spacing:.1px;
  color:var(--t-1);cursor:pointer;word-break:break-word;
  border-radius:var(--r-md);
  border:1px solid var(--border);
  background:
    linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0)),
    var(--surface);
  backdrop-filter:blur(12px);
  transition:all .22s var(--ease-out);
  animation:mcqIn .45s var(--ease-out) both;
  position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.mcq-btn:nth-child(1){animation-delay:.05s}
.mcq-btn:nth-child(2){animation-delay:.10s}
.mcq-btn:nth-child(3){animation-delay:.15s}
.mcq-btn:nth-child(4){animation-delay:.20s}
@keyframes mcqIn{
  from{opacity:0;transform:translateY(14px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.mcq-btn:hover{
  border-color:var(--border-strong);
  transform:translateY(-2px);
  background:linear-gradient(180deg,rgba(94,231,255,.12),rgba(94,231,255,.01)),var(--surface);
  box-shadow:0 14px 30px -12px rgba(94,231,255,.45);
}
.mcq-btn:active{transform:translateY(0) scale(.98);transition-duration:.06s}
.mcq-btn.correct{
  border-color:rgba(90,255,160,.7);
  background:linear-gradient(135deg,rgba(90,255,160,.24),rgba(90,255,160,.06));
  color:#daffe9;
  box-shadow:
    0 0 32px rgba(90,255,160,.45),
    inset 0 0 0 1px rgba(90,255,160,.5);
  animation:correctPop .55s var(--ease-spring);
}
.mcq-btn.wrong{
  border-color:rgba(255,84,112,.7);
  background:linear-gradient(135deg,rgba(255,84,112,.22),rgba(255,84,112,.06));
  color:#ffd7de;
  animation:shakeX .45s var(--ease-out);
}
@keyframes correctPop{
  0%{transform:scale(1)}
  40%{transform:scale(1.06)}
  70%{transform:scale(.98)}
  100%{transform:scale(1)}
}
@keyframes shakeX{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}

/* ═══════════════════════════════════════════════════════
   MEMORY CARDS
   ═══════════════════════════════════════════════════════ */
.memory-grid{display:grid;gap:8px;width:100%;max-width:460px;perspective:1000px}
.mem-card{
  aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;cursor:pointer;user-select:none;
  border-radius:var(--r-md);
  background:linear-gradient(135deg,rgba(177,140,255,.4),rgba(255,94,212,.26));
  border:1px solid rgba(177,140,255,.45);
  transition:all .35s var(--ease-out);
  transform-style:preserve-3d;
  box-shadow:0 8px 22px -8px rgba(177,140,255,.45),inset 0 1px 0 rgba(255,255,255,.15);
}
.mem-card:hover:not(.hidden):not(.matched){transform:translateY(-3px) scale(1.03)}
.mem-card.hidden{
  background:linear-gradient(135deg,rgba(42,22,66,.9),rgba(22,12,42,.9));
  border-color:var(--border);
  box-shadow:inset 0 0 22px rgba(0,0,0,.55);
}
.mem-card.hidden span{opacity:0;transform:scale(.5)}
.mem-card span{transition:all .3s var(--ease-spring)}
.mem-card.matched{
  background:linear-gradient(135deg,rgba(90,255,160,.3),rgba(0,180,120,.16));
  border-color:rgba(90,255,160,.65);
  box-shadow:
    0 0 28px rgba(90,255,160,.45),
    inset 0 0 14px rgba(90,255,160,.2);
  cursor:default;
  animation:correctPop .5s var(--ease-spring);
}

/* ═══════════════════════════════════════════════════════
   LETTERS / WORDS
   ═══════════════════════════════════════════════════════ */
.word-letters{
  display:flex;flex-wrap:wrap;gap:8px;
  justify-content:center;max-width:460px;
}
.letter-tile{
  min-width:48px;height:48px;padding:0 12px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',sans-serif;
  font-size:17px;font-weight:700;
  color:var(--t-1);cursor:pointer;user-select:none;
  border-radius:var(--r-sm);
  border:1px solid var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0)),var(--surface);
  transition:all .22s var(--ease-out);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.letter-tile:hover:not(.selected){
  border-color:var(--border-strong);
  transform:translateY(-2px);
  background:linear-gradient(180deg,rgba(94,231,255,.15),rgba(94,231,255,.02)),var(--surface);
  box-shadow:0 10px 22px -10px rgba(94,231,255,.5);
}
.letter-tile.selected{
  border-color:rgba(255,94,212,.55);
  background:linear-gradient(135deg,rgba(255,94,212,.22),rgba(177,140,255,.15));
  color:#fff;opacity:.45;transform:scale(.94);
}
.word-answer{
  display:flex;gap:6px;min-height:54px;
  flex-wrap:wrap;justify-content:center;align-items:center;
}
.answer-slot{
  min-width:48px;height:48px;padding:0 12px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',sans-serif;
  font-size:17px;font-weight:700;
  color:var(--t-1);
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  border-bottom:2px solid rgba(94,231,255,.55);
  border-radius:var(--r-sm);
  transition:all .25s var(--ease-spring);
  animation:slotPulse .4s var(--ease-spring) both;
}
@keyframes slotPulse{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

/* ═══════════════════════════════════════════════════════
   FEEDBACK BOX
   ═══════════════════════════════════════════════════════ */
.feedback-box{
  padding:14px;width:100%;max-width:460px;
  text-align:center;font-size:var(--fs-sm);font-weight:600;
  display:none;border-radius:var(--r-md);
}
.feedback-box.win{
  display:block;color:#bcffe0;
  border:1px solid rgba(90,255,160,.5);
  background:rgba(90,255,160,.08);
}
.feedback-box.lose{
  display:block;color:#ffb8c7;
  border:1px solid rgba(255,84,112,.5);
  background:rgba(255,84,112,.08);
}

/* ═══════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════ */
.btn-main{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--tap);padding:14px 22px;
  font-family:'Inter',sans-serif;font-size:15px;font-weight:700;
  letter-spacing:.4px;color:#fff;cursor:pointer;border:none;
  border-radius:var(--r-md);width:100%;max-width:460px;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  box-shadow:
    0 10px 28px -10px rgba(255,94,212,.6),
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(0,0,0,.2);
  transition:all .25s var(--ease-out);
  position:relative;overflow:hidden;
}
.btn-main::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.28),transparent 70%);
  transform:translateX(-100%);
  transition:transform .7s var(--ease-out);
}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 16px 36px -12px rgba(255,94,212,.7),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-main:hover::after{transform:translateX(100%)}
.btn-main:active{transform:translateY(0) scale(.98);transition-duration:.06s}

.btn-secondary{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--tap);padding:13px 18px;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
  letter-spacing:.3px;color:var(--t-2);cursor:pointer;
  border-radius:var(--r-md);width:100%;max-width:460px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--surface);
  backdrop-filter:blur(12px);
  transition:all .25s var(--ease-out);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.btn-secondary:hover{
  color:var(--t-1);border-color:var(--border-strong);
  background:linear-gradient(180deg,rgba(255,255,255,.06),transparent),var(--surface);
  transform:translateY(-1px);
}
.btn-secondary:active{transform:scale(.98)}

.btn-danger{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--tap);padding:13px 18px;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
  color:#ffb8c7;cursor:pointer;border-radius:var(--r-md);
  width:100%;max-width:460px;
  border:1px solid rgba(255,84,112,.42);
  background:linear-gradient(180deg,rgba(255,84,112,.10),rgba(255,84,112,.04));
  transition:all .25s var(--ease-out);
}
.btn-danger:hover{
  background:linear-gradient(180deg,rgba(255,84,112,.20),rgba(255,84,112,.10));
  color:#fff;
  box-shadow:0 0 24px -6px rgba(255,84,112,.5);
}

/* ═══════════════════════════════════════════════════════
   SHOP / SCORES / ODS / ACHIEVEMENTS
   ═══════════════════════════════════════════════════════ */
#shop-view,#scores-view,#ods-view,#achievements-view{
  padding:22px 16px;gap:12px;position:relative;
}
.shop-title{
  font-family:'Orbitron',sans-serif;
  font-size:22px;font-weight:800;letter-spacing:2px;text-align:center;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,94,212,.3));
}
.shop-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:17px;border-radius:var(--r-md);
  border:1px solid var(--border);
  background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,0)),var(--surface);
  backdrop-filter:blur(12px);
  cursor:pointer;font-size:14px;font-weight:600;
  transition:all .28s var(--ease-out);
  animation:cardIn .45s var(--ease-out) both;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.shop-item:hover{
  border-color:rgba(255,213,122,.5);
  background:linear-gradient(135deg,rgba(255,213,122,.07),rgba(255,213,122,.01)),var(--surface);
  transform:translateX(4px);
  box-shadow:0 12px 28px -12px rgba(255,213,122,.5);
}
.shop-item-price{
  color:var(--gold);font-family:'Orbitron',sans-serif;
  font-weight:800;font-size:14px;
  font-variant-numeric:tabular-nums;
}

.close-btn{
  position:absolute;top:16px;right:18px;
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,.04),transparent),var(--surface);
  color:var(--t-2);font-size:16px;cursor:pointer;
  transition:all .25s var(--ease-out);
  z-index:10;
}
.close-btn:hover{
  color:var(--t-1);
  border-color:var(--border-strong);
  transform:rotate(90deg);
  box-shadow:0 0 20px -6px rgba(94,231,255,.4);
}

.progress-wrap-lg{
  width:100%;max-width:460px;height:12px;
  background:rgba(255,255,255,.05);border-radius:100px;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.progress-fill-lg{
  height:100%;border-radius:100px;
  background:linear-gradient(90deg,var(--cyan),var(--pink));
  transition:width .8s var(--ease-out);
  box-shadow:0 0 16px rgba(94,231,255,.5);
}

/* ═══════════════════════════════════════════════════════
   SEQUENCE
   ═══════════════════════════════════════════════════════ */
.seq-display{
  display:flex;flex-wrap:wrap;gap:10px;
  justify-content:center;max-width:460px;
  animation:slideInUp .55s var(--ease-out) .1s both;
}
.seq-num{
  min-width:54px;height:54px;padding:0 14px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',sans-serif;
  font-size:18px;font-weight:700;color:var(--cyan);
  border-radius:var(--r-md);
  border:1px solid rgba(94,231,255,.3);
  background:linear-gradient(180deg,rgba(94,231,255,.08),rgba(94,231,255,.01)),var(--surface);
  box-shadow:inset 0 0 14px rgba(94,231,255,.1);
  animation:slotPulse .4s var(--ease-spring) both;
  font-variant-numeric:tabular-nums;
}
.seq-question{
  color:var(--gold);
  border-color:rgba(255,213,122,.55);
  background:linear-gradient(180deg,rgba(255,213,122,.15),rgba(255,213,122,.02)),var(--surface);
  animation:questionPulse 1.4s ease-in-out infinite;
}
@keyframes questionPulse{
  0%,100%{box-shadow:inset 0 0 14px rgba(255,213,122,.22),0 0 0 rgba(255,213,122,0)}
  50%{box-shadow:inset 0 0 22px rgba(255,213,122,.4),0 0 24px rgba(255,213,122,.4)}
}

/* ═══════════════════════════════════════════════════════
   ODS DASHBOARD
   ═══════════════════════════════════════════════════════ */
.ods-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;min-height:96px;padding:14px 10px;
  border-radius:var(--r-md);
  border:2px solid rgba(177,140,255,.32);
  background:linear-gradient(160deg,rgba(255,255,255,.03),transparent),var(--surface);
  backdrop-filter:blur(12px);
  cursor:pointer;font-size:11px;text-align:center;
  transition:all .3s var(--ease-out);
  animation:cardIn .45s var(--ease-out) both;
}
.ods-card:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 30px -14px rgba(177,140,255,.55);
}
.ods-card.completed{
  border-color:rgba(255,213,122,.65);
  background:linear-gradient(135deg,rgba(255,213,122,.12),rgba(255,213,122,.02)),var(--surface);
  box-shadow:0 0 26px -6px rgba(255,213,122,.4);
}
.ods-card .ods-icon{font-size:28px;filter:drop-shadow(0 3px 10px rgba(255,213,122,.3))}
.dash-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:10px;padding:4px;
}

/* ═══════════════════════════════════════════════════════
   ACHIEVEMENTS
   ═══════════════════════════════════════════════════════ */
.ach-item{
  display:flex;align-items:center;gap:13px;padding:15px;
  border-radius:var(--r-md);
  border:1px solid var(--border);
  background:linear-gradient(160deg,rgba(255,255,255,.03),transparent),var(--surface);
  backdrop-filter:blur(12px);
  transition:all .3s var(--ease-out);
  animation:cardIn .45s var(--ease-out) both;
}
.ach-item.unlocked{
  border-color:rgba(255,213,122,.5);
  background:linear-gradient(135deg,rgba(255,213,122,.09),rgba(255,213,122,.01)),var(--surface);
  box-shadow:0 0 24px -6px rgba(255,213,122,.28);
}
.ach-icon{
  width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  filter:grayscale(1);opacity:.5;
  transition:all .3s var(--ease-out);
}
.ach-item.unlocked .ach-icon{
  filter:none;opacity:1;
  background:linear-gradient(135deg,rgba(255,213,122,.22),rgba(255,177,88,.15));
  border-color:rgba(255,213,122,.55);
  box-shadow:0 0 18px rgba(255,213,122,.45);
}
.ach-info{flex:1;min-width:0}
.ach-name{font-size:13px;font-weight:700;color:var(--t-1);margin-bottom:3px;letter-spacing:.2px}
.ach-desc{font-size:11px;color:var(--t-3);line-height:1.35}
.ach-item.unlocked .ach-name{color:var(--gold)}
.ach-check{font-size:16px;color:var(--t-3);flex-shrink:0}
.ach-item.unlocked .ach-check{color:var(--gold)}
.ach-summary{
  display:flex;align-items:center;gap:16px;padding:18px;
  border-radius:var(--r-md);
  border:1px solid rgba(255,213,122,.3);
  background:linear-gradient(135deg,rgba(255,213,122,.08),rgba(255,177,88,.02)),var(--surface);
  margin-bottom:8px;
}
.ach-summary-num{
  font-family:'Orbitron',sans-serif;font-size:34px;font-weight:900;
  color:var(--gold);
  text-shadow:0 0 22px rgba(255,213,122,.55);
  font-variant-numeric:tabular-nums;
}
.ach-summary-lbl{font-size:12px;color:var(--t-2);line-height:1.4}

/* ═══════════════════════════════════════════════════════
   FOOTER
   ═══════════════════════════════════════════════════════ */
footer{
  position:relative;
  display:flex;gap:6px;padding:12px 14px 16px;
  border-top:1px solid var(--border);
  background:linear-gradient(180deg,transparent,rgba(10,10,20,.7));
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  flex-shrink:0;
}
footer::before{
  content:'';position:absolute;left:0;right:0;top:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--pink),var(--cyan),transparent);
  opacity:.4;
}
.footer-btn{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:var(--tap);min-width:0;padding:11px 8px;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
  letter-spacing:.25px;color:var(--t-3);cursor:pointer;
  border-radius:var(--r-md);
  border:1px solid transparent;background:transparent;
  transition:all .25s var(--ease-out);
}
.footer-btn:hover{color:var(--t-1);background:rgba(255,255,255,.045)}
.footer-btn.active-tab{
  color:var(--cyan);
  background:linear-gradient(135deg,rgba(94,231,255,.16),rgba(94,231,255,.03));
  box-shadow:inset 0 0 0 1px rgba(94,231,255,.4),0 0 18px -8px rgba(94,231,255,.5);
}
.footer-btn[data-gold].active-tab{
  color:var(--gold);
  background:linear-gradient(135deg,rgba(255,213,122,.16),rgba(255,213,122,.03));
  box-shadow:inset 0 0 0 1px rgba(255,213,122,.45),0 0 18px -8px rgba(255,213,122,.5);
}

/* ═══════════════════════════════════════════════════════
   POPUPS
   ═══════════════════════════════════════════════════════ */
.score-popup{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.6);
  padding:24px 36px;text-align:center;border-radius:var(--r-lg);
  border:1px solid rgba(255,213,122,.5);
  background:rgba(15,15,26,.96);
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  box-shadow:
    0 30px 80px -30px rgba(255,213,122,.6),
    inset 0 1px 0 rgba(255,255,255,.1);
  z-index:200;pointer-events:none;opacity:0;
  transition:transform .35s var(--ease-spring),opacity .3s var(--ease-out);
}
.score-popup.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.score-popup.good{
  border-color:rgba(90,255,160,.55);
  box-shadow:0 30px 80px -30px rgba(90,255,160,.6),inset 0 1px 0 rgba(255,255,255,.1);
}
.score-popup.bad{
  border-color:rgba(255,84,112,.55);
  box-shadow:0 30px 80px -30px rgba(255,84,112,.6),inset 0 1px 0 rgba(255,255,255,.1);
}
.score-popup h2{
  font-family:'Orbitron',sans-serif;font-size:22px;font-weight:800;
  letter-spacing:1.8px;color:var(--gold);margin-bottom:8px;
}
.score-popup.good h2{color:var(--green)}
.score-popup.bad h2{color:var(--red)}
.score-popup p{font-size:13px;color:var(--t-2);font-weight:500}

.toast-wrap{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:8px;
  z-index:220;pointer-events:none;max-width:90vw;
}
.toast{
  padding:13px 20px;border-radius:100px;
  border:1px solid var(--border-strong);
  background:rgba(15,15,26,.96);
  backdrop-filter:blur(22px) saturate(140%);
  color:var(--t-1);font-size:13px;font-weight:600;
  box-shadow:0 16px 40px -16px rgba(0,0,0,.9);
  animation:toastIn .38s var(--ease-spring);
  white-space:nowrap;
}
.toast.good{border-color:rgba(90,255,160,.5);color:#bcffe0}
.toast.bad{border-color:rgba(255,84,112,.5);color:#ffb8c7}
@keyframes toastIn{
  from{opacity:0;transform:translateY(16px) scale(.9)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.float-score{
  position:fixed;pointer-events:none;z-index:150;
  font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;
  color:var(--green);
  text-shadow:0 0 22px rgba(90,255,160,.9),0 2px 10px rgba(0,0,0,.55);
  animation:floatUp 1.15s var(--ease-out) forwards;
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.5)}
  20%{opacity:1;transform:translate(-50%,-22px) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-95px) scale(1.32)}
}

.combo-banner{
  position:fixed;top:38%;left:50%;
  transform:translate(-50%,-50%) scale(.3) rotate(-8deg);
  font-family:'Orbitron',sans-serif;
  font-size:34px;font-weight:900;letter-spacing:3px;
  color:var(--orange);
  text-shadow:0 0 32px rgba(255,177,88,.9),0 4px 14px rgba(0,0,0,.55);
  z-index:180;pointer-events:none;opacity:0;
}
.combo-banner.show{animation:comboIn 1.2s var(--ease-spring)}
@keyframes comboIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(2deg)}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.05) rotate(0)}
}

.particle{
  position:fixed;pointer-events:none;z-index:170;
  width:8px;height:8px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:190}

/* ═══════════════════════════════════════════════════════
   RESULTS
   ═══════════════════════════════════════════════════════ */
.results-shell{
  flex:1;display:flex;flex-direction:column;gap:16px;
  padding:26px 16px;
  align-items:center;justify-content:flex-start;
  animation:viewIn .55s var(--ease-out);
}
.results-title{
  font-family:'Orbitron',sans-serif;
  font-size:30px;font-weight:900;letter-spacing:3px;text-align:center;
  background:linear-gradient(90deg,var(--gold),var(--orange));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(255,213,122,.5));
  animation:titleIn .75s var(--ease-spring) both;
}
.results-title.over{
  background:linear-gradient(90deg,var(--red),#ff90a8);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 22px rgba(255,84,112,.5));
}
@keyframes titleIn{
  0%{opacity:0;transform:scale(.5) rotate(-6deg)}
  60%{transform:scale(1.08) rotate(2deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
.results-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;width:100%;max-width:460px;
}
.results-cell{
  padding:18px 12px;border-radius:var(--r-md);
  border:1px solid var(--border);
  background:linear-gradient(160deg,rgba(255,255,255,.035),transparent),var(--surface);
  backdrop-filter:blur(12px);
  text-align:center;
  animation:cardIn .55s var(--ease-out) both;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.results-cell:nth-child(1){animation-delay:.05s}
.results-cell:nth-child(2){animation-delay:.10s}
.results-cell:nth-child(3){animation-delay:.15s}
.results-cell:nth-child(4){animation-delay:.20s}
.results-cell:nth-child(5){animation-delay:.25s}
.results-cell:nth-child(6){animation-delay:.30s}
.results-cell .lbl{
  font-family:'Press Start 2P',monospace;
  font-size:8px;color:var(--t-3);letter-spacing:1.2px;margin-bottom:10px;
}
.results-cell .val{
  font-family:'Orbitron',sans-serif;
  font-size:26px;font-weight:800;color:var(--t-1);
  letter-spacing:.6px;
  font-variant-numeric:tabular-nums;
}
.results-cell.gold .val{color:var(--gold);text-shadow:0 0 18px rgba(255,213,122,.5)}
.results-cell.green .val{color:var(--green);text-shadow:0 0 18px rgba(90,255,160,.5)}
.results-cell.pink .val{color:var(--pink);text-shadow:0 0 18px rgba(255,94,212,.5)}
.results-cell.cyan .val{color:var(--cyan);text-shadow:0 0 18px rgba(94,231,255,.5)}
.results-actions{
  display:flex;flex-direction:column;gap:10px;
  width:100%;max-width:460px;margin-top:6px;
}

/* ═══════════════════════════════════════════════════════
   COUNTDOWN
   ═══════════════════════════════════════════════════════ */
.countdown{
  font-family:'Orbitron',sans-serif;font-size:88px;font-weight:900;
  color:var(--cyan);
  text-shadow:0 0 44px rgba(94,231,255,.9);
  animation:cdIn .55s var(--ease-spring);
}
@keyframes cdIn{
  0%{opacity:0;transform:scale(.3)}
  60%{transform:scale(1.15)}
  100%{opacity:1;transform:scale(1)}
}

/* ═══════════════════════════════════════════════════════
   MODALS
   ═══════════════════════════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;z-index:300;
  display:flex;align-items:center;justify-content:center;
  background:rgba(6,6,12,.82);
  backdrop-filter:blur(16px) saturate(120%);
  -webkit-backdrop-filter:blur(16px) saturate(120%);
  padding:20px;
  animation:fadeIn .28s ease-out;
}
.modal-overlay[hidden]{display:none!important}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{
  width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
  border-radius:var(--r-lg);
  border:1px solid var(--border-strong);
  background:
    linear-gradient(160deg,rgba(32,32,54,.96),rgba(15,15,26,.98));
  box-shadow:
    0 40px 100px -30px rgba(0,0,0,.95),
    0 0 0 1px rgba(255,255,255,.03) inset,
    0 1px 0 rgba(255,255,255,.08) inset;
  animation:modalIn .4s var(--ease-spring);
  position:relative;overflow:hidden;
}
.modal-card::before{
  content:'';position:absolute;top:0;left:16%;right:16%;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:.5;
}
@keyframes modalIn{
  from{opacity:0;transform:scale(.92) translateY(20px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 22px;border-bottom:1px solid var(--border);
}
.modal-title{
  font-family:'Orbitron',sans-serif;font-size:16px;font-weight:800;letter-spacing:1.2px;
  background:linear-gradient(90deg,var(--cyan),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.modal-close{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);background:transparent;
  color:var(--t-2);font-size:14px;cursor:pointer;
  transition:all .22s var(--ease-out);
}
.modal-close:hover{
  color:var(--t-1);border-color:var(--border-strong);
  transform:rotate(90deg);
}
.modal-body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:14px}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:13px 0;
}
.setting-row + .setting-row{border-top:1px solid var(--border)}
.setting-label{display:flex;flex-direction:column;gap:3px;min-width:0}
.setting-name{font-size:14px;font-weight:600;color:var(--t-1)}
.setting-desc{font-size:11px;color:var(--t-3);line-height:1.35}
.switch{
  position:relative;width:48px;height:28px;border-radius:100px;
  background:rgba(255,255,255,.08);
  border:1px solid var(--border);
  cursor:pointer;transition:all .25s var(--ease-out);flex-shrink:0;
}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;
  width:22px;height:22px;border-radius:50%;
  background:var(--t-3);
  transition:all .28s var(--ease-spring);
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.switch.on{
  background:linear-gradient(135deg,rgba(94,231,255,.4),rgba(94,231,255,.16));
  border-color:rgba(94,231,255,.55);
  box-shadow:0 0 18px -4px rgba(94,231,255,.5);
}
.switch.on::after{
  left:24px;background:var(--cyan);
  box-shadow:0 0 14px rgba(94,231,255,.7);
}
.slider-wrap{display:flex;align-items:center;gap:12px;min-width:140px}
.slider{
  -webkit-appearance:none;appearance:none;
  width:120px;height:6px;border-radius:100px;
  background:rgba(255,255,255,.1);outline:none;cursor:pointer;
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:20px;height:20px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  box-shadow:0 0 14px rgba(94,231,255,.6);cursor:pointer;
}
.slider::-moz-range-thumb{
  width:20px;height:20px;border:none;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  box-shadow:0 0 14px rgba(94,231,255,.6);cursor:pointer;
}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.theme-chip{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:11px 4px;border-radius:var(--r-sm);
  border:2px solid var(--border);
  background:rgba(255,255,255,.02);
  cursor:pointer;transition:all .22s var(--ease-out);
}
.theme-chip:hover{transform:translateY(-2px)}
.theme-chip.active{
  border-color:var(--t-1);
  box-shadow:0 0 22px rgba(255,255,255,.16);
}
.theme-dot{
  width:24px;height:24px;border-radius:50%;
  box-shadow:0 0 12px currentColor;
  border:1px solid rgba(255,255,255,.2);
}
.theme-name{font-size:10px;font-weight:600;color:var(--t-2)}

/* ═══════════════════════════════════════════════════════
   PAUSE
   ═══════════════════════════════════════════════════════ */
.pause-card{
  width:100%;max-width:360px;padding:30px 24px;
  border-radius:var(--r-lg);
  border:1px solid var(--border-strong);
  background:linear-gradient(160deg,rgba(32,32,54,.96),rgba(15,15,26,.98));
  box-shadow:0 40px 100px -30px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06);
  display:flex;flex-direction:column;gap:16px;align-items:center;
  animation:modalIn .35s var(--ease-spring);
  position:relative;overflow:hidden;
}
.pause-card::before{
  content:'';position:absolute;top:0;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:.5;
}
.pause-title{
  font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;letter-spacing:5px;
  background:linear-gradient(90deg,var(--cyan),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(94,231,255,.4));
  margin-bottom:6px;
}
.pause-actions{display:flex;flex-direction:column;gap:10px;width:100%}

/* ═══════════════════════════════════════════════════════
   LEVEL UP
   ═══════════════════════════════════════════════════════ */
.levelup-card{text-align:center;padding:36px 26px}
.levelup-icon{
  font-size:72px;margin-bottom:16px;
  animation:levelBounce 1s var(--ease-spring) infinite alternate;
  filter:drop-shadow(0 0 28px rgba(255,213,122,.6));
}
@keyframes levelBounce{
  0%{transform:scale(1) rotate(-6deg)}
  100%{transform:scale(1.14) rotate(6deg)}
}
.levelup-title{
  font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,var(--gold),var(--orange));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:10px;
}
.levelup-name{font-size:15px;font-weight:700;color:var(--t-1);margin-bottom:6px}
.levelup-desc{font-size:12px;color:var(--t-3);margin-bottom:22px;line-height:1.45}

/* ═══════════════════════════════════════════════════════
   KBD HELPER
   ═══════════════════════════════════════════════════════ */
.kbd-help{
  position:fixed;bottom:18px;right:18px;z-index:230;
  padding:9px 15px;border-radius:100px;
  border:1px solid var(--border);
  background:rgba(15,15,26,.92);
  backdrop-filter:blur(12px);
  font-size:11px;font-weight:600;color:var(--t-3);
  cursor:pointer;transition:all .25s var(--ease-out);
  display:none;
}
.kbd-help:hover{color:var(--t-1);border-color:var(--border-strong)}
.kbd-help kbd{
  display:inline-block;padding:2px 6px;border-radius:5px;
  background:rgba(255,255,255,.08);
  border:1px solid var(--border);
  font-family:'Inter',sans-serif;font-size:10px;color:var(--t-1);margin:0 1px;
}
@media (hover:hover) and (pointer:fine){.kbd-help{display:block}}

/* ═══════════════════════════════════════════════════════
   MÓVIL · Safe areas + táctil cómodo
   ═══════════════════════════════════════════════════════ */
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  overscroll-behavior:none;
}
body{overscroll-behavior-y:none}

@media (max-width:899px){
  header{padding-top:calc(14px + env(safe-area-inset-top))}
  footer{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .toast-wrap{bottom:calc(88px + env(safe-area-inset-bottom))}
}

@media (max-width:480px){
  .mcq-btn{font-size:14px;padding:16px 12px;min-height:52px}
  .key{font-size:19px;padding:14px 6px;min-height:52px}
  .numpad{max-width:300px}
  .math-problem{font-size:28px;padding:26px 18px;letter-spacing:2px}
  .math-problem.small{font-size:14px;padding:20px 16px;line-height:1.6}
  .math-input{font-size:32px;letter-spacing:4px}
  .hud{gap:5px;padding:10px}
  .hud-val{font-size:14px}
  .hud-stat{padding:6px 3px}
  .game-slot{min-height:96px;padding:14px 8px}
  .game-slot .slot-emoji{font-size:28px}
  .game-slot .slot-name{font-size:11px}
  .cat-tab{font-size:11px;padding:8px 13px}
  .search-input{font-size:13px;padding:12px 14px 12px 42px}
  .footer-btn{font-size:11px;padding:9px 5px;gap:4px}
  .results-title{font-size:26px;letter-spacing:2px}
  .results-cell .val{font-size:22px}
  .shop-title{font-size:19px}
  .game-title{font-size:15px;letter-spacing:1.5px}
}

/* ═══════════════════════════════════════════════════════
   PC / TABLET GRANDE · Web completa, todo el ancho
   ═══════════════════════════════════════════════════════ */
@media (min-width:900px){
  #app{max-width:100%;padding-left:0;padding-right:0}

  header{padding:18px 44px;gap:16px}
  .header-title{font-size:17px;letter-spacing:4px}
  .header-rank{font-size:9px}
  .icon-btn{width:44px;height:44px;font-size:19px;border-radius:12px}
  .coins-display{padding:10px 18px;font-size:13px}
  .btn-exit-admin-game{padding:10px 18px;font-size:12px}

  .hud{
    padding:18px 44px;
    grid-template-columns:repeat(5, minmax(0, 190px));
    justify-content:center;gap:16px;
  }
  .hud-stat{padding:14px 16px;border-radius:12px}
  .hud-label{font-size:9px;letter-spacing:1px}
  .hud-val{font-size:24px}

  .search-wrap{
    padding:26px 44px 0;
    max-width:1440px;margin:0 auto;width:100%;
  }
  .search-input{font-size:15px;padding:15px 22px 15px 50px}
  .search-wrap::before{top:calc(26px + 15px);left:calc(44px + 22px)}

  .cat-tabs{
    padding:20px 44px 14px;
    justify-content:center;flex-wrap:wrap;
  }
  .cat-tab{font-size:13px;padding:11px 20px}

  #menu-view .game-grid{
    padding:18px 44px 48px;
    grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
    gap:20px;
    max-width:1440px;margin:0 auto;width:100%;
  }
  .game-slot{min-height:160px;padding:24px 16px;gap:12px;border-radius:16px}
  .game-slot .slot-emoji{font-size:46px}
  .game-slot .slot-name{font-size:13px;letter-spacing:.4px}
  .game-slot .slot-lvl{font-size:9px}
  .game-slot .fav-btn{width:28px;height:28px;font-size:13px;top:12px;left:12px}
  .game-slot.completed::before{width:24px;height:24px;font-size:14px;top:12px;right:12px}

  #game-content{padding:36px 24px 24px;gap:24px}
  #game-view > div:last-child{
    max-width:780px;margin:0 auto;width:100%;
    padding:16px 24px 24px !important;
  }
  .game-topbar{max-width:720px;gap:14px}
  .game-title{font-size:24px;letter-spacing:2.5px}
  .game-meta{font-size:14px}
  .progress-wrap{height:9px}
