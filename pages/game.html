<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MindMath Arcade: ODS Supremacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="shared.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/game-progress.js" data-tecnomath-game="mindmath-arcade"></script>
    <style>
        :root {
            --neon-green: #39FF14; --neon-pink: #FF00FF; --neon-cyan: #00FFFF;
            --neon-yellow: #FFE600; --neon-orange: #FF6B00; --arcade-blue: #0044FF;
            --retro-bg: #060610; --card-bg: #0d0d1a; --gold: #FFD700;
            --purple: #9B00FF; --red: #FF0033; --ods-blue: #0267C1; --ods-green: #3F8E4B;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; font-family: 'Press Start 2P', cursive; }
        body {
            background: var(--retro-bg); color: white;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(0,68,255,0.07) 0%, transparent 50%),
                            radial-gradient(ellipse at 80% 20%, rgba(255,0,255,0.07) 0%, transparent 50%);
        }
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px);
        }
        #app {
            height: 100vh; height: 100dvh; display: flex; flex-direction: column;
            max-width: 520px; margin: 0 auto; position: relative; background: #060610;
        }
        header {
            padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--neon-pink);
            background: linear-gradient(90deg, rgba(255,0,255,0.05), transparent, rgba(0,255,255,0.05));
            flex-shrink: 0; gap: 4px;
        }
        .header-title { font-size: 8px; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); letter-spacing: 2px; text-align: center; }
        .header-rank { font-size: 5px; color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); text-align: center; }
        .cloud-btn { font-size: 15px; cursor: pointer; transition: transform .2s; flex-shrink: 0; }
        .cloud-btn:hover { transform: scale(1.3); }
        .coins-display { color: var(--gold); font-size: 7px; text-shadow: 0 0 8px var(--gold); flex-shrink: 0; text-align: right; }
        .btn-exit-admin-game {
            font-family: 'Press Start 2P', cursive; font-size: 7px;
            background: #c0392b; color: white; border: 1px solid #ff00ff;
            padding: 4px 8px; border-radius: 12px; cursor: pointer; margin-left: 6px;
        }
        .hud {
            display: flex; justify-content: space-around; background: rgba(0,0,0,0.6);
            padding: 6px; font-size: 5px; border-bottom: 1px solid #1a1a2e;
            flex-shrink: 0; gap: 4px; flex-wrap: wrap;
        }
        .hud-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .hud-label { color: #666; font-size: 4px; }
        .hud-val { color: var(--neon-green); font-size: 8px; text-shadow: 0 0 6px var(--neon-green); }

        .cat-tabs {
            display: flex; overflow-x: auto; gap: 4px; padding: 6px 8px;
            border-bottom: 1px solid #1a1a2e; flex-shrink: 0; scrollbar-width: none;
        }
        .cat-tabs::-webkit-scrollbar { display: none; }
        .cat-tab {
            white-space: nowrap; font-family: 'Press Start 2P', cursive; font-size: 4px;
            padding: 5px 8px; border: 1px solid #333; background: rgba(255,255,255,0.03);
            cursor: pointer; color: #888; transition: all .2s; flex-shrink: 0; border-radius: 3px;
        }
        .cat-tab.active { border-color: var(--neon-cyan); color: var(--neon-cyan); background: rgba(0,255,255,0.08); text-shadow: 0 0 6px var(--neon-cyan); }
        .cat-tab.ods-tab { border-color: #0267C1; }
        .cat-tab.ods-tab.active { border-color: #FFD700; color: #FFD700; background: rgba(255,215,0,0.1); text-shadow: 0 0 6px #FFD700; }

        .game-slot {
            border: 1px solid #222; background: var(--card-bg); padding: 8px 5px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; font-size: 4px; text-align: center; gap: 4px;
            transition: all .2s; position: relative; overflow: hidden;
            min-height: 70px; border-radius: 6px;
        }
        .game-slot:hover:not(.locked) { border-color: var(--neon-cyan); box-shadow: 0 0 12px rgba(0,255,255,0.2); transform: translateY(-2px); }
        .game-slot.locked { opacity: 0.25; filter: grayscale(1); cursor: not-allowed; }
        .game-slot .slot-emoji { font-size: 18px; }
        .game-slot .slot-name { color: #aaa; line-height: 1.3; font-size: 4px; }
        .game-slot .slot-lvl { font-size: 4px; color: #555; }
        .game-slot.completed { border-color: var(--neon-green); }
        .game-slot.completed::after { content: '✓'; position: absolute; top: 3px; right: 3px; color: var(--neon-green); font-size: 7px; }
        .game-slot.ods-slot { border-color: #0267C1; background: #08081a; }
        .game-slot.ods-slot.completed { border-color: #FFD700; }

        .view {
            flex: 1; display: flex; flex-direction: column;
            overflow-y: auto;  /* <- scroll cuando sea necesario */
            min-height: 0;     /* <- evita desbordamiento en flex */
        }
        .view.hidden { display: none !important; }

        #menu-view .game-grid {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
            gap: 8px;
            align-content: start;
        }

        #game-view {
            padding: 12px 10px;
            background: linear-gradient(180deg, #060610 0%, #0a0a1f 100%);
        }
        #game-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            overflow-y: auto;
        }
        .game-header { text-align: center; width: 100%; }
        .game-title { font-size: 8px; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); margin-bottom: 4px; }

        .game-timer-bar { width: 100%; max-width: 340px; height: 5px; background: #111; border: 1px solid #333; border-radius: 3px; overflow: hidden; }
        .game-timer-fill { height: 100%; background: var(--neon-green); transition: width .1s linear; border-radius: 3px; }

        .math-problem {
            font-size: 22px; text-align: center; color: white;
            text-shadow: 0 0 15px rgba(0,255,255,0.5); padding: 12px;
            border: 1px solid #1a1a3a; background: rgba(0,0,0,0.5);
            width: 100%; max-width: 340px; border-radius: 8px;
        }
        .math-input { font-size: 20px; color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); min-height: 35px; text-align: center; }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 250px; }
        .key { background: #111; border: 2px solid #333; padding: 12px 6px; text-align: center; cursor: pointer; font-family: 'Press Start 2P', cursive; font-size: 10px; color: white; transition: all .1s; user-select: none; border-radius: 4px; }
        .key:active { background: #222; border-color: var(--neon-cyan); transform: scale(0.95); }

        .mcq-options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; max-width: 340px; }
        .mcq-btn {
            background: #0d0d1a; border: 2px solid #222; padding: 10px 6px;
            cursor: pointer; font-family: 'Press Start 2P', cursive; font-size: 6px;
            color: white; text-align: center; transition: all .15s; line-height: 1.4; border-radius: 4px;
        }
        .mcq-btn:hover { border-color: var(--neon-cyan); background: rgba(0,255,255,0.08); }
        .mcq-btn.correct { border-color: var(--neon-green); background: rgba(57,255,20,0.15); color: var(--neon-green); }
        .mcq-btn.wrong { border-color: var(--red); background: rgba(255,0,51,0.15); color: var(--red); }

        .memory-grid { display: grid; gap: 6px; width: 100%; max-width: 340px; }
        .mem-card { aspect-ratio: 1; background: var(--purple); border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; transition: all .25s; user-select: none; border-radius: 6px; }
        .mem-card.hidden { background: #1a0a2e; }
        .mem-card.hidden span { opacity: 0; }
        .mem-card.matched { background: #0a2e1a; border-color: var(--neon-green); cursor: default; }

        .word-letters { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 340px; }
        .letter-tile { width: 34px; height: 34px; background: #1a1a2e; border: 2px solid #444; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; transition: all .15s; user-select: none; border-radius: 4px; }
        .letter-tile:hover { border-color: var(--neon-cyan); background: rgba(0,255,255,0.1); }
        .letter-tile.selected { border-color: var(--neon-pink); background: rgba(255,0,255,0.15); }
        .word-answer { display: flex; gap: 5px; min-height: 38px; flex-wrap: wrap; justify-content: center; align-items: center; }
        .answer-slot { width: 34px; height: 34px; background: #0d0d1a; border-bottom: 2px solid var(--neon-cyan); display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; border-radius: 4px; }

        .feedback-box { padding: 10px; width: 100%; max-width: 340px; text-align: center; font-size: 7px; display: none; border-radius: 4px; }
        .feedback-box.win { display: block; color: var(--neon-green); border: 1px solid var(--neon-green); background: rgba(57,255,20,0.08); }
        .feedback-box.lose { display: block; color: var(--red); border: 1px solid var(--red); background: rgba(255,0,51,0.08); }

        .btn-main { background: linear-gradient(135deg, var(--neon-pink), var(--purple)); color: white; padding: 12px 16px; border: none; font-family: 'Press Start 2P', cursive; cursor: pointer; font-size: 6px; width: 100%; max-width: 340px; transition: all .2s; text-shadow: 0 0 5px rgba(255,255,255,0.5); border-radius: 6px; }
        .btn-main:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(255,0,255,0.4); }
        .btn-secondary { background: transparent; border: 1px solid #444; color: #888; padding: 8px; font-family: 'Press Start 2P', cursive; font-size: 5px; cursor: pointer; width: 100%; max-width: 340px; transition: all .2s; border-radius: 6px; text-align: center; }
        .btn-secondary:hover { border-color: #888; color: white; }

        #shop-view, #scores-view, #ods-view {
            padding: 12px;
            gap: 10px;
            position: relative;
        }
        #shop-view.active, #scores-view.active, #ods-view.active {
            display: flex;
        }
        .shop-title { font-size: 10px; color: var(--neon-pink); text-align: center; text-shadow: 0 0 10px var(--neon-pink); }
        .shop-item { border: 1px solid #222; background: var(--card-bg); padding: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all .2s; font-size: 6px; border-radius: 6px; }
        .shop-item:hover { border-color: var(--gold); background: rgba(255,215,0,0.05); }
        .shop-item-name { color: white; }
        .shop-item-price { color: var(--gold); font-size: 7px; }

        .score-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0); background: #0d0d1a; border: 2px solid var(--gold); padding: 20px 25px; text-align: center; z-index: 200; transition: transform .3s cubic-bezier(0.175,0.885,0.32,1.275); box-shadow: 0 0 40px rgba(255,215,0,0.3); border-radius: 10px; pointer-events: none; }
        .score-popup.show { transform: translate(-50%,-50%) scale(1); }
        .score-popup h2 { color: var(--gold); font-size: 12px; margin-bottom: 6px; }
        .score-popup p { font-size: 6px; color: #aaa; }

        footer { padding: 6px 8px; border-top: 1px solid #1a1a2e; display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
        .footer-btn { flex: 1; background: #0d0d1a; border: 1px solid #222; color: white; font-family: 'Press Start 2P', cursive; font-size: 5px; padding: 8px 4px; cursor: pointer; transition: all .2s; border-radius: 4px; text-align: center; min-width: 0; }
        .footer-btn:hover { border-color: var(--neon-pink); color: var(--neon-pink); }
        .footer-btn.active-tab { border-color: var(--neon-cyan); color: var(--neon-cyan); }

        .admin-glow { color: var(--neon-pink) !important; text-shadow: 0 0 8px var(--neon-pink) !important; }
        .ods-badge-mini { background: #0267C1; color: white; font-size: 4px; padding: 2px 6px; border-radius: 10px; display: inline-block; margin: 2px 0; }
        .ods-badge-gold { background: #FFD700; color: #000; font-weight: 900; font-size: 4px; padding: 2px 6px; border-radius: 10px; }
        .progress-wrap { width: 100%; max-width: 340px; background: #111; height: 7px; border: 1px solid #222; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink)); transition: width .5s ease; border-radius: 4px; }
        .seq-display { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .seq-num { width: 38px; height: 38px; background: #111; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--neon-cyan); border-radius: 4px; }
        .seq-question { color: var(--neon-yellow); border-color: var(--neon-yellow); }

        .ods-card { border: 2px solid #0267C1; background: #08081f; padding: 10px; border-radius: 8px; text-align: center; font-size: 5px; cursor: pointer; transition: all .2s; min-height: 65px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
        .ods-card.completed { border-color: #FFD700; background: #0a0a15; }
        .ods-card .ods-icon { font-size: 22px; }
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; padding: 8px; }

        .close-btn {
            position: absolute; top: 8px; right: 12px; font-size: 18px; color: #888;
            cursor: pointer; transition: color .2s; z-index: 10;
            font-family: 'Press Start 2P', cursive;
        }
        .close-btn:hover { color: var(--neon-pink); }

        @media (max-width:350px) {
            .header-title { font-size: 6px; } .cat-tab { font-size: 3px; padding: 4px 6px; } .game-slot { min-height: 55px; padding: 6px 3px; } .game-slot .slot-emoji { font-size: 14px; } .game-slot .slot-name { font-size: 3px; } .key { padding: 10px 4px; font-size: 8px; } .numpad { gap: 4px; max-width: 200px; } .math-problem { font-size: 16px; padding: 8px; } .footer-btn { font-size: 4px; padding: 6px 2px; } .close-btn { font-size: 14px; top: 4px; right: 8px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <span class="cloud-btn" onclick="openAdminPanel()" title="Admin">☁️</span>
            <button id="exitAdminBtnGame" class="btn-exit-admin-game" style="display:none;" onclick="exitAdminMode()">🚫 SALIR</button>
            <div style="text-align:center;flex:1;min-width:0;">
                <div class="header-title">MINDMATH ODS</div>
                <div id="rank-display" class="header-rank">[NOVATO]</div>
            </div>
            <div class="coins-display">💰<span id="coin-count">0</span></div>
            <div class="coins-display" style="color:#FFD700;">🌐<span id="global-coins-display">0</span></div>
        </header>

        <div class="hud">
            <div class="hud-stat"><span class="hud-label">NIVEL</span><span id="user-lvl" class="hud-val">1</span></div>
            <div class="hud-stat"><span class="hud-label">VIDAS</span><span id="life-count" class="hud-val">3</span></div>
            <div class="hud-stat"><span class="hud-label">ESCUDO</span><span id="shield-count" class="hud-val">0</span></div>
            <div class="hud-stat"><span class="hud-label">RACHA</span><span id="streak-count" class="hud-val">0</span></div>
            <div class="hud-stat"><span class="hud-label">ODS</span><span id="ods-progress" class="hud-val" style="color:#FFD700">0/17</span></div>
        </div>

        <!-- MENÚ -->
        <div id="menu-view" class="view">
            <div class="cat-tabs" id="cat-tabs"></div>
            <div class="game-grid" id="game-grid"></div>
        </div>

        <!-- JUEGO -->
        <div id="game-view" class="view hidden">
            <div id="game-content"></div>
            <div style="padding:8px;border-top:1px solid #1a1a2e;flex-shrink:0;">
                <button class="btn-secondary" onclick="exitGame()">↩ RENDIRSE</button>
            </div>
        </div>

        <!-- TIENDA -->
        <div id="shop-view" class="view hidden">
            <span class="close-btn" onclick="switchTab('menu')">✕</span>
            <div class="shop-title" style="margin-bottom:8px;">🛒 TIENDA ARCADE</div>
            <div class="shop-item" onclick="buyItem('life',50)"><span class="shop-item-name">❤️ +1 VIDA</span><span class="shop-item-price">50 💰</span></div>
            <div class="shop-item" onclick="buyItem('shield',80)"><span class="shop-item-name">🛡️ ESCUDO x1</span><span class="shop-item-price">80 💰</span></div>
            <div class="shop-item" onclick="buyItem('hint',40)"><span class="shop-item-name">💡 PISTA x3</span><span class="shop-item-price">40 💰</span></div>
            <div class="shop-item" onclick="buyItem('time_boost',60)"><span class="shop-item-name">⏱️ +10s TIEMPO</span><span class="shop-item-price">60 💰</span></div>
            <div class="shop-item" onclick="openExchangeModal()" style="border-color: var(--neon-yellow); cursor: pointer;">
                <span class="shop-item-name">💱 CONVERTIR MONEDAS</span>
                <span class="shop-item-price">10% com</span>
            </div>
        </div>

        <!-- LOGROS -->
        <div id="scores-view" class="view hidden">
            <span class="close-btn" onclick="switchTab('menu')">✕</span>
            <div style="font-size:9px;color:var(--neon-cyan);text-align:center;margin-bottom:8px;">🏆 LOGROS</div>
            <div id="scores-content" style="flex:1;overflow-y:auto;padding:8px;"></div>
        </div>

        <!-- ODS -->
        <div id="ods-view" class="view hidden">
            <span class="close-btn" onclick="switchTab('menu')">✕</span>
            <div style="font-size:8px;color:#FFD700;text-align:center;margin-bottom:8px;">🌍 OBJETIVOS ODS</div>
            <div id="ods-dash-content" style="flex:1;overflow-y:auto;padding:8px;"></div>
        </div>

        <footer>
            <button class="footer-btn active-tab" id="tab-menu" onclick="switchTab('menu')">🎮 JUGAR</button>
            <button class="footer-btn" id="tab-shop" onclick="switchTab('shop')">🛒 TIENDA</button>
            <button class="footer-btn" id="tab-scores" onclick="switchTab('scores')">🏆 LOGROS</button>
            <button class="footer-btn" id="tab-ods" onclick="switchTab('ods')" style="color:#FFD700;">🌍 ODS</button>
        </footer>
    </div>

    <div class="score-popup" id="score-popup">
        <h2 id="popup-title">¡CORRECTO!</h2>
        <p id="popup-sub">+50 💰</p>
    </div>

    <script>
        // ════════════════════════════════════════════
        //  PATCH: TECNOMATH MOCK (offline compatible)
        // ════════════════════════════════════════════
        if (typeof Tecnomath === 'undefined') {
            window.Tecnomath = {
                getCurrentUser: () => null,
                getCoins: () => parseInt(localStorage.getItem('global_coins') || '0'),
                addCoins: (amount) => {
                    const current = parseInt(localStorage.getItem('global_coins') || '0');
                    localStorage.setItem('global_coins', (current + amount).toString());
                    if (window.TecnomathProgress) window.TecnomathProgress.save('mindmath-arcade', { globalCoins: current + amount });
                },
                updateHighScore: (game, score) => {
                    const key = 'highscore_' + game;
                    const old = parseInt(localStorage.getItem(key) || '0');
                    if (score > old) localStorage.setItem(key, score.toString());
                    if (window.TecnomathProgress) window.TecnomathProgress.save('mindmath-arcade', { game, score, highScore: Math.max(old, score) });
                },
                getGameCoins: (game) => stats.coins || 0,
                exchangeGlobalToLocal: (game, amount) => {
                    const current = parseInt(localStorage.getItem('global_coins') || '0');
                    if (current < amount) return false;
                    localStorage.setItem('global_coins', (current - amount).toString());
                    const gain = Math.floor(amount * 0.9);
                    stats.coins += gain;
                    saveStats();
                    return true;
                },
                isAdmin: () => stats.isAdmin || false,
                setAdmin: (username) => { stats.isAdmin = true; saveStats(); },
                unsetAdmin: (username) => { stats.isAdmin = false; saveStats(); }
            };
        }

        // ════════════════════════════════════════════
        //  CATEGORÍAS (incluyendo ODS)
        // ════════════════════════════════════════════
        const CATEGORIES = [
            { id: 'all', label: '⭐ TODOS', color: '#00FFFF' },
            { id: 'math', label: '➕ MATES', color: '#00FFFF' },
            { id: 'sci', label: '🔬 CIENCIAS', color: '#39FF14' },
            { id: 'lang', label: '📖 LENGUAJE', color: '#FFE600' },
            { id: 'hist', label: '🏛️ HISTORIA', color: '#FF6B00' },
            { id: 'mem', label: '🧠 MEMORIA', color: '#9B00FF' },
            { id: 'geo', label: '🌍 GEOGRAFÍA', color: '#FF00FF' },
            { id: 'logic', label: '🧩 LÓGICA', color: '#FF0033' },
            { id: 'ods', label: '🌿 ODS', color: '#FFD700', isODS: true },
        ];

        // ════════════════════════════════════════════

        // ─── MATH OPERATIONS ─────────────────────
        function buildMathGame(g) {
            const c = document.getElementById('game-content');
            const ops = g.ops, op = ops[Math.floor(Math.random() * ops.length)];
            let a, b, ans;
            if (op === '+') { a = rnd(5, g.id * 5 + 10); b = rnd(5, g.id * 3 + 5); ans = a + b; }
            else if (op === '-') { a = rnd(10, g.id * 5 + 20); b = rnd(1, a); ans = a - b; }
            else if (op === '*') { a = rnd(2, 12); b = rnd(2, 12); ans = a * b; }
            else { b = rnd(2, 12); ans = rnd(2, 12); a = b * ans; }
            mathAnswer = ans.toString(); mathInput = '';
            const opStr = op === '*' ? '×' : op === '/' ? '÷' : op;
            const q = op === '/' ? `${a} ÷ ${b}` : `${a} ${opStr} ${b}`;
            c.innerHTML = `<div class="game-header"><div class="game-title">${g.emoji} ${g.name}</div></div>
            <div class="game-timer-bar"><div class="game-timer-fill" id="tfill" style="width:100%"></div></div>
            <div class="math-problem">${q} = ?</div><div class="math-input" id="minput">_</div>
            <div class="numpad">${[1,2,3,4,5,6,7,8,9,'C',0,'OK'].map(k=>`<div class="key" onclick="mathKey('${k}')">${k}</div>`).join('')}</div>
            <div class="feedback-box" id="fb"></div>`;
            mathFillEl = document.getElementById('minput');
            startTimer(15 + stats.timeBoost, () => mathFail('⏱️ TIEMPO'), document.getElementById('tfill'));
            stats.timeBoost = 0;
        }
        function mathKey(k) {
            if (k === 'C') { mathInput = ''; mathFillEl.innerText = '_'; }
            else if (k === 'OK') { clearInterval(gameTimer); mathInput === mathAnswer ? gameWin(activeGame) : gameFail(activeGame, '❌ ERROR'); }
            else { if (mathInput.length < 6) { mathInput += k; mathFillEl.innerText = mathInput; } }
        }
        function mathFail(m) { gameFail(activeGame, m); }

        // ─── MCQ ─────────────────────────────────
        function buildMCQ(g) {
            const c = document.getElementById('game-content'), pool = QB[g.subtype];
            if (!pool) { c.innerHTML = '<div style="color:#888;font-size:6px;text-align:center;padding:20px;">Contenido próximamente</div>'; return; }
            const q = pool[Math.floor(Math.random() * pool.length)], shuffled = shuffleOpts(q.opts, q.a);
            mcqAnswered = false;
            c.innerHTML = `<div class="game-header"><div class="game-title">${g.emoji} ${g.name}</div></div>
            <div class="game-timer-bar"><div class="game-timer-fill" id="tfill" style="width:100%"></div></div>
            <div class="math-problem" style="font-size:9px;line-height:1.7;">${q.q}</div>
            <div class="mcq-options" id="mcq-opts">${shuffled.opts.map((o,i)=>`<div class="mcq-btn" onclick="mcqPick(this,${i},${shuffled.correct})">${o}</div>`).join('')}</div>
            <div class="feedback-box" id="fb"></div>`;
            startTimer(20 + stats.timeBoost, () => gameFail(g, '⏱️ TIEMPO'), document.getElementById('tfill')); stats.timeBoost = 0;
        }
        function shuffleOpts(opts, correctIdx) {
            const pairs = opts.map((o, i) => ({ o, correct: i === correctIdx }));
            for (let i = pairs.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pairs[i], pairs[j]] = [pairs[j], pairs[i]]; }
            return { opts: pairs.map(p => p.o), correct: pairs.findIndex(p => p.correct) };
        }
        function mcqPick(el, idx, correct) {
            if (mcqAnswered) return;
            mcqAnswered = true;
            clearInterval(gameTimer); document.querySelectorAll('.mcq-btn').forEach(b => b.style.pointerEvents = 'none');
            if (idx === correct) { el.classList.add('correct'); setTimeout(() => gameWin(activeGame), 600); }
            else { el.classList.add('wrong'); document.querySelectorAll('.mcq-btn')[correct].classList.add('correct'); setTimeout(() => gameFail(activeGame, '❌ ERROR'), 900); }
        }

        // ─── SEQUENCE ────────────────────────────
        function buildSequence(g) {
            const c = document.getElementById('game-content'), start = rnd(1, 10), diff = rnd(2, 8);
            const seq = [start, start + diff, start + 2 * diff, start + 3 * diff], ans = (start + 4 * diff).toString();
            c.innerHTML = `<div class="game-header"><div class="game-title">🔢 SECUENCIA</div></div>
            <div class="game-timer-bar"><div class="game-timer-fill" id="tfill" style="width:100%"></div></div>

            <div class="seq-display">${seq.map(n=>`<div class="seq-num">${n}</div>`).join('')}<div class="seq-num seq-question">?</div></div>
            <div class="math-input" id="minput" style="margin-top:12px;">_</div>
            <div class="numpad">${[1,2,3,4,5,6,7,8,9,'C',0,'OK'].map(k=>`<div class="key" onclick="seqKey('${k}','${ans}')">${k}</div>`).join('')}</div>`;
            mathInput = ''; mathFillEl = document.getElementById('minput');
            startTimer(20 + stats.timeBoost, () => gameFail(g, '⏱️ TIEMPO'), document.getElementById('tfill')); stats.timeBoost = 0;
        }
        function seqKey(k, ans) {
            if (k === 'C') { mathInput = ''; mathFillEl.innerText = '_'; }
            else if (k === 'OK') { clearInterval(gameTimer); mathInput === ans ? gameWin(activeGame) : gameFail(activeGame, '❌ ERROR'); }
            else { if (mathInput.length < 6) { mathInput += k; mathFillEl.innerText = mathInput; } }
        }

        // ─── FILL BLANK ──────────────────────────
        function buildFillBlank(g) {
            const c = document.getElementById('game-content'), pool = FILL_BLANK[g.subtype];

            c.innerHTML = `<div class="game-header"><div class="game-title">${g.emoji} ${g.name}</div></div>

        // ─── ANAGRAM ─────────────────────────────
        function buildAnagram(g) {
            const c = document.getElementById('game-content'), item = ANAGRAMS[Math.floor(Math.random() * ANAGRAMS.length)];
            anagramWord = item.word; anagramSelected = []; anagramLetters = anagramWord.split('').sort(() => Math.random() - .5);

            startTimer(30 + stats.timeBoost, () => gameFail(g, '⏱️ TIEMPO'), document.getElementById('tfill')); stats.timeBoost = 0;

        function pickLetter(idx) {
            const tile = document.getElementById('lt' + idx);
            if (tile.classList.contains('selected')) return;
            tile.classList.add('selected'); anagramSelected.push({ idx, letter: anagramLetters[idx] });
            const slots = document.querySelectorAll('.answer-slot'), pos = anagramSelected.length - 1;
            if (pos < slots.length) slots[pos].innerText = anagramLetters[idx];
            if (anagramSelected.length === anagramWord.length) { clearInterval(gameTimer); const formed = anagramSelected.map(s => s.letter).join(''); setTimeout(() => { formed === anagramWord ? gameWin(activeGame) : gameFail(activeGame, '❌ INCORRECTO'); }, 300); }
        }
        function clearAnagram() { anagramSelected = []; document.querySelectorAll('.letter-tile').forEach(t => t.classList.remove('selected')); document.querySelectorAll('.answer-slot').forEach(s => s.innerText = ''); }

        // ─── MEMORY CARDS ────────────────────────
        const MEM_EMOJIS = ['🧮', '📐', '🔬', '🌍', '📚', '🏛️', '⚗️', '🧬'];
        function buildMemoryCards(g) {
            const c = document.getElementById('game-content');
            memFlipped = []; memMatched = 0; memProcessing = false;
            const pairs = [...MEM_EMOJIS, ...MEM_EMOJIS].sort(() => Math.random() - .5);
            memCards = pairs.map((e, i) => ({ id: i, emoji: e, revealed: false, matched: false }));
            c.innerHTML = `<div class="game-header"><div class="game-title">🃏 MEMORIA</div></div>
            <div class="game-timer-bar"><div class="game-timer-fill" id="tfill" style="width:100%"></div></div>
            <div style="font-size:5px;color:#888;">Encuentra los 8 pares</div>
            <div class="memory-grid" style="grid-template-columns:repeat(4,1fr)" id="mem-grid">${memCards.map(mc=>`<div class="mem-card hidden" id="mc${mc.id}" onclick="flipCard(${mc.id})"><span>${mc.emoji}</span></div>`).join('')}</div>
            <div style="font-size:5px;color:#555;">Pares: <span id="mem-pairs">0</span>/8</div>`;
            startTimer(90, () => gameFail(g, '⏱️ TIEMPO'), document.getElementById('tfill'));
        }
        function flipCard(id) {
            if (memProcessing || memFlipped.length >= 2) return;
            const mc = memCards[id]; if (mc.matched || mc.revealed) return;
            mc.revealed = true; memFlipped.push(id); document.getElementById('mc' + id).classList.remove('hidden');
            if (memFlipped.length === 2) {
                memProcessing = true;
                const [a, b] = memFlipped;
                if (memCards[a].emoji === memCards[b].emoji) {
                    setTimeout(() => { memCards[a].matched = memCards[b].matched = true; document.getElementById('mc' + a).classList.add('matched'); document.getElementById('mc' + b).classList.add('matched'); memFlipped = []; memMatched++; document.getElementById('mem-pairs').innerText = memMatched; memProcessing = false; if (memMatched === 8) { clearInterval(gameTimer); setTimeout(() => gameWin(activeGame), 400); } }, 400);
                } else {
                    setTimeout(() => { memCards[a].revealed = memCards[b].revealed = false; document.getElementById('mc' + a).classList.add('hidden'); document.getElementById('mc' + b).classList.add('hidden'); memFlipped = []; memProcessing = false; }, 700);
                }
            }
        }

        // ─── MEMORY FRUITS ───────────────────────
        function buildMemoryFruits(g) {
            const c = document.getElementById('game-content');
            fruitFlipped = []; fruitMatched = 0; fruitAttempts = 8; fruitProcessing = false;
            const pairs = [...FRUIT_EMOJIS, ...FRUIT_EMOJIS].sort(() => Math.random() - .5);
            fruitCards = pairs.map((e, i) => ({ id: i, emoji: e, revealed: false, matched: false }));
            c.innerHTML = `<div class="game-header"><div class="game-title">🍎 MEMORIA FRUTAS</div></div>
            <div style="font-size:5px;color:#888;margin-bottom:4px;">Intentos: <span id="fruit-attempts">8</span> | Pares: <span id="fruit-pairs">0</span>/8</div>
            <div class="game-timer-bar"><div class="game-timer-fill" id="tfill" style="width:100%"></div></div>
            <div style="font-size:5px;color:#888;">Memoriza las frutas (5s) y luego empareja</div>
            <div class="memory-grid" style="grid-template-columns:repeat(4,1fr)" id="fruit-grid">${fruitCards.map(mc=>`<div class="mem-card" id="fc${mc.id}" onclick="flipFruitCard(${mc.id})"><span>${mc.emoji}</span></div>`).join('')}</div>
            <button class="btn-secondary" onclick="resetFruitMemory()">🔄 REINICIAR</button>`;
            document.getElementById('fruit-attempts').innerText = fruitAttempts; document.getElementById('fruit-pairs').innerText = '0';
            startTimer(75, () => gameFail(g, '⏱️ TIEMPO'), document.getElementById('tfill')); setTimeout(hideAllFruitCards, 5000);
        }
        function hideAllFruitCards() { fruitCards.forEach(mc => { if (!mc.matched) { mc.revealed = false; document.getElementById('fc' + mc.id).classList.add('hidden'); } }); }
        function flipFruitCard(id) {
            if (fruitProcessing || fruitFlipped.length >= 2 || fruitAttempts <= 0) return;
            const mc = fruitCards[id]; if (mc.matched || mc.revealed) return;
            mc.revealed = true; fruitFlipped.push(id); document.getElementById('fc' + id).classList.remove('hidden');
            if (fruitFlipped.length === 2) {
                fruitProcessing = true;
                const [a, b] = fruitFlipped;
                if (fruitCards[a].emoji === fruitCards[b].emoji) {
                    setTimeout(() => { fruitCards[a].matched = fruitCards[b].matched = true; document.getElementById('fc' + a).classList.add('matched'); document.getElementById('fc' + b).classList.add('matched'); fruitFlipped = []; fruitMatched++; document.getElementById('fruit-pairs').innerText = fruitMatched; fruitProcessing = false; if (fruitMatched === 8) { clearInterval(gameTimer); setTimeout(() => gameWin(activeGame), 400); } }, 400);
                } else {
                    fruitAttempts--; document.getElementById('fruit-attempts').innerText = fruitAttempts;
                    setTimeout(() => { fruitCards[a].revealed = fruitCards[b].revealed = false; document.getElementById('fc' + a).classList.add('hidden'); document.getElementById('fc' + b).classList.add('hidden'); fruitFlipped = []; fruitProcessing = false; if (fruitAttempts <= 0) { clearInterval(gameTimer); gameFail(activeGame, '❌ SIN INTENTOS'); } }, 700);
                }
            }
        }
        function resetFruitMemory() {
            clearInterval(gameTimer); fruitFlipped = []; fruitMatched = 0; fruitAttempts = 8; fruitProcessing = false;
            const pairs = [...FRUIT_EMOJIS, ...FRUIT_EMOJIS].sort(() => Math.random() - .5);
            fruitCards = pairs.map((e, i) => ({ id: i, emoji: e, revealed: false, matched: false }));
            const grid = document.getElementById('fruit-grid');
            if (grid) { grid.innerHTML = fruitCards.map(mc => `<div class="mem-card" id="fc${mc.id}" onclick="flipFruitCard(${mc.id})"><span>${mc.emoji}</span></div>`).join(''); }
            document.getElementById('fruit-attempts').innerText = fruitAttempts; document.getElementById('fruit-pairs').innerText = '0';
            startTimer(75, () => gameFail(activeGame, '⏱️ TIEMPO'), document.getElementById('tfill')); setTimeout(hideAllFruitCards, 5000);
        }

        // ─── SIMON ───────────────────────────────
        function buildSimon(g) {
            const c = document.getElementById('game-content'); simonSeq = []; simonPlayer = []; simonStep = 0;
            const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9], len = 5 + Math.floor((g.id || 42) / 10);
            simonSeq = Array.from({ length: len }, () => nums[Math.floor(Math.random() * 9)]);
            c.innerHTML = `<div class="game-header"><div class="game-title">🔢 SIMON DICE</div></div>
            <div class="game-timer-bar"><div class="game-timer-fill" id="tfill" style="width:100%"></div></div>
            <div style="font-size:6px;color:#888;">Memoriza y repite la secuencia</div>
            <div style="font-size:8px;color:var(--neon-yellow);margin-bottom:12px;text-align:center;" id="simon-seq-display">?</div>
            <div style="font-size:5px;color:#555;">Tu respuesta: <span id="simon-ans" style="color:var(--neon-green)"></span></div>
            <div class="numpad">${[1,2,3,4,5,6,7,8,9,'×','0','✓'].map(k=>`<div class="key" onclick="simonKey('${k}')">${k}</div>`).join('')}</div>
            <button class="btn-main" style="margin-top:10px;" onclick="showSimonSeq()">👁️ VER SECUENCIA</button>`;
            startTimer(45 + stats.timeBoost, () => gameFail(g, '⏱️ TIEMPO'), document.getElementById('tfill')); stats.timeBoost = 0;
            setTimeout(showSimonSeq, 500);
        }
        function showSimonSeq() { simonPlaying = true; simonPlayer = []; simonStep = 0; document.getElementById('simon-ans').innerText = ''; const el = document.getElementById('simon-seq-display'); el.innerText = '▶ ' + simonSeq.join(' - '); setTimeout(() => { el.innerText = '?'; simonPlaying = false; }, simonSeq.length * 500 + 1000); }
        function simonKey(k) { if (simonPlaying || k === '×') return; simonPlayer.push(parseInt(k)); document.getElementById('simon-ans').innerText = simonPlayer.join(' - '); if (simonPlayer[simonStep] !== simonSeq[simonStep]) { gameFail(activeGame, '❌ ERROR'); return; } simonStep++; if (simonStep === simonSeq.length) { clearInterval(gameTimer); gameWin(activeGame); } }

        // ─── MENTAL CALC ─────────────────────────
        function buildMentalCalc(g) {
            const c = document.getElementById('game-content'), ops = []; let total = 0;
            for (let i = 0; i < 4; i++) { const n = rnd(1, 20), op = i === 0 ? '+' : (['+', '-'][rnd(0, 1)]); if (op === '+' || i === 0) total += n; else total -= n; ops.push({ n, op: i === 0 ? '' : op }); }
            const ans = total.toString(), expr = ops.map(o => `${o.op} ${o.n}`).join(' ');
            c.innerHTML = `<div class="game-header"><div class="game-title">🧮 CÁLCULO MENTAL</div></div>
            <div class="game-timer-bar"><div class="game-timer-fill" id="tfill" style="width:100%"></div></div>
            <div class="math-problem" style="font-size:11px;line-height:1.8;">${expr} = ?</div>
            <div class="math-input" id="minput">_</div>
            <div class="numpad">${[1,2,3,4,5,6,7,8,9,'C',0,'OK'].map(k=>`<div class="key" onclick="mcalcKey('${k}','${ans}')">${k}</div>`).join('')}</div>`;
            mathInput = ''; mathFillEl = document.getElementById('minput'); startTimer(25, () => gameFail(g, '⏱️ TIEMPO'), document.getElementById('tfill'));
        }
        function mcalcKey(k, ans) { if (k === 'C') { mathInput = ''; mathFillEl.innerText = '_'; } else if (k === 'OK') { clearInterval(gameTimer); mathInput === ans ? gameWin(activeGame) : gameFail(activeGame, '❌ ERROR'); } else { if (mathInput.length < 6) { if (k === '-' && mathInput.length === 0) { mathInput = '-'; } else { mathInput += k; } mathFillEl.innerText = mathInput; } } }

        // ─── ORDER ───────────────────────────────
        function buildOrder(g) {
            const c = document.getElementById('game-content'), data = ORDER_DATA[g.subtype]; if (!data) { buildMCQ(g); return; }
            orderItems = [...data.items].sort(() => Math.random() - .5); orderPlaced = [];
            c.innerHTML = `<div class="game-header"><div class="game-title">${g.emoji} ORDENA</div></div>
            <div style="font-size:5px;color:#888;text-align:center;">${data.hint}</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px;border:1px dashed #333;border-radius:6px;width:100%;max-width:340px;" id="order-source">${orderItems.map((item,i)=>`<div style="background:#1a1a2e;border:1px solid #444;padding:6px 10px;font-size:6px;cursor:pointer;border-radius:4px;" id="oi${i}" onclick="orderPick(${i})">${item}</div>`).join('')}</div>
            <div style="font-size:5px;color:#555;text-align:center;">↓ Tu orden ↓</div>
            <div style="display:flex;flex-direction:column;gap:4px;min-height:100px;padding:8px;border:1px dashed #333;border-radius:6px;width:100%;max-width:340px;" id="order-target"></div>
            <button class="btn-secondary" onclick="orderClear()">↩ BORRAR</button>
            <button class="btn-main" onclick="orderCheck('${JSON.stringify(data.items)}')">✓ VERIFICAR</button>`;
        }
        function orderPick(i) { const el = document.getElementById('oi' + i); if (el.style.opacity === '0.2') return; el.style.opacity = '0.2'; orderPlaced.push(orderItems[i]); const target = document.getElementById('order-target'), d = document.createElement('div'); d.style.cssText = 'background:#1a1a2e;border:1px solid #444;padding:6px 10px;font-size:6px;text-align:center;border-radius:4px;'; d.innerText = `${orderPlaced.length}. ${orderItems[i]}`; target.appendChild(d); }
        function orderClear() { orderPlaced = []; document.querySelectorAll('#order-source > div').forEach(el => el.style.opacity = '1'); document.getElementById('order-target').innerHTML = ''; }
        function orderCheck(correctJson) { const correct = JSON.parse(correctJson); const ok = orderPlaced.length === correct.length && orderPlaced.every((v, i) => v === correct[i]); ok ? gameWin(activeGame) : gameFail(activeGame, '❌ ORDEN INCORRECTO'); }

        // ─── TIMELINE ────────────────────────────
        function buildTimeline(g) {
            const c = document.getElementById('game-content'), shuffled = [...TIMELINE_DATA].sort(() => Math.random() - .5);
            const target = shuffled[Math.floor(Math.random() * shuffled.length)];
            const opts4 = [target, ...TIMELINE_DATA.filter(x => x !== target).sort(() => Math.random() - .5).slice(0, 3)].sort(() => Math.random() - .5);
            mcqAnswered = false;
            c.innerHTML = `<div class="game-header"><div class="game-title">📅 LÍNEA DEL TIEMPO</div></div>
            <div class="game-timer-bar"><div class="game-timer-fill" id="tfill" style="width:100%"></div></div>
            <div style="font-size:7px;color:#aaa;text-align:center;">¿En qué fecha ocurrió?</div>
            <div class="math-problem" style="font-size:7px;line-height:1.7;">${target.event}</div>
            <div class="mcq-options">${opts4.map(o=>`<div class="mcq-btn" onclick="tlPick(this,'${o.label}','${target.label}')">${o.label}</div>`).join('')}</div>`;
            startTimer(20, () => gameFail(g, '⏱️ TIEMPO'), document.getElementById('tfill'));
        }
        function tlPick(el, chosen, ans) {
            if (mcqAnswered) return;
            mcqAnswered = true;
            clearInterval(gameTimer); document.querySelectorAll('.mcq-btn').forEach(b => b.style.pointerEvents = 'none');
            if (chosen === ans) { el.classList.add('correct'); setTimeout(() => gameWin(activeGame), 600); }
            else { el.classList.add('wrong'); document.querySelectorAll('.mcq-btn').forEach(b => { if (b.innerText === ans) b.classList.add('correct'); }); setTimeout(() => gameFail(activeGame, '❌ ERROR'), 900); }
        }

        // ─── READING ─────────────────────────────
        function buildReading(g) {
            const c = document.getElementById('game-content'), texts = [
                { p: "El agua cubre el 71% de la superficie terrestre. La mayor parte (97%) es salada. El 3% restante es agua dulce, aunque la mayoría está congelada.", q: "¿Qué porcentaje del agua es dulce?", opts: ["3%", "71%", "97%", "29%"], a: 0 },
                { p: "La fotosíntesis convierte CO₂ y agua en glucosa usando energía solar. Ocurre en los cloroplastos y libera oxígeno.", q: "¿Qué producen las plantas?", opts: ["Glucosa y oxígeno", "Solo CO₂", "Agua y CO₂", "Solo glucosa"], a: 0 },
            ], t = texts[Math.floor(Math.random() * texts.length)], shuffled = shuffleOpts(t.opts, t.a);
            mcqAnswered = false;
            c.innerHTML = `<div class="game-header"><div class="game-title">📖 COMPRENSIÓN</div></div>
            <div class="game-timer-bar"><div class="game-timer-fill" id="tfill" style="width:100%"></div></div>
            <div style="background:#0d0d1a;border:1px solid #1a1a3a;padding:12px;font-size:6px;color:#ccc;line-height:1.8;border-radius:6px;max-width:340px;">${t.p}</div>
            <div style="font-size:7px;color:var(--neon-cyan);text-align:center;">${t.q}</div>
            <div class="mcq-options">${shuffled.opts.map((o,i)=>`<div class="mcq-btn" onclick="mcqPick(this,${i},${shuffled.correct})">${o}</div>`).join('')}</div>`;
            startTimer(30, () => gameFail(g, '⏱️ TIEMPO'), document.getElementById('tfill'));
        }

        // ─── WORD ORDER ──────────────────────────
        function buildWordOrder(g) {
            const c = document.getElementById('game-content'), phrases = [["Las","plantas","producen","oxígeno"],["El","sol","es","una","estrella"],["Colombia","está","en","América"],["La","mitosis","divide","células"],["El","agua","es","vida"]];
            woTarget = phrases[Math.floor(Math.random() * phrases.length)]; woWords = [...woTarget].sort(() => Math.random() - .5); woSelected = [];
            c.innerHTML = `<div class="game-header"><div class="game-title">🔤 ORDENA LA FRASE</div></div>
            <div class="game-timer-bar"><div class="game-timer-fill" id="tfill" style="width:100%"></div></div>
            <div style="font-size:5px;color:#888;text-align:center;">Forma la oración correcta</div>
            <div class="word-answer" id="wo-answer" style="min-height:40px;padding:6px;border:1px dashed #333;width:100%;max-width:340px;border-radius:6px;"><span style="color:#555;font-size:5px;">Toca las palabras en orden</span></div>
            <div class="word-letters" id="wo-tiles">${woWords.map((w,i)=>`<div class="letter-tile" id="wt${i}" onclick="woPick(${i})" style="width:auto;padding:6px 8px;font-size:7px;">${w}</div>`).join('')}</div>
            <div style="display:flex;gap:6px;width:100%;max-width:340px;"><button class="btn-secondary" style="flex:1" onclick="woClear()">BORRAR</button><button class="btn-main" style="flex:1;margin:0;" onclick="woCheck()">✓ OK</button></div>`;
            startTimer(30, () => gameFail(g, '⏱️ TIEMPO'), document.getElementById('tfill'));
        }
        function woPick(i) { const tile = document.getElementById('wt' + i); if (tile.classList.contains('selected')) return; tile.classList.add('selected'); woSelected.push(woWords[i]); const ans = document.getElementById('wo-answer'); if (woSelected.length === 1) ans.innerHTML = ''; const span = document.createElement('div'); span.style.cssText = 'background:#1a1a2e;border:2px solid var(--neon-pink);padding:5px 8px;font-size:7px;border-radius:4px;'; span.innerText = woWords[i]; ans.appendChild(span); }
        function woClear() { woSelected = []; document.querySelectorAll('#wo-tiles .letter-tile').forEach(t => t.classList.remove('selected')); document.getElementById('wo-answer').innerHTML = '<span style="color:#555;font-size:5px;">Toca las palabras en orden</span>'; }
        function woCheck() {
            if (woSelected.length !== woTarget.length) {
                showPopup('⚠️ INCOMPLETO', 'Selecciona todas las palabras');
                return;
            }
            const ok = woSelected.join(' ') === woTarget.join(' ');
            ok ? gameWin(activeGame) : gameFail(activeGame, '❌ ORDEN INCORRECTO');
        }

        // ─── PATTERN ─────────────────────────────
        function buildPattern(g) {
            const patterns = [
                { seq: ['🔴','🔵','🔴','🔵','🔴','?'], ans:'🔵', opts:['🔵','🔴','🟡','🟢'] },
                { seq: ['🌟','🌟','🌙','🌟','🌟','?'], ans:'🌙', opts:['🌙','🌟','☀️','⭐'] },
                { seq: ['A','B','B','A','B','?'], ans:'B', opts:['B','A','C','D'] },
                { seq: ['1','2','4','8','16','?'], ans:'32', opts:['32','24','20','18'] },
            ], p = patterns[Math.floor(Math.random() * patterns.length)], shuffled = shuffleOpts(p.opts, p.opts.indexOf(p.ans));
            mcqAnswered = false;
            const c = document.getElementById('game-content');
            c.innerHTML = `<div class="game-header"><div class="game-title">♟️ PATRÓN</div></div>
            <div class="game-timer-bar"><div class="game-timer-fill" id="tfill" style="width:100%"></div></div>
            <div style="font-size:7px;color:#888;text-align:center;">¿Cuál continúa el patrón?</div>
            <div class="seq-display">${p.seq.map(s=>`<div class="seq-num" style="font-size:16px;${s==='?'?'border-color:var(--neon-yellow);color:var(--neon-yellow);':''}">${s}</div>`).join('')}</div>
            <div class="mcq-options">${shuffled.opts.map((o,i)=>`<div class="mcq-btn" onclick="mcqPick(this,${i},${shuffled.correct})" style="font-size:16px;">${o}</div>`).join('')}</div>`;
            startTimer(20, () => gameFail(g, '⏱️ TIEMPO'), document.getElementById('tfill'));
        }

        // ════════════════════════════════════════════
        //  WIN / FAIL
        // ════════════════════════════════════════════
        function gameWin(g) {
            clearInterval(gameTimer);
            if (!stats.isAdmin) {
                const reward = g.id * 10 + Math.floor((timeLeft / Math.max(1, timerTotal)) * 50);
                stats.coins += reward; stats.streak++;
                if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) { Tecnomath.addCoins(reward); Tecnomath.updateHighScore('mindmath', stats.unlocked); }
                if (!stats.completed.includes(g.id)) { stats.completed.push(g.id); if (g.id >= stats.unlocked && stats.unlocked < 57) stats.unlocked = Math.min(57, g.id + 1); }
                if (g.odsId && !stats.odsCompleted.includes(g.odsId)) { stats.odsCompleted.push(g.odsId); stats.coins += 100; if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) { Tecnomath.addCoins(100); } showPopup('🌍 ODS DESBLOQUEADO!', `ODS ${g.odsId}: +100 💰 bono`); }
                showPopup('¡CORRECTO!', `+${reward} 💰 · Racha: ${stats.streak}🔥`);
            } else { showPopup('¡CORRECTO!', 'MODO ADMIN'); }
            saveStats(); setTimeout(exitGame, 1200);
        }
        function gameFail(g, msg) {
            clearInterval(gameTimer);
            if (!stats.isAdmin) { if (stats.shields > 0) { stats.shields--; showPopup('🛡️ ESCUDO', 'Protección usada'); } else { stats.lives--; stats.streak = 0; showPopup(msg || '❌ FALLO', `Vidas: ${stats.lives} · Racha perdida`); } }
            else { showPopup(msg || 'ERROR', 'MODO ADMIN — sin penalización'); }
            saveStats(); setTimeout(exitGame, 1400);
        }
        function startTimer(secs, onEnd, fillEl) {
            clearInterval(gameTimer);
            timeLeft = timerTotal = secs;
            timerPaused = false;
            gameTimer = setInterval(() => {
                if (timerPaused) return;
                timeLeft--;
                if (fillEl) {
                    fillEl.style.width = (timeLeft / timerTotal * 100) + '%';
                    if (timeLeft <= 3) fillEl.style.background = 'var(--red)';
                    else fillEl.style.background = 'var(--neon-green)';
                }
                if (timeLeft <= 0) {
                    clearInterval(gameTimer);
                    onEnd();
                }
            }, 1000);
        }
        function showPopup(title, sub) { const p = document.getElementById('score-popup'); document.getElementById('popup-title').innerText = title; document.getElementById('popup-sub').innerText = sub; p.classList.add('show'); setTimeout(() => p.classList.remove('show'), 1200); }

        // ════════════════════════════════════════════
        //  SHOP
        // ════════════════════════════════════════════
        function buyItem(type, cost) { if (stats.isAdmin) { applyPurchase(type); return; } if (stats.coins < cost) { showPopup('❌ SIN MONEDAS', `Necesitas ${cost} 💰 locales. Convierte desde la tienda.`); return; } stats.coins -= cost; applyPurchase(type); saveStats(); }
        function applyPurchase(type) { if (type === 'life') stats.lives++; if (type === 'shield') stats.shields++; if (type === 'hint') stats.hints = (stats.hints || 0) + 3; if (type === 'time_boost') stats.timeBoost = (stats.timeBoost || 0) + 10; showPopup('✅ COMPRADO', `+1 ${type}`); saveStats(); }
        function openExchangeModal() { if (typeof Tecnomath === 'undefined' || !Tecnomath.getCurrentUser()) { showPopup('INICIA SESIÓN', 'Necesitas cuenta para convertir monedas'); return; } const globalCoins = Tecnomath.getCoins(); const amountStr = prompt(`Tienes ${globalCoins} 🌐 monedas globales.\n¿Cuántas deseas convertir a monedas de MindMath? (10% comisión)`); if (amountStr === null) return; const amount = parseInt(amountStr); if (isNaN(amount) || amount <= 0) { alert('Cantidad inválida'); return; } if (Tecnomath.exchangeGlobalToLocal('mindmath', amount)) { stats.coins = Tecnomath.getGameCoins('mindmath'); saveStats(); showPopup('✅ CONVERTIDO', `+${Math.floor(amount * 0.9)} 💰 locales`); } else { showPopup('❌ ERROR', 'Fondos globales insuficientes'); } }

        // ════════════════════════════════════════════
        //  ADMIN
        // ════════════════════════════════════════════
        function openAdminPanel() { const code = prompt('CÓDIGO ADMIN:'); if (ADMINS[code]) { stats.isAdmin = true; stats.unlocked = 57; if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) { Tecnomath.setAdmin(Tecnomath.getCurrentUser().username); } saveStats(); showPopup(`⚡ ${ADMINS[code].toUpperCase()}`, 'RECURSOS INFINITOS'); renderMenu(); } else if (code) { showPopup('🔒 ACCESO', 'DENEGADO'); } }
        function updateAdminButton() {
            const exitBtn = document.getElementById('exitAdminBtnGame');
            if (!exitBtn) return;
            try {
                const user = Tecnomath.getCurrentUser();
                if (user && Tecnomath.isAdmin()) {
                    exitBtn.style.display = 'inline-block';
                } else {
                    exitBtn.style.display = 'none';
                }
            } catch (e) {
                exitBtn.style.display = 'none';
            }
        }
        function exitAdminMode() {
            stats.isAdmin = false;
            stats.unlocked = 1;
            saveStats();
            renderMenu();
            updateHUD();
            document.getElementById('exitAdminBtnGame').style.display = 'none';
            showPopup('👋 ADMIN', 'Modo administrador desactivado');
        }

        // ════════════════════════════════════════════
        //  PAUSA AUTOMÁTICA
        // ════════════════════════════════════════════
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && activeGame) {
                timerPaused = true;
            } else if (!document.hidden && activeGame && timerPaused) {
                timerPaused = false;
            }
        });

        // ════════════════════════════════════════════
        //  UTILS & INIT
        // ════════════════════════════════════════════
        function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        buildCatTabs(); loadStats(); switchTab('menu');
    </script>
</body>
