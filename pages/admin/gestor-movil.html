<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agregar juego · TecnoMath</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060610;--card:#0d0d1a;--cyan:#00f5ff;--pink:#ff2bd6;--green:#39ff14;--gold:#ffd700}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:650px;margin:auto}.card{background:var(--card);border:1px solid #292943;border-radius:18px;padding:22px;box-shadow:0 15px 40px #0008}h1{font-family:'Press Start 2P';font-size:16px;color:var(--cyan);text-align:center}label{display:block;margin:14px 0 6px;font-weight:700;color:#cfd2e5}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #383852;background:#090914;color:#fff;font-size:15px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:var(--green);color:#001;font-weight:900;cursor:pointer}.status{margin-top:15px;padding:12px;border-radius:10px;background:#111126;white-space:pre-wrap}.ok{color:var(--green)}.err{color:#ff7f9b}.hint{color:#9292aa;font-size:13px;line-height:1.5}.back{color:var(--cyan);text-decoration:none}
</style>
</head>
<body><div class="wrap"><a class="back" href="supabase.html">← Volver al panel</a><div class="card"><h1>➕ AGREGAR JUEGO</h1><p class="hint">Este gestor ya no modifica index.html. Los juegos nuevos se guardan directamente en data/games.json y quedan disponibles para el orden dinámico de Supabase.</p>
<label>Nombre</label><input id="nombre" placeholder="Ej: Mi juego">
<label>Descripción</label><input id="descripcion" placeholder="Descripción breve">
<label>URL</label><input id="url" placeholder="games/mi-juego/index.html o https://..."><label>Emoji</label><input id="icono" placeholder="🎮">
<label>Categoría</label><select id="categoria"><option value="mates">mates</option><option value="edu">edu</option><option value="educacion">educacion</option><option value="logica">logica</option><option value="eco">eco</option><option value="kids">kids</option><option value="puzzle">puzzle</option><option value="retro">retro</option><option value="runners">runners</option><option value="otros">otros</option></select>
<label>Imagen (opcional)</label><input id="imagen" placeholder="img/mi-juego.png">
<button id="add">➕ GUARDAR EN games.json</button><div id="status" class="status">Listo.</div></div></div>
<script>
'use strict';
const OWNER='Junior162009',REPO='MindMathArcade',BRANCH='main',PATH='data/games.json';
const tokenKey='tecnomath_github_token';
const $=id=>document.getElementById(id);
function setStatus(text,ok=true){$('status').textContent=text;$('status').className='status '+(ok?'ok':'err')}
function b64decode(s){const bin=atob(s.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
function b64encode(s){const bytes=new TextEncoder().encode(s);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin)}
async function github(path,options={}){let token=localStorage.getItem(tokenKey);if(!token){token=prompt('Token de GitHub con permiso para actualizar el repositorio:');if(!token)throw Error('Se necesita el token de GitHub.');localStorage.setItem(tokenKey,token)}const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{...options,headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok){const t=await r.text();throw Error(`GitHub ${r.status}: ${t.slice(0,180)}`)}return r.json()}
async function agregarJuego(){const name=$('nombre').value.trim(),desc=$('descripcion').value.trim(),url=$('url').value.trim(),icon=$('icono').value.trim()||'🎮',category=$('categoria').value,imageUrl=$('imagen').value.trim();if(!name||!url){setStatus('Completa nombre y URL.',false);return}const btn=$('add');btn.disabled=true;setStatus('⏳ Leyendo data/games.json…');try{const current=await github(PATH);const games=JSON.parse(b64decode(current.content));if(!Array.isArray(games))throw Error('games.json no contiene una lista JSON.');const duplicate=games.find(g=>String(g.name||'').trim().toLowerCase()===name.toLowerCase()&&String(g.url||'').trim()===url);if(duplicate)throw Error('Ya existe un juego con el mismo nombre y URL.');games.push({name,desc:desc||'Juego educativo de TecnoMath',url,imageUrl,icon,category,deviceCompatibility:'both',evento:null,sourceType:'upload'});await github(PATH,{method:'PUT',body:JSON.stringify({message:`catalog: agregar ${name} a games.json`,content:b64encode(JSON.stringify(games,null,2)+'\n'),sha:current.sha,branch:BRANCH})});setStatus(`✅ "${name}" fue agregado a data/games.json.\nYa puede aparecer en el catálogo y ordenarse desde el panel de administración.`);['nombre','descripcion','url','icono','imagen'].forEach(id=>$(id).value='')}catch(e){setStatus('❌ '+e.message,false)}finally{btn.disabled=false}}
$('add').addEventListener('click',agregarJuego);
</script></body></html>
