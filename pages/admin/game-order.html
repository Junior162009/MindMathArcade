<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orden del catálogo · TecnoMath</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script src="../../js/tecnomath-auth.js?v=20260914"></script><style>body{margin:0;background:#060610;color:#fff;font:15px Arial}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.muted{color:#9ca0b5}.panel{background:#0d0d1a;border:1px solid #292943;border-radius:16px;padding:18px;margin-top:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#202038;color:#fff}.primary{background:#39ff14;color:#001}.secondary{background:#00d9ff;color:#001}.list{display:grid;gap:9px;margin-top:15px}.row{display:grid;grid-template-columns:40px 70px 1fr auto;gap:12px;align-items:center;background:#090914;border:1px solid #292943;border-radius:13px;padding:9px;user-select:none}.row.drag{opacity:.45;border-color:#00f5ff}.row.drag-over{border-color:#39ff14;box-shadow:0 0 0 2px #39ff1444}.handle{font-size:23px;text-align:center;cursor:grab;touch-action:none}.handle:active{cursor:grabbing}.thumb{width:70px;height:55px;object-fit:cover;border-radius:9px;background:#17172a;display:grid;place-items:center;font-size:25px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.name{font-weight:800}.meta{font-size:12px;color:#9292aa;margin-top:4px}.moves{display:flex;gap:5px}.moves button{width:34px;height:34px;border-radius:8px;border:1px solid #33334d;background:#151528;color:#fff;cursor:pointer}.status{margin-top:12px;padding:12px;border-radius:10px;background:#111126}.ok{color:#39ff14}.err{color:#ff7f9b}@media(max-width:650px){.row{grid-template-columns:30px 55px 1fr}.thumb{width:55px;height:48px}.moves{grid-column:3;justify-content:flex-end}}</style></head><body><div class="wrap"><a href="supabase.html" style="color:#00f5ff">← Volver al panel</a><div class="top"><div><h1>🎮 Orden del catálogo</h1><p class="muted">Este panel organiza todos los juegos de data/games.json. Arrastra un juego hasta el puesto que quieras o usa ↑ ↓. El orden queda guardado en Supabase y el inicio lo aplica automáticamente.</p></div></div><div id="status" class="status">Comprobando administrador…</div><section class="panel"><div class="toolbar"><button class="btn primary" id="save">💾 Guardar orden</button><button class="btn secondary" id="reload">↻ Recargar</button><button class="btn" id="reset">↺ Orden original</button><input id="search" type="search" placeholder="🔎 Buscar…" style="flex:1;min-width:210px;padding:10px;border-radius:9px;border:1px solid #33334d;background:#090914;color:#fff"></div><div id="list" class="list"></div></section></div><script>'use strict';
const $=id=>document.getElementById(id),auth=window.TecnomathAuth;let db,games=[],original=[],dragIndex=-1;
function status(t,ok=true){$('status').innerHTML=t;$('status').className='status '+(ok?'ok':'err')}
function key(g){return String(g&&g.submissionId||g&&g.id||'name:'+(g&&g.name||'')).trim()}
function esc(v){return String(v??'').replace(/[&<>\\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function logoUrl(g){const raw=String(g&&g.imageUrl||'').trim();if(!raw)return '';if(/^(https?:|data:|blob:|\/)/i.test(raw))return raw;return '../../'+raw.replace(/^\.\//,'')}
function logoHtml(g){const url=logoUrl(g),icon=esc(g&&g.icon||'🎮');if(!url)return `<div class="thumb" aria-label="${icon}">${icon}</div>`;return `<div class="thumb"><img src="${esc(url)}" alt="Logo de ${esc(g.name||'juego')}" onerror="this.style.display='none';this.parentElement.textContent='${icon.replace(/'/g,"\\'")}'></div>`}
function syncVisibleIndexes(){const map=new Map(games.map((g,i)=>[key(g),i]));$('list').querySelectorAll('.row[data-key]').forEach(r=>{const i=map.get(r.dataset.key);if(Number.isInteger(i))r.dataset.i=String(i)})}
function move(from,to){if(from<0||to<0||from>=games.length||to>=games.length||from===to)return;const [item]=games.splice(from,1);games.splice(to,0,item);render()}
function clearDragVisuals(){dragIndex=-1;$('list').querySelectorAll('.row').forEach(r=>r.classList.remove('drag','drag-over'))}
function finishDrop(from,to,target){if(from<0||to<0||from>=games.length||to>=games.length||from===to){clearDragVisuals();return}const [item]=games.splice(from,1);games.splice(to,0,item);const dragged=$('list').querySelector('.row.drag');if(dragged&&target&&dragged!==target){if(from<to)target.after(dragged);else target.before(dragged)}syncVisibleIndexes();clearDragVisuals()}
function render(){const q=$('search').value.trim().toLowerCase(),list=$('list');const vis=games.map((g,i)=>({g,i})).filter(x=>!q||`${x.g.name} ${x.g.desc||''} ${x.g.category||''}`.toLowerCase().includes(q));list.innerHTML=vis.length?vis.map(({g,i})=>`<article class="row" draggable="true" data-i="${i}" data-key="${esc(key(g))}"><div class="handle" title="Arrastra para cambiar de puesto" aria-label="Arrastra para cambiar de puesto">☷</div>${logoHtml(g)}<div><div class="name">${esc(g.name)}</div><div class="meta">${esc(g.category||'otros')} · ${esc(g.authorName||'TecnoMath')}</div></div><div class="moves"><button data-m="up" title="Subir">↑</button><button data-m="down" title="Bajar">↓</button></div></article>`).join(''):'<div class="muted">No hay coincidencias.</div>';
list.querySelectorAll('.row').forEach(r=>{const index=()=>Number(r.dataset.i);r.addEventListener('dragstart',e=>{dragIndex=index();r.classList.add('drag');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragIndex))}});r.addEventListener('dragend',clearDragVisuals);r.addEventListener('dragover',e=>{e.preventDefault();if(dragIndex<0)return;e.dataTransfer.dropEffect='move';list.querySelectorAll('.row').forEach(x=>x.classList.remove('drag-over'));if(index()!==dragIndex)r.classList.add('drag-over')});r.addEventListener('drop',e=>{e.preventDefault();const from=dragIndex>=0?dragIndex:Number(e.dataTransfer?.getData('text/plain'));const to=index();finishDrop(from,to,r)});r.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=index(),j=i+(b.dataset.m==='up'?-1:1);if(j>=0&&j<games.length)move(i,j)})})}
async function load(){status('⏳ Cargando catálogo…');try{const r=await fetch(`../../data/games.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar games.json');const data=await r.json();if(!Array.isArray(data))throw Error('games.json no contiene una lista');original=data.filter(g=>g&&g.url);const {data:orders,error}=await db.from('tecnomath_game_catalog_order').select('game_key,sort_order').order('sort_order',{ascending:true}).order('game_key',{ascending:true});if(error)throw error;const rank=new Map((orders||[]).map(x=>[String(x.game_key),Number(x.sort_order)]));games=[...original].sort((a,b)=>(rank.has(key(a))?rank.get(key(a)):1e9)-(rank.has(key(b))?rank.get(key(b)):1e9)||original.indexOf(a)-original.indexOf(b));render();status(`✅ ${games.length} juegos cargados. Puedes arrastrarlos para cambiar su puesto.`)}catch(e){status('❌ '+esc(e.message),false)}}
async function save(){if(!games.length)return;try{const payload=games.map((g,i)=>({game_key:key(g),sort_order:i+1}));const {error}=await db.rpc('tecnomath_update_game_catalog_order',{p_orders:payload});if(error)throw error;status('✅ Orden guardado en Supabase y listo para el catálogo público.')}catch(e){status('❌ '+esc(e.message),false)}}
$('save').onclick=save;$('reload').onclick=load;$('search').oninput=render;$('reset').onclick=()=>{games=[...original];render();status('↺ Orden original preparado. Pulsa Guardar orden para aplicarlo.')};
(async()=>{try{db=await auth.getClient();const user=await auth.currentUser();if(!user||!(await auth.isAdmin())){location.href='../../pages/auth.html';return}await load()}catch(e){status('❌ '+esc(e.message),false)}})();</script></body></html>
