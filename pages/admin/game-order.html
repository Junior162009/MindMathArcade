<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orden de juegos · TecnoMath</title>
<link rel="stylesheet" href="../../css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script src="../../js/tecnomath-auth.js?v=20260914-order"></script>
<style>
body{background:#060610;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:25px auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.muted{color:#aaa}.panel{background:#0d0d1a;border:1px solid #292943;border-radius:16px;padding:20px;margin-top:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:15px 0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#222238;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.primary{background:#39ff14;color:#001}.secondary{background:#00cfe8;color:#001}.game-list{display:grid;gap:10px}.game-row{display:grid;grid-template-columns:54px 150px 1fr auto;gap:14px;align-items:center;background:#090914;border:1px solid #292943;border-radius:14px;padding:10px;contain:layout paint}.position-box{display:flex;flex-direction:column;align-items:center;gap:4px}.position-box label{font-size:9px;color:#777}.position-input{width:46px;height:40px;box-sizing:border-box;text-align:center;border:1px solid #3a3a58;border-radius:9px;background:#151528;color:#fff;font-weight:900;font-size:16px;outline:none}.position-input:focus{border-color:#00cfe8;box-shadow:0 0 0 2px rgba(0,207,232,.15)}.thumb{width:150px;height:95px;border-radius:10px;background:#111125;border:1px solid #30304b;display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;padding:4px}.thumb img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;margin:0}.thumb-fallback{display:none;align-items:center;justify-content:center;font-size:30px;width:100%;height:100%}.name{font-weight:800}.meta{font-size:12px;color:#9292aa;margin-top:4px}.move-buttons{display:flex;gap:5px}.move-buttons button{border:1px solid #33334d;background:#151528;color:#fff;border-radius:8px;width:38px;height:38px;cursor:pointer;font-size:17px}.move-buttons button:disabled{opacity:.35;cursor:not-allowed}.status{padding:12px;border-radius:10px;background:#111126;margin-top:12px}.ok{color:#39ff14}.error{color:#ff8aa2}.pending{color:#ffd166}.preview{margin-top:18px;padding-top:16px;border-top:1px solid #292943}.preview-title{font-weight:800;margin-bottom:10px}.preview-strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}.preview-item{min-width:100px;background:#090914;border:1px solid #292943;border-radius:10px;padding:7px;text-align:center}.preview-item img{width:84px;height:54px;object-fit:contain;display:block;margin:auto}.preview-num{font-size:11px;color:#39ff14;font-weight:800}.preview-name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.history{font-size:12px;color:#9292aa}.undo{display:none}.position-help{font-size:12px;color:#9292aa;margin:4px 0 12px}.position-help b{color:#00cfe8}
@media(max-width:650px){.game-row{grid-template-columns:48px 110px 1fr;gap:9px}.thumb{width:110px;height:75px}.move-buttons{grid-column:3;justify-content:flex-end}.name{font-size:14px}.position-input{width:42px;height:36px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><a href="supabase.html" style="color:#00ffff">← Volver al panel</a><h1>🎮 Orden del catálogo</h1><p class="muted">Organiza los juegos con las flechas o escribe directamente el puesto.</p></div></div>
<div id="status" class="status">Comprobando administrador…</div>
<section class="panel">
<div class="toolbar"><button class="btn primary" id="save">💾 Guardar orden</button><button class="btn secondary" id="reload">↻ Recargar</button><button class="btn" id="reset">↺ Restaurar original</button><button class="btn undo" id="undo">↩️ Deshacer</button><input id="search" type="search" placeholder="Buscar juego…" style="padding:10px;border-radius:9px;border:1px solid #33334d;background:#090914;color:#fff;min-width:220px"></div>
<div class="position-help">💡 Escribe un número en <b>Puesto</b> y pulsa <b>Enter</b>. Ese juego ocupará ese puesto y los demás se desplazarán automáticamente hacia abajo.</div>
<div class="history" id="history"></div>
<div id="list" class="game-list"></div>
<div class="preview"><div class="preview-title">👁️ Vista previa del orden</div><div id="preview" class="preview-strip"></div></div>
</section>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
const auth=window.TecnomathAuth;let db=null,games=[],original=[],history=[],saving=false;
function setStatus(t,type='ok'){$('status').innerHTML=t;$('status').className='status '+type}
function key(g){return String(g.submissionId||g.url||g.name||'')}
function image(g){const src=String(g.imageUrl||'').trim();if(!src)return'';if(/^(?:https?:|data:|\/)/i.test(src))return src;return new URL(src.replace(/^\.\//,''),window.location.origin+'/').href}
function markChanged(){const changed=games.map(key).join('|')!==original.map(key).join('|');$('undo').style.display=history.length?'inline-block':'none';$('save').disabled=saving||!changed;$('reload').disabled=saving;$('reset').disabled=saving;$('history').textContent=changed?`🟡 Cambios pendientes · ${history.length} movimiento${history.length===1?'':'s'}`:'✅ Todo guardado';}
function renderPreview(){const p=$('preview');p.innerHTML=games.slice(0,20).map((g,i)=>{const src=esc(image(g)),name=esc(g.name);return `<div class="preview-item"><div class="preview-num">#${i+1}</div>${src?`<img src="${src}" alt="" loading="lazy" onerror="this.style.display='none'">`:''}<div class="preview-name">${name}</div></div>`}).join('')}
function render(){const q=$('search').value.trim().toLowerCase();const list=$('list');const visible=games.map((g,i)=>({g,i})).filter(x=>!q||`${x.g.name} ${x.g.desc||''} ${x.g.category||''}`.toLowerCase().includes(q));if(!visible.length){list.innerHTML='<div class="muted">No hay juegos que coincidan.</div>';markChanged();renderPreview();return}list.innerHTML=visible.map(({g,i})=>{const src=esc(image(g)),icon=esc(g.icon||'🎮'),name=esc(g.name);return `<article class="game-row" data-index="${i}"><div class="position-box"><label>PUESTO</label><input class="position-input" type="number" min="1" max="${games.length}" value="${i+1}" aria-label="Puesto de ${name}" title="Escribe el puesto y pulsa Enter"></div><div class="thumb">${src?`<img src="${src}" alt="Logo de ${name}" loading="lazy" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}<div class="thumb-fallback">${icon}</div></div><div><div class="name">${name}</div><div class="meta">${esc(g.category||'otros')} · ${esc(g.authorName||'TecnoMath')}</div></div><div class="move-buttons"><button type="button" data-move="up" title="Subir" ${i===0?'disabled':''}>↑</button><button type="button" data-move="down" title="Bajar" ${i===games.length-1?'disabled':''}>↓</button></div></article>`}).join('');list.querySelectorAll('.game-row').forEach(row=>{row.querySelectorAll('[data-move]').forEach(btn=>btn.addEventListener('click',()=>move(Number(row.dataset.index),btn.dataset.move==='up'?-1:1)));row.querySelector('.position-input').addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();const input=e.currentTarget;const target=Number(input.value);moveToPosition(Number(row.dataset.index),target);input.blur()});row.querySelector('.position-input').addEventListener('change',e=>{const target=Number(e.currentTarget.value);if(Number.isInteger(target))moveToPosition(Number(row.dataset.index),target)});});markChanged();renderPreview();}
function snapshot(){return games.map(key)}
function move(i,d){const j=i+d;if(i<0||j<0||j>=games.length||saving)return;history.push(snapshot());if(history.length>30)history.shift();[games[i],games[j]]=[games[j],games[i]];render();}
function moveToPosition(from,target){if(saving||from<0||from>=games.length)return;target=Math.max(1,Math.min(games.length,Math.trunc(target||0)));const to=target-1;if(from===to)return;history.push(snapshot());if(history.length>30)history.shift();const [item]=games.splice(from,1);games.splice(to,0,item);render();const row=document.querySelector(`.game-row[data-index="${to}"]`);row?.querySelector('.position-input')?.focus();}
function undo(){if(!history.length||saving)return;const keys=history.pop();const map=new Map(games.map(g=>[key(g),g]));games=keys.map(k=>map.get(k)).filter(Boolean);render();}
async function load(){setStatus('Cargando catálogo…','pending');try{const r=await fetch(`../../data/games.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar games.json');const data=await r.json();if(!Array.isArray(data))throw Error('games.json no contiene una lista');original=data.filter(g=>g&&g.url);const {data:orders,error}=await db.from('tecnomath_game_catalog_order').select('game_key,sort_order').order('sort_order',{ascending:true}).order('game_key',{ascending:true});if(error)throw error;const rank=new Map((orders||[]).map(x=>[String(x.game_key),Number(x.sort_order)]));games=[...original].sort((a,b)=>(rank.has(key(a))?rank.get(key(a)):Number.MAX_SAFE_INTEGER)-(rank.has(key(b))?rank.get(key(b)):Number.MAX_SAFE_INTEGER)||original.indexOf(a)-original.indexOf(b));history=[];render();setStatus(`✅ ${games.length} juegos cargados. Escribe un puesto y pulsa Enter para mover un juego.`,'ok')}catch(e){setStatus('❌ '+esc(e.message),'error')}}
async function save(){if(saving)return;const changed=games.map(key).join('|')!==original.map(key).join('|');if(!changed)return;saving=true;markChanged();setStatus('💾 Guardando orden en Supabase…','pending');try{const payload=games.map((g,i)=>({game_key:key(g),sort_order:i+1}));const {error}=await db.rpc('tecnomath_update_game_catalog_order',{p_orders:payload});if(error)throw error;original=[...games];history=[];render();setStatus('✅ Orden guardado correctamente en Supabase.','ok')}catch(e){setStatus('❌ No se pudo guardar: '+esc(e.message),'error')}finally{saving=false;markChanged()}}
$('save').addEventListener('click',save);$('reload').addEventListener('click',load);$('search').addEventListener('input',render);$('undo').addEventListener('click',undo);$('reset').addEventListener('click',()=>{if(saving)return;history.push(snapshot());games=[...original];render();setStatus('↺ Orden original preparado. Pulsa Guardar para aplicarlo.','pending')});
(async()=>{try{db=await auth.getClient();const user=await auth.currentUser();if(!user||!(await auth.isAdmin())){location.href='../../pages/auth.html';return}await load()}catch(e){setStatus('❌ '+esc(e.message),'error')}})();
</script>
</body>
</html>
