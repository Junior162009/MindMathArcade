<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orden del catálogo · TecnoMath</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script src="../../js/tecnomath-auth.js?v=20260914"></script><style>body{margin:0;background:#060610;color:#fff;font:15px Arial}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.muted{color:#9ca0b5}.panel{background:#0d0d1a;border:1px solid #292943;border-radius:16px;padding:18px;margin-top:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#202038;color:#fff;transition:filter .15s,transform .05s}.btn:hover:not(:disabled){filter:brightness(1.12)}.btn:active:not(:disabled){transform:scale(.98)}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:#39ff14;color:#001}.secondary{background:#00d9ff;color:#001}.list{display:grid;gap:9px;margin-top:15px}.row{display:grid;grid-template-columns:78px 130px 1fr auto;gap:14px;align-items:center;background:#090914;border:1px solid #292943;border-radius:13px;padding:10px;user-select:none}.thumb{width:130px;height:86px;border-radius:10px;background:#111125;border:1px solid #30304b;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px;box-sizing:border-box;padding:3px}.thumb img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;object-position:center;margin:auto}.name{font-weight:800}.meta{font-size:12px;color:#9292aa;margin-top:4px}.moves{display:flex;gap:7px}.moves button{width:40px;height:40px;border-radius:9px;border:1px solid #33334d;background:#151528;color:#fff;cursor:pointer;font-size:21px;font-weight:900}.moves button:hover{background:#242444;border-color:#00d9ff}.moves button:active{transform:scale(.96)}.status{margin-top:12px;padding:12px;border-radius:10px;background:#111126}.ok{color:#39ff14}.err{color:#ff7f9b}@media(max-width:650px){.row{grid-template-columns:62px 100px 1fr;gap:9px}.thumb{width:100px;height:70px}.moves{grid-column:3;justify-content:flex-end}.moves button{width:42px;height:38px}}</style></head><body><div class="wrap"><a href="supabase.html" style="color:#00f5ff">← Volver al panel</a><div class="top"><div><h1>🎮 Orden del catálogo</h1><p class="muted">Este panel organiza todos los juegos de data/games.json. Usa ↑ ↓ para cambiar cada juego de puesto. El orden queda guardado en Supabase y el inicio lo aplica automáticamente.</p></div></div><div id="status" class="status">Comprobando administrador…</div><section class="panel"><div class="toolbar"><button class="btn primary" id="save">💾 Guardar orden</button><button class="btn secondary" id="reload">↻ Recargar</button><button class="btn" id="reset">↺ Orden original</button><input id="search" type="search" placeholder="🔎 Buscar…" style="flex:1;min-width:210px;padding:10px;border-radius:9px;border:1px solid #33334d;background:#090914;color:#fff"></div><div id="list" class="list"></div></section></div><script>'use strict';
const $=id=>document.getElementById(id),auth=window.TecnomathAuth;let db,games=[],original=[];
function status(t,ok=true){$('status').innerHTML=t;$('status').className='status '+(ok?'ok':'err')}
function key(g){return String(g&&g.submissionId||g&&g.id||'name:'+(g&&g.name||'')).trim()}
function esc(v){return String(v??'').replace(/[&<>\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function logoUrl(g){const raw=String(g&&g.imageUrl||'').trim();if(!raw)return '';if(/^(https?:|data:|blob:|\/)/i.test(raw))return raw;return '../../'+raw.replace(/^\.\//,'')}
function logoHtml(g){const url=logoUrl(g),icon=esc(g&&g.icon||'🎮');if(!url)return `<div class="thumb" aria-label="${icon}">${icon}</div>`;return `<div class="thumb"><img src="${esc(url)}" alt="Logo de ${esc(g.name||'juego')}" onerror="this.style.display='none';this.parentElement.textContent='${icon.replace(/'/g,"\\'")}'"></div>`}
function visibleFullIndexes(){const q=$('search').value.trim().toLowerCase(),out=[];games.forEach((g,j)=>{if(!q||`${g.name||''} ${g.desc||''} ${g.category||''}`.toLowerCase().includes(q))out.push(j)});return out}
function moveRow(rowIndex,delta){const idx=visibleFullIndexes(),a=idx[rowIndex],b=idx[rowIndex+delta];if(a===undefined||b===undefined)return;[games[a],games[b]]=[games[b],games[a]];render()}
function render(){const list=$('list'),idx=visibleFullIndexes();if(!idx.length){list.innerHTML='<div class="muted">No hay coincidencias.</div>';return}list.innerHTML=idx.map((fullIndex,rowIndex)=>{const g=games[fullIndex];return `<article class="row" data-index="${fullIndex}"><div style="font-size:13px;font-weight:800;color:#00d9ff;text-align:center">Puesto<br><strong style="font-size:20px;color:#fff">${fullIndex+1}</strong></div>${logoHtml(g)}<div><div class="name">${esc(g.name)}</div><div class="meta">${esc(g.category||'otros')} · ${esc(g.authorName||'TecnoMath')}</div></div><div class="moves"><button data-m="up" title="Subir">↑</button><button data-m="down" title="Bajar">↓</button></div></article>`}).join('');list.querySelectorAll('.row').forEach(row=>{const fullIndex=Number(row.dataset.index);row.querySelector('[data-m="up"]').onclick=()=>moveRowByIndex(fullIndex,-1);row.querySelector('[data-m="down"]').onclick=()=>moveRowByIndex(fullIndex,1)})}
function moveRowByIndex(fullIndex,delta){const target=fullIndex+delta;if(fullIndex<0||target<0||fullIndex>=games.length||target>=games.length)return;[games[fullIndex],games[target]]=[games[target],games[fullIndex]];render()}
async function load(){if(!db){status('❌ No se pudo inicializar Supabase.',false);return}status('⏳ Cargando catálogo…');try{const r=await fetch(`../../data/games.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data))throw Error('games.json no es una lista');original=data.filter(g=>g&&g.url);const {data:orders,error}=await db.from('tecnomath_game_catalog_order').select('game_key,sort_order').order('sort_order',{ascending:true}).order('game_key',{ascending:true});if(error)throw error;const rank=new Map((orders||[]).map(x=>[String(x.game_key),Number(x.sort_order)]));games=[...original].sort((a,b)=>((rank.has(key(a))?rank.get(key(a)):1e9)-(rank.has(key(b))?rank.get(key(b)):1e9))||(original.indexOf(a)-original.indexOf(b)));render();status(`✅ ${games.length} juegos cargados. Usa las flechas para cambiar su puesto.`)}catch(e){console.error('[game-order] load:',e);status('❌ '+esc(e&&e.message||String(e)),false)}}
let saving=false;async function save(){if(saving||!games.length)return;if(!db){status('❌ No se pudo inicializar Supabase.',false);return}saving=true;const btn=$('save'),label=btn.textContent;btn.disabled=true;btn.textContent='⏳ Guardando…';try{const payload=games.map((g,i)=>({game_key:key(g),sort_order:i+1}));const {error}=await db.rpc('tecnomath_update_game_catalog_order',{p_orders:payload});if(error)throw error;status('✅ Orden guardado correctamente.')}catch(e){console.error('[game-order] save:',e);status('❌ '+esc(e&&e.message||String(e)),false)}finally{saving=false;btn.disabled=false;btn.textContent=label}}
function resetOrder(){games=[...original];render();status('↺ Orden original preparado. Pulsa Guardar orden para aplicarlo.')}
$('save').onclick=save;$('reload').onclick=load;$('search').oninput=render;$('reset').onclick=resetOrder;
const AUTH_TIMEOUT_MS=10000;
function withTimeout(promise,ms,msg){let t;return Promise.race([Promise.resolve(promise).finally(()=>clearTimeout(t)),new Promise((_,rej)=>{t=setTimeout(()=>rej(new Error(msg)),ms)})])}
async function requireAdmin(){if(!auth||typeof auth.getClient!=='function')throw new Error('No se pudo cargar js/tecnomath-auth.js (window.TecnomathAuth no está disponible).');status('⏳ Iniciando Supabase…');try{db=await withTimeout(auth.getClient(),AUTH_TIMEOUT_MS,'Supabase tardó demasiado en inicializar.')}catch(e){throw new Error(e&&e.message||'No se pudo inicializar Supabase.')}status('⏳ Comprobando sesión…');const s=await withTimeout(db.auth.getSession(),AUTH_TIMEOUT_MS,'No se pudo comprobar la sesión (getSession).');if(s&&s.error)throw s.error;const session=s&&s.data&&s.data.session;if(!session||!session.user){location.replace('../../pages/auth.html');return false}status('⏳ Verificando usuario…');const u=await withTimeout(db.auth.getUser(),AUTH_TIMEOUT_MS,'No se pudo verificar el usuario (getUser).');if(u&&u.error)throw u.error;const user=u&&u.data&&u.data.user;if(!user||user.id!==session.user.id){location.replace('../../pages/auth.html');return false}status('⏳ Comprobando administrador…');const p=await withTimeout(db.from('tecnomath_profiles').select('id,role').eq('id',user.id).maybeSingle(),AUTH_TIMEOUT_MS,'La consulta a tecnomath_profiles tardó demasiado.');if(p&&p.error)throw p.error;const role=String(p&&p.data&&p.data.role||'').toLowerCase();if(role!=='admin'){location.replace('../../pages/auth.html');return false}return true}
window.addEventListener('unhandledrejection',ev=>{console.error('[game-order] unhandledrejection:',ev.reason);const el=$('status');if(el&&!el.classList.contains('ok'))status('❌ '+esc(ev.reason&&ev.reason.message||String(ev.reason||'Error desconocido')),false)});window.addEventListener('error',ev=>{console.error('[game-order] error:',ev.error||ev.message);const el=$('status');if(el&&!el.classList.contains('ok'))status('❌ '+esc(ev.error&&ev.error.message||ev.message||'Error desconocido'),false)});
(async()=>{try{const ok=await requireAdmin();if(!ok)return;await load()}catch(e){console.error('[game-order] auth:',e);status('❌ '+esc(e&&e.message||String(e)),false)}})();
</script></body></html>
