<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orden de juegos · TecnoMath</title>
<link rel="stylesheet" href="../../css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script src="../../js/tecnomath-auth.js?v=20260914-order"></script>
<style>
body{background:#060610;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:25px auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.muted{color:#aaa}.panel{background:#0d0d1a;border:1px solid #292943;border-radius:16px;padding:20px;margin-top:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:15px 0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#222238;color:#fff}.primary{background:#39ff14;color:#001}.secondary{background:#00cfe8;color:#001}.danger{background:#ff416c;color:#fff}.game-list{display:grid;gap:10px}.game-row{display:grid;grid-template-columns:42px 150px 1fr auto;gap:14px;align-items:center;background:#090914;border:1px solid #292943;border-radius:14px;padding:10px}.game-row.dragging{opacity:.45}.handle{font-size:24px;cursor:grab;text-align:center}.thumb{width:150px;height:95px;border-radius:10px;background:#111125;border:1px solid #30304b;display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;padding:4px}.thumb img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;margin:0}.thumb-fallback{display:none;align-items:center;justify-content:center;font-size:30px;width:100%;height:100%}.name{font-weight:800}.meta{font-size:12px;color:#9292aa;margin-top:4px}.move-buttons{display:flex;gap:5px}.move-buttons button{border:1px solid #33334d;background:#151528;color:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer}.status{padding:12px;border-radius:10px;background:#111126;margin-top:12px}.ok{color:#39ff14}.error{color:#ff8aa2}@media(max-width:650px){.game-row{grid-template-columns:32px 110px 1fr}.thumb{width:110px;height:75px}.move-buttons{grid-column:3;justify-content:flex-end}.name{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><a href="supabase.html" style="color:#00ffff">← Volver al panel</a><h1>🎮 Orden del catálogo</h1><p class="muted">Arrastra los juegos o usa las flechas. El orden se guarda en Supabase y se aplica al catálogo público.</p></div></div>
<div id="status" class="status">Comprobando administrador…</div>
<section class="panel">
<div class="toolbar"><button class="btn primary" id="save">💾 Guardar orden</button><button class="btn secondary" id="reload">↻ Recargar</button><button class="btn" id="reset">↺ Restaurar orden original</button><input id="search" type="search" placeholder="Buscar juego…" style="padding:10px;border-radius:9px;border:1px solid #33334d;background:#090914;color:#fff;min-width:220px"></div>
<div id="list" class="game-list"></div>
</section>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
const auth=window.TecnomathAuth;let db=null,games=[],original=[];
function setStatus(t,ok=true){$('status').innerHTML=t;$('status').className='status '+(ok?'ok':'error')}
function key(g){return String(g.submissionId||g.url||g.name||'')}
function image(g){const src=String(g.imageUrl||'').trim();if(!src)return'';if(/^(?:https?:|data:|\/)/i.test(src))return src;return new URL(src.replace(/^\.\//,''),window.location.origin+'/').href}
function render(){const q=$('search').value.trim().toLowerCase();const list=$('list');const visible=games.map((g,i)=>({g,i})).filter(x=>!q||`${x.g.name} ${x.g.desc||''} ${x.g.category||''}`.toLowerCase().includes(q));if(!visible.length){list.innerHTML='<div class="muted">No hay juegos que coincidan.</div>';return}list.innerHTML=visible.map(({g,i})=>{const src=image(g),icon=esc(g.icon||'🎮'),name=esc(g.name);return `<article class="game-row" draggable="true" data-index="${i}"><div class="handle" title="Arrastrar">☷</div><div class="thumb"><img src="${esc(src)}" alt="Logo de ${name}" loading="eager" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="thumb-fallback">${icon}</div></div><div><div class="name">${name}</div><div class="meta">${esc(g.category||'otros')} · ${esc(g.authorName||'TecnoMath')}</div></div><div class="move-buttons"><button type="button" data-move="up" title="Subir">↑</button><button type="button" data-move="down" title="Bajar">↓</button></div></article>`}).join('');
list.querySelectorAll('.game-row').forEach(row=>{row.addEventListener('dragstart',()=>{row.classList.add('dragging');row.dataset.dragIndex=row.dataset.index});row.addEventListener('dragend',()=>row.classList.remove('dragging'));row.addEventListener('dragover',e=>e.preventDefault());row.addEventListener('drop',e=>{e.preventDefault();const from=Number(document.querySelector('.dragging')?.dataset.dragIndex);const to=Number(row.dataset.index);if(Number.isInteger(from)&&Number.isInteger(to)&&from!==to){const [item]=games.splice(from,1);games.splice(to,0,item);render()}});row.querySelectorAll('[data-move]').forEach(btn=>btn.addEventListener('click',()=>{const i=Number(row.dataset.index),d=btn.dataset.move==='up'?-1:1,j=i+d;if(j<0||j>=games.length)return;[games[i],games[j]]=[games[j],games[i]];render()}));});}
async function load(){setStatus('Cargando catálogo…');try{const r=await fetch(`../../data/games.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar games.json');const data=await r.json();if(!Array.isArray(data))throw Error('games.json no contiene una lista');original=data.filter(g=>g&&g.url);const {data:orders,error}=await db.from('tecnomath_game_catalog_order').select('game_key,sort_order').order('sort_order',{ascending:true}).order('game_key',{ascending:true});if(error)throw error;const rank=new Map((orders||[]).map(x=>[String(x.game_key),Number(x.sort_order)]));games=[...original].sort((a,b)=>{const ra=rank.has(key(a))?rank.get(key(a)):Number.MAX_SAFE_INTEGER;const rb=rank.has(key(b))?rank.get(key(b)):Number.MAX_SAFE_INTEGER;return ra-rb||original.indexOf(a)-original.indexOf(b)});render();setStatus(`✅ ${games.length} juegos cargados. Cambios pendientes hasta pulsar <b>Guardar orden</b>.`)}catch(e){setStatus('❌ '+esc(e.message),false)}}
async function save(){try{if(!games.length)return;const payload=games.map((g,i)=>({game_key:key(g),sort_order:i+1}));const {error}=await db.rpc('tecnomath_update_game_catalog_order',{p_orders:payload});if(error)throw error;setStatus('✅ Orden guardado. El catálogo público usará este orden.');}catch(e){setStatus('❌ No se pudo guardar: '+esc(e.message),false)}}
$('save').addEventListener('click',save);$('reload').addEventListener('click',load);$('search').addEventListener('input',render);$('reset').addEventListener('click',()=>{games=[...original];render();setStatus('↺ Orden original preparado. Pulsa Guardar orden para aplicarlo.');});
(async()=>{try{db=await auth.getClient();const user=await auth.currentUser();if(!user||!(await auth.isAdmin())){location.href='../../pages/auth.html';return}await load()}catch(e){setStatus('❌ '+esc(e.message),false)}})();
</script>
</body>
</html>
