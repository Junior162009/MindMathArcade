<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orden del catálogo · TecnoMath</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script src="../../js/tecnomath-auth.js?v=20260914"></script><style>body{margin:0;background:#060610;color:#fff;font:15px Arial}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.muted{color:#9ca0b5}.panel{background:#0d0d1a;border:1px solid #292943;border-radius:16px;padding:18px;margin-top:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#202038;color:#fff}.primary{background:#39ff14;color:#001}.secondary{background:#00d9ff;color:#001}.list{display:grid;gap:9px;margin-top:15px}.row{display:grid;grid-template-columns:78px 130px 1fr auto;gap:14px;align-items:center;background:#090914;border:1px solid #292943;border-radius:13px;padding:10px;user-select:none}.thumb{width:130px;height:86px;border-radius:10px;background:#111125;border:1px solid #30304b;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px;box-sizing:border-box;padding:3px}.thumb img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;object-position:center;margin:auto}.name{font-weight:800}.meta{font-size:12px;color:#9292aa;margin-top:4px}.moves{display:flex;gap:7px}.moves button{width:40px;height:40px;border-radius:9px;border:1px solid #33334d;background:#151528;color:#fff;cursor:pointer;font-size:21px;font-weight:900}.moves button:hover{background:#242444;border-color:#00d9ff}.moves button:active{transform:scale(.96)}.status{margin-top:12px;padding:12px;border-radius:10px;background:#111126}.ok{color:#39ff14}.err{color:#ff7f9b}@media(max-width:650px){.row{grid-template-columns:62px 100px 1fr;gap:9px}.thumb{width:100px;height:70px}.moves{grid-column:3;justify-content:flex-end}.moves button{width:42px;height:38px}}</style></head><body><div class="wrap"><a href="supabase.html" style="color:#00f5ff">← Volver al panel</a><div class="top"><div><h1>🎮 Orden del catálogo</h1><p class="muted">Este panel organiza todos los juegos de data/games.json. Usa ↑ ↓ para cambiar cada juego de puesto. El orden queda guardado en Supabase y el inicio lo aplica automáticamente.</p></div></div><div id="status" class="status">Comprobando administrador…</div><section class="panel"><div class="toolbar"><button class="btn primary" id="save">💾 Guardar orden</button><button class="btn secondary" id="reload">↻ Recargar</button><button class="btn" id="reset">↺ Orden original</button><input id="search" type="search" placeholder="🔎 Buscar…" style="flex:1;min-width:210px;padding:10px;border-radius:9px;border:1px solid #33334d;background:#090914;color:#fff"></div><div id="list" class="list"></div></section></div><script>'use strict';
const $=id=>document.getElementById(id),auth=window.TecnomathAuth;let db,games=[],original=[];
function status(t,ok=true){$('status').innerHTML=t;$('status').className='status '+(ok?'ok':'err')}
function key(g){return String(g&&g.submissionId||g&&g.id||'name:'+(g&&g.name||'')).trim()}
function esc(v){return String(v??'').replace(/[&<>\\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function logoUrl(g){const raw=String(g&&g.imageUrl||'').trim();if(!raw)return '';if(/^(https?:|data:|blob:|\/)/i.test(raw))return raw;return '../../'+raw.replace(/^\.\//,'')}
function logoHtml(g){const url=logoUrl(g),icon=esc(g&&g.icon||'🎮');if(!url)return `<div class="thumb" aria-label="${icon}">${icon}</div>`;return `<div class="thumb"><img src="${esc(url)}" alt="Logo de ${esc(g.name||'juego')}" onerror="this.style.display='none';this.parentElement.textContent='${icon.replace(/'/g,"\\'")}'></div>`}
function move(from,to){if(from<0||to<0||from>=games.length||to>=games.length||from===to)return;const [item]=games.splice(from,1);games.splice(to,0,item);render()}
function render(){const q=$('search').value.trim().toLowerCase(),list=$('list');const vis=games.map((g,i)=>({g,i})).filter(x=>!q||`${x.g.name} ${x.g.desc||''} ${x.g.category||''}`.toLowerCase().includes(q));list.innerHTML=vis.length?vis.map(({g,i})=>`<article class="row"><div style="font-size:13px;font-weight:800;color:#00d9ff;text-align:center">Puesto<br><strong style="font-size:20px;color:#fff">${i+1}</strong></div>${logoHtml(g)}<div><div class="name">${esc(g.name)}</div><div class="meta">${esc(g.category||'otros')} · ${esc(g.authorName||'TecnoMath')}</div></div><div class="moves"><button data-m="up" title="Subir">↑</button><button data-m="down" title="Bajar">↓</button></div></article>`).join(''):'<div class="muted">No hay coincidencias.</div>';list.querySelectorAll('.row').forEach(r=>r.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const rows=[...list.querySelectorAll('.row')],i=rows.indexOf(r);if(i<0)return;const q2=$('search').value.trim().toLowerCase();const visIndexes=games.map((g,j)=>({g,j})).filter(x=>!q2||`${x.g.name} ${x.g.desc||''} ${x.g.category||''}`.toLowerCase().includes(q2)).map(x=>x.j);const fullIndex=visIndexes[i];const target=fullIndex+(b.dataset.m==='up'?-1:1);if(target>=0&&target<games.length)move(fullIndex,target)})})}
async function load(){status('⏳ Cargando catálogo…');try{const r=await fetch(`../../data/games.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar games.json');const data=await r.json();if(!Array.isArray(data))throw Error('games.json no contiene una lista');original=data.filter(g=>g&&g.url);const {data:orders,error}=await db.from('tecnomath_game_catalog_order').select('game_key,sort_order').order('sort_order',{ascending:true}).order('game_key',{ascending:true});if(error)throw error;const rank=new Map((orders||[]).map(x=>[String(x.game_key),Number(x.sort_order)]));games=[...original].sort((a,b)=>(rank.has(key(a))?rank.get(key(a)):1e9)-(rank.has(key(b))?rank.get(key(b)):1e9)||original.indexOf(a)-original.indexOf(b));render();status(`✅ ${games.length} juegos cargados. Usa las flechas para cambiar su puesto.`)}catch(e){status('❌ '+esc(e.message),false)}}
async function save(){if(!games.length)return;try{const payload=games.map((g,i)=>({game_key:key(g),sort_order:i+1}));const {error}=await db.rpc('tecnomath_update_game_catalog_order',{p_orders:payload});if(error)throw error;status('✅ Orden guardado en Supabase y listo para el catálogo público.')}catch(e){status('❌ '+esc(e.message),false)}}
$('save').onclick=save;$('reload').onclick=load;$('search').oninput=render;$('reset').onclick=()=>{games=[...original];render();status('↺ Orden original preparado. Pulsa Guardar orden para aplicarlo.')};
(async()=>{try{status('⏳ Verificando sesión…');db=await auth.getClient();const {data:{session},error:sessionError}=await db.auth.getSession();if(sessionError)throw sessionError;if(!session?.user){location.href='../../pages/auth.html';return}status('⏳ Verificando permisos…');const {data:profile,error:profileError}=await db.from('tecnomath_profiles').select('id,username,role').eq('id',session.user.id).maybeSingle();if(profileError)throw profileError;if(String(profile?.role||'').toLowerCase()!=='admin'){location.href='../../pages/auth.html';return}await load()}catch(e){console.error('TecnoMath game-order auth:',e);status('❌ '+esc(e.message),false)}})();</script></body></html>
