<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🤖 Tester de torneos | TecnoMath</title><link rel="stylesheet" href="../../css/admin.css"><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script><script src="../../js/firebase-config.js"></script><style>body{background:#090914;color:#fff;font-family:Arial;margin:0;padding:20px}.wrap{max-width:900px;margin:auto}#access,#status,section{background:#111126;border:1px solid #393956;border-radius:14px;padding:18px;margin:16px 0}label{display:block;margin:12px 0;font-weight:700}select,button{padding:12px;border-radius:9px;margin:6px;border:1px solid #444}button{font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}select{min-width:240px}</style></head><body><main class="wrap"><a href="./tournaments.html">← Volver a torneos</a><h1>🤖 Tester de torneos</h1><p>Herramienta exclusiva para administradores. Los bots son datos sintéticos y no crean cuentas de Firebase Authentication.</p><div id="access">Comprobando permisos…</div><section id="panel" hidden><label for="tournament">Torneo</label><select id="tournament" aria-label="Selecciona el torneo que quieres probar"></select><label for="botCount">Cantidad de bots</label><select id="botCount" aria-label="Cantidad de bots"><option value="3">3</option><option value="5" selected>5</option><option value="10">10</option><option value="20">20</option><option value="50">50</option></select><p><button id="create">🤖 Crear e inscribir</button><button id="scores">🏆 Simular puntuaciones</button><button id="cleanup">🧹 Limpiar bots</button></p><div id="status" role="status" aria-live="polite"></div></section></main><script>(function(){'use strict';const $=id=>document.getElementById(id),access=$('access'),panel=$('panel'),status=$('status'),select=$('tournament'),buttons=[$('create'),$('scores'),$('cleanup')];let auth,firestore,functions;function waitFirebase(){return new Promise((resolve,reject)=>{let n=0;const timer=setInterval(()=>{n++;if(window.firebase&&firebase.apps&&firebase.apps.length&&firebase.auth&&firebase.firestore&&firebase.functions&&window.TecnomathFirebase){clearInterval(timer);resolve()}else if(n>=120){clearInterval(timer);reject(new Error('Firebase no se pudo inicializar.'))}},50)})}async function waitAuth(){auth=firebase.auth();if(auth.currentUser)return auth.currentUser;return await new Promise(resolve=>{let done=false;const off=auth.onAuthStateChanged(u=>{if(done)return;done=true;off();resolve(u)})})}async function loadGuard(){if(window.TecnomathAdminGuard)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='/js/admin-guard.js?v=5';s.onload=resolve;s.onerror=()=>reject(new Error('No se pudo cargar el guard de administrador.'));document.head.appendChild(s)})}async function loadTournaments(){const snap=await firestore.collection('tournaments').limit(100).get();select.innerHTML='';const first=document.createElement('option');first.value='';first.textContent='Selecciona un torneo';select.appendChild(first);snap.forEach(d=>{const data=d.data()||{},o=document.createElement('option');o.value=d.id;o.textContent=data.name||d.id;select.appendChild(o)})}function count(){return Number($('botCount').value)||5}function setBusy(v){buttons.forEach(b=>b.disabled=v)}function friendlyError(e){const code=e?.code||'';const msg=e?.message||String(e);if(code.includes('permission-denied'))return '⛔ No tienes permisos de administrador en el servidor.';if(code.includes('unauthenticated'))return '⛔ Tu sesión expiró. Inicia sesión nuevamente.';if(code.includes('failed-precondition'))return '⚠️ '+msg;return '❌ '+msg}async function call(name,data){if(!functions)functions=firebase.app().functions('us-central1');const fn=functions.httpsCallable(name);try{return(await fn(data)).data}catch(e){console.error('Callable '+name,e);throw e}}async function verifyServerAdmin(){const result=await call('checkTournamentTesterAdmin',{});return result&&result.admin===true}async function create(){if(!select.value){status.textContent='Selecciona un torneo.';return}setBusy(true);status.textContent='⏳ Creando e inscribiendo bots…';try{const result=await call('createTournamentBots',{tournamentId:select.value,count:count()});status.textContent='✅ '+(result.created||0)+' bots inscritos correctamente.'}finally{setBusy(false)}}async function scores(){if(!select.value){status.textContent='Selecciona un torneo.';return}setBusy(true);status.textContent='⏳ Simulando puntuaciones…';try{const result=await call('simulateTournamentBotScores',{tournamentId:select.value,count:count()});status.textContent='🏆 '+(result.updated||0)+' puntuaciones simuladas.'}finally{setBusy(false)}}async function cleanup(){if(!select.value){status.textContent='Selecciona un torneo.';return}if(!confirm('¿Eliminar los bots y sus puntuaciones de este torneo?'))return;setBusy(true);status.textContent='⏳ Limpiando bots…';try{const result=await call('cleanupTournamentBots',{tournamentId:select.value});status.textContent='🧹 '+(result.deleted||0)+' datos de bots eliminados.';await loadTournaments()}finally{setBusy(false)}}async function boot(){try{await waitFirebase();const user=await waitAuth();if(!user){access.textContent='⛔ Debes iniciar sesión.';return}firestore=firebase.firestore();functions=firebase.app().functions('us-central1');try{await loadGuard();if(window.TecnomathAdminGuard&&typeof window.TecnomathAdminGuard.getAdminProfile==='function'){const profile=await window.TecnomathAdminGuard.getAdminProfile(user);if(!profile){access.textContent='⛔ Acceso denegado. Tu perfil no está reconocido como administrador.';return}}}catch(e){console.warn('Guard local no disponible:',e)}try{await user.getIdToken(true)}catch(e){console.warn('No se pudo refrescar el token:',e)}const serverAdmin=await verifyServerAdmin();if(!serverAdmin){access.textContent='⛔ El servidor no reconoce esta cuenta como administrador. Revisa users/'+user.uid+'/role = admin.';return}access.textContent='🟢 Administrador reconocido. El tester está disponible.';panel.hidden=false;await loadTournaments()}catch(e){console.error(e);access.textContent=friendlyError(e)}}$('create').onclick=()=>create().catch(e=>status.textContent=friendlyError(e));$('scores').onclick=()=>scores().catch(e=>status.textContent=friendlyError(e));$('cleanup').onclick=()=>cleanup().catch(e=>status.textContent=friendlyError(e));boot()})();</script></body></html>
