<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🤖 Tester de torneos | TecnoMath</title><style>body{margin:0;background:#090914;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:950px;margin:auto;padding:24px}a{color:#8fd3ff}.box{background:#111126;border:1px solid #2d2d4a;border-radius:18px;padding:20px;margin:16px 0}.controls{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}select,button{padding:12px;border-radius:9px;border:1px solid #393956;background:#17172e;color:#fff}button{font-weight:bold;cursor:pointer}.primary{background:#39ff14;color:#001}.danger{background:#ff416c;color:#fff}.status{margin-top:14px;padding:12px;background:#17172e;border-radius:10px}.bots{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}.bot{background:#17172e;border:1px solid #303050;border-radius:10px;padding:12px}.error{color:#ff7788}.ok{color:#7dff9b}@media(max-width:600px){.wrap{padding:14px}.controls{grid-template-columns:1fr}.controls button{width:100%}}</style><script src="../../js/tecnomath-auth.js"></script></head><body><main class="wrap"><a href="tournaments.html">← Torneos</a><h1>🤖 Tester de torneos</h1><div id="access" class="status">Comprobando permisos…</div><section id="panel" hidden><div class="box"><div class="controls"><label>Torneo<select id="tournament"></select></label><label>Bots<select id="count"><option>3</option><option selected>5</option><option>10</option><option>20</option><option>50</option></select></label></div><div class="controls" style="margin-top:12px"><button class="primary" id="create">🤖 Crear e inscribir</button><button id="scores">🏆 Simular puntuaciones</button></div><button class="danger" id="cleanup" style="margin-top:12px">🧹 Limpiar bots</button><div id="status" class="status">Selecciona un torneo.</div><div id="bots" class="bots"></div></div></section></main><script>(async()=>{const $=id=>document.getElementById(id);try{if(!await TecnomathAuth.isAdmin()){$('access').innerHTML='<span class="error">⛔ Acceso denegado.</span>';return}$('access').innerHTML='<span class="ok">🟢 Administrador reconocido.</span>';$('panel').hidden=false;const db=await TecnomathAuth.getClient(),params=new URLSearchParams(location.search);await load();if(params.get('id')){$('tournament').value=params.get('id')}await refresh();$('tournament').onchange=refresh;$('create').onclick=create;$('scores').onclick=scores;$('cleanup').onclick=cleanup;async function load(){const {data,error}=await db.from('tecnomath_tournaments').select('id,name,start_at').order('start_at',{ascending:true});if(error)throw error;$('tournament').innerHTML=(data||[]).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')||'<option value="">No hay torneos</option>'}async function refresh(){const id=$('tournament').value;if(!id){$('bots').innerHTML='';return}const {data,error}=await db.from('tecnomath_tournament_participants').select('name,bot_id,score,plays,status').eq('tournament_id',id).eq('is_bot',true).order('score',{ascending:false});if(error)throw error;$('status').textContent='🤖 Bots inscritos: '+(data?.length||0);$('bots').innerHTML=data?.length?data.map(b=>`<div class="bot">🤖 <b>${esc(b.name)}</b><br>${Number(b.score||0)} pts<br><small>${Number(b.plays||0)} partida(s)</small></div>`).join(''):'<div>Sin bots.</div>'}async function create(){try{setBusy(true);const {data,error}=await db.rpc('tecnomath_create_tournament_bots',{p_tournament_id:$('tournament').value,p_count:Number($('count').value)});if(error)throw error;$('status').innerHTML='<span class="ok">✅ '+Number(data||0)+' bots creados e inscritos.</span>';await refresh()}catch(e){$('status').innerHTML='<span class="error">❌ '+esc(e.message||e)+'</span>'}finally{setBusy(false)}}async function scores(){try{setBusy(true);const {data,error}=await db.rpc('tecnomath_simulate_tournament_bot_scores',{p_tournament_id:$('tournament').value});if(error)throw error;$('status').innerHTML='<span class="ok">🏆 '+Number(data||0)+' puntuaciones simuladas.</span>';await refresh()}catch(e){$('status').innerHTML='<span class="error">❌ '+esc(e.message||e)+'</span>'}finally{setBusy(false)}}async function cleanup(){if(!confirm('¿Eliminar solo los bots de este torneo?'))return;try{setBusy(true);const {data,error}=await db.rpc('tecnomath_cleanup_tournament_bots',{p_tournament_id:$('tournament').value});if(error)throw error;$('status').innerHTML='<span class="ok">🧹 '+Number(data||0)+' bots eliminados.</span>';await refresh()}catch(e){$('status').innerHTML='<span class="error">❌ '+esc(e.message||e)+'</span>'}finally{setBusy(false)}}function setBusy(v){['create','scores','cleanup','tournament','count'].forEach(x=>$(x).disabled=v)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}}catch(e){console.error(e);$('access').innerHTML='<span class="error">❌ '+esc(e.message||e)+'</span>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})()</script></body></html>
