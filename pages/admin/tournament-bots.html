<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🤖 Tester de torneos | TecnoMath</title><link rel="stylesheet" href="../../css/admin.css"><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="../../js/firebase-config.js"></script><style>body{background:#090914;color:#fff;font-family:Arial;margin:0;padding:20px}.wrap{max-width:900px;margin:auto}#access,#status,section{background:#111126;border:1px solid #393956;border-radius:14px;padding:18px;margin:16px 0}label{display:block;margin:12px 0}select,button{padding:12px;border-radius:9px;margin:6px}button{font-weight:bold;cursor:pointer}select{min-width:240px}</style></head><body><main class="wrap"><a href="./tournaments.html">← Volver a torneos</a><h1>🤖 Tester de torneos</h1><p>Herramienta exclusiva para administradores. Los bots son datos sintéticos.</p><div id="access">Comprobando permisos…</div><section id="panel" hidden><label>Torneo <select id="tournament"></select></label><label>Bots <select id="botCount"><option>3</option><option selected>5</option><option>10</option><option>20</option></select></label><p><button id="create">🤖 Crear e inscribir</button> <button id="scores">🏆 Simular puntuaciones</button> <button id="cleanup">🧹 Limpiar bots</button></p><div id="status"></div></section></main><script>(function(){'use strict';const $=id=>document.getElementById(id);const access=$('access'),panel=$('panel'),status=$('status'),select=$('tournament');let auth,db;function waitFirebase(){return new Promise((resolve,reject)=>{let n=0;const timer=setInterval(()=>{n++;if(window.firebase&&firebase.apps&&firebase.apps.length&&firebase.auth&&firebase.firestore){clearInterval(timer);resolve()}else if(n>=100){clearInterval(timer);reject(new Error('Firebase no se pudo inicializar.'))}},50)})}function botId(i){return'TEST_BOT_'+String(i+1).padStart(2,'0')}async function requireExistingAdmin(){const user=auth.currentUser;if(!user)return null;const guard=window.TecnomathAdminGuard;if(!guard||typeof guard.getAdminProfile!=='function')return null;return await guard.getAdminProfile(user)}async function load(){const s=await db.collection('tournaments').limit(50).get();select.innerHTML='<option value="">Selecciona un torneo</option>';s.forEach(d=>{const o=document.createElement('option');o.value=d.id;o.textContent=(d.data().name||d.id);select.appendChild(o)})}async function count(){return Number($('botCount').value)||5}async function create(){if(!select.value)return status.textContent='Selecciona un torneo.';const ref=db.collection('tournaments').doc(select.value),snap=await ref.get(),data=snap.data()||{},max=Number(data.maxPlayers||0),current=Number(data.participantCount||0),n=await count();if(max&&current+n>max)throw Error('No hay suficientes cupos.');const b=db.batch(),now=firebase.firestore.Timestamp.now();for(let i=0;i<n;i++){const uid=botId(i);b.set(ref.collection('participants').doc(uid),{uid,name:'🤖 Bot '+(i+1),isTestBot:true,bot:true,joinedAt:now,status:'registered'},{merge:true})}b.set(ref,{participantCount:current+n,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await b.commit();status.textContent='✅ '+n+' bots inscritos.'}async function scores(){if(!select.value)return status.textContent='Selecciona un torneo.';const ref=db.collection('tournaments').doc(select.value),b=db.batch(),n=await count();for(let i=0;i<n;i++){const uid=botId(i);b.set(ref.collection('scores').doc(uid),{uid,name:'🤖 Bot '+(i+1),score:1000-i*50+Math.floor(Math.random()*40),isTestBot:true,bot:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}await b.commit();status.textContent='🏆 Puntuaciones simuladas.'}async function cleanup(){if(!select.value)return status.textContent='Selecciona un torneo.';const ref=db.collection('tournaments').doc(select.value),[p,s]=await Promise.all([ref.collection('participants').where('isTestBot','==',true).get(),ref.collection('scores').where('isTestBot','==',true).get()]),b=db.batch();p.forEach(x=>b.delete(x.ref));s.forEach(x=>b.delete(x.ref));const t=await ref.get(),d=t.data()||{};b.set(ref,{participantCount:Math.max(0,Number(d.participantCount||0)-p.size)},{merge:true});await b.commit();status.textContent='🧹 Bots eliminados.'}async function boot(){try{await waitFirebase();auth=firebase.auth();db=firebase.firestore();await new Promise(resolve=>{if(auth.currentUser)return resolve();const off=auth.onAuthStateChanged(()=>{off();resolve()})});if(!auth.currentUser){access.textContent='⛔ Debes iniciar sesión.';return}const guardScript=document.createElement('script');guardScript.src='../../js/admin-guard.js';guardScript.onload=async()=>{try{const profile=await requireExistingAdmin();if(!profile){access.textContent='⛔ Acceso denegado. Tu cuenta no está reconocida como administrador por TecnoMath.';return}access.textContent='🟢 Administrador reconocido. El tester está disponible.';panel.hidden=false;await load()}catch(e){console.error(e);access.textContent='❌ Error verificando administrador: '+e.message}};guardScript.onerror=()=>access.textContent='❌ No se pudo cargar admin-guard.js.';document.head.appendChild(guardScript)}catch(e){console.error(e);access.textContent='❌ '+e.message}}$('create').onclick=()=>create().catch(e=>status.textContent='❌ '+e.message);$('scores').onclick=()=>scores().catch(e=>status.textContent='❌ '+e.message);$('cleanup').onclick=()=>cleanup().catch(e=>status.textContent='❌ '+e.message);boot()})();</script></body></html>
