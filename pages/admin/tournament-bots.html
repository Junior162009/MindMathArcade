<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🤖 Tester de torneos | TecnoMath</title>
<link rel="stylesheet" href="../../css/admin.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../../js/firebase-config.js"></script>
<style>
body{background:#090914;color:#fff;font-family:Arial,sans-serif;margin:0;padding:20px}.wrap{max-width:900px;margin:auto}.card{background:#111126;border:1px solid #393956;border-radius:14px;padding:18px;margin:16px 0}label{display:block;margin:12px 0 6px;font-weight:700}select,button{padding:12px;border-radius:9px;margin:6px 6px 6px 0;border:1px solid #444;background:#17172e;color:#fff}button{font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}select{min-width:240px}.hint{opacity:.8}.ok{color:#7dff9b}.error{color:#ff7777}.bot-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:12px}.bot{background:#17172e;border:1px solid #303050;border-radius:10px;padding:10px}.counter{margin-top:12px;padding:12px;border-radius:10px;background:#0d0d20;border:1px solid #303050}.bot small{opacity:.7}
</style>
</head>
<body>
<main class="wrap">
<a href="./tournaments.html">← Volver a torneos</a>
<h1>🤖 Tester de torneos</h1>
<p>Herramienta exclusiva para administradores. Los bots son datos sintéticos y no crean cuentas reales de Firebase Authentication.</p>
<div id="access" class="card">Comprobando permisos…</div>
<section id="panel" class="card" hidden>
<label for="tournament">Torneo</label>
<select id="tournament" aria-label="Selecciona el torneo que quieres probar"></select>
<div id="counter" class="counter">Selecciona un torneo.</div>
<label for="botCount">Cantidad de bots</label>
<select id="botCount" aria-label="Cantidad de bots"><option value="3">3</option><option value="5" selected>5</option><option value="10">10</option><option value="20">20</option><option value="50">50</option></select>
<div><button id="create">🤖 Crear e inscribir</button><button id="scores">🏆 Simular puntuaciones</button><button id="cleanup">🧹 Limpiar bots</button></div>
<div id="status" role="status" aria-live="polite"></div>
<div id="botList" class="bot-list"></div>
</section>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const access=$('access'),panel=$('panel'),status=$('status'),select=$('tournament'),counter=$('counter'),botList=$('botList');
const buttons=[$('create'),$('scores'),$('cleanup')];
const ADMIN_EMAILS=new Set(['delahozbarcelojunior@gmail.com','nicolenatera26@gmail.com','mateobarbosamatos@gmail.com','jandresvf23@gmail.com']);
let auth,db,firestore,currentUser;
function waitFirebase(){return new Promise((resolve,reject)=>{let n=0;const timer=setInterval(()=>{n++;if(window.firebase&&firebase.apps&&firebase.apps.length&&firebase.auth&&firebase.firestore&&firebase.database){clearInterval(timer);resolve()}else if(n>=120){clearInterval(timer);reject(new Error('Firebase no se pudo inicializar.'))}},50)})}
function waitAuth(){if(auth.currentUser)return Promise.resolve(auth.currentUser);return new Promise(resolve=>{let done=false;const off=auth.onAuthStateChanged(u=>{if(done)return;done=true;off();resolve(u)})})}
async function verifyAdmin(u){if(ADMIN_EMAILS.has(String(u&&u.email||'').toLowerCase()))return true;const s=await db.ref('users/'+u.uid+'/role').once('value');return String(s.val()||'').toLowerCase()==='admin'}
function setBusy(v){buttons.forEach(b=>b.disabled=v);select.disabled=v}
function friendlyError(e){const c=String(e&&e.code||''),m=String(e&&e.message||e||'Error desconocido');if(c.includes('permission-denied'))return '⛔ Firestore rechazó la operación. Publica las reglas de Firestore y verifica tu cuenta administradora.';if(c.includes('unauthenticated'))return '⛔ Tu sesión expiró. Inicia sesión nuevamente.';return '❌ '+m}
function botId(){return 'TM_BOT_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9)}
function botData(id,i){const names=['TecnoBot','MathBot','PixelBot','NexoBot','ProfeBot','RayoBot','CerebroBot','SigmaBot','TurboBot','NovaBot'];return{uid:id,name:names[i%names.length]+' '+String(i+1).padStart(2,'0'),isBot:true,bot:true,botId:id,createdBy:currentUser.uid,score:0,plays:0,status:'registered',source:'tournament-tester'}}
async function participants(ref){return ref.collection('participants').get()}
async function loadTournaments(){const snap=await firestore.collection('tournaments').orderBy('startAt','asc').limit(100).get();select.innerHTML='<option value="">Selecciona un torneo</option>';snap.forEach(d=>{const x=d.data()||{},o=document.createElement('option');o.value=d.id;o.textContent=x.name||d.id;select.appendChild(o)});if(select.options.length>1){select.selectedIndex=1;await loadBots()}}
async function loadBots(){if(!select.value){counter.textContent='Selecciona un torneo.';botList.innerHTML='';return}const ref=firestore.collection('tournaments').doc(select.value),t=await ref.get();if(!t.exists)throw new Error('Torneo no encontrado.');const x=t.data()||{},s=await participants(ref),bots=s.docs.filter(d=>d.data()&&d.data().isBot===true),max=Number(x.maxPlayers||0);counter.textContent='👥 Participantes: '+s.size+(max?' / '+max:'')+' · 🤖 Bots inscritos: '+bots.length;botList.innerHTML=bots.length?bots.map(d=>{const b=d.data()||{};return '<div class="bot">🤖 <b>'+String(b.name||d.id).replace(/[&<>]/g,'')+'</b><br><small>ID: '+String(d.id).replace(/[&<>]/g,'')+'</small><br><small>'+Number(b.score||0)+' pts</small></div>'}).join(''):'<div class="hint">No hay bots inscritos todavía.</div>'}
async function createBots(){if(!select.value){status.textContent='⚠️ Selecciona un torneo.';return}setBusy(true);status.textContent='⏳ Creando e inscribiendo bots…';try{const ref=firestore.collection('tournaments').doc(select.value),snap=await ref.get();if(!snap.exists)throw new Error('El torneo seleccionado no existe.');const x=snap.data()||{},max=Number(x.maxPlayers||0),p=await participants(ref),current=p.size,n=Number($('botCount').value)||5;if(max>0&&current>=max)throw new Error('El torneo ya está lleno.');const createCount=max>0?Math.min(n,max-current):n;const batch=firestore.batch();for(let i=0;i<createCount;i++){const id=botId(),d=botData(id,i);batch.set(ref.collection('participants').doc(id),{...d,joinedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}batch.set(ref,{participantCount:current+createCount,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await batch.commit();status.textContent='✅ '+createCount+' bots creados e inscritos en participants.';await loadBots()}catch(e){console.error(e);status.textContent=friendlyError(e)}finally{setBusy(false)}}
async function simulateScores(){if(!select.value){status.textContent='⚠️ Selecciona un torneo.';return}setBusy(true);status.textContent='⏳ Simulando puntuaciones…';try{const ref=firestore.collection('tournaments').doc(select.value),t=await ref.get(),s=await ref.collection('participants').where('isBot','==',true).get();if(s.empty)throw new Error('No hay bots en este torneo. Primero créalos.');const gameId=t.data()&&t.data().gameId||ref.id,batch=firestore.batch();s.docs.forEach((d,i)=>{const score=100+Math.floor(Math.random()*901);batch.set(ref.collection('scores').doc(d.id),{uid:d.id,name:d.data().name||d.id,isBot:true,bot:true,botId:d.data().botId||d.id,score,gameId,plays:1,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});batch.set(d.ref,{score,plays:1,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})});await batch.commit();status.textContent='🏆 '+s.size+' puntuaciones guardadas en scores.';await loadBots()}catch(e){console.error(e);status.textContent=friendlyError(e)}finally{setBusy(false)}}
async function cleanup(){if(!select.value){status.textContent='⚠️ Selecciona un torneo.';return}if(!confirm('¿Eliminar únicamente los bots y sus puntuaciones? Los usuarios reales no serán modificados.'))return;setBusy(true);status.textContent='⏳ Limpiando bots…';try{const ref=firestore.collection('tournaments').doc(select.value),p=await ref.collection('participants').where('isBot','==',true).get(),s=await ref.collection('scores').where('isBot','==',true).get(),all=await participants(ref),batch=firestore.batch();p.docs.forEach(d=>batch.delete(d.ref));s.docs.forEach(d=>batch.delete(d.ref));batch.set(ref,{participantCount:Math.max(0,all.size-p.size),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await batch.commit();status.textContent='🧹 '+p.size+' bots eliminados. Usuarios reales intactos.';await loadBots()}catch(e){console.error(e);status.textContent=friendlyError(e)}finally{setBusy(false)}}
async function boot(){try{await waitFirebase();auth=firebase.auth();db=firebase.database();firestore=firebase.firestore();currentUser=await waitAuth();if(!currentUser){access.innerHTML='<span class="error">⛔ Debes iniciar sesión.</span>';return}if(!await verifyAdmin(currentUser)){access.innerHTML='<span class="error">⛔ Acceso denegado. Esta herramienta es exclusiva para administradores.</span>';return}access.innerHTML='<span class="ok">🟢 Administrador reconocido. El tester está disponible.</span>';panel.hidden=false;await loadTournaments()}catch(e){console.error(e);access.innerHTML='<span class="error">'+friendlyError(e)+'</span>'}}
select.onchange=loadBots;$('create').onclick=createBots;$('scores').onclick=simulateScores;$('cleanup').onclick=cleanup;boot();
})();
</script>
</body>
</html>
