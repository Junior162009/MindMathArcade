<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🏆 Administrar torneos | TecnoMath</title><style>body{margin:0;background:#090914;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}a{color:#8fd3ff}.box,.card{background:#111126;border:1px solid #2d2d4a;border-radius:18px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:grid;gap:7px;font-weight:bold}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #393956;background:#090914;color:#fff;min-height:42px}textarea{min-height:80px}button{padding:11px 15px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#39ff14;color:#001}.secondary{background:#303b67;color:#fff}.status{padding:12px;background:#17172e;border-radius:10px}.error{color:#ff7788}.ok{color:#7dff9b}.meta{color:#aaa;line-height:1.7}.card h3{margin:0}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#25254a;width:max-content;font-size:12px}@media(max-width:600px){.wrap{padding:14px}.tools{display:grid;grid-template-columns:1fr}.tools>*{width:100%;box-sizing:border-box}}</style><script src="../../js/tecnomath-auth.js"></script></head><body><main class="wrap"><a href="index.html">← Panel</a><h1>🏆 Centro de torneos</h1><div id="access" class="status">Comprobando permisos…</div><section id="panel" hidden><section class="box"><h2>➕ Crear torneo</h2><form id="form"><div class="grid"><label>Nombre<input id="name" required maxlength="100" placeholder="Copa TecnoMath"></label><label>Juego<input id="gameId" maxlength="100" placeholder="ID del juego"></label><label>Tipo<select id="type"><option value="score">Mayor puntuación</option><option value="elimination">Eliminatorias</option></select></label><label>Máximo jugadores<input id="maxPlayers" type="number" min="2" max="10000" value="32"></label><label>Inicio<input id="start" type="datetime-local" required></label><label>Final<input id="end" type="datetime-local" required></label><label>🥇 Premio 1<input id="p1"></label><label>🥈 Premio 2<input id="p2"></label><label>🥉 Premio 3<input id="p3"></label><label style="grid-column:1/-1">Descripción<textarea id="description" maxlength="500"></textarea></label></div><div class="tools"><button class="primary">🏆 Crear torneo</button><button type="button" class="secondary" id="reload">↻ Actualizar</button></div></form><div id="msg" class="status" hidden></div></section><section class="box"><h2>📋 Torneos</h2><div id="list">Cargando…</div></section></section></main><script>(async()=>{const $=id=>document.getElementById(id);let db;try{if(!await TecnomathAuth.isAdmin()){$('access').innerHTML='<span class="error">⛔ Acceso denegado.</span>';return}$('access').innerHTML='<span class="ok">🟢 Administrador reconocido.</span>';$('panel').hidden=false;db=await TecnomathAuth.getClient();await load();$('form').onsubmit=create;$('reload').onclick=load}catch(e){console.error(e);$('access').innerHTML='<span class="error">❌ '+esc(e.message||e)+'</span>'}async function create(ev){ev.preventDefault();const msg=$('msg');msg.hidden=false;msg.textContent='⏳ Creando…';try{const a=new Date($('start').value),b=new Date($('end').value);if(!(b>a))throw new Error('La fecha final debe ser posterior al inicio.');const {error}=await db.rpc('tecnomath_create_tournament',{p_name:$('name').value,p_description:$('description').value,p_game_id:$('gameId').value,p_tournament_type:$('type').value,p_max_players:Number($('maxPlayers').value),p_start_at:a.toISOString(),p_end_at:b.toISOString(),p_prize_first:$('p1').value,p_prize_second:$('p2').value,p_prize_third:$('p3').value});if(error)throw error;msg.innerHTML='<span class="ok">✅ Torneo creado correctamente.</span>';ev.target.reset();$('maxPlayers').value=32;await load()}catch(e){msg.innerHTML='<span class="error">❌ '+esc(e.message||e)+'</span>'}}async function load(){const {data,error}=await db.from('tecnomath_tournaments').select('*').order('start_at',{ascending:true});if(error)throw error;$('list').innerHTML=data?.length?data.map(t=>`<article class="card"><span class="badge">${esc(t.status)}</span><h3>🏆 ${esc(t.name)}</h3><div class="meta">🎮 ${esc(t.game_id||'Todos')} · 👥 ${t.max_players}<br>📅 ${new Date(t.start_at).toLocaleString('es-CO')} → ${new Date(t.end_at).toLocaleString('es-CO')}<br>🎁 ${esc(t.prize_first||'—')} / ${esc(t.prize_second||'—')} / ${esc(t.prize_third||'—')}</div><div class="tools"><a href="../tournament.html?id=${t.id}">Ver torneo</a><a href="tournament-bots.html?id=${t.id}">🤖 Bots</a><button class="secondary" onclick="finalizeTournament('${t.id}')">🏁 Finalizar</button></div></article>`).join(''):'<div class="status">No hay torneos.</div>'}window.finalizeTournament=async id=>{if(!confirm('¿Finalizar este torneo y generar el podio?'))return;const {error}=await db.rpc('tecnomath_finalize_tournament',{p_tournament_id:id});if(error)alert('Error: '+error.message);else await load()};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})()</script></body></html>
