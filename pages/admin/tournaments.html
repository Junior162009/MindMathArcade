<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar torneos | TecnoMath</title><link rel="stylesheet" href="../../css/admin.css"><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="../../js/firebase-config.js"></script><script src="../../js/admin-guard.js"></script><style>body{background:#090914;color:#fff;font-family:Arial;margin:0;padding:20px}main{max-width:1100px;margin:auto}.box{background:#111126;border:1px solid #292943;border-radius:16px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:grid;gap:7px;font-weight:bold}input,select,textarea{padding:11px;border-radius:9px;border:1px solid #393956;background:#090914;color:#fff;box-sizing:border-box}input[type=date],input[type=time]{color-scheme:dark}textarea{min-height:70px}button{padding:10px 14px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#39ff14;color:#001}.danger{background:#ff416c;color:#fff}.card{padding:16px;margin-top:12px;border-radius:13px;background:#090914;border:1px solid #292943}.meta{color:#aaa;line-height:1.6}.msg{padding:12px;border-radius:10px;margin:12px 0;background:#17243b}.hidden{display:none}.date-box{background:#0c0c20;border:1px solid #393956;border-radius:13px;padding:13px}.date-box .title{font-size:13px;color:#aaa;margin-bottom:9px}.date-box .fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.date-box input{width:100%;font-size:15px}.duration{grid-column:1/-1;margin:3px 0 0;color:#39ff14;font-size:13px;font-weight:bold}.date-error{grid-column:1/-1;color:#ff708e;font-size:13px;min-height:16px}@media(max-width:520px){.date-box .fields{grid-template-columns:1fr}.duration,.date-error{grid-column:auto}}</style></head><body><main><a href="./index.html">← Volver al panel</a><h1>🏆 Administrar torneos</h1><div id="msg" class="msg">Cargando...</div><section class="box"><h2>➕ Crear torneo</h2><form id="form"><div class="grid"><label>Nombre<input id="name" required maxlength="100" placeholder="Ej. Copa Math Battle"></label><label>Juego<select id="gameId"><option value="">Todos los juegos</option><option value="math-runner">Math Runner</option><option value="space-math">Space Math</option><option value="zombie-math">Zombie Math</option><option value="jinete11">Math Battle</option></select></label><label>Tipo<select id="type"><option value="score">Mayor puntuación</option><option value="elimination">Eliminatorias</option></select></label><label>Máximo jugadores<input id="maxPlayers" type="number" min="2" value="32"></label><div class="date-box"><div class="title">📅 Inicio del torneo</div><div class="fields"><label>Fecha<input id="startDate" type="date" required></label><label>Hora<input id="startTime" type="time" required step="60"></label><div class="duration" id="duration"></div><div class="date-error" id="dateError"></div></div></div><div class="date-box"><div class="title">🏁 Final del torneo</div><div class="fields"><label>Fecha<input id="endDate" type="date" required></label><label>Hora<input id="endTime" type="time" required step="60"></label><div class="duration">Selecciona fecha y hora de finalización</div><div class="date-error"></div></div></div><label>Premio<input id="prize" maxlength="120" placeholder="Ej. 🥇 500 XP + Insignia"></label></div><label style="margin-top:12px">Descripción<textarea id="description" maxlength="500"></textarea></label><p><button class="primary" type="submit">🏆 Crear torneo</button></p></form></section><section class="box"><h2>📋 Torneos creados</h2><div id="list">Cargando...</div></section></main><script>'use strict';const db=firebase.firestore();const $=id=>document.getElementById(id);const msg=t=>{$('msg').textContent=t};const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const dt=v=>v?.toDate?.().toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})||'—';function state(t){if(t.status==='finished'||t.status==='cancelled')return t.status;const n=Date.now(),s=t.startAt?.toMillis?.()||0,e=t.endAt?.toMillis?.()||Infinity;return n<s?'upcoming':n>e?'finished':'active'}function combineDateTime(date,time){if(!date||!time)return null;const [y,m,d]=date.split('-').map(Number),[h,min]=time.split(':').map(Number);return new Date(y,m-1,d,h,min,0,0)}function updateDateUI(){const s=combineDateTime($('startDate').value,$('startTime').value),e=combineDateTime($('endDate').value,$('endTime').value);let text='';if(s&&e){const diff=e-s;if(diff<=0){$('dateError').textContent='❌ La fecha y hora final deben ser posteriores al inicio.';$('duration').textContent='';return false}$('dateError').textContent='';const mins=Math.floor(diff/60000),days=Math.floor(mins/1440),hours=Math.floor(mins%1440/60),rest=mins%60;const parts=[];if(days)parts.push(days+' día'+(days===1?'':'s'));if(hours)parts.push(hours+' h');if(rest)parts.push(rest+' min');text='⏱️ Duración: '+parts.join(' · ')}else{$('dateError').textContent='';text='Selecciona fecha y hora de inicio y final.'}$('duration').textContent=text;return !!(s&&e&&e>s)}function setDateDefaults(){const now=new Date(),pad=n=>String(n).padStart(2,'0');const start=new Date(now.getTime()+60*60000);const end=new Date(start.getTime()+60*60000);const set=(prefix,d)=>{$(prefix+'Date').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());$(prefix+'Time').value=pad(d.getHours())+':'+pad(d.getMinutes())};set('start',start);set('end',end);updateDateUI()}async function create(e){e.preventDefault();if(!updateDateUI())return msg('❌ Revisa las fechas y horas del torneo.');const start=combineDateTime($('startDate').value,$('startTime').value),end=combineDateTime($('endDate').value,$('endTime').value),id=$('gameId').value;try{await db.collection('tournaments').add({name:$('name').value.trim(),description:$('description').value.trim(),gameId:id,gameName:$('gameId').selectedOptions[0].text,type:$('type').value,maxPlayers:Number($('maxPlayers').value)||0,participantCount:0,prize:$('prize').value.trim(),status:'upcoming',startAt:firebase.firestore.Timestamp.fromDate(start),endAt:firebase.firestore.Timestamp.fromDate(end),createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});e.target.reset();$('maxPlayers').value=32;setDateDefaults();msg('✅ Torneo creado correctamente');}catch(error){console.error(error);msg('❌ No se pudo crear el torneo. Comprueba tus permisos de administrador.')}}async function action(id,a){const ref=db.collection('tournaments').doc(id);try{if(a==='start')await ref.update({status:'active',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});if(a==='cancel')await ref.update({status:'cancelled',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});if(a==='finish'){const s=await ref.collection('scores').orderBy('score','desc').limit(3).get();await ref.update({status:'finished',finishedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),winners:s.docs.map((d,i)=>({rank:i+1,...d.data()}))})}msg('✅ Torneo actualizado');}catch(error){console.error(error);msg('❌ No se pudo actualizar el torneo. Comprueba tus permisos.')}}db.collection('tournaments').orderBy('createdAt','desc').onSnapshot(s=>{$('list').innerHTML=s.docs.length?s.docs.map(d=>{const t=d.data(),st=state(t);return `<article class="card"><h3>${esc(t.name)}</h3><div class="meta">${st==='active'?'🟢 EN CURSO':st==='upcoming'?'🟡 PRÓXIMO':st==='finished'?'⚪ FINALIZADO':'🔴 CANCELADO'} · 👥 ${t.participantCount||0}/${t.maxPlayers||'∞'} · 🎮 ${esc(t.gameName||'Todos')}<br>📅 ${dt(t.startAt)} → ${dt(t.endAt)}<br>🏅 ${esc(t.prize||'Sin premio')}</div><p>${esc(t.description)}</p>${st==='upcoming'?`<button class="primary" onclick="action('${d.id}','start')">▶️ Iniciar</button>`:''}${st!=='finished'&&st!=='cancelled'?`<button onclick="action('${d.id}','finish')">🏁 Finalizar</button><button class="danger" onclick="action('${d.id}','cancel')">Cancelar</button>`:''}</article>`}).join(''):'No hay torneos todavía.'},error=>{console.error(error);$('list').textContent='No se pudieron cargar los torneos.'});$('form').addEventListener('submit',create);['startDate','startTime','endDate','endTime'].forEach(id=>$(id).addEventListener('change',updateDateUI));window.action=action;setDateDefaults();msg('Panel listo.');</script></body></html>
