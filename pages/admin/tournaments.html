<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar torneos | TecnoMath</title><link rel="stylesheet" href="../../css/admin.css"><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="../../js/firebase-config.js"></script><script src="../../js/admin-guard.js"></script><style>body{background:#090914;color:#fff;font-family:Arial;margin:0;padding:20px}main{max-width:1100px;margin:auto}.box{background:#111126;border:1px solid #292943;border-radius:16px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:grid;gap:7px;font-weight:bold}input,select,textarea{padding:11px;border-radius:9px;border:1px solid #393956;background:#090914;color:#fff}textarea{min-height:70px}button{padding:10px 14px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#39ff14;color:#001}.danger{background:#ff416c;color:#fff}.card{padding:16px;margin-top:12px;border-radius:13px;background:#090914;border:1px solid #292943}.meta{color:#aaa;line-height:1.6}.msg{padding:12px;border-radius:10px;margin:12px 0;background:#17243b}.hidden{display:none}</style></head><body><main><a href="./index.html">← Volver al panel</a><h1>🏆 Administrar torneos</h1><div id="msg" class="msg">Cargando...</div><section class="box"><h2>➕ Crear torneo</h2><form id="form"><div class="grid"><label>Nombre<input id="name" required maxlength="100" placeholder="Ej. Copa Math Battle"></label><label>Juego<select id="gameId"><option value="">Todos los juegos</option><option value="math-runner">Math Runner</option><option value="space-math">Space Math</option><option value="zombie-math">Zombie Math</option><option value="jinete11">Math Battle</option></select></label><label>Tipo<select id="type"><option value="score">Mayor puntuación</option><option value="elimination">Eliminatorias</option></select></label><label>Máximo jugadores<input id="maxPlayers" type="number" min="2" value="32"></label><label>Inicio<input id="startAt" type="datetime-local" required></label><label>Final<input id="endAt" type="datetime-local" required></label><label>Premio<input id="prize" maxlength="120" placeholder="Ej. 🥇 500 XP + Insignia"></label></div><label style="margin-top:12px">Descripción<textarea id="description" maxlength="500"></textarea></label><p><button class="primary" type="submit">🏆 Crear torneo</button></p></form></section><section class="box"><h2>📋 Torneos creados</h2><div id="list">Cargando...</div></section></main><script>'use strict';const db=firebase.firestore();const $=id=>document.getElementById(id);const msg=t=>{$('msg').textContent=t};const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const dt=v=>v?.toDate?.().toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})||'—';function state(t){if(t.status==='finished'||t.status==='cancelled')return t.status;const n=Date.now(),s=t.startAt?.toMillis?.()||0,e=t.endAt?.toMillis?.()||Infinity;return n<s?'upcoming':n>e?'finished':'active'}async function create(e){e.preventDefault();const start=new Date($('startAt').value),end=new Date($('endAt').value);if(end<=start)return msg('❌ La fecha final debe ser posterior al inicio');const id=$('gameId').value;await db.collection('tournaments').add({name:$('name').value.trim(),description:$('description').value.trim(),gameId:id,gameName:$('gameId').selectedOptions[0].text,type:$('type').value,maxPlayers:Number($('maxPlayers').value)||0,participantCount:0,prize:$('prize').value.trim(),status:'upcoming',startAt:firebase.firestore.Timestamp.fromDate(start),endAt:firebase.firestore.Timestamp.fromDate(end),createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});e.target.reset();$('maxPlayers').value=32;msg('✅ Torneo creado correctamente');}async function action(id,a){const ref=db.collection('tournaments').doc(id);if(a==='start')await ref.update({status:'active'});if(a==='cancel')await ref.update({status:'cancelled'});if(a==='finish'){const s=await ref.collection('scores').orderBy('score','desc').limit(3).get();await ref.update({status:'finished',finishedAt:firebase.firestore.FieldValue.serverTimestamp(),winners:s.docs.map((d,i)=>({rank:i+1,...d.data()}))})}msg('✅ Torneo actualizado');}db.collection('tournaments').orderBy('createdAt','desc').onSnapshot(s=>{$('list').innerHTML=s.docs.length?s.docs.map(d=>{const t=d.data(),st=state(t);return `<article class="card"><h3>${esc(t.name)}</h3><div class="meta">${st==='active'?'🟢 EN CURSO':st==='upcoming'?'🟡 PRÓXIMO':st==='finished'?'⚪ FINALIZADO':'🔴 CANCELADO'} · 👥 ${t.participantCount||0}/${t.maxPlayers||'∞'} · 🎮 ${esc(t.gameName||'Todos')}<br>📅 ${dt(t.startAt)} → ${dt(t.endAt)}<br>🏅 ${esc(t.prize||'Sin premio')}</div><p>${esc(t.description)}</p>${st==='upcoming'?`<button class="primary" onclick="action('${d.id}','start')">▶️ Iniciar</button>`:''}${st!=='finished'&&st!=='cancelled'?`<button onclick="action('${d.id}','finish')">🏁 Finalizar</button><button class="danger" onclick="action('${d.id}','cancel')">Cancelar</button>`:''}</article>`}).join(''):'No hay torneos todavía.'});$('form').addEventListener('submit',create);window.action=action;msg('Panel listo.');</script></body></html>
