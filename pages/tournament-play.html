<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🏆 Competencia | TecnoMath</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050509;color:#fff;font-family:Arial,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050509}#bar{position:fixed;z-index:20;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(9,9,20,.94);border:1px solid #ffd700;border-radius:14px;padding:8px 10px;box-shadow:0 4px 18px rgba(0,0,0,.4);font-size:12px;max-width:calc(100vw - 20px)}#title{font-weight:900;color:#ffd700;white-space:nowrap}button{border:0;border-radius:9px;padding:8px 10px;font-weight:800;cursor:pointer}#send{background:#39ff14;color:#001}#send:disabled{opacity:.55}#status{font-size:11px;color:#ddd;max-width:300px}#back{background:#292943;color:#fff}@media(max-width:650px){#bar{top:6px;padding:6px;font-size:10px;gap:5px}#status{display:none}button{padding:7px 8px}}</style><script src="../js/tecnomath-auth.js"></script></head><body><div id="bar"><span id="title">🏆 TORNEO</span><button id="send">ENVIAR PUNTUACIÓN</button><button id="back">SALIR</button><span id="status">Cargando…</span></div><iframe id="game" allow="fullscreen"></iframe><script>(async()=>{const q=new URLSearchParams(location.search),tournament=q.get('tournament'),game=q.get('game'),$=id=>document.getElementById(id);if(!tournament||!game){$('status').textContent='Faltan datos del torneo.';return}let db,submitted=false,started=Date.now();const gameUrl=new URL(decodeURIComponent(game),location.origin);gameUrl.searchParams.set('tournament',tournament);$('game').src=gameUrl.href;$('game').addEventListener('load',()=>{try{const d=$('game').contentDocument;['/js/tecnomath-auth.js','/js/tecnomath-tournament.js'].forEach(src=>{if(!d.querySelector('script[src="'+src+'"]')){const s=d.createElement('script');s.src=src;d.head.appendChild(s)}})}catch(e){console.warn('No se pudo preparar el juego:',e)}});try{db=await TecnomathAuth.getClient();const {data:t,error}=await db.from('tecnomath_tournaments').select('name,status,game_id').eq('id',tournament).single();if(error)throw error;$('title').textContent='🏆 '+(t.name||'TORNEO');if(!['open','live'].includes(t.status)){$('status').textContent=t.status==='upcoming'?'El torneo aún no ha comenzado.':'El torneo no está activo.';$('send').disabled=true}}catch(e){console.error(e);$('status').textContent='No se pudo validar el torneo.'}function num(v){const n=Number(String(v??'').replace(/[^0-9.-]/g,''));return Number.isFinite(n)?Math.max(0,Math.floor(n)):null}function scoreFromWindow(w){try{const bridge=w.TecnomathTournament;if(bridge&&typeof bridge.getScore==='function'){const n=num(bridge.getScore());if(n!==null)return n}}catch(_){}for(const v of [w.score,w.gameScore,w.currentScore,w.points,w.puntos,w.finalScore]){const n=num(v);if(n!==null)return n}for(const s of ['#score','#hud-score','#game-score','#scoreValue','#score-value','[data-score]','.score','.score-value','.hud-score','#points','.points']){try{const e=w.document.querySelector(s);if(e){const n=num(e.textContent||e.value||e.getAttribute('data-score'));if(n!==null)return n}}catch(_){}}return null}async function send(){if(submitted)return;const score=scoreFromWindow($('game').contentWindow);if(score===null){$('status').textContent='No pude detectar la puntuación. Termina la partida y vuelve a pulsar ENVIAR.';return}$('send').disabled=true;$('status').textContent='Enviando…';try{const {error}=await db.rpc('tecnomath_submit_tournament_score',{p_tournament_id:tournament,p_score:score,p_duration_ms:Math.max(0,Date.now()-started),p_metadata:{source:'tournament-play',game:gameUrl.pathname}});if(error)throw error;submitted=true;$('status').textContent='✅ Resultado enviado: '+score;$('send').textContent='RESULTADO ENVIADO'}catch(e){console.error(e);$('status').textContent='❌ '+String(e.message||e);$('send').disabled=false}}$('send').onclick=send;$('back').onclick=()=>location.href='tournament.html?id='+encodeURIComponent(tournament);window.addEventListener('message',e=>{if(e.data?.type==='tecnomath:tournament-score')send()})})();</script></body></html>
