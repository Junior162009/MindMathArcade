<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Subir juego · TecnoMath</title>
<link rel="stylesheet" href="../css/admin.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/game-submissions.js"></script>
<style>
body{background:#060610;color:#fff;font-family:Arial,sans-serif;margin:0}.upload-wrap{max-width:760px;margin:40px auto;padding:20px}.upload-card{background:#0d0d1a;border:2px solid #00ffff;border-radius:18px;padding:28px;box-shadow:0 0 30px rgba(0,255,255,.12)}h1{color:#00ffff;margin-top:0}.intro{color:#aaa;line-height:1.6}.grid{display:grid;gap:16px}.field label{display:block;color:#39ff14;font-weight:bold;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid #292943;background:#090914;color:#fff;box-sizing:border-box}.field textarea{min-height:120px;resize:vertical}.hint{font-size:12px;color:#888;margin-top:6px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:bold;background:#00ffff;color:#001}.btn.secondary{background:#222238;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:18px;padding:12px;border-radius:10px;background:#111126;display:none}.status.show{display:block}.status.ok{border:1px solid #39ff14;color:#39ff14}.status.error{border:1px solid #ff416c;color:#ff8aa2}.user-note{padding:12px;background:#111126;border-radius:10px;color:#ddd;margin-bottom:18px}.back{display:inline-block;margin-bottom:20px;color:#00ffff;text-decoration:none}
</style>
</head>
<body>
<main class="upload-wrap">
<a class="back" href="../index.html">← Volver a TecnoMath</a>
<section class="upload-card">
<h1>🎮 SUBIR MI JUEGO</h1>
<p class="intro">Comparte tu juego con TecnoMath. El juego quedará <strong>pendiente de revisión</strong>. Un administrador debe aprobarlo antes de que se publique.</p>
<div id="uploadUser" class="user-note">Comprobando sesión…</div>
<form id="gameUploadForm" class="grid">
<div class="field"><label for="gameName">Nombre del juego</label><input id="gameName" maxlength="60" required placeholder="Ej. Matemáticas Espaciales"></div>
<div class="field"><label for="gameDescription">Descripción</label><textarea id="gameDescription" maxlength="500" required placeholder="Explica brevemente de qué trata tu juego."></textarea></div>
<div class="field"><label for="gameCategory">Categoría</label><select id="gameCategory"><option value="mates">🧮 Matemáticas</option><option value="logica">🧠 Lógica</option><option value="ciencia">🔬 Ciencia</option><option value="ingles">🇬🇧 Inglés</option><option value="sociales">🌎 Sociales</option><option value="arte">🎨 Arte</option><option value="otros">🎮 Otros</option></select></div>
<div class="field"><label for="gameZip">Juego completo (.zip)</label><input id="gameZip" type="file" accept=".zip,application/zip" required><div class="hint">Máximo 7 MB. Debe contener un <b>index.html</b> en la raíz del ZIP.</div></div>
<div class="field"><label for="gameCover">Logo / portada (opcional)</label><input id="gameCover" type="file" accept="image/png,image/jpeg,image/webp"><div class="hint">Máximo 1 MB. Recomendado: 512×512 o 16:9.</div></div>
<div class="actions"><button class="btn secondary" type="button" onclick="location.href='../index.html'">Cancelar</button><button class="btn" id="submitGame" type="submit">🚀 ENVIAR PARA REVISIÓN</button></div>
</form>
<div id="uploadStatus" class="status"></div>
</section>
</main>
</body>
</html>
