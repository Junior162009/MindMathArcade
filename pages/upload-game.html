<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Subir juego · TecnoMath</title>
<link rel="stylesheet" href="../css/admin.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<style>body{background:#060610;color:#fff;font-family:Arial,sans-serif;margin:0}.upload-wrap{max-width:760px;margin:40px auto;padding:20px}.upload-card{background:#0d0d1a;border:2px solid #00ffff;border-radius:18px;padding:28px;box-shadow:0 0 30px rgba(0,255,255,.12)}h1{color:#00ffff}.intro,.notice{color:#aaa;line-height:1.6}.notice{padding:14px;border:1px solid #30304b;border-radius:12px;background:#101022;margin:18px 0}.notice strong{color:#39ff14}.grid{display:grid;gap:16px}.field label{display:block;color:#39ff14;font-weight:bold;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid #292943;background:#090914;color:#fff;box-sizing:border-box}.field textarea{min-height:120px}.hint{font-size:12px;color:#888;margin-top:6px}.actions{display:flex;gap:12px;margin-top:20px}.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:bold;background:#00ffff}.btn.secondary{background:#222238;color:#fff}.btn:disabled{opacity:.5}.status{margin-top:18px;padding:12px;border-radius:10px;background:#111126;display:none}.status.show{display:block}.status.ok{border:1px solid #39ff14;color:#39ff14}.status.error{border:1px solid #ff416c;color:#ff8aa2}.user-note{padding:12px;background:#111126;border-radius:10px;margin-bottom:18px}.back{display:inline-block;margin-bottom:20px;color:#00ffff}</style>
</head><body><main class="upload-wrap"><a class="back" href="../index.html">← Volver</a><section class="upload-card"><h1>🎮 SUBIR MI JUEGO</h1><p class="intro">Envía tu juego para que los 4 administradores lo revisen.</p><div class="notice">☁️ <strong>Modo Spark:</strong> no usamos Firebase Storage ni Cloud Functions. Tu juego debe estar publicado en una URL web (GitHub Pages, Netlify, Vercel, etc.).</div><div id="uploadUser" class="user-note">Comprobando sesión…</div><form id="gameUploadForm" class="grid"><div class="field"><label for="gameName">Nombre</label><input id="gameName" maxlength="60" required placeholder="Ej. Bit Rush"></div><div class="field"><label for="gameDescription">Descripción</label><textarea id="gameDescription" maxlength="500" required></textarea></div><div class="field"><label for="gameCategory">Categoría</label><select id="gameCategory"><option value="mates">🧮 Matemáticas</option><option value="logica">🧠 Lógica</option><option value="ciencia">🔬 Ciencia</option><option value="ingles">🇬🇧 Inglés</option><option value="sociales">🌎 Sociales</option><option value="arte">🎨 Arte</option><option value="otros">🎮 Otros</option></select></div><div class="field"><label for="gameUrl">🌐 URL del juego</label><input id="gameUrl" type="url" maxlength="500" required placeholder="https://usuario.github.io/mi-juego/"><div class="hint">Debe abrir directamente el juego.</div></div><div class="field"><label for="gameImageUrl">🖼️ URL de portada (opcional)</label><input id="gameImageUrl" type="url" maxlength="500" placeholder="https://.../portada.png"></div><div class="actions"><button class="btn secondary" type="button" onclick="location.href='../index.html'">Cancelar</button><button class="btn" id="submitGame" type="submit">🚀 ENVIAR PARA REVISIÓN</button></div></form><div id="uploadStatus" class="status"></div></section></main><script>document.addEventListener('DOMContentLoaded',()=>{const f=document.getElementById('gameUploadForm'),st=document.getElementById('uploadStatus'),ub=document.getElementById('uploadUser'),btn=document.getElementById('submitGame');let u=null;const show=(m,t)=>{st.textContent=m;st.className='status show '+t};const valid=v=>{try{const x=new URL(v);return x.protocol==='https:'||x.protocol==='http:'}catch(_){return false}};window.TecnomathFirebase.auth.onAuthStateChanged(x=>{u=x||null;if(!u){ub.innerHTML='🔒 Debes iniciar sesión. <a href="auth.html">Iniciar sesión</a>';btn.disabled=true}else{ub.textContent='👤 '+(u.displayName||u.email);btn.disabled=false}});f.addEventListener('submit',async e=>{e.preventDefault();if(!u)return show('Debes iniciar sesión.','error');const name=document.getElementById('gameName').value.trim(),description=document.getElementById('gameDescription').value.trim(),category=document.getElementById('gameCategory').value,gameUrl=document.getElementById('gameUrl').value.trim(),imageUrl=document.getElementById('gameImageUrl').value.trim();if(!valid(gameUrl))return show('La URL del juego no es válida.','error');if(imageUrl&&!valid(imageUrl))return show('La URL de portada no es válida.','error');btn.disabled=true;btn.textContent='⏳ ENVIANDO…';try{const ref=window.TecnomathFirebase.database.ref('gameSubmissions').push();await ref.set({name,description,category,gameUrl,imageUrl:imageUrl||'',icon:'🎮',authorUid:u.uid,authorName:u.displayName||u.email.split('@')[0],authorEmail:u.email||'',status:'pending',createdAt:window.TecnomathFirebase.serverTimestamp,submissionVersion:4,storageRequired:false});f.reset();show('✅ Enviado. Los administradores lo revisarán y, si lo aprueban, aparecerá en el catálogo.','ok')}catch(x){show('❌ '+(x.message||x),'error')}btn.disabled=false;btn.textContent='🚀 ENVIAR PARA REVISIÓN'})});</script></body></html>
