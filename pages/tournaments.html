<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🏆 Torneos | TecnoMath</title><style>body{margin:0;background:#090914;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}a{color:#8fd3ff}.hero,.card{background:#111126;border:1px solid #2d2d4a;border-radius:18px;padding:22px;margin:16px 0}.hero{background:linear-gradient(135deg,#15152f,#101026)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card h3{margin-top:0}.meta{color:#aaa;line-height:1.7}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#25254a;font-size:12px}.open{background:#153d24;color:#7dff9b}.live{background:#4a171f;color:#ff9aa9}.btn{display:inline-block;border:0;border-radius:10px;padding:11px 15px;background:#39ff14;color:#001;font-weight:bold;cursor:pointer;text-decoration:none}.btn.secondary{background:#303b67;color:#fff}.empty{text-align:center;padding:30px;color:#aaa}.error{color:#ff7788}.ok{color:#7dff9b}</style><script src="../js/tecnomath-auth.js"></script></head><body><main class="wrap"><a href="../index.html">← TecnoMath</a><section class="hero"><h1>🏆 Centro de Torneos</h1><p>Compite, sube tu puntuación y alcanza el podio.</p><div id="account" class="meta">Comprobando cuenta…</div></section><section><h2>Próximos torneos</h2><div id="list" class="grid"><div class="empty">Cargando torneos…</div></div></section></main><script>(async()=>{const $=id=>document.getElementById(id),db=await TecnomathAuth.getClient();try{const u=await TecnomathAuth.currentUser();$('account').innerHTML=u?'🟢 Sesión iniciada':'🔵 Puedes ver torneos sin iniciar sesión. Para competir debes acceder.';const {data,error}=await db.from('tecnomath_tournaments').select('*').in('status',['upcoming','open','live']).order('start_at',{ascending:true});if(error)throw error;if(!data?.length){$('list').innerHTML='<div class="empty">No hay torneos próximos.</div>';return}$('list').innerHTML=data.map(t=>{const d=new Date(t.start_at),end=new Date(t.end_at);const badge=t.status==='live'?'live':t.status==='open'?'open':'';return `<article class="card"><span class="badge ${badge}">${t.status==='live'?'🔴 EN VIVO':t.status==='open'?'🟢 ABIERTO':'🕐 PRÓXIMO'}</span><h3>${esc(t.name)}</h3><p class="meta">🎮 ${esc(t.game_id||'Todos los juegos')}<br>📅 ${d.toLocaleString('es-CO')}<br>🏁 ${end.toLocaleString('es-CO')}<br>👥 Máximo ${t.max_players}</p><p>${esc(t.description||'')}</p><a class="btn" href="tournament.html?id=${encodeURIComponent(t.id)}">Ver torneo</a></article>`}).join('');}catch(e){console.error(e);$('list').innerHTML='<div class="empty error">No se pudieron cargar los torneos.</div>'}})();function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
