<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🏆 Torneo | TecnoMath</title><style>body{margin:0;background:#090914;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px}a{color:#8fd3ff}.box{background:#111126;border:1px solid #2d2d4a;border-radius:18px;padding:22px;margin:16px 0}.top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.badge{padding:7px 11px;border-radius:999px;background:#25254a}.live{background:#4a171f;color:#ff9aa9}.open{background:#153d24;color:#7dff9b}.btn{border:0;border-radius:10px;padding:12px 16px;background:#39ff14;color:#001;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.5}.rank{width:100%;border-collapse:collapse}.rank th,.rank td{padding:12px;border-bottom:1px solid #292943;text-align:left}.rank th{color:#aaa}.me{font-weight:bold}.msg{padding:12px;border-radius:10px;background:#17172e}.error{color:#ff7788}.ok{color:#7dff9b}.prizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.prize{background:#17172e;padding:14px;border-radius:12px;text-align:center}@media(max-width:650px){.prizes{grid-template-columns:1fr}.wrap{padding:16px}}</style><script src="../js/tecnomath-auth.js"></script></head><body><main class="wrap"><a href="tournaments.html">← Torneos</a><div id="app" class="box">Cargando…</div></main><script>(async()=>{const id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);if(!id){$('app').textContent='Torneo no especificado.';return}const db=await TecnomathAuth.getClient();let me=null;try{me=await TecnomathAuth.currentUser();await db.rpc('tecnomath_refresh_tournament_status',{p_tournament_id:id});const {data:t,error}=await db.from('tecnomath_tournaments').select('*').eq('id',id).single();if(error)throw error;render(t);await refresh();const channel=db.channel('tm-tournament-'+id).on('postgres_changes',{event:'*',schema:'public',table:'tecnomath_tournament_participants',filter:'tournament_id=eq.'+id},()=>refresh()).subscribe();window.addEventListener('beforeunload',()=>db.removeChannel(channel));setInterval(async()=>{await db.rpc('tecnomath_refresh_tournament_status',{p_tournament_id:id});const {data:t2}=await db.from('tecnomath_tournaments').select('*').eq('id',id).single();if(t2)render(t2);await refresh()},15000)}catch(e){console.error(e);$('app').innerHTML='<p class="error">No se pudo cargar el torneo.</p>'}function render(t){const start=new Date(t.start_at),end=new Date(t.end_at);$('app').innerHTML=`<div class="top"><div><span class="badge ${t.status==='live'?'live':t.status==='open'?'open':''}">${label(t.status)}</span><h1>🏆 ${esc(t.name)}</h1><p>${esc(t.description||'')}</p><p>🎮 ${esc(t.game_id||'Todos los juegos')} · 👥 máximo ${t.max_players}<br>📅 ${start.toLocaleString('es-CO')} → ${end.toLocaleString('es-CO')}</p></div><div><button id="join" class="btn">🏁 Inscribirme</button><div id="joinMsg" class="msg" style="margin-top:10px">${me?'':'Inicia sesión para competir.'}</div></div></div><h2>📊 Ranking en vivo</h2><div id="ranking">Cargando…</div><h2>🎁 Premios</h2><div class="prizes"><div class="prize">🥇<br>${esc(t.prize_first||'—')}</div><div class="prize">🥈<br>${esc(t.prize_second||'—')}</div><div class="prize">🥉<br>${esc(t.prize_third||'—')}</div></div>`;$('join').disabled=!me||!['upcoming','open','live'].includes(t.status);$('join').onclick=async()=>{try{$('join').disabled=true;const {error}=await db.rpc('tecnomath_join_tournament',{p_tournament_id:id});if(error)throw error;$('joinMsg').innerHTML='<span class="ok">✅ Inscripción confirmada.</span>'}catch(e){$('joinMsg').innerHTML='<span class="error">❌ '+esc(friendly(e))+'</span>'}finally{await refresh()}}}async function refresh(){const {data,error}=await db.from('tecnomath_tournament_participants').select('id,name,user_id,is_bot,score,plays,status').eq('tournament_id',id).order('score',{ascending:false}).order('updated_at',{ascending:true});if(error)throw error;const rows=data||[];$('ranking').innerHTML=rows.length?`<table class="rank"><thead><tr><th>#</th><th>Jugador</th><th>Puntos</th><th>Partidas</th></tr></thead><tbody>${rows.map((p,i)=>`<tr class="${me&&p.user_id===me.id?'me':''}"><td>${i+1}</td><td>${i<3?['🥇','🥈','🥉'][i]+' ':''}${esc(p.name)}${p.is_bot?' 🤖':''}</td><td>${Number(p.score||0)}</td><td>${Number(p.plays||0)}</td></tr>`).join('')}</tbody></table>`:'<p class="msg">Todavía no hay participantes.</p>'}function label(s){return ({upcoming:'🕐 PRÓXIMO',open:'🟢 ABIERTO',live:'🔴 EN VIVO',finished:'🏁 FINALIZADO',cancelled:'❌ CANCELADO'})[s]||s}function friendly(e){const m=String(e?.message||e);return m.includes('tournament_full')?'El torneo está lleno.':m.includes('login_required')?'Debes iniciar sesión.':m.includes('tournament_closed')?'El torneo ya no está abierto.':m.includes('duplicate')?'Ya estás inscrito.':m}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})()</script></body></html>
