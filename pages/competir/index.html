<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competir | TecnoMath</title><style>body{margin:0;background:#10152b;color:white;font-family:Arial;padding:20px}main{max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:#20294b;border-radius:18px;padding:18px}button{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer}li{margin:7px 0}.tournament{margin:12px 0;padding:12px;background:#161d37;border-radius:12px}</style></head><body><main><h1>🏆 Competir en TecnoMath</h1><p>Rankings reales y torneos conectados a tu cuenta.</p><div class=grid><section class=card><h2>🌍 Top Global</h2><ol id=global><li>Cargando...</li></ol></section><section class=card><h2>🎮 Top del juego</h2><select id=game><option value="">Selecciona un juego</option><option value="math-runner">Math Runner</option><option value="space-math">Space Math</option><option value="zombie-math">Zombie Math</option><option value="jinete11">Math Battle</option></select><ol id=gameTop></ol></section></div><section class=card style="margin-top:18px"><h2>⚔️ Torneos activos y próximos</h2><div id=tournaments>Cargando torneos...</div></section></main><script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script><script src="/js/firebase-config.js"></script><script src="/js/tecnomath-competition.js?v=1"></script><script>let stopGame=null;const C=()=>window.TecnoMathCompetition;function esc(s){return String(s||'Jugador').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function rows(el,data){el.innerHTML=data.length?data.map(x=>`<li><b>#${x.rank}</b> ${esc(x.name)} — ${x.score||0} pts</li>`).join(''):'<li>Aún no hay resultados.</li>'}firebase.auth().onAuthStateChanged(()=>{C().top(null,d=>rows(global,d));C().active(renderTournaments)});game.onchange=()=>{if(stopGame)stopGame();gameTop.innerHTML='';if(game.value)stopGame=C().top(game.value,d=>rows(gameTop,d))};function renderTournaments(list){tournaments.innerHTML=list.length?list.map(t=>`<article class=tournament><h3>${esc(t.name||'Torneo')}</h3><p>${t.status==='active'?'🟢 En curso':'🟡 Próximamente'}</p><button onclick="join('${t.id}')">Inscribirme</button><button onclick="showTop('${t.id}')">Ver ranking</button><ol id="top-${t.id}"></ol></article>`).join(''):'No hay torneos publicados todavía.'}async function join(id){let r=await C().join(id);alert(r.ok?'¡Inscripción realizada!':r.error)}function showTop(id){C().tournamentTop(id,d=>rows(document.getElementById('top-'+id),d))}</script></body></html>
