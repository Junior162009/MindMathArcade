<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎃 Halloween Parade</title>
    <style>
        /* ========== RESET Y BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0518;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ========== CONTENEDOR PRINCIPAL (ocupa toda la pantalla) ========== */
        .game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(8px, 2vh, 20px);
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0d0518 100%);
            position: relative;
        }

        /* ========== FONDO DECORATIVO (emojis flotantes) ========== */
        .bg-emojis {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            font-size: clamp(30px, 6vw, 70px);
            opacity: 0.06;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            word-break: break-all;
            line-height: 1.5;
        }

        .bg-emojis span {
            display: inline-block;
            animation: floatEmoji 10s ease-in-out infinite alternate;
        }

        @keyframes floatEmoji {
            0% { transform: translateY(0) rotate(-3deg); }
            100% { transform: translateY(-20px) rotate(3deg); }
        }

        /* ========== WRAPPER DEL IFRAME (autoescalable) ========== */
        .iframe-wrapper {
            position: relative;
            z-index: 1;
            width: min(95vw, 95vh * 0.666); /* respeta proporción 2:3 */
            max-width: 500px;
            aspect-ratio: 2 / 3; /* relación de aspecto fija (420/630) */
            background: #0a0410;
            border-radius: clamp(12px, 3vw, 28px);
            border: 2px solid rgba(255, 140, 0, 0.3);
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.15), inset 0 0 60px rgba(255, 140, 0, 0.05);
            overflow: hidden;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .iframe-wrapper:hover {
            border-color: rgba(255, 140, 0, 0.7);
            box-shadow: 0 0 60px rgba(255, 140, 0, 0.3);
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* ========== TÍTULO (minimalista, encima del iframe) ========== */
        .title {
            position: relative;
            z-index: 2;
            font-size: clamp(1rem, 3.5vw, 2.2rem);
            font-weight: 900;
            color: #ff8c00;
            text-shadow: 0 0 20px rgba(255, 140, 0, 0.4), 0 0 60px rgba(255, 140, 0, 0.2);
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: clamp(6px, 1.5vh, 15px);
            padding: 0 10px;
            white-space: nowrap;
        }

        /* ========== BOTÓN VOLVER (abajo, fijo) ========== */
        .btn-back {
            position: relative;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            gap: clamp(6px, 1vw, 12px);
            padding: clamp(8px, 1.5vh, 14px) clamp(16px, 3vw, 32px);
            background: rgba(255, 140, 0, 0.1);
            color: #ff8c00;
            font-size: clamp(0.6rem, 1.8vw, 1rem);
            font-weight: 600;
            text-decoration: none;
            border: 2px solid rgba(255, 140, 0, 0.25);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: inherit;
            margin-top: clamp(8px, 2vh, 20px);
            touch-action: manipulation;
        }

        .btn-back:hover {
            background: rgba(255, 140, 0, 0.2);
            border-color: #ff8c00;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.3);
            transform: scale(1.05);
        }

        .btn-back:active {
            transform: scale(0.95);
        }

        .btn-back svg {
            width: clamp(16px, 2vw, 24px);
            height: clamp(16px, 2vw, 24px);
            fill: currentColor;
            flex-shrink: 0;
        }

        /* ========== RESPONSIVE: ajuste por orientación ========== */
        @media (orientation: landscape) and (max-height: 500px) {
            .iframe-wrapper {
                width: min(70vh, 80vw);
                aspect-ratio: 2 / 3;
                max-width: 400px;
            }
            .title {
                font-size: clamp(0.8rem, 2.5vw, 1.4rem);
                margin-bottom: 4px;
            }
            .btn-back {
                padding: 6px 16px;
                font-size: 0.6rem;
                margin-top: 4px;
            }
        }

        @media (max-width: 400px) {
            .title {
                white-space: normal;
                font-size: clamp(0.8rem, 4vw, 1.2rem);
            }
            .iframe-wrapper {
                width: 95vw;
                max-width: 360px;
            }
        }

        @media (min-width: 768px) {
            .iframe-wrapper {
                max-width: 520px;
            }
        }

        @media (min-width: 1024px) {
            .iframe-wrapper {
                max-width: 580px;
            }
        }

        /* ========== BLOQUEO DE ZOOM (adicional) ========== */
        @supports (-webkit-touch-callout: none) {
            body {
                -webkit-text-size-adjust: none;
            }
        }
    </style>
</head>
<body>

    <!-- Fondo decorativo con emojis -->
    <div class="bg-emojis">
        <span>🎃</span><span>🦇</span><span>🎃</span><span>🕸️</span><span>🎃</span>
        <span>🦇</span><span>🎃</span><span>🕷️</span><span>🎃</span><span>🦇</span>
        <span>🎃</span><span>🕸️</span><span>🎃</span><span>🦇</span><span>🎃</span>
        <span>🦇</span><span>🎃</span><span>🕸️</span><span>🎃</span><span>🦇</span>
    </div>

    <!-- Contenido principal -->
    <div class="game-container">

        <!-- Título -->
        <div class="title">🎃 Halloween Parade</div>

        <!-- Iframe autoescalable -->
        <div class="iframe-wrapper">
            <iframe
                src="https://y8.com/embed/halloween_parade"
                scrolling="no"
                allowfullscreen
                loading="lazy"
                title="Halloween Parade Game">
            </iframe>
        </div>

        <!-- Botón volver -->
        <a href="../index.html" class="btn-back">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Volver
        </a>

    </div>

    <script>
        // ============================================================
        // BLOQUEAR ZOOM CON GESTOS (touch)
        // ============================================================
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        document.addEventListener('gesturechange', function(e) {
            e.preventDefault();
        });

        document.addEventListener('gestureend', function(e) {
            e.preventDefault();
        });

        // También bloquear zoom con doble toque
        document.addEventListener('dblclick', function(e) {
            e.preventDefault();
        }, { passive: false });

        console.log('🎃 Halloween Parade cargado - Zoom bloqueado y autoescalado');
    </script>

</body>
</html>
