<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0518">
<title>🎃 Halloween Parade</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0d0518;
    font-family:'Segoe UI',sans-serif;
}

/* CONTENEDOR PRINCIPAL */
.game-container{
    width:100vw;
    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:radial-gradient(circle at center,#1a0a2e 0%,#0d0518 100%);
    padding:15px;
}

/* TÍTULO */
.title{
    color:#ff8c00;
    font-size:clamp(1.3rem,4vw,2.5rem);
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:15px;
    text-align:center;
    text-shadow:0 0 20px rgba(255,140,0,.5);
}

/* MARCO DEL JUEGO */
.iframe-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;

    width:min(95vw,520px);
    height:min(85vh,780px);

    margin:0 auto;

    background:#000;
    border-radius:25px;
    overflow:hidden;

    border:2px solid rgba(255,140,0,.4);

    box-shadow:
        0 0 35px rgba(255,140,0,.25),
        0 0 80px rgba(255,140,0,.15);
}

/* IFRAME */
.iframe-wrapper iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
}

/* BOTÓN VOLVER */
.btn-back{
    margin-top:15px;

    display:flex;
    align-items:center;
    gap:8px;

    padding:10px 25px;

    text-decoration:none;
    color:#ff8c00;

    border:2px solid rgba(255,140,0,.3);
    border-radius:50px;

    background:rgba(255,140,0,.08);

    font-weight:700;
    transition:.3s;
}

.btn-back:hover{
    background:rgba(255,140,0,.18);
    border-color:#ff8c00;
    transform:scale(1.05);
}

.btn-back svg{
    width:18px;
    height:18px;
    fill:currentColor;
}

/* MÓVILES */
@media (max-width:768px){

    .iframe-wrapper{
        width:95vw;
        height:75vh;
    }

    .title{
        font-size:1.4rem;
    }
}
</style>
</head>

<body>

<div class="game-container">

    <div class="title">
        🎃 Halloween Parade
    </div>

    <div class="iframe-wrapper">
        <iframe
            src="https://es.y8.com/embed/halloween_parade"
            allowfullscreen
            scrolling="no"
            loading="lazy">
        </iframe>
    </div>

    <a href="../index.html" class="btn-back">
        <svg viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/>
        </svg>
        VOLVER
    </a>

</div>

</body>
</html>
