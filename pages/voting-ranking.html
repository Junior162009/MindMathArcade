<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Ranking en vivo de los juegos de TecnoMath"><title>🏆 Ranking de votaciones · TecnoMath</title><link rel="stylesheet" href="../css/voting.css?v=20260918-v3"><style>
.ranking-only{max-width:980px;margin:22px auto}.ranking-only .hero-copy{padding-bottom:18px}.ranking-only-list{display:grid;gap:14px;margin-top:20px}.live-rank{display:grid;grid-template-columns:72px 88px 1fr auto;align-items:center;gap:18px;padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#111126,#090914);box-shadow:0 10px 30px #0004;transition:.25s}.live-rank:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 12px 32px #00f5ff18}.live-rank .position{font-size:24px;font-weight:1000;text-align:center}.rank-logo{width:78px;height:78px;border-radius:16px;object-fit:cover;background:#080812;border:1px solid #292943}.rank-name{font-size:clamp(15px,2.5vw,22px);font-weight:1000}.rank-meta{color:var(--muted);font-size:12px;margin-top:6px}.rank-total{font-size:clamp(20px,3vw,30px);font-weight:1000;color:var(--cyan);text-align:right}.rank-total small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.rank-top{border-color:#6b5a19;box-shadow:0 0 25px #ffd70012}.back-vote{margin-top:20px}@media(max-width:650px){.live-rank{grid-template-columns:48px 62px 1fr;gap:10px;padding:12px}.rank-logo{width:58px;height:58px}.rank-total{grid-column:3;text-align:left;font-size:20px}.live-rank .position{font-size:18px}}</style></head><body><main class="voting-shell ranking-only"><header class="hero"><a class="brand" href="../index.html"><img src="../img/mindmath.png" alt="" class="brand-logo" onerror="this.style.display='none'"><span>⚡ TECNOMATH</span></a><div class="hero-copy"><span class="eyebrow">RESULTADOS EN VIVO</span><h1>🏆 RANKING DE VOTACIONES</h1><p>Consulta las posiciones, logos, nombres y votos de los juegos en tiempo real.</p></div><div class="live-badge" id="liveStatus"><i></i> CONECTANDO…</div></header><section class="stats-grid"><article class="stat-card"><span>🎮 Juegos</span><strong id="totalGames">—</strong></article><article class="stat-card"><span>❤️ Votos totales</span><strong id="totalVotes">—</strong></article><article class="stat-card"><span>🥇 Líder</span><strong id="leaderName">—</strong></article><article class="stat-card"><span>🕒 Actualización</span><strong id="updated">—</strong></article></section><section class="ranking-panel"><div class="section-head"><div><span class="eyebrow">TODAS LAS POSICIONES</span><h2>📊 Ranking completo</h2></div><button id="refresh" class="ghost-btn">↻ Actualizar</button></div><div id="ranking" class="ranking-only-list" aria-live="polite"></div></section><div class="back-vote"><a class="vote-btn" href="voting.html">❤️ IR A VOTAR</a><a class="ghost-btn" href="../index.html">🏠 INICIO</a></div></main><script>
(function(){'use strict';const C='../data/games.json',S={db:null,games:[],counts:new Map(),channel:null};const $=id=>document.getElementById(id),gid=g=>String(g.url||g.name||'').trim(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rows(){return S.games.map(g=>({...g,id:gid(g),votes:Number(S.counts.get(gid(g))||0)})).sort((a,b)=>b.votes-a.votes||a.name.localeCompare(b.name,'es'))}function render(){const r=rows(),total=r.reduce((a,g)=>a+g.votes,0);$('totalGames').textContent=r.length.toLocaleString('es-CO');$('totalVotes').textContent=total.toLocaleString('es-CO');$('leaderName').textContent=r[0]?.name||'—';$('updated').textContent=new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});$('ranking').innerHTML=r.map((g,i)=>{const img=g.imageUrl?'<img class="rank-logo" src="../'+esc(g.imageUrl.replace(/^\\.\\//,''))+'" alt="'+esc(g.name)+'" loading="lazy">':'<div class="rank-logo" style="display:grid;place-items:center;font-size:32px">'+esc(g.icon||'🎮')+'</div>';const medal=i<3?['🥇','🥈','🥉'][i]:'#'+(i+1);return '<article class="live-rank '+(i<3?'rank-top':'')+'"><div class="position">'+medal+'</div>'+img+'<div><div class="rank-name">'+esc(g.name)+'</div><div class="rank-meta">'+esc(g.category||'Juego educativo')+'</div></div><div class="rank-total">'+g.votes.toLocaleString('es-CO')+'<small>VOTOS</small></div></article>'}).join('')||'<div class="empty">No hay juegos disponibles.</div>'}async function load(){const a=await fetch(C+'?v='+Date.now(),{cache:'no-store'});if(!a.ok)throw Error('No se pudo cargar el catálogo');const d=await a.json();S.games=d.filter(g=>g&&g.name&&g.url&&(!g.evento||String(g.evento).trim().toLowerCase()==='null'));const q=await fetch('https://xdszveoxdrdnwwzzvkav.supabase.co/rest/v1/game_vote_counts?select=game_id,votes',{cache:'no-store',headers:{apikey:'sb_publishable_xwUE0aN1g0rb7aOLyXPAsA_kOAX9bOA',Authorization:'Bearer sb_publishable_xwUE0aN1g0rb7aOLyXPAsA_kOAX9bOA'}});if(!q.ok)throw Error('No se pudieron cargar los votos ('+q.status+')');const data=await q.json();S.counts=new Map((data||[]).map(x=>[String(x.game_id),Number(x.votes||0)]));render()}async function boot(){try{if(!window.supabase?.createClient){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('No se pudo cargar Supabase.'));document.head.appendChild(s)})}S.db=window.supabase.createClient('https://xdszveoxdrdnwwzzvkav.supabase.co','sb_publishable_xwUE0aN1g0rb7aOLyXPAsA_kOAX9bOA',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});await load();S.channel=S.db.channel('tecnomath-voting').on('broadcast',{event:'VOTE'},async()=>{try{await load()}catch(e){console.error(e)}}).subscribe(s=>{if(s==='SUBSCRIBED')$('liveStatus').innerHTML='<i></i> RANKING EN VIVO';else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(s))$('liveStatus').innerHTML='<i></i> RECONECTANDO…'});}catch(e){console.error(e);$('liveStatus').className='live-badge error';$('liveStatus').innerHTML='<i></i> ERROR';$('ranking').innerHTML='<div class="empty">⚠️ No pudimos cargar el ranking. Recarga la página.</div>'}}$('refresh').onclick=load;boot();})();
</script></body></html>
