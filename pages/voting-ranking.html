</style></style></head><body><main class="voting-shell ranking-only"><header class="hero"><a class="brand" href="../index.html"><img src="../img/mindmath.png" alt="" class="brand-logo" onerror="this.style.display='none'"><span>⚡ TECNOMATH</span></a><div class="hero-copy"><span class="eyebrow">RESULTADOS EN VIVO</span><h1>🏆 RANKING DE VOTACIONES</h1><p>Consulta las posiciones, logos, nombres y votos de los juegos en tiempo real.</p></div><div class="live-badge" id="liveStatus"><i></i> CONECTANDO…</div></header><section class="stats-grid"><article class="stat-card"><span>🎮 Juegos</span><strong id="totalGames">—</strong></article><article class="stat-card"><span>❤️ Votos totales</span><strong id="totalVotes">—</strong></article><article class="stat-card"><span>🥇 Líder</span><strong id="leaderName">—</strong></article><article class="stat-card"><span>🕒 Actualización</span><strong id="updated">—</strong></article></section><section class="ranking-panel"><div class="section-head"><div><span class="eyebrow">TODAS LAS POSICIONES</span><h2>📊 Ranking completo</h2></div><button id="refresh" class="ghost-btn">↻ Actualizar</button></div><div id="ranking" class="ranking-only-list" aria-live="polite"></div></section><div class="back-vote"><a class="vote-btn" href="voting.html">❤️ IR A VOTAR</a><a class="ghost-btn" href="../index.html">🏠 INICIO</a></div></main><script>
(function(){
'use strict';
const SUPABASE_URL='https://xdszveoxdrdnwwzzvkav.supabase.co';
const SUPABASE_KEY='sb_publishable_xwUE0aN1g0rb7aOLyXPAsA_kOAX9bOA';
const CATALOG_URL='../data/games.json',POLL_MS=7000;
const S={db:null,games:[],counts:new Map(),channel:null,pollTimer:null,realtime:false,loading:false};
const $=id=>document.getElementById(id),gid=g=>String(g.url||g.name||'').trim();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setStatus=(kind,text)=>{$('liveStatus').className='live-badge '+(kind||'');$('liveStatus').innerHTML='<i></i> '+esc(text)};
function rows(){return S.games.map(g=>({...g,id:gid(g),votes:Number(S.counts.get(gid(g))||0)})).sort((a,b)=>b.votes-a.votes||a.name.localeCompare(b.name,'es'))}
function render(){const r=rows(),total=r.reduce((a,g)=>a+g.votes,0);$('totalGames').textContent=r.length.toLocaleString('es-CO');$('totalVotes').textContent=total.toLocaleString('es-CO');$('leaderName').textContent=r[0]?.name||'—';$('updated').textContent=new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('ranking').innerHTML=r.map((g,i)=>{const img=g.imageUrl?'<img class="rank-logo" src="../'+esc(g.imageUrl.replace(/^\.\//,''))+'" alt="'+esc(g.name)+'" loading="lazy" onerror="this.style.display=\'none\'">':'<div class="rank-logo" style="display:grid;place-items:center;font-size:32px">'+esc(g.icon||'🎮')+'</div>';const medal=i<3?['🥇','🥈','🥉'][i]:'#'+(i+1);return '<article class="live-rank '+(i<3?'rank-top':'')+'"><div class="position">'+medal+'</div>'+img+'<div><div class="rank-name">'+esc(g.name)+'</div><div class="rank-meta">'+esc(g.category||'Juego educativo')+'</div></div><div class="rank-total">'+g.votes.toLocaleString('es-CO')+'<small>VOTOS</small></div></article>'}).join('')||'<div class="empty">No hay juegos disponibles.</div>'}
async function loadCatalog(){const r=await fetch(CATALOG_URL+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Catálogo: HTTP '+r.status);const d=await r.json();if(!Array.isArray(d))throw Error('El catálogo no es un arreglo.');S.games=d.filter(g=>g&&g.name&&g.url&&(!g.evento||String(g.evento).trim().toLowerCase()==='null'))}
async function loadCounts(){if(S.loading)return;S.loading=true;try{const {data,error}=await S.db.from('game_vote_counts').select('game_id,votes');if(error)throw error;S.counts=new Map((data||[]).map(x=>[String(x.game_id),Number(x.votes||0)]));render();return true}finally{S.loading=false}}
async function poll(){try{await loadCounts();if(!S.realtime)setStatus('warn','🟡 ACTUALIZANDO…')}catch(e){console.error('TecnoMath ranking polling:',e);if(!S.realtime)setStatus('warn','🟡 RECONECTANDO…')}}
async function bootRealtime(){S.channel=S.db.channel('tecnomath-voting').on('broadcast',{event:'VOTE'},async()=>{try{await loadCounts()}catch(e){console.error('TecnoMath ranking realtime refresh:',e)}}).subscribe(status=>{console.info('TecnoMath Realtime:',status);if(status==='SUBSCRIBED'){S.realtime=true;setStatus('','🟢 RANKING EN VIVO')}else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status)){S.realtime=false;setStatus('warn','🟡 RECONECTANDO…')}})}
async function boot(){try{setStatus('warn','CONECTANDO…');await loadCatalog();if(!window.supabase?.createClient){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js';s.onload=resolve;s.onerror=()=>reject(Error('No se pudo cargar Supabase JS.'));document.head.appendChild(s)})}S.db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});await loadCounts();await bootRealtime();S.pollTimer=setInterval(poll,POLL_MS);$('refresh').onclick=poll;window.addEventListener('online',poll);window.addEventListener('offline',()=>{S.realtime=false;setStatus('warn','🟡 SIN CONEXIÓN — REINTENTANDO…')});window.addEventListener('beforeunload',()=>{if(S.pollTimer)clearInterval(S.pollTimer);if(S.channel)S.db.removeChannel(S.channel)})}catch(e){console.error('TecnoMath ranking boot:',e);setStatus('error','🔴 ERROR DE CONEXIÓN');$('ranking').innerHTML='<div class="empty">⚠️ No pudimos cargar el ranking. El sistema seguirá intentando actualizarlo automáticamente.</div>';S.pollTimer=setInterval(poll,POLL_MS)}}
boot();
})();
</script></body></html>
