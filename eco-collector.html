<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Eco Collector · ODS 6 y 12</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="shared.js"></script>
    <style>
        :root {
            --neon-cyan: #00FFFF; --neon-pink: #FF00FF; --neon-green: #39FF14;
            --gold: #FFD700; --retro-bg: #060610; --card-bg: #0d0d1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body {
            height: 100%; width: 100%; overflow: hidden;
            background: var(--retro-bg);
            font-family: 'Press Start 2P', cursive; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(0,255,255,0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 70%, rgba(57,255,20,0.15) 0%, transparent 50%);
            animation: gradientShift 8s ease-in-out infinite;
        }
        @keyframes gradientShift {
            0%,100%{ opacity:0.7; } 50%{ opacity:1; }
        }
        .game-wrapper {
            position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 500px; height: 100vh; padding: 10px;
        }
        .hud {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 8px 12px; font-size: 7px; color: var(--neon-green);
            text-shadow: 0 0 8px var(--neon-green); background: rgba(0,0,0,0.6);
            border-radius: 8px; margin-bottom: 8px; flex-wrap: wrap; gap: 5px;
        }
        .hud-item { display: flex; align-items: center; gap: 4px; }
        .hud-item span { color: var(--gold); }
        canvas {
            border: 2px solid var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px rgba(0,255,255,0.3);
            border-radius: 8px; width: 100%; aspect-ratio: 400/600; background: #0a0a1a;
        }
        .ods-badge {
            font-size: 5px; color: var(--gold); text-align: center; margin: 5px 0;
            text-shadow: 0 0 6px var(--gold);
        }
        .button-row { display: flex; gap: 10px; margin-top: 8px; width: 100%; justify-content: center; flex-wrap: wrap; }
        .btn {
            font-family: 'Press Start 2P', cursive; font-size: 7px; padding: 10px 18px;
            border: none; border-radius: 8px; cursor: pointer; color: white;
            box-shadow: 0 0 10px currentColor; transition: 0.2s; text-transform: uppercase;
        }
        .btn-shop { background: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); }
        .btn-restart { background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }
        .btn:hover { transform: scale(1.05); }
        /* Modal de tienda */
        .shop-modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); z-index: 100;
            display: flex; align-items: center; justify-content: center;
            visibility: hidden; opacity: 0; transition: 0.3s;
        }
        .shop-modal.open { visibility: visible; opacity: 1; }
        .shop-content {
            background: var(--card-bg); border: 2px solid var(--neon-pink);
            border-radius: 12px; padding: 20px; width: 90%; max-width: 380px;
            box-shadow: 0 0 30px rgba(255,0,255,0.4); text-align: center;
        }
        .shop-content h3 { font-size: 10px; color: var(--neon-pink); margin-bottom: 15px; text-shadow: 0 0 10px var(--neon-pink); }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border: 1px solid #333; border-radius: 8px; margin-bottom: 8px;
            background: rgba(255,255,255,0.03); font-size: 6px;
        }
        .shop-item button {
            font-family: 'Press Start 2P', cursive; font-size: 6px; padding: 6px 10px;
            background: var(--neon-cyan); color: black; border: none; border-radius: 6px;
            cursor: pointer; box-shadow: 0 0 8px var(--neon-cyan);
        }
        .shop-item button:disabled { opacity:0.5; cursor:not-allowed; }
        .close-shop {
            margin-top: 15px; background: transparent; border:1px solid var(--neon-pink);
            color: var(--neon-pink); font-family: 'Press Start 2P', cursive;
            font-size: 7px; padding: 8px 16px; cursor: pointer; border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="hud">
        <div class="hud-item">💧 <span id="scoreDisplay">0</span></div>
        <div class="hud-item">❤️ <span id="livesDisplay">3</span></div>
        <div class="hud-item">🛡️ <span id="shieldIndicator">0</span></div>
        <div class="hud-item">⏱️ <span id="timeDisplay">60</span></div>
        <div class="hud-item">🌐 <span id="globalCoinsDisplay">0</span></div>
        <div class="hud-item" style="color:var(--neon-yellow);">💰 <span id="localCoinsDisplay">0</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div class="ods-badge">🌍 ODS 6: Agua limpia · ODS 12: Reciclaje responsable</div>
    <div class="button-row">
        <button class="btn btn-shop" id="shopBtn">🛒 TIENDA</button>
    </div>
</div>

<!-- Modal de tienda -->
<div class="shop-modal" id="shopModal">
    <div class="shop-content">
        <h3>🛒 TIENDA ECO</h3>
        <div id="shopItemsContainer"></div>
        <button class="close-shop" id="closeShopBtn">CERRAR</button>
    </div>
</div>

<script>
    // ═══════════════════════════════════════
    //  VARIABLES DEL JUEGO
    // ═══════════════════════════════════════
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let player = { x: canvas.width/2 - 25, y: canvas.height - 70, width: 50, height: 30 };
    let items = [];
    let score = 0;
    let lives = 3;
    let timeLeft = 60;
    let gameActive = true;
    let gamePaused = false;
    let gameInterval;
    let spawnInterval;
    let frameId;
    // Power-ups comprados
    let shieldActive = false;
    let magnetActive = false, magnetTimer = 0;
    let slowActive = false, slowTimer = 0;
    // Monedas locales del juego
    let localCoins = 0;

    // Elementos HUD
    const scoreDisplay = document.getElementById('scoreDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const timeDisplay = document.getElementById('timeDisplay');
    const shieldIndicator = document.getElementById('shieldIndicator');
    const globalCoinsDisplay = document.getElementById('globalCoinsDisplay');
    const localCoinsDisplay = document.getElementById('localCoinsDisplay');
    const shopBtn = document.getElementById('shopBtn');
    const shopModal = document.getElementById('shopModal');
    const closeShopBtn = document.getElementById('closeShopBtn');
    const shopItemsContainer = document.getElementById('shopItemsContainer');

    // Tipos de objetos
    const itemTypes = [
        { type:'good', emoji:'💧', points:10, color:'#00BFFF' },
        { type:'good', emoji:'♻️', points:15, color:'#4CAF50' },
        { type:'bad',  emoji:'☣️', points:-20, color:'#FF0033' },
        { type:'good', emoji:'🌱', points:20, color:'#8BC34A' }
    ];

    // Power-ups de la tienda (precios en monedas locales)
    const shopItems = [
        { id:'shield', name:'🛡️ Escudo', desc:'Bloquea 1 contaminante', price:30, action:()=>{ shieldActive = true; shieldIndicator.textContent = '1'; } },
        { id:'life',   name:'❤️ Vida extra', desc:'+1 vida (máx 5)', price:50, action:()=>{ if(lives<5){ lives++; updateHUD(); } } },
        { id:'magnet', name:'🧲 Imán 15s', desc:'Atrae objetos buenos', price:40, action:()=>{ magnetActive = true; magnetTimer = 15*60; } },
        { id:'slow',   name:'🐢 Cámara lenta 10s', desc:'Reduce velocidad 50%', price:25, action:()=>{ slowActive = true; slowTimer = 10*60; } }
    ];

    // ═══════════════════════════════════════
    //  FUNCIONES DE MONEDAS
    // ═══════════════════════════════════════
    function loadLocalCoins() {
        if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) {
            localCoins = Tecnomath.getGameCoins('eco-collector');
        } else {
            localCoins = 0;
        }
    }

    function saveLocalCoins() {
        if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) {
            Tecnomath.setGameCoins('eco-collector', localCoins);
        }
    }

    function updateGlobalCoinsDisplay() {
        const user = (typeof Tecnomath !== 'undefined') ? Tecnomath.getCurrentUser() : null;
        globalCoinsDisplay.textContent = user ? Tecnomath.getCoins() : '0';
    }

    function updateHUD() {
        scoreDisplay.textContent = score;
        livesDisplay.textContent = lives;
        localCoinsDisplay.textContent = localCoins;
        updateGlobalCoinsDisplay();
    }

    // ═══════════════════════════════════════
    //  SPAWN DE OBJETOS
    // ═══════════════════════════════════════
    function spawnItem() {
        if (!gameActive || gamePaused) return;
        const typeIndex = Math.random() < 0.3 ? 2 : Math.floor(Math.random() * 3);
        const itemType = itemTypes[typeIndex];
        const x = Math.random() * (canvas.width - 30) + 15;
        items.push({
            x: x, y: -25, radius: 18, type: itemType,
            speed: slowActive ? 1.5 : 3 + Math.random() * 3
        });
    }

    // ═══════════════════════════════════════
    //  DIBUJO
    // ═══════════════════════════════════════
    function drawBackground() {
        for(let i=0; i<40; i++) {
            ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.6+0.2})`;
            ctx.beginPath();
            ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*1.5+0.5, 0, Math.PI*2);
            ctx.fill();
        }
    }

    function drawPlayer() {
        ctx.fillStyle = '#FFD700';
        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.roundRect(player.x, player.y, player.width, player.height, 6);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = '14px "Press Start 2P"';
        ctx.fillText('🛸', player.x+12, player.y+22);
    }

    function drawItems() {
        items.forEach(item => {
            ctx.beginPath();
            ctx.arc(item.x, item.y, item.radius, 0, Math.PI*2);
            ctx.fillStyle = item.type.color;
            ctx.shadowColor = item.type.color;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.font = '18px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(item.type.emoji, item.x, item.y);
        });
    }

    // ═══════════════════════════════════════
    //  ACTUALIZACIÓN Y COLISIONES
    // ═══════════════════════════════════════
    function updateItems() {
        for (let i=items.length-1; i>=0; i--) {
            items[i].y += items[i].speed;
            // Efecto imán
            if (magnetActive && items[i].type.type === 'good' && items[i].y > canvas.height/2) {
                if (Math.abs(items[i].x - (player.x+player.width/2)) < 80) {
                    items[i].x += (player.x+player.width/2 - items[i].x) * 0.05;
                }
            }
            // Colisión
            if (items[i].y + items[i].radius > player.y &&
                items[i].x > player.x && items[i].x < player.x + player.width) {
                handleCollision(items[i]);
                items.splice(i,1);
                continue;
            }
            if (items[i].y - items[i].radius > canvas.height) items.splice(i,1);
        }
    }

    function handleCollision(item) {
        if (item.type.type === 'good') {
            score += item.type.points;
            if (item.type.emoji === '🌱') score += 5;
            // Pequeña recompensa en monedas locales
            localCoins += Math.floor(item.type.points / 5);
            saveLocalCoins();
        } else {
            if (shieldActive) {
                shieldActive = false;
                shieldIndicator.textContent = '0';
            } else {
                lives--;
                if (lives <= 0) { gameOver(); return; }
            }
        }
        updateHUD();
    }

    // ═══════════════════════════════════════
    //  GAME OVER Y REINICIO
    // ═══════════════════════════════════════
    function gameOver() {
        gameActive = false;
        clearInterval(gameInterval);
        clearInterval(spawnInterval);
        cancelAnimationFrame(frameId);
        // Recompensa global
        if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) {
            const reward = Math.floor(score / 2);
            Tecnomath.addCoins(reward);
            Tecnomath.updateHighScore('eco-collector', score);
            updateGlobalCoinsDisplay();
        }
        // Pantalla final
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, canvas.height/2-60, canvas.width, 120);
        ctx.fillStyle = '#FF0033';
        ctx.font = '14px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('JUEGO TERMINADO', canvas.width/2, canvas.height/2-20);
        ctx.fillStyle = '#fff';
        ctx.font = '8px "Press Start 2P"';
        ctx.fillText('Puntaje: '+score, canvas.width/2, canvas.height/2+20);
        // Botón reiniciar
        const oldBtn = document.getElementById('restartBtn');
        if (oldBtn) oldBtn.remove();
        const btn = document.createElement('button');
        btn.id = 'restartBtn';
        btn.className = 'btn btn-restart';
        btn.textContent = '🔄 REINICIAR';
        btn.onclick = restartGame;
        document.querySelector('.button-row').appendChild(btn);
    }

    function restartGame() {
        items = [];
        score = 0;
        lives = 3;
        timeLeft = 60;
        gameActive = true;
        gamePaused = false;
        shieldActive = false; shieldIndicator.textContent = '0';
        magnetActive = false; magnetTimer = 0;
        slowActive = false; slowTimer = 0;
        // Cargar monedas locales de nuevo (por si cambiaron)
        loadLocalCoins();
        updateHUD();
        timeDisplay.textContent = timeLeft;
        // Limpiar intervalos anteriores
        clearInterval(gameInterval);
        clearInterval(spawnInterval);
        if (frameId) cancelAnimationFrame(frameId);
        startTimer();
        spawnInterval = setInterval(spawnItem, 800);
        frameId = requestAnimationFrame(gameLoop);
        // Quitar botón reiniciar si existe
        const oldBtn = document.getElementById('restartBtn');
        if (oldBtn) oldBtn.remove();
    }

    // ═══════════════════════════════════════
    //  TIENDA
    // ═══════════════════════════════════════
    function toggleShop(open) {
        if (open) {
            if (gameActive) { gamePaused = true; clearInterval(gameInterval); clearInterval(spawnInterval); cancelAnimationFrame(frameId); }
            renderShopItems();
            shopModal.classList.add('open');
        } else {
            shopModal.classList.remove('open');
            if (gameActive && gamePaused) {
                gamePaused = false;
                startTimer();
                spawnInterval = setInterval(spawnItem, 800);
                frameId = requestAnimationFrame(gameLoop);
            }
        }
    }

    function renderShopItems() {
        shopItemsContainer.innerHTML = '';
        shopItems.forEach(item => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `<span>${item.name} - ${item.desc}</span><span style="color:var(--gold)">${item.price} 💰</span>`;
            const buyBtn = document.createElement('button');
            buyBtn.textContent = 'Comprar';
            buyBtn.disabled = localCoins < item.price;
            buyBtn.onclick = () => {
                if (localCoins >= item.price) {
                    localCoins -= item.price;
                    item.action();
                    saveLocalCoins();
                    updateHUD();
                    renderShopItems();
                }
            };
            div.appendChild(buyBtn);
            shopItemsContainer.appendChild(div);
        });
        // Botón extra para convertir monedas globales
        const exchangeDiv = document.createElement('div');
        exchangeDiv.className = 'shop-item';
        exchangeDiv.innerHTML = '<span>💱 Convertir 🌐 → 💰</span><span style="color:var(--gold)">10% com</span>';
        const exchangeBtn = document.createElement('button');
        exchangeBtn.textContent = 'Convertir';
        exchangeBtn.onclick = () => openExchangeModal();
        exchangeDiv.appendChild(exchangeBtn);
        shopItemsContainer.appendChild(exchangeDiv);
    }

    function openExchangeModal() {
        if (typeof Tecnomath === 'undefined' || !Tecnomath.getCurrentUser()) {
            alert('Inicia sesión para convertir monedas');
            return;
        }
        const globalCoins = Tecnomath.getCoins();
        const amountStr = prompt(`Tienes ${globalCoins} 🌐 monedas globales.\n¿Cuántas deseas convertir a monedas locales de Eco Collector? (10% comisión)`);
        if (amountStr === null) return;
        const amount = parseInt(amountStr);
        if (isNaN(amount) || amount <= 0) {
            alert('Cantidad inválida');
            return;
        }
        if (Tecnomath.exchangeGlobalToLocal('eco-collector', amount)) {
            localCoins = Tecnomath.getGameCoins('eco-collector');
            saveLocalCoins();
            updateHUD();
            renderShopItems();
            alert('Conversión exitosa');
        } else {
            alert('Fondos insuficientes');
        }
    }

    // ═══════════════════════════════════════
    //  TEMPORIZADOR Y LOOP
    // ═══════════════════════════════════════
    function startTimer() {
        gameInterval = setInterval(() => {
            timeLeft--;
            timeDisplay.textContent = timeLeft;
            if (magnetActive) {
                magnetTimer--;
                if (magnetTimer <= 0) magnetActive = false;
            }
            if (slowActive) {
                slowTimer--;
                if (slowTimer <= 0) slowActive = false;
            }
            if (timeLeft <= 0) gameOver();
        }, 1000);
    }

    function gameLoop() {
        if (!gameActive || gamePaused) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        drawItems();
        drawPlayer();
        updateItems();
        frameId = requestAnimationFrame(gameLoop);
    }

    // ═══════════════════════════════════════
    //  CONTROLES
    // ═══════════════════════════════════════
    function movePlayer(e) {
        if (!gameActive || gamePaused) return;
        let clientX;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            e.preventDefault();
        } else {
            clientX = e.clientX;
        }
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const relativeX = (clientX - rect.left) * scaleX;
        player.x = Math.max(0, Math.min(canvas.width - player.width, relativeX - player.width/2));
    }

    canvas.addEventListener('mousemove', movePlayer);
    canvas.addEventListener('touchmove', movePlayer, { passive: false });
    canvas.addEventListener('touchstart', movePlayer, { passive: false });
    document.addEventListener('keydown', (e) => {
        if (!gameActive || gamePaused) return;
        if (e.key === 'ArrowLeft') player.x = Math.max(0, player.x - 20);
        if (e.key === 'ArrowRight') player.x = Math.min(canvas.width - player.width, player.x + 20);
    });

    shopBtn.addEventListener('click', () => toggleShop(true));
    closeShopBtn.addEventListener('click', () => toggleShop(false));

    // ═══════════════════════════════════════
    //  INICIAR
    // ═══════════════════════════════════════
    function init() {
        loadLocalCoins();
        updateHUD();
        timeDisplay.textContent = timeLeft;
        startTimer();
        spawnInterval = setInterval(spawnItem, 800);
        frameId = requestAnimationFrame(gameLoop);
    }

    init();
</script>
</body>
</html>
