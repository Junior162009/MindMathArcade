<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>🧮 Suma Visual con Emojis | Aprende a sumar jugando</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #2b6c91 0%, #1e4b66 40%, #163e54 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Fredoka', 'Poppins', system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.3);
        }

        .contenedor-juego {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 248, 235, 0.9);
            backdrop-filter: blur(20px);
            background: #fef9e6;
            border-radius: 70px 70px 60px 60px;
            padding: 2.5rem 2rem 2.2rem;
            box-shadow: 0 35px 50px rgba(0, 0, 0, 0.5), 0 10px 25px rgba(0, 0, 0, 0.4), inset 0 2px 10px rgba(255, 255, 200, 0.8);
            text-align: center;
            border: 3px solid #ffcf9a;
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #2d4059;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            text-shadow: 2px 2px 0 #ffe3b0;
            letter-spacing: -0.5px;
        }
        h1 span {
            background: #ffb347;
            color: white;
            font-size: 2.2rem;
            padding: 0.2rem 1rem;
            border-radius: 60px;
            text-shadow: none;
            box-shadow: 0 6px 0 #c16f1a;
            background: linear-gradient(180deg, #ff9f2f 0%, #f57c00 100%);
        }

        .zona-suma {
            background: #fff5e6;
            border-radius: 100px;
            padding: 1.8rem 1.2rem;
            margin: 1.8rem 0 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1rem 1.8rem;
            background: #fffaee;
            box-shadow: inset 0 8px 20px rgba(180, 120, 40, 0.15), 0 18px 25px -8px rgba(0,0,0,0.25);
            border: 2px solid #e7b87a;
            transition: 0.2s;
        }

        .grupo-emojis {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            background: #ffffffd6;
            padding: 1rem 1.2rem;
            border-radius: 80px;
            box-shadow: 0 8px 12px rgba(0,0,0,0.1);
            min-width: 90px;
            transition: all 0.2s;
        }

        .emoji-item {
            font-size: 2.8rem;
            line-height: 1;
            filter: drop-shadow(2px 4px 5px rgba(0,0,0,0.25));
            transition: transform 0.2s ease;
            display: inline-block;
            animation: pop 0.4s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0.2); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .signo-mas {
            font-size: 3.5rem;
            font-weight: 800;
            color: #e76f51;
            background: #fae3d9;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 8px 0 #c14c30, 0 10px 15px rgba(0,0,0,0.2);
            background: radial-gradient(circle at 30% 30%, #ffb38b, #e76f51);
            color: white;
            text-shadow: 0 2px 4px black;
            line-height: 1;
        }

        .signo-igual {
            font-size: 3.5rem;
            font-weight: 800;
            color: #2a9d8f;
            background: #d4f0e8;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 8px 0 #1e6b5e, 0 10px 15px rgba(0,0,0,0.2);
            background: radial-gradient(circle at 30% 30%, #6fd4c0, #2a9d8f);
            color: white;
            text-shadow: 0 2px 4px black;
        }

        .caja-respuesta {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        .input-respuesta {
            font-size: 2.4rem;
            width: 120px;
            text-align: center;
            padding: 0.5rem 0.2rem;
            border: 4px dashed #f4a261;
            border-radius: 40px;
            background: #fffef5;
            font-weight: bold;
            color: #264653;
            outline: none;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            transition: 0.2s;
            font-family: 'Fredoka', sans-serif;
        }

        .input-respuesta:focus {
            border-color: #e76f51;
            box-shadow: 0 0 0 5px rgba(231, 111, 81, 0.4);
        }

        .botones {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            margin: 0.8rem 0 0.5rem;
        }

        .btn {
            background: #ffcd94;
            border: none;
            font-weight: bold;
            font-size: 1.4rem;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            background: #ffb347;
            color: white;
            text-shadow: 0 1px 2px black;
            box-shadow: 0 7px 0 #c16f1a, 0 8px 14px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.08s ease;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            letter-spacing: 0.5px;
            background: linear-gradient(180deg, #ffae42 0%, #f57c00 100%);
            border: 2px solid #ffe5b9;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #c16f1a, 0 5px 10px rgba(0,0,0,0.3);
        }

        .btn-verde {
            background: linear-gradient(180deg, #6abf69 0%, #388e3c 100%);
            box-shadow: 0 7px 0 #1e5621, 0 8px 14px rgba(0,0,0,0.3);
            border-color: #b9e6b0;
        }

        .btn-azul {
            background: linear-gradient(180deg, #5d9cec 0%, #2c5f9e 100%);
            box-shadow: 0 7px 0 #173e6b, 0 8px 14px rgba(0,0,0,0.3);
            border-color: #b0d4ff;
        }

        .mensaje {
            font-size: 1.7rem;
            font-weight: bold;
            margin-top: 0.8rem;
            min-height: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            color: #2d3e50;
        }

        .resultado-emojis {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.2rem;
            margin: 0.5rem 0;
        }

        footer {
            margin-top: 1.8rem;
            color: #5c4b3c;
            font-weight: 500;
            display: flex;
            justify-content: center;
            gap: 1rem;
            font-size: 1rem;
        }

        @media (max-width: 550px) {
            .contenedor-juego {
                padding: 1.5rem 1rem;
            }
            .emoji-item {
                font-size: 2rem;
            }
            .signo-mas, .signo-igual {
                width: 55px;
                height: 55px;
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-juego">
        <h1>
            ➕ Suma con <span>Emojis</span> 🧸
        </h1>

        <!-- Visualización de la suma -->
        <div class="zona-suma" id="zonaSuma">
            <div class="grupo-emojis" id="grupo1"></div>
            <div class="signo-mas">+</div>
            <div class="grupo-emojis" id="grupo2"></div>
            <div class="signo-igual">=</div>
            <div class="caja-respuesta">
                <input type="number" id="respuestaInput" class="input-respuesta" placeholder="?" min="0" max="20" inputmode="numeric">
                <div class="resultado-emojis" id="resultadoEmojis"></div>
            </div>
        </div>

        <div class="mensaje" id="mensaje"></div>

        <div class="botones">
            <button class="btn btn-verde" id="btnComprobar">✅ Comprobar</button>
            <button class="btn btn-azul" id="btnNuevaSuma">🔄 Nueva suma</button>
        </div>
        <footer>
            <span>🐼🐨🦊</span> <span>¡Tú puedes!</span> <span>🐸🐙🐣</span>
        </footer>
    </div>

    <script>
        (function() {
            // Emojis divertidos para representar cantidades
            const listaEmojis = ['🍎', '🐶', '🐱', '🌟', '🍕', '🎈', '🐸', '🌻', '🦊', '🍇', '🐼', '🚗', '🐙', '🍒', '🐨', '🎵', '🐣', '🍊', '🐝', '🧸'];
            
            // Estado actual
            let numero1 = 3;
            let numero2 = 2;
            let emojiActual = '🍎';

            // Elementos del DOM
            const grupo1 = document.getElementById('grupo1');
            const grupo2 = document.getElementById('grupo2');
            const respuestaInput = document.getElementById('respuestaInput');
            const resultadoEmojis = document.getElementById('resultadoEmojis');
            const mensajeDiv = document.getElementById('mensaje');
            const btnComprobar = document.getElementById('btnComprobar');
            const btnNuevaSuma = document.getElementById('btnNuevaSuma');

            // Elegir emoji aleatorio diferente
            function obtenerEmojiAleatorio() {
                return listaEmojis[Math.floor(Math.random() * listaEmojis.length)];
            }

            // Renderizar emojis en un contenedor según cantidad
            function renderizarEmojis(contenedor, cantidad, emoji) {
                contenedor.innerHTML = '';
                for (let i = 0; i < cantidad; i++) {
                    const span = document.createElement('span');
                    span.className = 'emoji-item';
                    span.textContent = emoji;
                    // Pequeño retraso para animación escalonada (opcional)
                    span.style.animationDelay = `${i * 0.05}s`;
                    contenedor.appendChild(span);
                }
            }

            // Actualizar toda la interfaz con números y emoji
            function actualizarVisualizacion() {
                renderizarEmojis(grupo1, numero1, emojiActual);
                renderizarEmojis(grupo2, numero2, emojiActual);
                
                // Limpiar resultado y mensaje previo
                resultadoEmojis.innerHTML = '';
                mensajeDiv.innerHTML = '';
                respuestaInput.value = '';
                respuestaInput.focus();
            }

            // Generar nueva suma aleatoria (números del 1 al 6 para niños, suma máxima 12)
            function generarNuevaSuma() {
                numero1 = Math.floor(Math.random() * 6) + 1; // 1-6
                numero2 = Math.floor(Math.random() * 6) + 1; // 1-6
                emojiActual = obtenerEmojiAleatorio();
                actualizarVisualizacion();
            }

            // Mostrar resultado visual con emojis (la suma correcta)
            function mostrarResultadoVisual(suma) {
                resultadoEmojis.innerHTML = '';
                for (let i = 0; i < suma; i++) {
                    const span = document.createElement('span');
                    span.className = 'emoji-item';
                    span.textContent = emojiActual;
                    span.style.animationDelay = `${i * 0.04}s`;
                    resultadoEmojis.appendChild(span);
                }
            }

            // Manejar comprobación de respuesta
            function comprobarRespuesta() {
                const valorInput = respuestaInput.value.trim();
                if (valorInput === '') {
                    mensajeDiv.innerHTML = '🤔 Escribe un número en el recuadro...';
                    return;
                }
                const respuestaUsuario = Number(valorInput);
                if (isNaN(respuestaUsuario) || !Number.isInteger(respuestaUsuario) || respuestaUsuario < 0) {
                    mensajeDiv.innerHTML = '🔢 ¡Usa un número entero positivo!';
                    respuestaInput.value = '';
                    return;
                }

                const sumaCorrecta = numero1 + numero2;
                
                if (respuestaUsuario === sumaCorrecta) {
                    // ¡Correcto!
                    mostrarResultadoVisual(sumaCorrecta);
                    mensajeDiv.innerHTML = `🎉 ¡Muy bien! ${numero1} + ${numero2} = ${sumaCorrecta} 🎉 ${emojiActual.repeat(2)}`;
                } else {
                    // Incorrecto: mostrar ayuda visual y mensaje
                    mostrarResultadoVisual(sumaCorrecta);
                    mensajeDiv.innerHTML = `😲 ¡Casi! Mira los emojis: ${numero1} + ${numero2} = <strong>${sumaCorrecta}</strong> ${emojiActual}`;
                    // Resaltar el input para reintentar
                    respuestaInput.style.borderColor = '#e76f51';
                    setTimeout(() => {
                        respuestaInput.style.borderColor = '#f4a261';
                    }, 600);
                }
            }

            // Event listeners
            btnComprobar.addEventListener('click', comprobarRespuesta);

            btnNuevaSuma.addEventListener('click', () => {
                generarNuevaSuma();
                // Restaurar estilo de input
                respuestaInput.style.borderColor = '#f4a261';
            });

            // Permitir comprobar con tecla Enter
            respuestaInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    comprobarRespuesta();
                }
            });

            // Inicializar al cargar
            generarNuevaSuma();
        })();
    </script>
</body>
</html>
