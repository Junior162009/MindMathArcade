<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>🧮 EmojiMath Pro | Aprende mates con emojis</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="shared.js"></script>
    <style>
        :root {
            --neon-cyan: #00FFFF; --neon-pink: #FF00FF; --neon-green: #39FF14;
            --gold: #FFD700; --retro-bg: #060610; --card-bg: #0d0d1a;
            --coral: #FF6F61; --ocean: #2b6c91;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
        html, body {
            height:100%; width:100%; overflow:hidden;
            background: linear-gradient(145deg, #2b6c91 0%, #1e4b66 40%, #163e54 100%);
            font-family: 'Nunito', sans-serif; color:white;
            display:flex; align-items:center; justify-content:center;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.3);
        }
        .game-wrapper {
            width:100%; max-width:550px; height:100vh;
            display:flex; flex-direction:column; padding:10px; gap:8px;
            background: rgba(255,248,235,0.05); backdrop-filter:blur(5px);
            border-radius:30px; overflow:hidden;
        }
        /* HUD */
        .hud {
            display:flex; justify-content:space-between; align-items:center;
            background:rgba(0,0,0,0.5); padding:8px 14px; border-radius:30px;
            font-family:'Press Start 2P', cursive; font-size:7px;
            color:var(--neon-green); text-shadow:0 0 8px var(--neon-green);
            flex-wrap:wrap; gap:6px;
        }
        .hud-item { display:flex; align-items:center; gap:4px; }
        .hud-item span { color:var(--gold); }
        .btn-admin {
            font-size:16px; background:none; border:none; color:var(--neon-pink);
            cursor:pointer; text-shadow:0 0 8px var(--neon-pink);
        }
        /* Selector de operación */
        .mode-selector {
            display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
        }
        .mode-btn {
            font-family:'Press Start 2P', cursive; font-size:6px; padding:8px 14px;
            background:#0d0d1a; border:2px solid #333; color:#888; border-radius:25px;
            cursor:pointer; transition:0.2s;
        }
        .mode-btn.active {
            border-color:var(--neon-cyan); color:var(--neon-cyan);
            background:rgba(0,255,255,0.1); text-shadow:0 0 6px var(--neon-cyan);
        }
        /* Área del juego */
        .game-area {
            flex:1; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:15px; background:rgba(255,255,255,0.1);
            border-radius:30px; padding:15px;
        }
        .visual-sum {
            display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
            gap:0.8rem;
        }
        .emoji-group {
            display:flex; flex-wrap:wrap; gap:4px; justify-content:center;
            background:rgba(255,255,255,0.2); padding:10px; border-radius:30px;
            min-width:80px;
        }
        .emoji-item {
            font-size:2.5rem; filter:drop-shadow(2px 4px 5px rgba(0,0,0,0.4));
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0%{ transform:scale(0); opacity:0; } 70%{ transform:scale(1.2); } 100%{ transform:scale(1); opacity:1; }
        }
        .operator-sign {
            font-size:3rem; font-weight:900; width:55px; height:55px;
            display:flex; align-items:center; justify-content:center;
            background: radial-gradient(circle at 30% 30%, #ffb38b, #e76f51);
            border-radius:50%; box-shadow:0 6px 0 #c14c30; color:white;
            text-shadow:0 2px 4px black;
        }
        .input-area {
            display:flex; flex-direction:column; align-items:center; gap:8px;
        }
        .answer-input {
            font-size:2rem; width:110px; text-align:center; padding:8px;
            border:4px dashed #f4a261; border-radius:30px; background:#fffef5;
            font-weight:bold; color:#264653; font-family:'Nunito', sans-serif;
            outline:none;
        }
        .answer-input:focus { border-color:var(--neon-cyan); }
        .result-emojis {
            display:flex; flex-wrap:wrap; gap:4px; justify-content:center;
        }
        .message {
            font-size:1.2rem; font-weight:700; min-height:2rem; text-align:center;
            color:#FFD700; text-shadow:0 0 8px rgba(255,215,0,0.7);
        }
        /* Botones inferiores */
        .bottom-bar {
            display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
        }
        .btn {
            font-family:'Press Start 2P', cursive; font-size:7px; padding:10px 16px;
            border:none; border-radius:25px; cursor:pointer; color:white;
            box-shadow:0 4px 10px rgba(0,0,0,0.3); transition:0.2s;
        }
        .btn-check { background:#4CAF50; }
        .btn-new { background:#FF9800; }
        .btn-shop { background:var(--neon-pink); }
        .btn:active { transform:scale(0.95); }
        .btn:disabled { opacity:0.5; cursor:not-allowed; }
        /* Tienda modal */
        .modal {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.7); z-index:100;
            display:flex; align-items:center; justify-content:center;
            visibility:hidden; opacity:0; transition:0.3s;
        }
        .modal.open { visibility:visible; opacity:1; }
        .modal-content {
            background:white; border-radius:30px; padding:20px; width:90%;
            max-width:380px; text-align:center; color:#333;
        }
        .modal-content h3 { font-size:20px; margin-bottom:15px; color:var(--coral); }
        .shop-item {
            display:flex; justify-content:space-between; align-items:center;
            padding:10px; border:2px solid #eee; border-radius:20px; margin-bottom:8px;
            background:#FFFDE7; font-weight:700; font-size:14px;
        }
        .shop-item button {
            font-family:'Press Start 2P', cursive; font-size:6px; padding:6px 12px;
            background:#4CAF50; color:white; border:none; border-radius:15px;
            cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.2);
        }
        .shop-item button:disabled { background:#CCC; }
        .close-modal {
            margin-top:15px; background:#FF5252; color:white; border:none;
            font-family:'Press Start 2P', cursive; font-size:7px;
            padding:8px 16px; border-radius:15px; cursor:pointer;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="hud">
        <div class="hud-item">⭐ <span id="starsDisplay">0</span></div>
        <div class="hud-item">❤️ <span id="livesDisplay">3</span></div>
        <div class="hud-item">🛡️ <span id="shieldDisplay">0</span></div>
        <div class="hud-item">🌐 <span id="globalCoinsDisplay">0</span></div>
        <div class="hud-item">💰 <span id="localCoinsDisplay">0</span></div>
        <button class="btn-admin" id="adminBtn" title="Admin">☁️</button>
    </div>

    <div class="mode-selector" id="modeSelector">
        <button class="mode-btn active" data-mode="sum">➕ Suma</button>
        <button class="mode-btn" data-mode="subtract">➖ Resta</button>
        <button class="mode-btn" data-mode="count">🔢 Conteo</button>
    </div>

    <div class="game-area">
        <div class="visual-sum" id="visualSum"></div>
        <div class="message" id="messageArea"></div>
    </div>

    <div class="bottom-bar">
        <button class="btn btn-check" id="checkBtn">✅ COMPROBAR</button>
        <button class="btn btn-new" id="newBtn">🔄 NUEVA</button>
        <button class="btn btn-shop" id="shopBtn">🛒 TIENDA</button>
    </div>
</div>

<div class="modal" id="shopModal">
    <div class="modal-content">
        <h3>🛒 TIENDA EMOJI</h3>
        <div id="shopItemsContainer"></div>
        <button class="close-modal" id="closeShopBtn">CERRAR</button>
    </div>
</div>

<script>
    // ═══════════════════════════════════════
    //  CONFIGURACIÓN
    // ═══════════════════════════════════════
    const EMOJIS = ['🍎','🐶','🐱','🌟','🍕','🎈','🐸','🌻','🦊','🍇','🐼','🚗','🐙','🍒','🐨','🎵','🐣','🍊','🐝','🧸'];
    const ADMINS = {"1983":"Junior","2024":"Nicole","7777":"Mateo","8888":"Jaider","ods2026":"ODS Master"};

    let currentMode = 'sum';
    let num1 = 3, num2 = 2, correctAnswer = 5;
    let currentEmoji = '🍎';
    let score = 0, lives = 3, shields = 0, streak = 0;
    let localCoins = 0, adminActive = false;
    let level = 1;

    // DOM Elements
    const visualSum = document.getElementById('visualSum');
    const messageArea = document.getElementById('messageArea');
    const starsDisplay = document.getElementById('starsDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const shieldDisplay = document.getElementById('shieldDisplay');
    const globalCoinsDisplay = document.getElementById('globalCoinsDisplay');
    const localCoinsDisplay = document.getElementById('localCoinsDisplay');
    const shopModal = document.getElementById('shopModal');
    const closeShopBtn = document.getElementById('closeShopBtn');
    const shopItemsContainer = document.getElementById('shopItemsContainer');
    const checkBtn = document.getElementById('checkBtn');
    const newBtn = document.getElementById('newBtn');
    const shopBtn = document.getElementById('shopBtn');
    const adminBtn = document.getElementById('adminBtn');
    const modeButtons = document.querySelectorAll('.mode-btn');

    // ═══════════════════════════════════════
    //  FUNCIONES DE DATOS
    // ═══════════════════════════════════════
    function loadStats() {
        const saved = localStorage.getItem('emojimath_stats');
        if (saved) { try {
            const data = JSON.parse(saved);
            lives = data.lives ?? 3;
            shields = data.shields ?? 0;
            score = data.score ?? 0;
            level = data.level ?? 1;
        } catch(e){} }
        if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) {
            localCoins = Tecnomath.getGameCoins('emojimath');
            adminActive = Tecnomath.isAdmin();
        }
        updateHUD();
    }

    function saveStats() {
        localStorage.setItem('emojimath_stats', JSON.stringify({
            lives, shields, score, level
        }));
        if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) {
            Tecnomath.setGameCoins('emojimath', localCoins);
        }
    }

    function updateHUD() {
        starsDisplay.textContent = score;
        livesDisplay.textContent = adminActive ? '∞' : lives;
        shieldDisplay.textContent = shields;
        localCoinsDisplay.textContent = adminActive ? '∞' : localCoins;
        if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) {
            globalCoinsDisplay.textContent = adminActive ? '∞' : Tecnomath.getCoins();
        } else {
            globalCoinsDisplay.textContent = '0';
        }
    }

    function addLocalCoins(amount) {
        if (adminActive) return;
        localCoins += amount;
        saveStats();
        updateHUD();
    }

    function spendLocalCoins(amount) {
        if (adminActive) return true;
        if (localCoins < amount) return false;
        localCoins -= amount;
        saveStats();
        updateHUD();
        return true;
    }

    // ═══════════════════════════════════════
    //  GENERACIÓN DE PREGUNTAS
    // ═══════════════════════════════════════
    function generateQuestion() {
        currentEmoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
        const maxNum = Math.min(6 + level, 12);
        if (currentMode === 'sum') {
            num1 = Math.floor(Math.random() * maxNum) + 1;
            num2 = Math.floor(Math.random() * maxNum) + 1;
            correctAnswer = num1 + num2;
        } else if (currentMode === 'subtract') {
            num1 = Math.floor(Math.random() * maxNum) + 2;
            num2 = Math.floor(Math.random() * num1) + 1;
            correctAnswer = num1 - num2;
        } else if (currentMode === 'count') {
            num1 = Math.floor(Math.random() * maxNum) + 1;
            num2 = 0;
            correctAnswer = num1;
        }
        renderVisual();
    }

    function renderVisual() {
        visualSum.innerHTML = '';

        const group1 = document.createElement('div');
        group1.className = 'emoji-group';
        for (let i=0; i<num1; i++) {
            const span = document.createElement('span');
            span.className = 'emoji-item';
            span.textContent = currentEmoji;
            group1.appendChild(span);
        }

        const opSign = document.createElement('div');
        opSign.className = 'operator-sign';
        if (currentMode === 'sum') opSign.textContent = '+';
        else if (currentMode === 'subtract') opSign.textContent = '−';
        else if (currentMode === 'count') opSign.textContent = '🔍';

        visualSum.appendChild(group1);
        visualSum.appendChild(opSign);

        if (currentMode !== 'count') {
            const group2 = document.createElement('div');
            group2.className = 'emoji-group';
            for (let i=0; i<num2; i++) {
                const span = document.createElement('span');
                span.className = 'emoji-item';
                span.textContent = currentEmoji;
                group2.appendChild(span);
            }
            visualSum.appendChild(group2);
        }

        const inputDiv = document.createElement('div');
        inputDiv.className = 'input-area';
        const input = document.createElement('input');
        input.type = 'number';
        input.className = 'answer-input';
        input.placeholder = '?';
        input.id = 'answerInput';
        const resultDiv = document.createElement('div');
        resultDiv.className = 'result-emojis';
        resultDiv.id = 'resultEmojis';
        inputDiv.appendChild(input);
        inputDiv.appendChild(resultDiv);
        visualSum.appendChild(inputDiv);

        // Focus automático
        setTimeout(() => input.focus(), 100);

        messageArea.innerHTML = '';
    }

    // ═══════════════════════════════════════
    //  COMPROBACIÓN
    // ═══════════════════════════════════════
    function checkAnswer() {
        const input = document.getElementById('answerInput');
        if (!input) return;
        const val = input.value.trim();
        if (val === '') {
            messageArea.innerHTML = '🤔 Escribe un número...';
            return;
        }
        const answer = parseInt(val);
        if (isNaN(answer) || answer < 0) {
            messageArea.innerHTML = '🔢 Solo números positivos';
            return;
        }

        const resultDiv = document.getElementById('resultEmojis');
        if (answer === correctAnswer) {
            streak++;
            score++;
            const reward = 5 + Math.floor(level/2);
            addLocalCoins(reward);
            if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) {
                Tecnomath.addCoins(reward);
                Tecnomath.updateHighScore('emojimath', score);
            }
            if (streak % 5 === 0 && level < 15) level++;
            messageArea.innerHTML = `🎉 ¡Correcto! +${reward}💰 Racha: ${streak}🔥`;
            resultDiv.innerHTML = '';
            for (let i=0; i<correctAnswer; i++) {
                const span = document.createElement('span');
                span.className = 'emoji-item';
                span.textContent = currentEmoji;
                resultDiv.appendChild(span);
            }
            saveStats();
            updateHUD();
            setTimeout(generateQuestion, 1200);
        } else {
            streak = 0;
            if (shields > 0) {
                shields--;
                messageArea.innerHTML = `🛡️ Escudo usado. La respuesta era ${correctAnswer}`;
            } else {
                if (!adminActive) lives--;
                if (lives <= 0) {
                    lives = 3;
                    score = Math.max(0, score - 3);
                    messageArea.innerHTML = '😞 Sin vidas. Reiniciando...';
                } else {
                    messageArea.innerHTML = `❌ Era ${correctAnswer}. Vidas: ${lives}`;
                }
            }
            resultDiv.innerHTML = '';
            for (let i=0; i<correctAnswer; i++) {
                const span = document.createElement('span');
                span.className = 'emoji-item';
                span.textContent = currentEmoji;
                resultDiv.appendChild(span);
            }
            saveStats();
            updateHUD();
            setTimeout(generateQuestion, 1500);
        }
    }

    // ═══════════════════════════════════════
    //  TIENDA
    // ═══════════════════════════════════════
    function openShop() {
        renderShopItems();
        shopModal.classList.add('open');
    }
    function closeShop() {
        shopModal.classList.remove('open');
    }

    function renderShopItems() {
        shopItemsContainer.innerHTML = '';
        const items = [
            { name:'❤️ Vida', price:30, action:() => { lives++; saveStats(); updateHUD(); } },
            { name:'🛡️ Escudo', price:25, action:() => { shields++; saveStats(); updateHUD(); } },
            { name:'⭐ Pista', price:15, action:() => { messageArea.innerHTML = `🔍 La respuesta es ${correctAnswer}`; } },
            { name:'💱 Convertir 🌐→💰', price:0, action:() => { openExchange(); } }
        ];
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `<span>${item.name}</span><span>${item.price > 0 ? item.price+' 💰' : '10% com'}</span>`;
            const buyBtn = document.createElement('button');
            buyBtn.textContent = 'Comprar';
            if (item.price === 0) { buyBtn.disabled = false; buyBtn.textContent = 'Convertir'; }
            else buyBtn.disabled = !adminActive && localCoins < item.price;
            buyBtn.addEventListener('click', () => {
                if (item.price === 0) { item.action(); }
                else if (adminActive || spendLocalCoins(item.price)) { item.action(); }
                updateHUD(); renderShopItems();
            });
            div.appendChild(buyBtn);
            shopItemsContainer.appendChild(div);
        });
    }

    function openExchange() {
        if (typeof Tecnomath === 'undefined' || !Tecnomath.getCurrentUser()) { alert('Inicia sesión'); return; }
        if (adminActive) { localCoins += 500; saveStats(); updateHUD(); renderShopItems(); return; }
        const amount = prompt('Monedas globales a convertir:');
        if (!amount) return;
        const num = parseInt(amount);
        if (isNaN(num) || num<=0) return;
        if (Tecnomath.exchangeGlobalToLocal('emojimath', num)) {
            localCoins = Tecnomath.getGameCoins('emojimath');
            saveStats(); updateHUD(); renderShopItems();
        } else alert('Fondos insuficientes');
    }

    // ═══════════════════════════════════════
    //  ADMIN
    // ═══════════════════════════════════════
    function openAdminPanel() {
        const code = prompt('CÓDIGO ADMIN:');
        if (ADMINS[code]) {
            adminActive = true;
            if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) {
                Tecnomath.setAdmin(Tecnomath.getCurrentUser().username);
            }
            updateHUD();
            alert(`⚡ ${ADMINS[code].toUpperCase()} · ADMIN ACTIVADO`);
        } else if (code) alert('🔒 ACCESO DENEGADO');
    }

    // ═══════════════════════════════════════
    //  EVENTOS
    // ═══════════════════════════════════════
    modeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            modeButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.dataset.mode;
            generateQuestion();
        });
    });

    checkBtn.addEventListener('click', checkAnswer);
    newBtn.addEventListener('click', generateQuestion);
    shopBtn.addEventListener('click', openShop);
    closeShopBtn.addEventListener('click', closeShop);
    adminBtn.addEventListener('click', openAdminPanel);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            checkAnswer();
        }
    });

    // ═══════════════════════════════════════
    //  INICIO
    // ═══════════════════════════════════════
    function init() {
        loadStats();
        generateQuestion();
    }

    init();
</script>
</body>
</html>
