<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Animalandia · Alimenta a tus amigos</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="shared.js"></script>
    <style>
        :root {
            --sky: #87CEEB; --grass: #7CFC00; --sun: #FFD700;
            --card-bg: #FFF8E1; --wood: #DEB887;
            --neon-pink: #FF00FF; --neon-cyan: #00FFFF; --gold: #FFD700;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
        html, body {
            height:100%; width:100%; overflow:hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 70%, #7CFC00 100%);
            font-family: 'Nunito', sans-serif; color:#4A3728;
            display:flex; align-items:center; justify-content:center;
        }
        .game-wrapper {
            width:100%; max-width:500px; height:100vh;
            display:flex; flex-direction:column; background:rgba(255,255,255,0.3);
            position:relative; overflow:hidden;
        }
        .hud {
            display:flex; justify-content:space-between; align-items:center;
            padding:8px 12px; background:rgba(255,255,255,0.85);
            font-weight:700; font-size:14px; flex-shrink:0;
            box-shadow:0 2px 8px rgba(0,0,0,0.1); z-index:2;
        }
        .hud-left, .hud-right { display:flex; gap:12px; align-items:center; }
        .stars { color:#FF8C00; }
        .lives { color:#FF5252; }
        .shield { color:#2196F3; }
        .coins { color:#8B4513; font-size:12px; }
        .global-coins { color:#FFD700; font-size:12px; }
        .admin-btn {
            font-size:20px; cursor:pointer; background:none; border:none;
            color:var(--neon-pink); text-shadow:0 0 8px var(--neon-pink);
            transition:0.2s; padding:4px 8px;
        }
        .admin-btn:hover { transform:scale(1.2); }
        .category-tabs {
            display:flex; overflow-x:auto; gap:6px; padding:6px 10px;
            background:rgba(255,255,255,0.7); flex-shrink:0;
            scrollbar-width:none;
        }
        .category-tabs::-webkit-scrollbar { display:none; }
        .cat-tab {
            font-family:'Press Start 2P', cursive; font-size:8px; padding:8px 12px;
            background:white; border:2px solid #CCC; border-radius:20px;
            cursor:pointer; transition:0.2s; white-space:nowrap; color:#4A3728;
        }
        .cat-tab.active {
            background:var(--sun); border-color:#FF8C00; color:#4A3728;
            box-shadow:0 4px 10px rgba(255,140,0,0.4);
        }
        .cat-tab.locked {
            opacity:0.5; cursor:not-allowed; background:#EEE;
        }
        .main-area {
            flex:1; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:15px; padding:10px; overflow-y:auto;
        }
        .animal-card {
            background:var(--card-bg); border-radius:30px; padding:20px 25px;
            box-shadow:0 8px 20px rgba(0,0,0,0.2); text-align:center;
            transition:0.3s; width:90%; max-width:320px;
            position:relative;
        }
        .animal-emoji {
            font-size:80px; animation: bounce 0.8s ease-in-out infinite;
        }
        @keyframes bounce {
            0%,100%{ transform:translateY(0); }
            30%{ transform:translateY(-15px); }
            50%{ transform:translateY(0); }
        }
        .animal-name {
            font-size:26px; font-weight:900; color:#5D4037; margin:8px 0;
        }
        .animal-request {
            font-size:20px; font-weight:700; color:#FF6F00; margin:5px 0;
        }
        .food-options {
            display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
            width:100%; max-width:380px; padding:0 10px; flex-shrink:0;
        }
        .food-btn {
            background:white; border:4px solid #DDD; border-radius:25px;
            padding:18px 10px; font-size:45px; cursor:pointer;
            transition:0.2s; box-shadow:0 4px 10px rgba(0,0,0,0.1);
            display:flex; align-items:center; justify-content:center;
            aspect-ratio:1; min-height:0;
        }
        .food-btn:active { transform:scale(0.9); border-color:#FFD700; }
        .food-btn.correct-pick {
            border-color:#4CAF50; background:#E8F5E9; animation: popCorrect 0.5s;
        }
        .food-btn.wrong-pick {
            border-color:#FF5252; background:#FFEBEE; animation: shake 0.4s;
        }
        @keyframes popCorrect {
            0%{ transform:scale(1); } 50%{ transform:scale(1.2); } 100%{ transform:scale(1); }
        }
        @keyframes shake {
            0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-10px); } 75%{ transform:translateX(10px); }
        }
        .level-indicator {
            font-size:16px; font-weight:700; color:#5D4037; text-align:center;
        }
        .bottom-bar {
            display:flex; gap:10px; padding:8px; justify-content:center;
            background:rgba(255,255,255,0.7); flex-shrink:0;
        }
        .btn {
            font-family:'Press Start 2P', cursive; font-size:8px; padding:10px 16px;
            border:none; border-radius:25px; cursor:pointer; color:white;
            box-shadow:0 4px 10px rgba(0,0,0,0.2); transition:0.2s;
        }
        .btn-shop { background:#FF9800; }
        .btn-hint { background:#2196F3; }
        .btn-star { background:#E91E63; }
        .btn:active { transform:scale(0.95); }
        .btn:disabled { opacity:0.5; cursor:not-allowed; }
        .shop-modal {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.6); z-index:100;
            display:flex; align-items:center; justify-content:center;
            visibility:hidden; opacity:0; transition:0.3s;
        }
        .shop-modal.open { visibility:visible; opacity:1; }
        .shop-content {
            background:white; border-radius:30px; padding:20px; width:90%; max-width:380px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3); text-align:center;
        }
        .shop-content h3 { font-size:22px; color:#5D4037; margin-bottom:15px; }
        .shop-item {
            display:flex; justify-content:space-between; align-items:center;
            padding:12px; border:2px solid #EEE; border-radius:20px; margin-bottom:10px;
            background:#FFFDE7; font-weight:700;
        }
        .shop-item button {
            font-family:'Press Start 2P', cursive; font-size:8px; padding:6px 12px;
            background:#4CAF50; color:white; border:none; border-radius:15px;
            cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.2);
        }
        .shop-item button:disabled { background:#CCC; }
        .close-shop {
            margin-top:15px; background:#FF5252; color:white; border:none;
            font-family:'Press Start 2P', cursive; font-size:8px;
            padding:8px 16px; border-radius:15px; cursor:pointer;
        }
        .message-popup {
            position:fixed; top:30%; left:50%; transform:translate(-50%,-50%);
            background:white; border-radius:25px; padding:30px; text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.3); z-index:200;
            display:none; font-weight:700; font-size:24px;
        }
        .message-popup.show { display:block; animation: popIn 0.5s; }
        @keyframes popIn {
            from{ opacity:0; transform:translate(-50%,-50%) scale(0.5); }
            to{ opacity:1; transform:translate(-50%,-50%) scale(1); }
        }
    </style>
</head>

    // ═══════════════════════════════════
    //  FUNCIONES DE MONEDAS Y GUARDADO
    // ═══════════════════════════════════
    function loadStats() {
        const saved = localStorage.getItem('animalandia_stats');
        if (saved) {
            try { stats = { ...stats, ...JSON.parse(saved) }; } catch(e) {}
        }
        if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) {
            stats.localCoins = Tecnomath.getGameCoins('animalandia');
            stats.isAdmin = stats.isAdmin || Tecnomath.isAdmin();
        }
        updateHUD();
        renderCategories();
    }

    function saveStats() {
        localStorage.setItem('animalandia_stats', JSON.stringify({
            currentCategory: stats.currentCategory,
            currentAnimalIndex: stats.currentAnimalIndex,
            unlockedCategories: stats.unlockedCategories,
            lives: stats.lives,
            shields: stats.shields,
            stars: stats.stars,
            hints: stats.hints,
            isAdmin: stats.isAdmin
        }));
        if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) {
            Tecnomath.setGameCoins('animalandia', stats.localCoins);
        }
    }

    function updateHUD() {
        starsCount.textContent = stats.stars;
        livesCount.textContent = stats.isAdmin ? '∞' : stats.lives;
        shieldCount.textContent = stats.shields;
        localCoinsDisplay.textContent = stats.isAdmin ? '∞' : stats.localCoins;
        if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) {
            globalCoinsDisplay.textContent = stats.isAdmin ? '∞' : Tecnomath.getCoins();
        } else {
            globalCoinsDisplay.textContent = '0';
        }
        hintBtn.disabled = !stats.isAdmin && stats.localCoins < 20;
        starBtn.disabled = !stats.isAdmin && stats.localCoins < 50;
    }

    // ═══════════════════════════════════
    //  SONIDOS
    // ═══════════════════════════════════
    function playTone(freq, duration, type='square', volume=0.1) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.value = volume;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        } catch(e) {}
    }

    function playCorrectSound() { playTone(800, 0.2, 'square', 0.1); setTimeout(()=>playTone(1200, 0.25, 'square', 0.1), 200); }
    function playWrongSound() { playTone(200, 0.3, 'sawtooth', 0.08); }
    function playClickSound() { playTone(600, 0.1, 'sine', 0.05); }

    function openAdminPanel() {

        if (ADMINS[code]) {
            stats.isAdmin = true;
            if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) {
                Tecnomath.setAdmin(Tecnomath.getCurrentUser().username);
            }
            saveStats();
            updateHUD();
            showMessage(`⚡ ${ADMINS[code].toUpperCase()} · RECURSOS INFINITOS`);
        } else if (code) {
            showMessage('🔒 ACCESO DENEGADO');
        }
    }

    adminBtn.addEventListener('click', openAdminPanel);

    // ═══════════════════════════════════
    //  CATEGORÍAS Y NAVEGACIÓN
    // ═══════════════════════════════════
    function renderCategories() {
        categoryTabs.innerHTML = '';
        CATEGORIES.forEach((cat, idx) => {
            const tab = document.createElement('div');
            tab.className = 'cat-tab';
            tab.textContent = cat.label;
            if (idx === stats.currentCategory) tab.classList.add('active');
            if (idx >= stats.unlockedCategories) tab.classList.add('locked');
            else tab.addEventListener('click', () => switchCategory(idx));
            categoryTabs.appendChild(tab);
        });
    }

    function switchCategory(idx) {
        if (idx >= stats.unlockedCategories) return;
        stats.currentCategory = idx;
        stats.currentAnimalIndex = 0;
        renderCategories();
        loadAnimal();
        saveStats();
    }

    // ═══════════════════════════════════
    //  CARGA DE ANIMAL Y OPCIONES
    // ═══════════════════════════════════
    function loadAnimal() {
        const cat = CATEGORIES[stats.currentCategory];
        const totalAnimals = cat.animals.length;
        if (stats.currentAnimalIndex >= totalAnimals) {
            // Categoría completada
            animalEmoji.textContent = '🎉';
            animalName.textContent = '¡Categoría completada!';
            animalRequest.textContent = 'Has alimentado a todos';
            foodOptions.innerHTML = '';
            levelIndicator.textContent = '¡Excelente!';

            // Desbloquear siguiente categoría si no es la última
            if (stats.unlockedCategories < CATEGORIES.length && stats.unlockedCategories === stats.currentCategory + 1) {
                // Ya estaba desbloqueada? No, si unlockedCategories es menor que la actual+1
            }
            if (stats.currentCategory + 1 > stats.unlockedCategories && stats.currentCategory + 1 < CATEGORIES.length) {
                stats.unlockedCategories = stats.currentCategory + 1;
                showMessage('🔓 ¡Nueva categoría desbloqueada!');
            }

            // Recompensa global
            if (typeof Tecnomath !== 'undefined' && Tecnomath.getCurrentUser()) {
                const reward = stats.stars * 5;
                Tecnomath.addCoins(reward);
                Tecnomath.updateHighScore('animalandia', stats.stars);
            }
            saveStats();
            renderCategories();

            // Avanzar automáticamente a la siguiente categoría si existe y está desbloqueada
            setTimeout(() => {
                if (stats.currentCategory + 1 < CATEGORIES.length && stats.currentCategory + 1 < stats.unlockedCategories) {
                    stats.currentCategory++;
                } else if (stats.currentCategory + 1 >= CATEGORIES.length) {
                    // Ya completó todo, volver al inicio
                    stats.currentCategory = 0;
                }
                stats.currentAnimalIndex = 0;
                renderCategories();
                loadAnimal();
                saveStats();
            }, 2500);
            return;
        }

        const animal = cat.animals[stats.currentAnimalIndex];
        animalEmoji.textContent = animal.emoji;
        animalName.textContent = animal.name;
        animalRequest.textContent = `¡Quiero ${animal.foodName}!`;  // Sin emoji
        levelIndicator.textContent = `${cat.label} · Nivel ${stats.currentAnimalIndex + 1}/${totalAnimals}`;

        const options = [animal.food, ...animal.altFoods].sort(() => Math.random() - 0.5);
        foodOptions.innerHTML = '';
        options.forEach(food => {
            const btn = document.createElement('div');
            btn.className = 'food-btn';
            btn.textContent = food;
            btn.addEventListener('click', () => handleFoodPick(food, btn));
            foodOptions.appendChild(btn);
        });

        wrongAttempts = 0;
        canInteract = true;
    }

    // ═══════════════════════════════════
    //  LÓGICA PRINCIPAL
    // ═══════════════════════════════════
    function handleFoodPick(food, btn) {
        if (!canInteract) return;
        canInteract = false;
        playClickSound();

        const cat = CATEGORIES[stats.currentCategory];
        const animal = cat.animals[stats.currentAnimalIndex];
        const correct = animal.food;

        if (food === correct) {
            btn.classList.add('correct-pick');
            stats.stars++;
            if (!stats.isAdmin) stats.localCoins += 5;
            wrongAttempts = 0;
            playCorrectSound();
            showMessage('🎉 ¡Muy bien! 🎉');
            saveStats();
            updateHUD();
            setTimeout(() => {
                stats.currentAnimalIndex++;
                loadAnimal();
                saveStats();
            }, 800);
        } else {
            btn.classList.add('wrong-pick');
            wrongAttempts++;
            playWrongSound();
            if (wrongAttempts >= MAX_WRONG) {
                if (stats.shields > 0) {
                    stats.shields--;
                    wrongAttempts = 0;
                    showMessage('🛡️ ¡Escudo usado! Sigue intentando');
                } else {
                    if (!stats.isAdmin) stats.lives--;
                    updateHUD();
                    if (stats.lives <= 0) {
                        showMessage('😞 Sin vidas... Reinicia el juego');
                        setTimeout(() => resetGame(), 2000);
                        return;
                    } else {
                        showMessage('💔 Perdiste una vida. ¡Sigue!');
                        wrongAttempts = 0;
                    }
                }
                saveStats();
                updateHUD();
                setTimeout(() => {
                    loadAnimal();
                }, 600);
            } else {
                showMessage(`😊 Inténtalo otra vez (${MAX_WRONG - wrongAttempts} intentos)`, 800);
                setTimeout(() => {
                    btn.classList.remove('wrong-pick');
                    canInteract = true;
                }, 600);
            }
        }
    }

    function useHint() {
        if (!canInteract) return;
        if (!stats.isAdmin && stats.localCoins < 20) return;
        if (!stats.isAdmin) stats.localCoins -= 20;
        saveStats();
        updateHUD();
        const cat = CATEGORIES[stats.currentCategory];
        const animal = cat.animals[stats.currentAnimalIndex];
        const buttons = foodOptions.querySelectorAll('.food-btn');
        buttons.forEach(btn => {
            if (btn.textContent === animal.food) {
                btn.style.borderColor = '#4CAF50';
                btn.style.background = '#E8F5E9';
                setTimeout(() => {
                    btn.style.borderColor = '#DDD';
                    btn.style.background = 'white';
                }, 1500);
            }
        });
    }

    function useStar() {
        if (!canInteract) return;
        if (!stats.isAdmin && stats.localCoins < 50) return;
        if (!stats.isAdmin) stats.localCoins -= 50;
        saveStats();
        updateHUD();
        stats.stars += 5;
        if (!stats.isAdmin) stats.localCoins += 5;
        showMessage('🌟 ¡Estrella fugaz! Nivel completado');
        playCorrectSound();
        setTimeout(() => {
            stats.currentAnimalIndex++;
            loadAnimal();
            saveStats();
        }, 500);
    }

    // ═══════════════════════════════════
    //  TIENDA
    // ═══════════════════════════════════
    function openShop() {
        renderShopItems();
        shopModal.classList.add('open');
    }

    function closeShop() {
        shopModal.classList.remove('open');
    }

    function renderShopItems() {
        shopItemsContainer.innerHTML = '';
        const items = [
            { name:'❤️ Vida', price:30, action:() => { stats.lives++; saveStats(); updateHUD(); } },
            { name:'🛡️ Escudo', price:40, action:() => { stats.shields++; saveStats(); updateHUD(); } },
            { name:'💡 Pista x3', price:25, action:() => { stats.hints += 3; saveStats(); } }
        ];
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `<span>${item.name}</span><span>${item.price} 💰</span>`;
            const buyBtn = document.createElement('button');
            buyBtn.textContent = 'Comprar';
            buyBtn.disabled = !stats.isAdmin && stats.localCoins < item.price;
            buyBtn.addEventListener('click', () => {
                if (stats.isAdmin) { item.action(); }
                else if (stats.localCoins >= item.price) {
                    stats.localCoins -= item.price;
                    item.action();
                }
                saveStats();
                updateHUD();
                renderShopItems();
            });
            div.appendChild(buyBtn);
            shopItemsContainer.appendChild(div);
        });
        // Conversión de monedas
        const exchDiv = document.createElement('div');
        exchDiv.className = 'shop-item';
        exchDiv.innerHTML = '<span>💱 Convertir 🌐 → 💰 (10% com)</span>';
        const exchBtn = document.createElement('button');
        exchBtn.textContent = 'Convertir';
        exchBtn.addEventListener('click', () => {
            if (typeof Tecnomath === 'undefined' || !Tecnomath.getCurrentUser()) {
                alert('Inicia sesión para convertir');
                return;
            }
            if (stats.isAdmin) {
                stats.localCoins += 1000;
                saveStats();
                updateHUD();
                renderShopItems();
                return;
            }
            const amount = prompt('Cantidad de monedas globales a convertir:');
            if (!amount) return;
            const num = parseInt(amount);
            if (isNaN(num) || num <= 0) return;
            if (Tecnomath.exchangeGlobalToLocal('animalandia', num)) {
                stats.localCoins = Tecnomath.getGameCoins('animalandia');
                saveStats();
                updateHUD();
                renderShopItems();
            } else {
                alert('Fondos insuficientes');
            }
        });
        exchDiv.appendChild(exchBtn);
        shopItemsContainer.appendChild(exchDiv);
    }

    // ═══════════════════════════════════
    //  RESETEO
    // ═══════════════════════════════════
    function resetGame() {
        stats.lives = 3;
        stats.shields = 0;
        stats.currentCategory = 0;
        stats.currentAnimalIndex = 0;
        stats.stars = 0;
        stats.localCoins = 0;
        saveStats();
        updateHUD();
        renderCategories();
        loadAnimal();
        messagePopup.classList.remove('show');
    }

    // ═══════════════════════════════════
    //  MENSAJES
    // ═══════════════════════════════════
    function showMessage(html, duration = 1500) {
        popupContent.innerHTML = html;
        messagePopup.classList.add('show');
        setTimeout(() => messagePopup.classList.remove('show'), duration);
    }

    // ═══════════════════════════════════
    //  EVENTOS
    // ═══════════════════════════════════
    shopBtn.addEventListener('click', openShop);
    closeShopBtn.addEventListener('click', closeShop);
    hintBtn.addEventListener('click', useHint);
    starBtn.addEventListener('click', useStar);

    // ═══════════════════════════════════
    //  INICIO
    // ═══════════════════════════════════
    function init() {
        loadStats();
        renderCategories();
        loadAnimal();
        updateHUD();
    }

    init();
</script>
</body>
</html>
