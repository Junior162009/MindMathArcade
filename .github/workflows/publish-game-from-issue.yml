name: Publicación por Issue desactivada

# Este flujo queda desactivado porque la carga real de los juegos se almacena
# en Firebase Realtime Database (gameUploadQueue). El publicador oficial es
# process-game-queue.yml, que toma únicamente envíos aprobados y los copia a
# games/ antes de actualizar data/games.json.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Publicación por Issues desactivada. Usar el flujo de gameUploadQueue."
