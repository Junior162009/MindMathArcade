name: Verify Supabase portal session bridge

on:
  push:
    branches: [main]
    paths:
      - 'js/tecnomath-auth.js'
      - 'js/shared.js'
      - 'index.html'
      - '.github/workflows/fix-supabase-portal-session.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verificar integración Supabase
        shell: bash
        run: |
          set -euo pipefail
          test -f js/tecnomath-auth.js
          test -f js/shared.js
          grep -q 'js/tecnomath-auth.js' index.html
          grep -q 'window.TecnomathAuth' js/tecnomath-auth.js
          if grep -qE 'firebase\.auth\(|firebase\.database\(' js/shared.js; then
            echo "ERROR: shared.js todavía contiene llamadas directas a Firebase."
            exit 1
          fi
          echo "Puente de sesión Supabase: OK"
