name: Publicar juegos aprobados

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write


jobs:

  publish:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Descargar repositorio
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =====================================================
      # Descargar juegos aprobados desde Firebase
      # =====================================================

      - name: Obtener juegos aprobados
        env:
          FIREBASE_DB: https://tecnomath-sync-6058a-default-rtdb.firebaseio.com

        run: |

          python - <<'PY'

          import json
          import os
          from urllib.request import Request, urlopen


          db = os.environ["FIREBASE_DB"].rstrip("/")

          url = db + "/publishedGames.json"

          request = Request(
              url,
              headers={
                  "Accept": "application/json"
              }
          )


          try:

              with urlopen(request, timeout=30) as response:

                  raw = response.read().decode()

                  data = json.loads(raw or "null")

          except Exception as error:

              print("No se pudo consultar Firebase:")
              print(error)

              data = {}


          if not isinstance(data, dict):

              data = {}


          os.makedirs("tmp", exist_ok=True)


          with open(
              "tmp/published-games.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  data,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "Juegos aprobados encontrados:",
              len(data)
          )

          PY


      # =====================================================
      # Generar catálogo
      # =====================================================

      - name: Generar data/games.json
        run: |

          python - <<'PY'

          import json
          import re
          from pathlib import Path


          firebase_file = Path(
              "tmp/published-games.json"
          )


          if firebase_file.exists():

              data = json.loads(
                  firebase_file.read_text(
                      encoding="utf-8"
                  )
              )

          else:

              data = {}


          if not isinstance(data, dict):

              data = {}


          catalog = []


          def slug(value):

              value = str(
                  value or "juego"
              ).lower()

              value = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  value
              )

              value = value.strip("-")

              return value[:50] or "juego"


          for game_id, game in data.items():

              if not isinstance(game, dict):
                  continue


              url = str(
                  game.get("url") or ""
              ).strip()


              if not url:
                  continue


              name = (
                  game.get("name")
                  or "Juego"
              )


              catalog.append({

                  "name": name,

                  "desc":
                      game.get("desc")
                      or game.get("description")
                      or "Juego educativo de TecnoMath",

                  "description":
                      game.get("description")
                      or game.get("desc")
                      or "Juego educativo de TecnoMath",

                  "category":
                      game.get("category")
                      or "otros",

                  "url":
                      url,

                  "imageUrl":
                      game.get("imageUrl")
                      or "",

                  "icon":
                      game.get("icon")
                      or "🎮",

                  "deviceCompatibility":
                      game.get(
                          "deviceCompatibility"
                      )
                      or "both",

                  "evento":
                      game.get("evento"),

                  "submissionId":
                      game_id,

                  "authorName":
                      game.get("authorName")
                      or "Usuario",

                  "sourceType":
                      game.get("sourceType")
                      or "url"

              })


          data_dir = Path("data")

          data_dir.mkdir(
              parents=True,
              exist_ok=True
          )


          output = (
              data_dir /
              "games.json"
          )


          output.write_text(

              json.dumps(
                  catalog,
                  ensure_ascii=False,
                  indent=2
              )
              + "\n",

              encoding="utf-8"

          )


          print(
              "Catálogo generado:",
              len(catalog),
              "juegos"
          )

          PY


      # =====================================================
      # Guardar catálogo
      # =====================================================

      - name: Commit catálogo
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/games.json


          if git diff --cached --quiet; then

            echo "No hay cambios."

            exit 0

          fi


          git commit \
            -m "chore: actualizar catálogo de juegos"


          git push