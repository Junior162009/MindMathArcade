name: Publicar juegos aprobados

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener juegos aprobados
        env:
          FIREBASE_DB: https://tecnomath-sync-6058a-default-rtdb.firebaseio.com
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen

          db = os.environ["FIREBASE_DB"].rstrip("/")
          req = Request(db + "/publishedGames.json", headers={"Accept": "application/json"})
          try:
              with urlopen(req, timeout=30) as r:
                  data = json.loads(r.read().decode() or "null") or {}
          except Exception as e:
              print(f"Firebase no disponible: {e}")
              data = {}

          if not isinstance(data, dict):
              data = {}
          os.makedirs("tmp", exist_ok=True)
          with open("tmp/published-games.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(f"Juegos aprobados encontrados: {len(data)}")
          PY

      - name: Generar catálogo separado
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          source = Path("tmp/published-games.json")
          data = json.loads(source.read_text(encoding="utf-8")) if source.exists() else {}
          if not isinstance(data, dict):
              data = {}

          catalog = []

          def slug(value):
              s = re.sub(r"[^a-z0-9]+", "-", str(value or "juego").lower()).strip("-")
              return s[:50] or "juego"

          for gid, game in data.items():
              if not isinstance(game, dict):
                  continue

              name = str(game.get("name") or "Juego")
              source_type = str(game.get("sourceType") or "url").lower()
              local_url = str(game.get("publishedUrl") or "").strip()
              external_url = str(game.get("url") or "").strip()

              if source_type in {"upload", "files", "zip", "rar", "archive", "local"} and not local_url:
                  folder = f"{slug(name)}-{slug(gid)[-16:]}"
                  candidate = Path("games") / folder / "index.html"
                  if candidate.exists():
                      local_url = f"games/{folder}/index.html"

              final_url = local_url or external_url
              if not final_url:
                  continue

              catalog.append({
                  "name": name,
                  "desc": game.get("desc") or game.get("description") or "Juego educativo de TecnoMath",
                  "description": game.get("description") or game.get("desc") or "Juego educativo de TecnoMath",
                  "category": game.get("category") or "otros",
                  "url": final_url,
                  "imageUrl": game.get("imageUrl") or "",
                  "icon": game.get("icon") or "🎮",
                  "deviceCompatibility": game.get("deviceCompatibility") or "both",
                  "evento": game.get("evento"),
                  "submissionId": gid,
                  "authorName": game.get("authorName") or "Usuario",
                  "sourceType": source_type
              })

          out = Path("data/games.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Catálogo generado: {len(catalog)} juegos")
          PY

      - name: Validar catálogo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/games.json")
          games = json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(games, list), "games.json debe ser un array"
          seen = set()
          for game in games:
              assert game.get("name"), "Juego sin nombre"
              assert game.get("url"), "Juego sin URL"
              key = game.get("submissionId") or game.get("url")
              assert key not in seen, f"Juego duplicado: {key}"
              seen.add(key)
              if game.get("url", "").startswith("games/"):
                  assert Path(game["url"]).exists(), f"No existe el juego local: {game['url']}"
          print("Catálogo válido")
          PY

      - name: Commit catálogo y juegos publicados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json games
          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git commit -m "chore: sincronizar juegos aprobados y catálogo"
          git push
