name: Publicar juegos aprobados

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar wrappers y catálogo
        env:
          FIREBASE_DB: https://tecnomath-sync-6058a-default-rtdb.firebaseio.com
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.request import urlopen, Request
          db=os.environ['FIREBASE_DB'].rstrip('/')
          req=Request(db+'/publishedGames.json',headers={'Accept':'application/json'})
          with urlopen(req,timeout=30) as r: data=json.loads(r.read().decode() or 'null')
          root=Path('games'); root.mkdir(exist_ok=True); out=[]
          def slug(v):
              s=re.sub(r'[^a-z0-9]+','-',str(v or 'juego').lower()).strip('-')
              return s[:45] or 'juego'
          for gid,g in (data or {}).items():
              if not isinstance(g,dict) or not g.get('url'): continue
              folder=f"{slug(g.get('name'))}-{slug(gid)[-16:]}"
              d=root/folder; d.mkdir(parents=True,exist_ok=True)
              url=str(g['url']).replace('\\','\\\\').replace('"','\\"')
              title=str(g.get('name') or 'Juego TecnoMath').replace('&','&amp;').replace('<','&lt;').replace('>','&gt;')
              html=f'''<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title} · TecnoMath</title><meta http-equiv="refresh" content="0;url={url}"><style>html,body{{margin:0;height:100%;background:#060610;color:#00ffff;font-family:Arial;display:grid;place-items:center;text-align:center}}a{{color:#39ff14}}</style></head><body><div><h1>🎮 {title}</h1><p>Cargando…</p><a href="{url}">Abrir juego</a><script>location.replace("{url}")</script></div></body></html>'''
              (d/'index.html').write_text(html,encoding='utf-8')
              out.append({'name':g.get('name') or 'Juego','desc':g.get('desc') or 'Juego educativo de TecnoMath','url':f'games/{folder}/index.html','imageUrl':g.get('imageUrl') or '','icon':g.get('icon') or '🎮','category':g.get('category') or 'otros','deviceCompatibility':'both','evento':g.get('evento'),'submissionId':gid,'authorName':g.get('authorName') or 'Usuario'})
          (root/'published-games.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Juegos publicados:',len(out))
          PY
      - name: Commit y publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/published-games.json games/*/index.html
          git commit -m "chore: publish approved games"
          git push
