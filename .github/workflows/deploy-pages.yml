name: Publicar sitio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Aplicar estilo compacto tipo YouTube a MindMath
        shell: python
        run: |
          from pathlib import Path
          p = Path('pages/game.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* YOUTUBE_COMPACT_UI_V1 */'
          if marker not in s:
              css = r'''
          /* YOUTUBE_COMPACT_UI_V1 */
          :root{
            --tap:40px;
            --fs-xs:10px; --fs-sm:12px; --fs-md:14px;
            --fs-lg:17px; --fs-xl:23px; --fs-2xl:32px;
            --r-sm:7px; --r-md:10px; --r-lg:14px; --r-xl:18px;
          }
          html,body{overflow:hidden}
          body{font-size:12px}
          #app{width:100%;max-width:none;margin:0;padding:0}
          header{
            min-height:56px;height:56px;padding:8px 18px;gap:12px;
            background:rgba(15,15,18,.96);
            border-bottom:1px solid rgba(255,255,255,.08);
            backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
          }
          header::after{display:none}
          .header-title{font-size:12px;letter-spacing:1.6px}
          .header-rank{font-size:7px;margin-top:2px;letter-spacing:.7px}
          .header-mid{text-align:left;padding:0 2px}
          .icon-btn{width:36px;height:36px;border-radius:50%;font-size:14px}
          .coins-display{padding:6px 9px;font-size:11px;gap:4px}
          .btn-exit-admin-game{font-size:10px;padding:7px 10px}
          .hud{
            grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:7px 18px;
            background:#0f0f12;border-bottom:1px solid rgba(255,255,255,.07);
          }
          .hud-stat{min-width:0;padding:5px 3px;border:0;border-radius:0;background:transparent;gap:1px}
          .hud-stat::before{display:none}
          .hud-label{font-size:6px;letter-spacing:.45px}
          .hud-val{font-size:13px;text-shadow:0 0 8px rgba(94,231,255,.3)}
          .view{padding:0 18px 18px;animation:viewIn .25s ease-out both}
          .view > *{max-width:1120px;margin-left:auto;margin-right:auto}
          .game-container,.game-card,.question-card,.quiz-card,.play-area,.question-area{width:100%;max-width:900px}
          .game-card,.question-card,.quiz-card{border-radius:12px}
          .question-card,.question-area{margin-top:10px}
          .question,.question-text,.problem,.equation{font-size:clamp(22px,3.2vw,34px)!important;line-height:1.15!important}
          .answer-grid,.answers,.options,.choices{gap:8px!important}
          button,.answer-btn,.option-btn,.choice-btn{min-height:40px;font-size:13px!important;border-radius:8px}
          .result-card,.results-card,.start-card,.menu-card,.settings-card{max-width:760px;padding:18px!important}
          .result-card h1,.results-card h1,.start-card h1,.menu-card h1{font-size:24px!important}
          .view::-webkit-scrollbar{width:8px}
          .view::-webkit-scrollbar-track{background:transparent}
          .view::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:20px}
          .view::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}
          @media (min-width:900px){
            header{padding-left:28px;padding-right:28px}
            .hud{padding-left:28px;padding-right:28px}
            .view{padding-left:28px;padding-right:28px}
            .view > *{max-width:1180px}
            .question-card,.question-area,.game-card,.quiz-card,.game-container{max-width:940px}
          }
          @media (max-width:700px){
            header{padding-left:10px;padding-right:10px}
            .hud{padding-left:10px;padding-right:10px}
            .view{padding-left:10px;padding-right:10px;padding-bottom:10px}
            .header-title{font-size:11px;letter-spacing:1px}
            .coins-display{padding:5px 7px}
            .question,.question-text,.problem,.equation{font-size:clamp(20px,7vw,28px)!important}
          }
          @media (max-width:420px){
            .header-rank{display:none}
            .hud{padding-top:5px;padding-bottom:5px}
            .hud-label{font-size:5px}
            .hud-val{font-size:12px}
            .view{padding-left:8px;padding-right:8px}
          }
          @media (prefers-reduced-motion:reduce){.view{animation:none}}
          '''
              pos = s.rfind('</style>')
              if pos == -1:
                  raise SystemExit('No se encontró </style>')
              s = s[:pos] + '\n' + css + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
              import subprocess
              subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git','add','pages/game.html'], check=True)
              subprocess.run(['git','commit','-m','style: compactar interfaz de MindMath Arcade tipo YouTube'], check=True)
              subprocess.run(['git','push'], check=True)
              print('Estilo aplicado y enviado al repositorio.')
          else:
              print('El estilo ya estaba aplicado.')

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar y verificar sitio
        shell: bash
        run: |
          set -euo pipefail
          touch .nojekyll

          test -f index.html

          echo "Verificando juegos publicados..."
          game_count=$(find games -type f -name 'index.html' | wc -l)
          echo "Juegos encontrados: ${game_count}"

          if [ "${game_count}" -lt 1 ]; then
            echo "ERROR: no se encontró ningún juego en games/"
            exit 1
          fi

          test -f games/nova-math-defensa-estelar-61d90774-e32/index.html
          test -f games/nova-math-defensa-estelar-61d90774-e32/css/style.css
          test -f games/nova-math-defensa-estelar-61d90774-e32/js/game.js

          echo "NOVA MATH verificado correctamente."
          echo "Contenido que será publicado:"
          ls -la games/nova-math-defensa-estelar-61d90774-e32/

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
