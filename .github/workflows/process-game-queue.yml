name: Publicar juegos aprobados automáticamente

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

env:
  SUPABASE_URL: https://xdszveoxdrdnwwzzvkav.supabase.co
  RESEND_FROM: TecnoMath <notificaciones@tecnomath.online>

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verificar conexión con Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.request
          url=os.environ['SUPABASE_URL']+'/rest/v1/tecnomath_game_submissions?select=id&limit=1'
          req=urllib.request.Request(url,headers={'apikey':os.environ['SUPABASE_SERVICE_ROLE_KEY'],'Authorization':'Bearer '+os.environ['SUPABASE_SERVICE_ROLE_KEY']})
          with urllib.request.urlopen(req,timeout=30) as r: print('Supabase: conexión correcta. HTTP',r.status)
          PY

      - name: Instalar herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full >/dev/null

      - name: Publicar juegos aprobados y notificar autores
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/publish-approved-games.py
