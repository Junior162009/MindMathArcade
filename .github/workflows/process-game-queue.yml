name: Publicar juegos aprobados automáticamente

on:
  repository_dispatch:
    types: [game-approved]
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'ID opcional del envío aprobado'
        required: false
        type: string
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

env:
  FIREBASE_DB: https://tecnomath-sync-6058a-default-rtdb.firebaseio.com
  RESEND_FROM: TecnoMath <notificaciones@tecnomath.online>

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Autenticar para leer Firebase Realtime Database
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/userinfo.email
            https://www.googleapis.com/auth/firebase.database

      - name: Verificar autenticación de Firebase
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python - <<'PY'
          import os, urllib.request
          db=os.environ['FIREBASE_DB']
          token=os.environ['FIREBASE_ACCESS_TOKEN']
          url=f'{db}/publicGameQueue.json?shallow=true'
          req=urllib.request.Request(url,headers={
              'Authorization':f'Bearer {token}',
              'User-Agent':'TecnoMath-GitHub-Publisher',
              'Accept':'application/json'
          })
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  print('Firebase: autenticación correcta. HTTP',r.status)
          except urllib.error.HTTPError as e:
              detail=e.read().decode('utf-8','replace')
              raise SystemExit(f'Firebase: autenticación fallida HTTP {e.code}: {detail}')
          except Exception as e:
              raise SystemExit(f'Firebase: autenticación fallida: {e}')
          PY

      - name: Instalar herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full >/dev/null

      - name: Adaptar publicador para autenticación OAuth2
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/publish-approved-games.py')
          s=p.read_text(encoding='utf-8')
          old="queue_url = f'{DB}/publicGameQueue.json?access_token={ACCESS_TOKEN}'"
          new="queue_url = f'{DB}/publicGameQueue.json'"
          s=s.replace(old,new)
          old2="url = f'{DB}/{path}.json?access_token={ACCESS_TOKEN}'"
          new2="url = f'{DB}/{path}.json'"
          s=s.replace(old2,new2)
          marker="queue_request = urllib.request.Request(\n    queue_url,\n    headers={\n"
          replacement="queue_request = urllib.request.Request(\n    queue_url,\n    headers={\n        'Authorization': f'Bearer {ACCESS_TOKEN}',\n"
          s=s.replace(marker,replacement,1)
          marker2="req = urllib.request.Request(\n        url,\n        data=body,\n        headers={\n"
          replacement2="req = urllib.request.Request(\n        url,\n        data=body,\n        headers={\n            'Authorization': f'Bearer {ACCESS_TOKEN}',\n"
          s=s.replace(marker2,replacement2,1)
          p.write_text(s,encoding='utf-8')
          print('Publicador adaptado para Authorization: Bearer.')
          PY

      - name: Publicar aprobados y enviar correo de publicación
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EVENT_SUBMISSION_ID: ${{ github.event.client_payload.submissionId || inputs.submission_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/publish-approved-games.py
