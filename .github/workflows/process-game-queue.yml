name: Procesar juegos enviados desde Spark

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full >/dev/null

      - name: Publicar juegos aprobados
        env:
          FIREBASE_DB: https://tecnomath-sync-6058a-default-rtdb.firebaseio.com
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, re, shutil, subprocess, urllib.error, urllib.request, zipfile
          from pathlib import Path

          db=os.environ['FIREBASE_DB'].rstrip('/')

          def get_json(path):
              req=urllib.request.Request(db+'/'+path+'.json',headers={'User-Agent':'TecnoMath-GitHub-Actions'})
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      return json.loads(r.read().decode('utf-8') or 'null') or {}
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='replace')
                  raise RuntimeError(f'Firebase HTTP {e.code} leyendo {path}: {body[:500]}')

          def slug(v):
              v=str(v or 'juego').lower()
              v=re.sub(r'[^a-z0-9]+','-',v).strip('-')
              return v[:60] or 'juego'

          def safe_extract_zip(z,out):
              for info in z.infolist():
                  name=info.filename.replace('\\','/').lstrip('/')
                  parts=[p for p in name.split('/') if p]
                  if not parts or '..' in parts: continue
                  target=out.joinpath(*parts)
                  if info.is_dir(): target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with z.open(info) as src, open(target,'wb') as dst: shutil.copyfileobj(src,dst)

          def extract_package(raw,out):
              package=out/'package.bin'; package.write_bytes(raw)
              extracted=out/'extracted'; extracted.mkdir(parents=True,exist_ok=True)
              try:
                  with zipfile.ZipFile(package) as z: safe_extract_zip(z,extracted)
              except zipfile.BadZipFile:
                  subprocess.run(['7z','x','-y',f'-o{extracted}',str(package)],check=True,stdout=subprocess.DEVNULL)
              return extracted

          def find_index(base):
              return next(iter(list(base.rglob('index.html'))+list(base.rglob('index.htm'))),None)

          def install_game(src,dst):
              index=find_index(src)
              if not index: raise RuntimeError('El juego aprobado no contiene index.html o index.htm.')
              game_root=index.parent
              if dst.exists(): shutil.rmtree(dst)
              dst.mkdir(parents=True,exist_ok=True)
              for item in game_root.iterdir():
                  if item.name.startswith('.'): continue
                  target=dst/item.name
                  if item.is_dir(): shutil.copytree(item,target)
                  else: shutil.copy2(item,target)

          queue=get_json('gameUploadQueue')
          games_dir=Path('games'); games_dir.mkdir(parents=True,exist_ok=True)
          catalog_path=Path('data/games.json'); catalog_path.parent.mkdir(parents=True,exist_ok=True)
          try: catalog=json.loads(catalog_path.read_text(encoding='utf-8')) if catalog_path.exists() else []
          except Exception: catalog=[]
          changed=False

          for gid,game in queue.items():
              if not isinstance(game,dict) or game.get('status')!='approved': continue
              name=game.get('name') or 'Juego'
              folder=f'{slug(name)}-{str(gid).lstrip("-")}'
              destination=games_dir/folder
              try:
                  source=game.get('sourceType') or 'upload'
                  if source=='url':
                      url=str(game.get('gameUrl') or '').strip()
                      if not re.match(r'^https?://',url,re.I): raise RuntimeError('URL inválida')
                      if destination.exists(): shutil.rmtree(destination)
                      destination.mkdir(parents=True,exist_ok=True)
                      safe_name=(name.replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('"','&quot;'))
                      html='<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+safe_name+'</title></head><body><script>location.replace('+json.dumps(url)+')</script></body></html>'
                      (destination/'index.html').write_text(html,encoding='utf-8')
                  else:
                      package=game.get('packageBase64')
                      if not package: raise RuntimeError('No existe packageBase64 para este juego.')
                      work=Path('/tmp')/('game-'+str(gid))
                      shutil.rmtree(work,ignore_errors=True); work.mkdir(parents=True,exist_ok=True)
                      raw=base64.b64decode(package,validate=True)
                      src=extract_package(raw,work)
                      install_game(src,destination)

                  catalog=[x for x in catalog if str(x.get('submissionId',''))!=str(gid)]
                  catalog.append({'name':name,'desc':game.get('description') or 'Juego educativo de TecnoMath','url':f'games/{folder}/index.html','imageUrl':game.get('imageUrl') or '','icon':game.get('icon') or '🎮','category':game.get('category') or 'otros','deviceCompatibility':'both','evento':None,'submissionId':str(gid),'authorName':game.get('authorName') or 'Usuario','sourceType':source})
                  changed=True
                  print('Juego publicado:',folder)
              except Exception as exc:
                  print(f'ERROR publicando {gid}: {exc}')

          if changed:
              catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add','games','data/games.json'],check=True)
              if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
                  subprocess.run(['git','commit','-m','feat: publish approved Spark game'],check=True)
                  subprocess.run(['git','push'],check=True)
          else:
              print('No hay juegos aprobados para publicar.')
          PY