name: Publicar juegos aprobados automáticamente

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: publish-approved-games
  cancel-in-progress: false

env:
  FIREBASE_DB: https://tecnomath-sync-6058a-default-rtdb.firebaseio.com

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full >/dev/null

      - name: Buscar y publicar juegos aprobados
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, re, shutil, subprocess, urllib.error, urllib.request, zipfile
          from pathlib import Path

          DB=os.environ['FIREBASE_DB'].rstrip('/')
          USER_AGENT='TecnoMath-AutoPublisher/2.0'

          def get_json(path):
              req=urllib.request.Request(f'{DB}/{path}.json',headers={'User-Agent':USER_AGENT,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      raw=r.read().decode('utf-8')
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='replace')
                  raise RuntimeError(f'Firebase HTTP {e.code} leyendo {path}: {body[:300]}')

          def slug(value):
              value=str(value or 'juego').lower()
              value=re.sub(r'[^a-z0-9]+','-',value).strip('-')
              return value[:60] or 'juego'

          def safe_extract(z,out):
              for info in z.infolist():
                  name=info.filename.replace('\\','/').lstrip('/')
                  parts=[p for p in name.split('/') if p]
                  if not parts or '..' in parts: continue
                  target=out.joinpath(*parts)
                  if info.is_dir():
                      target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with z.open(info) as src, open(target,'wb') as dst:
                          shutil.copyfileobj(src,dst)

          def extract_package(package_b64,work):
              raw=base64.b64decode(package_b64,validate=True)
              package=work/'game.zip'
              package.write_bytes(raw)
              out=work/'extracted'
              out.mkdir(parents=True,exist_ok=True)
              try:
                  with zipfile.ZipFile(package) as z:
                      safe_extract(z,out)
              except zipfile.BadZipFile:
                  subprocess.run(['7z','x','-y',f'-o{out}',str(package)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT)
              return out

          def find_index(root):
              direct=root/'index.html'
              if direct.exists(): return direct
              direct_htm=root/'index.htm'
              if direct_htm.exists(): return direct_htm
              indexes=list(root.rglob('index.html'))+list(root.rglob('index.htm'))
              return indexes[0] if indexes else None

          def install(src,dst):
              index=find_index(src)
              if not index:
                  raise RuntimeError('El paquete no contiene index.html ni index.htm.')
              root=index.parent
              if dst.exists(): shutil.rmtree(dst)
              dst.mkdir(parents=True,exist_ok=True)
              for item in root.iterdir():
                  if item.name.startswith('.'): continue
                  target=dst/item.name
                  if item.is_dir(): shutil.copytree(item,target)
                  else: shutil.copy2(item,target)

          queue=get_json('gameUploadQueue') or {}
          games=Path('games'); games.mkdir(parents=True,exist_ok=True)
          catalog_file=Path('data/games.json'); catalog_file.parent.mkdir(parents=True,exist_ok=True)
          try:
              catalog=json.loads(catalog_file.read_text(encoding='utf-8'))
              if not isinstance(catalog,list): catalog=[]
          except Exception:
              catalog=[]

          published_ids={str(x.get('submissionId')) for x in catalog if isinstance(x,dict) and x.get('submissionId')}
          changed=False
          found=0

          for gid,game in queue.items():
              if not isinstance(game,dict) or str(game.get('status','')).lower()!='approved':
                  continue
              found+=1
              gid=str(gid)
              if gid in published_ids:
                  print(f'Ya publicado: {gid}')
                  continue

              name=str(game.get('name') or 'Juego').strip() or 'Juego'
              folder=f'{slug(name)}-{re.sub(r"[^A-Za-z0-9_-]", "", gid)[:40] or "game"}'
              destination=games/folder
              source=str(game.get('sourceType') or 'upload')

              try:
                  if source=='url':
                      url=str(game.get('gameUrl') or '').strip()
                      if not re.match(r'^https?://',url,re.I): raise RuntimeError('URL del juego inválida.')
                      if destination.exists(): shutil.rmtree(destination)
                      destination.mkdir(parents=True,exist_ok=True)
                      title=(name.replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('"','&quot;'))
                      html=f'<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title}</title></head><body><script>location.replace({json.dumps(url)});</script><noscript><a href={json.dumps(url)}>Abrir juego</a></noscript></body></html>'
                      (destination/'index.html').write_text(html,encoding='utf-8')
                  else:
                      package=game.get('packageBase64')
                      if not package: raise RuntimeError('No existe packageBase64 en el envío aprobado.')
                      work=Path('/tmp')/f'tecnomath-{gid}'
                      shutil.rmtree(work,ignore_errors=True)
                      work.mkdir(parents=True,exist_ok=True)
                      src=extract_package(package,work)
                      install(src,destination)

                  entry={
                      'name':name,
                      'desc':str(game.get('description') or 'Juego educativo de TecnoMath'),
                      'url':f'games/{folder}/index.html',
                      'imageUrl':str(game.get('imageUrl') or ''),
                      'icon':str(game.get('icon') or '🎮'),
                      'category':str(game.get('category') or 'otros'),
                      'deviceCompatibility':'both',
                      'evento':None,
                      'submissionId':gid,
                      'authorName':str(game.get('authorName') or 'Usuario'),
                      'sourceType':source,
                      'publishedAt':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat()
                  }
                  catalog.append(entry)
                  changed=True
                  print(f'PUBLICADO: {name} -> {entry["url"]}')
              except Exception as exc:
                  print(f'ERROR: no se pudo publicar {gid}: {exc}')

          if found==0:
              print('No hay juegos aprobados pendientes.')

          if changed:
              catalog_file.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add','games','data/games.json'],check=True)
              if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
                  subprocess.run(['git','commit','-m','feat: publish approved Spark game'],check=True)
                  subprocess.run(['git','push'],check=True)
          else:
              print('No hubo cambios en el repositorio.')
          PY
