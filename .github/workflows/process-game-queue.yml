name: Publicar juegos aprobados automáticamente

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'ID opcional del envío aprobado'
        required: false
        type: string
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: publish-approved-games
  cancel-in-progress: false

env:
  FIREBASE_DB: https://tecnomath-sync-6058a-default-rtdb.firebaseio.com
  RESEND_FROM: TecnoMath <notificaciones@tecnomath.online>

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Autenticar para leer Firebase Realtime Database
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          token_format: access_token

      - name: Instalar herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full >/dev/null

      - name: Publicar aprobados y enviar correo de publicación
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EVENT_SUBMISSION_ID: ${{ github.event.client_payload.submissionId || inputs.submission_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/publish-approved-games.py
