name: Activar UI segura de TecnoMath
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activate:
    if: ${{ !contains(github.event.head_commit.message, '[ui-safe]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar UI externa sin tocar el contenido funcional
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='    <link rel="stylesheet" href="assets/css/tecnomath-ui-v2.css?v=20260914">\n'
          js='    <script src="js/tecnomath-ui-v2.js?v=20260914" defer></script>\n'
          if 'assets/css/tecnomath-ui-v2.css' not in s:
              s=s.replace('</head>',css+'</head>',1)
          if 'js/tecnomath-ui-v2.js' not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verificar contenido crítico
        shell: bash
        run: |
          set -e
          grep -q 'class="project-card"' index.html
          grep -q 'id="projectsContainer"' index.html
          grep -q 'id="sponsorsArea"' index.html
          grep -q 'id="qrcode"' index.html
          grep -q 'js/games-loader.js' index.html
          grep -q 'tecnomath-ui-v2.css' index.html
          grep -q 'tecnomath-ui-v2.js' index.html
      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: conectar UI sin romper portada [ui-safe]'
          git push