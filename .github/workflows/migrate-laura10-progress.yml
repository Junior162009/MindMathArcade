name: Verify Laura10 Supabase progress migration

on:
  push:
    branches: [main]
    paths:
      - 'games/laura10°/index.html'
      - 'js/tecnomath-auth.js'
      - 'js/tecnomath-progress.js'
      - '.github/workflows/migrate-laura10-progress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verificar migración Laura10
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'tecnomath-auth.js' 'games/laura10°/index.html'
          grep -q 'tecnomath-progress.js' 'games/laura10°/index.html'
          if grep -qE 'firebase-app-compat|firebase-auth-compat|firebase-database-compat|firebase-config.js|game-progress.js' 'games/laura10°/index.html'; then
            echo 'ERROR: Laura10° conserva scripts Firebase/progreso antiguo.'
            exit 1
          fi
          echo 'Laura10° usa el sistema de progreso Supabase: OK'
