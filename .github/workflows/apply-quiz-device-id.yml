name: Apply quiz device ID

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-quiz-device-id.yml'

permissions:
  contents: write

jobs:
  patch-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore student list and keep device protection
        shell: python
        run: |
          from pathlib import Path
          path=Path('games/quiz-resena-critica/index.html')
          text=path.read_text(encoding='utf-8')
          students=[
          ('emmanuel arrieta','Emmanuel Arrieta'),('andris atencio','Andris Atencio'),('mateo barbosa','Mateo Barbosa'),('fabiana barrios','Fabiana Barrios'),('gabriel bonilla','Gabriel Bonilla'),('yeider camacho','Yeider Camacho'),('daniela contreras','Daniela Contreras'),('jose de la hoz','Jose De La Hoz'),('dylan guerrero','Dylan Guerrero'),('sheila jaramillo','Sheila Jaramillo'),('jolberth jaramillo','Jolberth Jaramillo'),('carlos jimenez','Carlos Jimenez'),('jhoangel jinete','Jhoangel Jinete'),('jose lopez','Jose Lopez'),('numar lopez','Numar Lopez'),('yendri marchena','Yendri Marchena'),('litzy marsiglia','Litzy Marsiglia'),('tahimi mayorga','Tahimi Mayorga'),('nicole natera','Nicole Natera'),('luisa pacheco','Luisa Pacheco'),('frederick peña','Frederick Peña'),('nataly peña','Nataly Peña'),('yeicoil pozo','Yeicoil Pozo'),('laurys primera','Laurys Primera'),('danny rico','Danny Rico'),('joselyn rios','Joselyn Rios'),('edglimar roca','Edglimar Roca'),('esequiel silva','Esequiel Silva'),('andy tocarruncho','Andy Tocarruncho'),('jaider velez','Jaider Velez'),('sharon yepes','Sharon Yepes'),('oscar yepes','Oscar Yepes'),('yulisa yepes','Yulisa Yepes'),('john yepes','John Yepes')]
          options='<option value="">— Selecciona un estudiante —</option>'+''.join(f'<option value="{v}">{label}</option>' for v,label in students)
          import re
          text=re.sub(r'<label for="name">[^<]*</label><input id="name"[^>]*>', '<label for="name">Selecciona tu nombre</label><select id="name">'+options+'</select>', text, count=1)
          text=text.replace("async function start(){let s=$('name');if(!s||!s.value.trim())return;name=s.value.trim();$('startBtn').disabled=true;", "async function start(){let s=$('name').selectedOptions[0];if(!s||!s.value)return;name=s.textContent.trim();$('startBtn').disabled=true;",1)
          text=text.replace("$('name').oninput=()=>{$('startBtn').disabled=!$('name').value.trim()};", "$('name').onchange=()=>{$('startBtn').disabled=!$('name').value};",1)
          # Ensure the device protection is present; if not, fail rather than silently deploying an unprotected quiz.
          if 'TECNOMATH_DEVICE_ID_V2' not in text or 'device_id:deviceId' not in text or 'verifyDevice' not in text:
              raise SystemExit('Falta la protección por ID de dispositivo; no se publica un HTML sin ella.')
          text=text.replace('TECNOMATH_DEVICE_ID_V2','TECNOMATH_DEVICE_ID_V3',1)
          path.write_text(text,encoding='utf-8')
          print('Student list restored; device protection preserved.')

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- games/quiz-resena-critica/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/quiz-resena-critica/index.html
          git commit -m 'fix: restore quiz student list and keep device ID protection'
          git push
