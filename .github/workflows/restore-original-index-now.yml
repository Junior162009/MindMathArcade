name: Restore original index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-original-index-now.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original index
        run: |
          git checkout 3a6cb6a4ad4e732c679e25c926155a3139e6cd72 -- index.html
          test -s index.html
          grep -q 'id="projectsContainer"' index.html
          grep -q 'const juegosRecomendados' index.html
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "restore: original MindMath Arcade index"
          git push
