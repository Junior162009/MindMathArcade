name: Verificar integración visual de TecnoMath

on:
  push:
    paths:
      - 'assets/css/tecnomath-ui-v2.css'
      - 'js/tecnomath-ui-v2.js'
      - 'index.html'
      - '.github/workflows/connect-tecnomath-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verificar capa visual sin mutar el repositorio
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/css/tecnomath-ui-v2.css
          test -f js/tecnomath-ui-v2.js
          grep -q 'id="projectsContainer"' index.html
          grep -q 'id="sponsorsArea"' index.html
          grep -q 'id="qrcode"' index.html
          grep -q 'js/games-loader.js' index.html
          grep -q 'js/tecnomath-auth.js' index.html
          if grep -q 'pages/admin/supabase.html' index.html; then
            echo 'ERROR: el portal no debe enlazar al panel administrativo histórico.'
            exit 1
          fi
          echo 'Integración visual y rutas administrativas: OK'
