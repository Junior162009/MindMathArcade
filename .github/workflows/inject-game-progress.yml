name: Conectar progreso automático de juegos

on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      - 'js/tecnomath-progress.js'
      - 'scripts/inject-game-progress.py'
      - '.github/workflows/inject-game-progress.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inyectar sincronización automática
        run: python3 scripts/inject-game-progress.py

      - name: Guardar cambios
        run: |
          git config user.name 'TecnoMath Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No hay juegos nuevos para conectar.'
            exit 0
          fi
          git add games/**/index.html
          git commit -m 'chore: conectar juegos al progreso automático'
          git push
