name: Verify canonical Supabase admin guard

on:
  push:
    branches: [main]
    paths:
      - 'js/admin-guard.js'
      - 'js/admin-guard-supabase.js'
      - '.github/workflows/apply-supabase-admin-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Verificar guardias
        run: cmp -s js/admin-guard.js js/admin-guard-supabase.js
