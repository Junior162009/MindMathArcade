name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy tracked Edge Functions to Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: xdszveoxdrdnwwzzvkav

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase credentials
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Falta el secreto SUPABASE_ACCESS_TOKEN en GitHub Secrets."
            exit 1
          fi

      - name: Deploy tracked Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for dir in supabase/functions/*; do
            [ -f "$dir/index.ts" ] || continue
            found=1
            name="$(basename "$dir")"
            echo "Desplegando función versionada: $name"
            supabase functions deploy "$name" --use-api --project-ref "$SUPABASE_PROJECT_ID"
          done
          if [ "$found" -eq 0 ]; then
            echo "No hay Edge Functions versionadas para desplegar."
          fi
