name: Cleanup legacy admin UI

on:
  push:
    paths:
      - '.github/workflows/cleanup-legacy-admin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy admin UI from portal
        shell: python
        run: |
          from pathlib import Path
          import re

          for name in ('index.html', 'index-backup.html'):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'\s*<button id="adminAccessBtn"\b[^>]*>.*?</button>', '', s, flags=re.S)
              s = re.sub(r'\s*<div id="admin-cloud"\b[^>]*>.*?</div>\s*<div id="admin-panel">.*?</div>', '', s, flags=re.S)
              s = re.sub(r'\s*/\* Nube de admin \*/.*?#admin-panel \.btn-gold\s*\{.*?\}\s*', '\n', s, flags=re.S)
              p.write_text(s, encoding='utf-8')

          # Remove only the obsolete portal bridge handlers; keep the rest of shared.js intact.
          p = Path('js/shared.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'\n\s*function setupAdminBridge\(\)\{.*?\n\s*setupAdminBridge\(\);', '', s, flags=re.S)
              p.write_text(s, encoding='utf-8')

      - name: Verify legacy portal selectors are gone
        shell: bash
        run: |
          ! grep -R -n --exclude-dir=.git --exclude='cleanup-legacy-admin.yml' 'adminAccessBtn' index.html index-backup.html js/shared.js
          ! grep -R -n --exclude-dir=.git --exclude='cleanup-legacy-admin.yml' 'admin-cloud' index.html index-backup.html js/shared.js
          ! grep -R -n --exclude-dir=.git --exclude='cleanup-legacy-admin.yml' 'setupAdminBridge' js/shared.js

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/cleanup-legacy-admin.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html index-backup.html js/shared.js .github/workflows/cleanup-legacy-admin.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: eliminar UI administrativa heredada'
          git push
