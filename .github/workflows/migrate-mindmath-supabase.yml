name: Migrate MindMath game to Supabase
on:
  push:
    paths:
      - '.github/workflows/migrate-mindmath-supabase.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('pages/game.html')
          s=p.read_text(encoding='utf-8')
          old='''<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>\n<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>\n<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>\n<script src="../js/firebase-config.js"></script>'''
          new='''<script src="../js/tecnomath-auth.js?v=20260914-supabase"></script>'''
          if old not in s:
              raise SystemExit('Firebase script block not found')
          s=s.replace(old,new,1)
          marker='''/* ═══════════════════════════════════════════════\n   CONSTANTES\n   ═══════════════════════════════════════════════ */'''
          bridge=r'''/* ═══════════════════════════════════════════════\n   MINDFMATH · SUPABASE BRIDGE\n   Fuente oficial de cuenta/progreso: Supabase Auth + PostgreSQL.\n   ═══════════════════════════════════════════════ */\n(function(){\n  const GAME_ID='mindmath-arcade';\n  const localCoins=()=>parseInt(localStorage.getItem('global_coins')||'0',10)||0;\n  const writeCoins=(n)=>{\n    const value=Math.max(0,Math.floor(Number(n)||0));\n    localStorage.setItem('global_coins',String(value));\n    window.TecnoMathProgress?.save?.(GAME_ID,{globalCoins:value});\n    return value;\n  };\n  window.Tecnomath=Object.assign(window.Tecnomath||{}, {\n    getCurrentUser:()=>window.TecnoMathProgress?.getUser?.()||null,\n    getCoins:()=>localCoins(),\n    addCoins:(amount)=>writeCoins(localCoins()+Number(amount||0)),\n    updateHighScore:(game,score)=>{\n      const key='highscore_'+game;\n      const old=parseInt(localStorage.getItem(key)||'0',10)||0;\n      if(Number(score)>old)localStorage.setItem(key,String(score));\n      window.TecnoMathProgress?.save?.(GAME_ID,{game,score,highScore:Math.max(old,Number(score)||0)});\n    },\n    getGameCoins:()=>stats.coins||0,\n    exchangeGlobalToLocal:(game,amount)=>{\n      const n=Math.floor(Number(amount)||0);\n      if(n<=0||localCoins()<n)return false;\n      writeCoins(localCoins()-n);\n      stats.coins+=(Math.floor(n*0.9));\n      saveStats();\n      return true;\n    },\n    isAdmin:()=>!!window.TecnomathCurrentAdmin||!!stats.isAdmin,\n    setAdmin:()=>{},\n    unsetAdmin:()=>{}\n  });\n  window.addEventListener('tecnomath:authchange',()=>{\n    setTimeout(()=>{\n      try{loadStats();}catch(_){}\n      try{updateHUD();renderMenu();}catch(_){}\n    },100);\n  });\n})();\n\n'''
          if marker not in s:
              raise SystemExit('Constants marker not found')
          s=s.replace(marker,bridge+marker,1)
          s=s.replace('''   TECNOMATH MOCK''','''   TECNOMATH COMPATIBILITY''',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/game.html
          git diff --cached --quiet && exit 0
          git commit -m 'migrate MindMath Arcade game to Supabase'
          git push
      - name: Remove temporary migration workflow
        if: success()
        run: |
          rm -f .github/workflows/migrate-mindmath-supabase.yml
          git add .github/workflows/migrate-mindmath-supabase.yml
          git commit -m 'remove temporary Supabase migration workflow'
          git push
# trigger migration
