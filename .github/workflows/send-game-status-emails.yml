name: Enviar correos de estado de juegos

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_DB: https://tecnomath-sync-6058a-default-rtdb.firebaseio.com
  RESEND_FROM: TecnoMath <notificaciones@tecnomath.online>

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email

      - name: Enviar correos pendientes
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send-game-status-emails.py
