name: Enviar correos de estado de juegos (Supabase)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

env:
  SUPABASE_URL: https://xdszveoxdrdnwwzzvkav.supabase.co
  RESEND_FROM: TecnoMath <notificaciones@tecnomath.online>

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar conexión con Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.request
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          url=os.environ['SUPABASE_URL']+'/rest/v1/tecnomath_game_submissions?select=id&limit=1'
          req=urllib.request.Request(url,headers={'apikey':key,'Authorization':'Bearer '+key})
          with urllib.request.urlopen(req,timeout=30) as r: print('Supabase: conexión correcta. HTTP',r.status)
          PY

      - name: Enviar correos de estado pendientes
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send-game-status-emails.py
