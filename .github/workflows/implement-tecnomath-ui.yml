name: Implementar UI superior TecnoMath

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[tm-ui-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Aplicar UI superior sin tocar tarjetas
        shell: python
        run: |
          from pathlib import Path
          import re
          
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '/* TM_UI_V2_START */'
          if marker in html:
              print('UI ya implementada')
              raise SystemExit(0)
          
          css = r'''\n/* TM_UI_V2_START */\n.tm-ui-header {\n  position:relative; z-index:1000;\n  padding:10px clamp(12px,3vw,28px) !important;\n  background:rgba(7,7,17,.72) !important;\n  border-bottom:1px solid transparent !important;\n  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);\n  box-shadow:0 10px 35px rgba(0,0,0,.28) !important;\n  transition:padding .35s cubic-bezier(.25,.8,.25,1),background .35s,box-shadow .35s;\n}\n.tm-ui-header::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:linear-gradient(90deg,transparent,#a855f7,#00f5ff,transparent); box-shadow:0 0 14px rgba(0,245,255,.35); }\n.tm-ui-header.tm-shrink { padding-top:6px !important; padding-bottom:6px !important; background:rgba(7,7,17,.92) !important; }\n.tm-ui-header .header-content { max-width:1280px; margin:auto; flex-wrap:nowrap; }\n.tm-ui-header .logo-area { flex:0 0 auto; }\n.tm-ui-header h1 { color:#fff !important; background:linear-gradient(90deg,#b77cff,#00f5ff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; text-shadow:none !important; font-size:clamp(14px,2.5vw,24px) !important; animation:tmLogoPulse 3s ease-in-out infinite !important; }\n.tm-ui-header .subtitle { color:#00f5ff !important; text-shadow:0 0 8px rgba(0,245,255,.55) !important; }\n@keyframes tmLogoPulse { 0%,100%{filter:drop-shadow(0 0 3px rgba(0,245,255,.35))} 50%{filter:drop-shadow(0 0 11px rgba(168,85,247,.6))} }\n.tm-ui-nav { display:flex; align-items:center; justify-content:center; gap:clamp(12px,2.2vw,30px); margin-left:auto; }\n.tm-ui-nav a { position:relative; padding:10px 2px; color:#c2c8dc; text-decoration:none; font:700 clamp(7px,1vw,10px)/1 'Orbitron',sans-serif; transition:color .25s; }\n.tm-ui-nav a::after { content:""; position:absolute; left:50%; bottom:3px; width:0; height:2px; transform:translateX(-50%); background:linear-gradient(90deg,#a855f7,#00f5ff); box-shadow:0 0 9px #00f5ff; transition:width .3s cubic-bezier(.25,.8,.25,1); }\n.tm-ui-nav a:hover,.tm-ui-nav a.active { color:#fff; }\n.tm-ui-nav a:hover::after,.tm-ui-nav a.active::after { width:100%; }\n.tm-ui-actions { display:flex; align-items:center; gap:8px; margin-left:10px; }\n.tm-ui-theme,.tm-ui-menu { width:40px; height:40px; display:grid; place-items:center; border:1px solid rgba(168,85,247,.35); border-radius:10px; background:rgba(168,85,247,.08); color:#fff; cursor:pointer; transition:.3s cubic-bezier(.25,.8,.25,1); }\n.tm-ui-theme:hover,.tm-ui-menu:hover { border-color:#00f5ff; box-shadow:0 0 18px rgba(0,245,255,.18); transform:translateY(-2px); }\n.tm-ui-menu { display:none; }\n.tm-ui-hero { position:relative; overflow:hidden; isolation:isolate; padding:clamp(70px,10vw,125px) 20px clamp(65px,9vw,105px); text-align:center; background:radial-gradient(circle at 50% 35%,rgba(168,85,247,.16),transparent 36%),linear-gradient(180deg,rgba(4,4,15,.5),rgba(7,7,17,.96)); border-bottom:1px solid rgba(168,85,247,.2); }\n.tm-ui-hero::before { content:""; position:absolute; inset:-30%; z-index:-2; background-image:linear-gradient(rgba(0,245,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(168,85,247,.07) 1px,transparent 1px); background-size:52px 52px; transform:perspective(520px) rotateX(58deg) translateY(120px); mask-image:linear-gradient(to bottom,transparent,black 25%,black 70%,transparent); animation:tmGrid 18s linear infinite; }\n.tm-ui-hero::after { content:""; position:absolute; width:420px; height:420px; border-radius:50%; left:50%; top:20%; transform:translate(-50%,-50%); background:#00f5ff; filter:blur(130px); opacity:.06; z-index:-1; }\n@keyframes tmGrid { to{background-position:0 52px;} }\n.tm-ui-badge { display:inline-flex; align-items:center; gap:8px; padding:8px 13px; border:1px solid rgba(0,245,255,.3); border-radius:999px; color:#00f5ff; background:rgba(0,245,255,.05); font:700 8px/1 'Orbitron',sans-serif; letter-spacing:1px; animation:tmUp .7s both; }\n.tm-ui-dot { width:7px; height:7px; border-radius:50%; background:#00f5ff; box-shadow:0 0 9px #00f5ff; }\n.tm-ui-hero h2 { margin:22px 0 18px; font:normal clamp(28px,7vw,72px)/1.18 'Press Start 2P',monospace; color:#fff; text-shadow:0 0 18px rgba(168,85,247,.35); animation:tmUp .8s .1s both; }\n.tm-ui-hero h2 span { background:linear-gradient(90deg,#b77cff,#00f5ff); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 9px rgba(0,245,255,.25)); }\n.tm-ui-hero p { max-width:720px; margin:auto; color:#c2c8dc; font:400 clamp(13px,2vw,18px)/1.65 'Orbitron',sans-serif; animation:tmUp .8s .2s both; }\n.tm-ui-hero-actions { display:flex; justify-content:center; flex-wrap:wrap; gap:12px; margin-top:32px; animation:tmUp .8s .3s both; }\n.tm-ui-btn { min-height:52px; padding:0 22px; display:inline-flex; align-items:center; justify-content:center; gap:9px; border-radius:11px; text-decoration:none; font:700 9px/1 'Orbitron',sans-serif; transition:.3s cubic-bezier(.25,.8,.25,1); }\n.tm-ui-primary { color:#fff; background:linear-gradient(110deg,#7040d6,#a855f7,#00b8d4); box-shadow:0 0 22px rgba(168,85,247,.2); }\n.tm-ui-primary:hover { transform:translateY(-4px); box-shadow:0 10px 30px rgba(168,85,247,.3),0 0 30px rgba(0,245,255,.12); }\n.tm-ui-secondary { color:#00f5ff; border:1px solid rgba(0,245,255,.35); background:rgba(0,245,255,.04); }\n.tm-ui-secondary:hover { transform:translateY(-4px); background:rgba(0,245,255,.08); box-shadow:0 0 22px rgba(0,245,255,.12); }\n.tm-ui-search { width:min(650px,100%); margin:32px auto 0; display:flex; align-items:center; gap:10px; min-height:52px; padding:0 14px; border:1px solid rgba(168,85,247,.28); border-radius:12px; background:rgba(8,8,22,.75); transition:.3s; animation:tmUp .8s .4s both; }\n.tm-ui-search:focus-within { border-color:#00f5ff; box-shadow:0 0 0 3px rgba(0,245,255,.07),0 0 24px rgba(0,245,255,.08); }\n.tm-ui-search span { color:#00f5ff; font-size:22px; }\n.tm-ui-search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:#fff; font:400 12px 'Orbitron',sans-serif; }\n.tm-ui-search input::placeholder { color:#777d92; }\n.tm-ui-stats { padding:55px 20px; background:#0b0b18; border-bottom:1px solid rgba(168,85,247,.15); }\n.tm-ui-stats h3 { margin:0 0 30px; text-align:center; color:#fff; font:normal clamp(13px,2.5vw,20px) 'Press Start 2P',monospace; }\n.tm-ui-stats h3 span { color:#00f5ff; }\n.tm-ui-stat-grid { width:min(1100px,100%); margin:auto; display:grid; grid-template-columns:repeat(4,1fr); }\n.tm-ui-stat { text-align:center; padding:10px 18px; border-right:1px solid transparent; border-image:linear-gradient(#a855f7,#00f5ff) 1; }\n.tm-ui-stat:last-child { border-right:0; }\n.tm-ui-stat strong { display:block; color:#00f5ff; font:normal clamp(20px,4vw,34px) 'Press Start 2P',monospace; text-shadow:0 0 12px rgba(0,245,255,.28); }\n.tm-ui-stat span { display:block; margin-top:9px; color:#777d92; font:700 8px 'Orbitron',sans-serif; letter-spacing:1px; }\n.tm-ui-top { position:fixed; right:22px; bottom:22px; z-index:900; width:46px; height:46px; border:1px solid rgba(0,245,255,.35); border-radius:12px; background:rgba(8,8,22,.9); color:#00f5ff; cursor:pointer; opacity:0; visibility:hidden; transform:translateY(12px); transition:.3s; }\n.tm-ui-top.show { opacity:1; visibility:visible; transform:none; }\nhtml { scrollbar-width:thin; scrollbar-color:#a855f7 #070711; }\nhtml::-webkit-scrollbar { width:8px; }\nhtml::-webkit-scrollbar-track { background:#070711; }\nhtml::-webkit-scrollbar-thumb { background:linear-gradient(#a855f7,#00f5ff); border-radius:10px; }\n::selection { background:#a855f7; color:#fff; }\n.tm-ui-hero a:focus-visible,.tm-ui-header a:focus-visible,.tm-ui-header button:focus-visible,.tm-ui-search input:focus-visible,.tm-ui-top:focus-visible { outline:2px solid #00f5ff; outline-offset:4px; }\n@keyframes tmUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }\n@media(max-width:850px){ .tm-ui-nav{display:none;position:absolute;top:calc(100% + 1px);left:10px;right:10px;padding:12px;flex-direction:column;align-items:stretch;background:rgba(8,8,22,.97);border:1px solid rgba(168,85,247,.25);border-radius:12px;box-shadow:0 20px 45px rgba(0,0,0,.45)} .tm-ui-nav.open{display:flex} .tm-ui-menu{display:grid} .tm-ui-header .header-content{position:relative} .tm-ui-stat-grid{grid-template-columns:1fr 1fr}.tm-ui-stat:nth-child(2){border-right:0} }\n@media(max-width:560px){ .tm-ui-hero{padding-top:65px}.tm-ui-hero h2{font-size:clamp(23px,10vw,42px)} .tm-ui-hero-actions{flex-direction:column}.tm-ui-btn{width:100%}.tm-ui-stat-grid{grid-template-columns:1fr}.tm-ui-stat{border-right:0;border-bottom:1px solid rgba(168,85,247,.18)} .tm-ui-stat:last-child{border-bottom:0} }\n@media(prefers-reduced-motion:reduce){.tm-ui-hero::before,.tm-ui-header h1{animation:none!important}.tm-ui-hero *{animation-duration:.01ms!important;transition-duration:.01ms!important}}\n/* TM_UI_V2_END */\n'''
          html = html.replace('</style>', css + '\n    </style>', 1)
          
          hero = r'''\n<!-- TM_UI_V2_HERO -->\n<section class="tm-ui-hero" id="tm-ui-hero">\n  <div class="tm-ui-badge"><span class="tm-ui-dot"></span> PLATAFORMA EDUCATIVA GAMING</div>\n  <h2>APRENDE.<br><span>JUEGA.</span><br>DOMINA.</h2>\n  <p>Convierte el aprendizaje en una experiencia retro-futurista, divertida y competitiva.</p>\n  <div class="tm-ui-hero-actions">\n    <a class="tm-ui-btn tm-ui-primary" href="#projectsContainer">🎮 EXPLORAR JUEGOS</a>\n    <a class="tm-ui-btn tm-ui-secondary" href="#tm-ui-stats">⚡ VER ESTADÍSTICAS</a>\n  </div>\n  <label class="tm-ui-search" aria-label="Buscar juegos">\n    <span aria-hidden="true">⌕</span>\n    <input id="tmUiSearch" type="search" placeholder="Buscar un juego..." autocomplete="off">\n  </label>\n</section>\n\n<section class="tm-ui-stats" id="tm-ui-stats" aria-label="Estadísticas de TecnoMath">\n  <h3>TECNO<span>MATH</span> EN NÚMEROS</h3>\n  <div class="tm-ui-stat-grid">\n    <div class="tm-ui-stat"><strong data-tm-target="60" data-tm-suffix="+">0</strong><span>JUEGOS</span></div>\n    <div class="tm-ui-stat"><strong data-tm-target="1000" data-tm-suffix="+">0</strong><span>JUGADORES</span></div>\n    <div class="tm-ui-stat"><strong data-tm-target="10" data-tm-suffix="+">0</strong><span>ÁREAS</span></div>\n    <div class="tm-ui-stat"><strong data-tm-target="100" data-tm-suffix="%">0</strong><span>DIVERSIÓN</span></div>\n  </div>\n</section>\n<button class="tm-ui-top" id="tmUiTop" type="button" aria-label="Volver arriba">↑</button>\n'''
          html = html.replace('<div class="container" id="projectsContainer"></div>', hero + '\n<div class="container" id="projectsContainer"></div>', 1)
          
          js = r'''\n<script id="tm-ui-v2-script">\n(() => {\n  const header=document.querySelector('header');\n  if(header){\n    header.classList.add('tm-ui-header');\n    const content=header.querySelector('.header-content');\n    if(content && !header.querySelector('.tm-ui-nav')){\n      const nav=document.createElement('nav'); nav.className='tm-ui-nav'; nav.setAttribute('aria-label','Navegación principal');\n      nav.innerHTML='<a class="active" href="#tm-ui-hero">Inicio</a><a href="#projectsContainer">Juegos</a><a href="#tm-ui-stats">Estadísticas</a>';\n      const actions=document.createElement('div'); actions.className='tm-ui-actions';\n      actions.innerHTML='<button class="tm-ui-theme" id="tmUiTheme" type="button" aria-label="Cambiar modo de color" aria-pressed="false">☾</button><button class="tm-ui-menu" id="tmUiMenu" type="button" aria-label="Abrir menú" aria-expanded="false">☰</button>';\n      content.append(nav,actions);\n      const menu=document.getElementById('tmUiMenu');\n      menu.addEventListener('click',()=>{const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-label',open?'Cerrar menú':'Abrir menú');});\n      nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{nav.classList.remove('open');menu.setAttribute('aria-expanded','false');}));\n      const theme=document.getElementById('tmUiTheme');\n      theme.addEventListener('click',()=>{document.documentElement.classList.toggle('tm-light-ui');const light=document.documentElement.classList.contains('tm-light-ui');theme.textContent=light?'☀':'☾';theme.setAttribute('aria-pressed',String(light));localStorage.setItem('tm-ui-theme',light?'light':'dark');});\n      if(localStorage.getItem('tm-ui-theme')==='light'){document.documentElement.classList.add('tm-light-ui');theme.textContent='☀';theme.setAttribute('aria-pressed','true');}\n    }\n  }\n  const onScroll=()=>{header?.classList.toggle('tm-shrink',scrollY>30);document.getElementById('tmUiTop')?.classList.toggle('show',scrollY>500);};\n  addEventListener('scroll',onScroll,{passive:true});onScroll();\n  document.getElementById('tmUiTop')?.addEventListener('click',()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));\n  const stats=document.getElementById('tm-ui-stats'); const counters=[...document.querySelectorAll('[data-tm-target]')];\n  const run=()=>counters.forEach(el=>{if(el.dataset.done)return;el.dataset.done='1';const target=Number(el.dataset.tmTarget),suffix=el.dataset.tmSuffix||'';if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=target.toLocaleString('es-CO')+suffix;return;}let start=performance.now();const tick=t=>{const p=Math.min((t-start)/1400,1),v=Math.floor(target*(1-Math.pow(1-p,3)));el.textContent=v.toLocaleString('es-CO')+suffix;if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick);});\n  if(stats&&'IntersectionObserver'in window)new IntersectionObserver(e=>{if(e.some(x=>x.isIntersecting)){run();}}, {threshold:.25}).observe(stats); else run();\n  const search=document.getElementById('tmUiSearch');\n  search?.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();document.querySelectorAll('#projectsContainer .project-card').forEach(card=>{card.style.display=!q||card.textContent.toLowerCase().includes(q)?'':'none';});});\n  const lightStyle=document.createElement('style');lightStyle.textContent='.tm-light-ui .tm-ui-header{background:rgba(244,243,255,.86)!important}.tm-light-ui .tm-ui-header h1{-webkit-text-fill-color:#151321!important}.tm-light-ui .tm-ui-nav a{color:#454258}.tm-light-ui .tm-ui-hero{background:linear-gradient(180deg,#f4f3ff,#e9e8f5)}.tm-light-ui .tm-ui-hero h2,.tm-light-ui .tm-ui-stats h3{color:#151321}.tm-light-ui .tm-ui-hero p{color:#454258}.tm-light-ui .tm-ui-search{background:rgba(255,255,255,.8)}.tm-light-ui .tm-ui-search input{color:#151321}.tm-light-ui .tm-ui-stats{background:#e9e8f5}';document.head.appendChild(lightStyle);\n})();\n</script>\n'''
          html = html.replace('</body>', js + '\n</body>', 1)
          
          # The legacy header/hero are kept for compatibility; only the legacy hero/filter block is hidden visually.
          legacy = r'''\n<style id="tm-ui-v2-legacy-hide">\n  body > header + .promo-bubble-container, body > .promo-bubble-container { display:none !important; }\n  body > .hero { display:none !important; }\n</style>\n'''
          html = html.replace('</head>', legacy + '\n</head>', 1)
          path.write_text(html, encoding='utf-8')
          print('index.html actualizado')
      
      - name: Verificar que las tarjetas no fueron modificadas
        run: |
          grep -q 'TM_UI_V2_START' index.html
          grep -q 'project-card' index.html
          echo 'Verificación OK: UI superior instalada y .project-card sigue presente.'

      - name: Commit y eliminar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/implement-tecnomath-ui.yml
          git rm .github/workflows/implement-tecnomath-ui.yml
          git commit -m 'Implementar nueva UI superior de TecnoMath [tm-ui-auto]'
          git push
