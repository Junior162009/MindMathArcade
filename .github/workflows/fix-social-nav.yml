name: Fix Social Navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide mobile bottom navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/shared.js')
          s=p.read_text(encoding='utf-8')
          marker="style.textContent += '\\n      /* SOCIAL SOLO ARRIBA */\\n      #tecnomathBottomNav{display:none !important}\\n      body{padding-bottom:0 !important}\\n      @media(max-width:768px){body{padding-bottom:0 !important}}\\n    ';"
          if '/* SOCIAL SOLO ARRIBA */' not in s:
              target="document.head.appendChild(style);\n\n    function createLink"
              replacement="document.head.appendChild(style);\n    style.textContent += '\\n      /* SOCIAL SOLO ARRIBA */\\n      #tecnomathBottomNav{display:none !important}\\n      body{padding-bottom:0 !important}\\n    ';\n\n    function createLink"
              if target not in s:
                  raise SystemExit('No se encontró el bloque de navegación social')
              p.write_text(s.replace(target,replacement,1),encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/shared.js .github/workflows/fix-social-nav.yml
          git rm .github/workflows/fix-social-nav.yml
          git diff --cached --quiet || git commit -m "Fix Social navigation: show only at top"
          git push