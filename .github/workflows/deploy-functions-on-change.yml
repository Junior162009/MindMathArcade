name: Firebase Functions (desactivado)

# La publicación de juegos ya no depende de Firebase Cloud Functions.
# Se mantiene este archivo para no borrar funciones existentes, pero no se ejecuta.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Firebase Functions deployment desactivado. La publicación usa GitHub Actions + Firebase Realtime Database + GitHub Pages."
