name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/index.js'
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-functions-deploy
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: tecnomath-sync-6058

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Configurar Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Instalar dependencias de Functions
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Desplegar Firebase Functions
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive
