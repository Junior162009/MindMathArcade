name: Migrate portal events to Supabase

on:
  push:
    paths:
      - '.github/workflows/migrate-index-events-supabase.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-time Supabase portal migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '<!-- TECNOMATH_SUPABASE_EVENTS_V1 -->' in s:
              print('Already migrated')
              raise SystemExit(0)
          s=re.sub(r'\s*<!-- ========== FIREBASE SDK ========== -->.*?</script>\s*<!-- ========== CONFIGURACIÓN DE FIREBASE ========== -->.*?</script>\s*','\n',s,flags=re.S)
          marker='''    <!-- TECNOMATH_SUPABASE_EVENTS_V1 -->\n    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n    <script src="js/tecnomath-auth.js?v=20260911-3"></script>\n    <script src="js/tecnomath-settings.js?v=20260911-1"></script>\n    <script src="js/theme-sync.js?v=20260911-1"></script>\n'''
          s=s.replace('    <!-- Favicon dinámico -->',marker+'\n    <!-- Favicon dinámico -->',1)
          pat=re.compile(r'        function syncEventToFirebase\(eventName\) \{.*?\n        \}\n\n        function listenFirebaseEvents\(\) \{.*?\n        \}\n',re.S)
          repl='''        async function syncEventToFirebase(eventName) {\n            try {\n                const nombre=String(eventName||'stop').trim().toLowerCase();\n                await window.TecnomathSettings.setEvent({nombre,activo:nombre!=='stop',timestamp:new Date().toISOString()});\n                pendingGlobalEvent=null;\n                console.log('☁️ Evento guardado en Supabase:',nombre);\n            } catch(err) {\n                pendingGlobalEvent=null;\n                console.warn('Error al guardar evento en Supabase:',err);\n                alert('No se pudo publicar el evento. Comprueba tu sesión de administrador.');\n            }\n        }\n\n        async function listenFirebaseEvents() {\n            if(syncInitialized) return;\n            const settings=window.TecnomathSettings;\n            if(!settings) return;\n            const applyEvent=(data)=>{\n                if(!data) return;\n                const active=data.activo===true && data.nombre && data.nombre!=='stop';\n                if(!active){\n                    if(fairMode) deactivateFairMode(false);\n                    else { activeEvent=null; loadThemeCSS(null); updateFavicon('🎮'); deactivateVisualEffects(); const title=document.getElementById('mainTitle'); if(title) title.textContent='TECNOMATH'; renderProjects(currentActiveFilter); }\n                    return;\n                }\n                const eventName=String(data.nombre).trim().toLowerCase();\n                if(!eventName || eventName===activeEvent) return;\n                if(eventName==='feria'){ if(!fairMode) activateFairMode(false); return; }\n                if(eventName==='feriaplus'){ if(!fairMode || activeEvent!=='feriaplus') activateMegaFair(false); return; }\n                const config=getEventConfig(eventName);\n                if(config) activatePermanentTheme(config.title,config.notification,config.confettiColors,config.emojis,eventName,false);\n            };\n            try {\n                applyEvent(await settings.getEvent());\n                settings.subscribeEvents(applyEvent);\n                syncInitialized=true;\n                console.log('📡 Eventos globales conectados a Supabase Realtime.');\n            } catch(error) { console.warn('No se pudieron cargar eventos globales desde Supabase:',error); }\n        }\n'''
          s,n=pat.subn(repl,s,count=1)
          if n!=1: raise SystemExit('No se encontró el bloque de eventos')
          s=s.replace("if (!user || !Tecnomath.isAdmin() || !firebase.auth().currentUser) {","if (!user || !Tecnomath.isAdmin()) {",1)
          s=s.replace("            try {\n                await firebase.auth().signOut();\n            } catch (error) {\n                console.warn('No se pudo cerrar la sesión de Firebase.', error);\n            } finally {\n                Tecnomath.logout();\n                updateUserBar();\n            }","            try {\n                await Tecnomath.logout();\n            } finally {\n                updateUserBar();\n            }",1)
          s=s.replace("console.log('🔥 Firebase sincronización activa.');","console.log('☁️ Supabase es la fuente oficial de eventos y temáticas.');")
          s=s.replace("console.log('📡 Publica eventos globales con el código de administrador.');","console.log('📡 Publica eventos globales mediante Supabase Realtime.');")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit migration and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/migrate-index-events-supabase.yml
          git commit -m "migrate portal events and themes to Supabase" || exit 0
          git push
