<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tecnomath · Portal de Proyectos</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#060610">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tecnomath">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00FFFF; --neon-pink: #FF00FF; --neon-green: #39FF14;
            --neon-yellow: #FFE600; --gold: #FFD700; --retro-bg: #060610; --card-bg: #0d0d1a;
            --grid-cols: 2;
            --card-min-width: 140px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%; overflow-y: auto; background: var(--retro-bg);
            font-family: 'Press Start 2P', cursive; color: white;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(0,68,255,0.07) 0%, transparent 50%),
                            radial-gradient(ellipse at 80% 20%, rgba(255,0,255,0.07) 0%, transparent 50%);
        }
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px);
        }
        header {
            padding: clamp(10px, 2vw, 15px); border-bottom: 2px solid var(--neon-pink);
            background: linear-gradient(90deg, rgba(255,0,255,0.05), transparent, rgba(0,255,255,0.05));
            position: relative;
        }
        .header-content {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: clamp(6px, 1vw, 10px);
        }
        .logo-area { text-align: left; }
        h1 {
            font-size: clamp(12px, 4vw, 22px); color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 30px var(--neon-cyan);
            letter-spacing: 2px; animation: titlePulse 2s ease-in-out infinite; margin: 0;
        }
        @keyframes titlePulse {
            0%,100%{ text-shadow: 0 0 10px var(--neon-cyan), 0 0 30px var(--neon-cyan); }
            50%{ text-shadow: 0 0 20px var(--neon-pink), 0 0 50px var(--neon-pink); }
        }
        .subtitle { font-size: clamp(4px, 1.5vw, 6px); color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); margin-top: 5px; }
        .user-area {
            display: flex; align-items: center; gap: clamp(8px, 2vw, 15px);
        }
        #userDisplay { font-size: clamp(4px, 1.5vw, 6px); color: var(--neon-green); text-shadow: 0 0 6px var(--neon-green); }
        .auth-link {
            font-size: clamp(4px, 1.5vw, 6px); color: var(--neon-pink); text-decoration: none;
            border: 1px solid var(--neon-pink); padding: 4px 8px; border-radius: 4px;
            transition: 0.2s;
        }
        .auth-link:hover { background: rgba(255,0,255,0.1); box-shadow: 0 0 10px var(--neon-pink); }

        /* Nube de admin */
        #admin-cloud {
            display: none; position: fixed; bottom: 20px; right: 20px; z-index: 500;
            cursor: pointer; background: var(--neon-pink); color: white;
            font-size: 28px; width: 50px; height: 50px; border-radius: 50%;
            text-align: center; line-height: 50px; box-shadow: 0 0 20px var(--neon-pink);
            transition: 0.2s;
        }
        #admin-cloud:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--neon-pink); }
        #admin-panel {
            display: none; position: fixed; bottom: 80px; right: 20px; z-index: 500;
            background: var(--card-bg); border: 2px solid var(--neon-pink);
            border-radius: 12px; padding: 15px; box-shadow: 0 0 25px rgba(255,0,255,0.4);
            flex-direction: column; gap: 10px; min-width: 220px;
        }
        #admin-panel a, #admin-panel button {
            font-family: 'Press Start 2P', cursive; font-size: 7px; padding: 8px 12px;
            border-radius: 8px; text-decoration: none; color: white; background: var(--neon-pink);
            text-align: center; box-shadow: 0 4px 0 #c02660; border: none; cursor: pointer;
            transition: 0.1s;
        }
        #admin-panel a:active, #admin-panel button:active { transform: translateY(2px); box-shadow: 0 1px 0 #c02660; }
        #admin-panel .btn-gold { background: var(--gold); color: black; box-shadow: 0 4px 0 #b8860b; }

        /* NUEVO SISTEMA DE ANUNCIOS: BURBUJAS FLOTANTES */
        .promo-bubble-container {
            max-width: 900px; margin: 20px auto; padding: 0 10px;
            position: relative; min-height: 180px;
        }
        .promo-bubble {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 500px;
            background: radial-gradient(circle at 30% 30%, rgba(255,0,255,0.2), var(--card-bg));
            border: 3px solid var(--neon-pink);
            border-radius: 50%;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255,0,255,0.5), inset 0 0 20px rgba(255,0,255,0.1);
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            opacity: 0;
            transform: translateX(-50%) scale(0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: floatBubble 3s ease-in-out infinite;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        .promo-bubble.active {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            z-index: 2;
        }
        .promo-bubble.inactive {
            opacity: 0;
            transform: translateX(-50%) scale(0.7);
            z-index: 1;
            pointer-events: none;
        }
        @keyframes floatBubble {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }
        .promo-bubble img {
            width: 60px; height: 60px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--gold); box-shadow: 0 0 15px var(--gold);
        }
        .promo-bubble h3 {
            font-size: clamp(10px, 3vw, 14px); color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
        }
        .promo-bubble p {
            font-size: clamp(6px, 2vw, 8px); color: #ddd;
        }
        .promo-bubble .timer-badge {
            position: absolute; top: 15px; right: 25px;
            background: rgba(0,0,0,0.8); color: var(--neon-green);
            font-size: clamp(5px, 1.5vw, 7px); padding: 4px 10px;
            border-radius: 20px; text-shadow: 0 0 6px var(--neon-green);
        }
        /* Puntos de navegación */
        .promo-dots {
            display: flex; justify-content: center; gap: 8px; margin-top: 15px;
        }
        .promo-dot {
            width: 10px; height: 10px; border-radius: 50%; background: #555;
            cursor: pointer; transition: 0.3s;
        }
        .promo-dot.active { background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }

        .hero {
            text-align: center; padding: clamp(20px, 4vw, 30px) 10px;
            background: rgba(0,0,0,0.3); border-bottom: 1px solid #1a1a2e;
        }
        .hero h2 {
            font-size: clamp(8px, 2.5vw, 14px); color: var(--neon-yellow);
            text-shadow: 0 0 12px var(--neon-yellow); margin-bottom: 10px;
        }
        .hero p {
            font-size: clamp(4px, 1.2vw, 6px); color: #aaa; max-width: 600px;
            margin: 0 auto; line-height: 1.8;
        }

        .filters {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
            padding: 10px; max-width: 800px; margin: 0 auto;
        }
        .filter-btn {
            font-family: 'Press Start 2P', cursive; font-size: clamp(4px, 1vw, 6px);
            padding: 6px 12px; background: #111; border: 1px solid #333; color: #888;
            border-radius: 20px; cursor: pointer; transition: 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            border-color: var(--neon-cyan); color: var(--neon-cyan);
            background: rgba(0,255,255,0.1); text-shadow: 0 0 6px var(--neon-cyan);
        }

        .container {
            max-width: 900px; margin: 20px auto; padding: 10px;
            display: grid;
            grid-template-columns: repeat(var(--grid-cols), minmax(var(--card-min-width), 1fr));
            gap: clamp(8px, 2vw, 15px);
        }
        .project-card {
            background: var(--card-bg); border: 2px solid #1a1a2e; border-radius: 12px;
            padding: clamp(10px, 2vw, 15px) clamp(6px, 1.5vw, 10px);
            text-align: center; cursor: pointer; transition: all 0.3s;
            text-decoration: none; display: flex; flex-direction: column; align-items: center;
            gap: clamp(6px, 1.5vw, 10px); opacity: 0; animation: fadeIn 0.6s ease-out forwards;
        }
        .project-card:nth-child(1) { animation-delay: 0.1s; }
        .project-card:nth-child(2) { animation-delay: 0.2s; }
        .project-card:nth-child(3) { animation-delay: 0.3s; }
        .project-card:nth-child(4) { animation-delay: 0.4s; }
        .project-card:nth-child(5) { animation-delay: 0.5s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .project-card:hover {
            border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,255,255,0.3);
            transform: translateY(-5px);
        }
        .project-icon {
            width: clamp(50px, 12vw, 70px); height: clamp(50px, 12vw, 70px);
            background: #0a0a1a; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #333; transition: 0.3s; overflow: hidden;
        }
        .project-card:hover .project-icon {
            border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255,0,255,0.5);
        }
        .project-icon img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 12px;
        }
        .project-icon span { font-size: clamp(24px, 6vw, 36px); }
        .project-name { font-size: clamp(4px, 1.5vw, 6px); color: white; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .project-desc { font-size: clamp(3px, 1vw, 4px); color: #aaa; line-height: 1.4; }

        .sponsors-section {
            max-width: 900px; margin: 20px auto; padding: 10px;
        }
        .sponsors-label {
            font-size: clamp(4px, 1.5vw, 6px); color: #888; text-align: center;
            margin-bottom: 15px; letter-spacing: 2px;
        }
        .sponsors-grid {
            display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(10px, 2vw, 20px);
        }
        .sponsor-card {
            background: var(--card-bg); border: 2px solid #1a1a2e; border-radius: 12px;
            padding: clamp(8px, 1.5vw, 12px); text-align: center;
            width: clamp(100px, 20vw, 140px);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .sponsor-icon {
            width: clamp(40px, 8vw, 60px); height: clamp(40px, 8vw, 60px);
            border-radius: 12px; background: #0a0a1a;
            border: 2px solid #333; display: flex; align-items: center; justify-content: center;
            font-size: clamp(20px, 5vw, 28px); overflow: hidden;
        }
        .sponsor-icon img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 12px;
        }
        .sponsor-name { font-size: clamp(3px, 1.2vw, 5px); color: white; }
        .sponsor-phone {
            font-size: clamp(3px, 1.2vw, 5px); color: var(--gold); text-decoration: none;
            font-family: 'Orbitron', monospace;
        }

        footer {
            text-align: center; padding: 15px; color: #444;
            font-size: clamp(3px, 1vw, 5px);
            border-top: 1px solid #1a1a2e; margin-top: 20px;
        }

        @media (max-width: 480px) {
            :root { --grid-cols: 2; --card-min-width: 120px; }
            .header-content { flex-direction: column; align-items: flex-start; }
            .user-area { width: 100%; justify-content: space-between; }
        }
        @media (min-width: 481px) and (max-width: 768px) {
            :root { --grid-cols: 3; --card-min-width: 140px; }
        }
        @media (min-width: 769px) {
            :root { --grid-cols: 4; --card-min-width: 150px; }
        }
        @media (min-width: 1200px) {
            :root { --grid-cols: 5; --card-min-width: 160px; }
            .container { max-width: 1100px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-area">
                <h1>TECNOMATH</h1>
                <div class="subtitle">PORTAL DE PROYECTOS</div>
            </div>
            <div class="user-area">
                <span id="userDisplay">Invitado</span>
                <a href="auth.html" class="auth-link" id="authLink">🔑 ACCEDER</a>
            </div>
        </div>
    </header>

    <div id="admin-cloud" onclick="toggleAdminPanel()">☁️</div>
    <div id="admin-panel">
        <a href="admin-promos.html" target="_blank">📢 GESTIONAR PROMOS</a>
        <a href="gestor-movil.html" target="_blank" class="btn-gold">➕ AGREGAR JUEGO</a>
        <button onclick="exitAdminMode()" style="background:#c0392b;">🚪 SALIR ADMIN</button>
    </div>

    <!-- NUEVOS ANUNCIOS ESTILO BURBUJA -->
    <div class="promo-bubble-container" id="promoBubbleContainer">
        <div class="promo-bubble inactive" id="promoBubble1"></div>
        <div class="promo-bubble inactive" id="promoBubble2"></div>
        <div class="promo-dots" id="promoDots"></div>
    </div>

    <div class="hero">
        <h2>🎮 EXPLORA Y JUEGA</h2>
        <p>Descubre minijuegos educativos sobre los ODS. Matemáticas, ciencias, ecología y mucho más. ¡Gana monedas y desbloquea logros!</p>
    </div>

    <div class="filters" id="filtersContainer"></div>

    <div class="sponsors-section">
        <div class="sponsors-label">— PATROCINADORES —</div>
        <div class="sponsors-grid" id="sponsorsArea"></div>
    </div>

    <div class="container" id="projectsContainer"></div>

    <footer>© 2026 Tecnomath · Powered by GitHub Pages</footer>

    <script src="shared.js"></script>
    <script>
        // ═══════════════════════════════════════
        // REGISTRO DEL SERVICE WORKER (PWA)
        // ═══════════════════════════════════════
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }

        // ═══════════════════════════════════════
        // DETECCIÓN DE DISPOSITIVO
        // ═══════════════════════════════════════
        function detectDevice() {
            const ua = navigator.userAgent;
            const width = window.innerWidth;
            const height = window.innerHeight;
            let deviceType = 'desktop';
            let orientation = (width > height) ? 'landscape' : 'portrait';
            if (/Mobi|Android|iPhone|iPad|iPod|webOS/i.test(ua)) {
                deviceType = (/iPad|Tablet|PlayBook/i.test(ua) || (width >= 768 && /Mobile/i.test(ua))) ? 'tablet' : 'mobile';
            } else if (width < 768) {
                deviceType = 'small-desktop';
            } else if (width >= 1200) {
                deviceType = 'large-desktop';
            }
            const root = document.documentElement;
            switch (deviceType) {
                case 'mobile':
                    root.style.setProperty('--grid-cols', orientation === 'landscape' ? 3 : 2);
                    root.style.setProperty('--card-min-width', '110px');
                    break;
                case 'tablet':
                    root.style.setProperty('--grid-cols', orientation === 'landscape' ? 4 : 3);
                    root.style.setProperty('--card-min-width', '140px');
                    break;
                case 'small-desktop':
                    root.style.setProperty('--grid-cols', 3);
                    root.style.setProperty('--card-min-width', '150px');
                    break;
                case 'large-desktop':
                    root.style.setProperty('--grid-cols', 5);
                    root.style.setProperty('--card-min-width', '160px');
                    break;
                default:
                    root.style.setProperty('--grid-cols', 4);
                    root.style.setProperty('--card-min-width', '150px');
            }
            return { deviceType, orientation, width };
        }
        const deviceInfo = detectDevice();
        window.addEventListener('resize', () => {
            detectDevice();
            renderSponsors();
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(detectDevice, 300);
        });

        // ═══════════════════════════════════════
        // PATROCINADORES
        // ═══════════════════════════════════════
        const allSponsorsPortal = [
            { name: "HappyBander",     phone: "+573001112233", image: "👨‍💼", imageUrl: "img/happybander.jpg" },
            { name: "Gomix",           phone: "+573002223344", image: "👩‍🔬", imageUrl: "img/gomix.png" },
            { name: "Carlos Ruiz",     phone: "+573003334455", image: "👨‍🏫", imageUrl: "" },
            { name: "Laura Díaz",      phone: "+573004445566", image: "👩‍💻", imageUrl: "" },
            { name: "EcoWorld",        phone: "+573006667788", image: "🌱", imageUrl: "" },
            { name: "NeuroLab",        phone: "+573007778899", image: "🧠", imageUrl: "" },
            { name: "Oceanix",         phone: "+573008889900", image: "🌊", imageUrl: "" },
            { name: "GreenTech",       phone: "+573009990011", image: "🌿", imageUrl: "" }
        ];
        function renderSponsors() {
            const selected = [...allSponsorsPortal].sort(() => Math.random() - 0.5).slice(0, 4);
            const area = document.getElementById('sponsorsArea');
            if (!area) return;
            area.innerHTML = '';
            selected.forEach(sponsor => {
                const card = document.createElement('div');
                card.className = 'sponsor-card';
                const icon = document.createElement('div');
                icon.className = 'sponsor-icon';
                if (sponsor.imageUrl && sponsor.imageUrl.trim() !== '') {
                    const img = document.createElement('img');
                    img.src = sponsor.imageUrl;
                    img.alt = sponsor.name;
                    img.onerror = function() { this.remove(); icon.textContent = sponsor.image || '🖼️'; };
                    icon.appendChild(img);
                } else {
                    icon.textContent = sponsor.image || '🖼️';
                }
                const name = document.createElement('div');
                name.className = 'sponsor-name';
                name.textContent = sponsor.name;
                const phone = document.createElement('a');
                phone.className = 'sponsor-phone';
                phone.href = 'tel:' + sponsor.phone;
                phone.textContent = sponsor.phone;
                card.appendChild(icon); card.appendChild(name); card.appendChild(phone);
                area.appendChild(card);
            });
        }
        renderSponsors();

        // ═══════════════════════════════════════
        // NUEVO SISTEMA DE ANUNCIOS: BURBUJAS FLOTANTES
        // ═══════════════════════════════════════
        let promosActivas = [];
        let burbujaActual = 0;
        let intervaloBurbujas = null;
        const burbuja1 = document.getElementById('promoBubble1');
        const burbuja2 = document.getElementById('promoBubble2');
        const dotsContainer = document.getElementById('promoDots');
        const container = document.getElementById('promoBubbleContainer');

        async function cargarPromociones() {
            try {
                const response = await fetch('promociones.json');
                if (!response.ok) throw new Error('No se pudo cargar');
                const data = await response.json();
                const ahora = new Date();
                promosActivas = data.filter(p => {
                    if (!p.activo) return false;
                    const inicio = new Date(p.fechaInicio);
                    const fin = new Date(p.fechaFin);
                    return ahora >= inicio && ahora <= fin;
                });
                if (promosActivas.length > 0) {
                    container.style.display = 'block';
                    crearDots();
                    mostrarBurbuja(0);
                    iniciarRotacion();
                } else {
                    container.style.display = 'none';
                }
            } catch (e) {
                console.warn('Promociones no disponibles:', e);
                container.style.display = 'none';
            }
        }

        function crearDots() {
            dotsContainer.innerHTML = '';
            promosActivas.forEach((_, i) => {
                const dot = document.createElement('span');
                dot.className = 'promo-dot' + (i === 0 ? ' active' : '');
                dot.onclick = () => cambiarBurbuja(i);
                dotsContainer.appendChild(dot);
            });
        }

        function cambiarBurbuja(index) {
            if (index === burbujaActual || promosActivas.length === 0) return;
            // Ocultar burbuja activa y mostrar la nueva con transición
            const oldBubble = burbujaActual % 2 === 0 ? burbuja1 : burbuja2;
            const newBubble = index % 2 === 0 ? burbuja1 : burbuja2;
            oldBubble.classList.remove('active');
            oldBubble.classList.add('inactive');
            burbujaActual = index;
            llenarBurbuja(newBubble, promosActivas[index]);
            newBubble.classList.remove('inactive');
            newBubble.classList.add('active');
            actualizarDots();
            reiniciarRotacion();
        }

        function mostrarBurbuja(index) {
            const bubble = index % 2 === 0 ? burbuja1 : burbuja2;
            llenarBurbuja(bubble, promosActivas[index]);
            bubble.classList.remove('inactive');
            bubble.classList.add('active');
            burbujaActual = index;
            actualizarDots();
        }

        function llenarBurbuja(bubble, promo) {
            bubble.innerHTML = `
                <a href="${promo.url}" target="_blank" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; align-items:center; gap:8px;">
                    <img src="${promo.imagen || 'img/default-promo.png'}" alt="${promo.nombre}">
                    <h3>${promo.nombre}</h3>
                    <p>${promo.descripcion}</p>
                </a>
                <span class="timer-badge">${calcularDiasRestantes(promo.fechaFin)} días</span>
            `;
        }

        function calcularDiasRestantes(fechaFin) {
            const fin = new Date(fechaFin);
            const ahora = new Date();
            return Math.ceil((fin - ahora) / (1000 * 60 * 60 * 24));
        }

        function actualizarDots() {
            const dots = dotsContainer.children;
            for (let i = 0; i < dots.length; i++) {
                dots[i].classList.toggle('active', i === burbujaActual);
            }
        }

        function iniciarRotacion() {
            if (promosActivas.length <= 1) return;
            intervaloBurbujas = setInterval(() => {
                let next = (burbujaActual + 1) % promosActivas.length;
                cambiarBurbuja(next);
            }, 6000);
        }

        function reiniciarRotacion() {
            if (intervaloBurbujas) clearInterval(intervaloBurbujas);
            iniciarRotacion();

                renderProjects(cat === 'todos' ? null : cat);
            });

        function renderProjects(filterCategory = null) {
            const container = document.getElementById('projectsContainer');
            container.innerHTML = '';
            const filtered = filterCategory ? projects.filter(p => p.category === filterCategory) : projects;
            filtered.forEach(proj => {
                const card = document.createElement('a');
                card.className = 'project-card';
                card.href = proj.url;
                card.target = (proj.url.endsWith('.html') && !proj.url.startsWith('http')) ? '_self' : '_blank';
                card.rel = "noopener";
                const iconDiv = document.createElement('div');
                iconDiv.className = 'project-icon';
                if (proj.imageUrl && proj.imageUrl.trim() !== '') {
                    const img = document.createElement('img');
                    img.src = proj.imageUrl;
                    img.alt = proj.name;
                    img.onerror = function() { this.remove(); const span = document.createElement('span'); span.textContent = proj.icon || '🕹️'; iconDiv.appendChild(span); };
                    iconDiv.appendChild(img);
                } else {
                    const span = document.createElement('span');
                    span.textContent = proj.icon || '🕹️';
                    iconDiv.appendChild(span);
                }
                const nameDiv = document.createElement('div');
                nameDiv.className = 'project-name';
                nameDiv.textContent = proj.name;
                const descDiv = document.createElement('div');
                descDiv.className = 'project-desc';
                descDiv.textContent = proj.desc;
                card.appendChild(iconDiv); card.appendChild(nameDiv); card.appendChild(descDiv);
                container.appendChild(card);
            });
        }
        renderProjects();

        function toggleAdminPanel() {
            const panel = document.getElementById('admin-panel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        }
        function exitAdminMode() {
            const user = Tecnomath.getCurrentUser();
            if (user && Tecnomath.isAdmin()) {
                Tecnomath.unsetAdmin(user.username);
                alert('Has salido del modo administrador. La página se recargará.');
                location.reload();
            }
        }
        (function updateUserBar() {
            const userDisplay = document.getElementById('userDisplay');
            const authLink = document.getElementById('authLink');
            const adminCloud = document.getElementById('admin-cloud');
            if (!userDisplay) return;
            const user = Tecnomath.getCurrentUser();
            if (user) {
                const coins = Tecnomath.getCoins();
                userDisplay.textContent = `${user.username} · 💰 ${coins}`;
                if (Tecnomath.isAdmin()) {
                    if (adminCloud) adminCloud.style.display = 'block';
                    if (authLink) authLink.style.display = 'none';
                } else {
                    if (adminCloud) adminCloud.style.display = 'none';
                    if (authLink) authLink.style.display = 'inline-block';
                }
            } else {
                userDisplay.textContent = 'Invitado';
                if (adminCloud) adminCloud.style.display = 'none';
                if (authLink) authLink.style.display = 'inline-block';
            }
        })();

        // ACCESO OCULTO: DOBLE CLIC EN ESQUINA INFERIOR DERECHA
        const ADMINS_PORTAL = { "1983": "Junior", "2024": "Nicole", "7777": "Mateo", "8888": "Jaider", "ods2026": "ODS Master" };
        const secretZone = document.createElement('div');
        secretZone.style.cssText = 'position:fixed; bottom:0; right:0; width:70px; height:70px; z-index:499;';
        secretZone.addEventListener('dblclick', function(e) {
            e.preventDefault();
            const user = Tecnomath.getCurrentUser();
            if (!user) { alert('Debes iniciar sesión primero (usa el botón 🔑 ACCEDER).'); return; }
            const code = prompt('🔐 CÓDIGO ADMIN:');
            if (ADMINS_PORTAL[code]) {
                Tecnomath.setAdmin(user.username);
                alert('⚡ ' + ADMINS_PORTAL[code].toUpperCase() + ' · ADMIN ACTIVADO');
                location.reload();
            } else if (code) { alert('🔒 ACCESO DENEGADO'); }
        });
