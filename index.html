    <style>
        :root { --neon-cyan:#00FFFF;--neon-pink:#FF00FF;--neon-green:#39FF14;--neon-yellow:#FFE600;--gold:#FFD700;--retro-bg:#060610;--card-bg:#0d0d1a;--grid-cols:2;--card-min-width:140px;--theme-bg:var(--retro-bg);--theme-card:var(--card-bg);--theme-border:#1a1a2e;--theme-text:white }
        *{margin:0;padding:0;box-sizing:border-box}html,body{min-height:100%;overflow-y:auto;background:var(--theme-bg);font-family:'Press Start 2P',cursive;color:var(--theme-text);transition:background .6s,color .6s;background-image:radial-gradient(ellipse at 20% 50%,rgba(0,68,255,.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(255,0,255,.07) 0%,transparent 50%)}body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 4px)}header{padding:clamp(10px,2vw,15px);border-bottom:2px solid var(--neon-pink);background:linear-gradient(90deg,rgba(255,0,255,.09),rgba(8,8,24,.86),rgba(0,255,255,.09));position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.18)}.header-content{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:clamp(6px,1vw,10px)}.logo-area{text-align:left;min-width:0}h1{font-size:clamp(12px,4vw,22px);color:var(--neon-cyan);text-shadow:0 0 10px var(--neon-cyan),0 0 30px var(--neon-cyan);letter-spacing:2px;margin:0}.subtitle{font-size:clamp(4px,1.5vw,6px);color:var(--neon-pink);margin-top:5px}.user-area{display:flex;align-items:center;gap:clamp(7px,1.4vw,12px);flex-wrap:wrap;justify-content:flex-end}#userDisplay{font-size:clamp(4px,1.5vw,6px);color:var(--neon-green);line-height:1.6}.auth-link{font-size:clamp(4px,1.5vw,6px);color:var(--neon-pink);text-decoration:none;border:1px solid var(--neon-pink);padding:6px 9px;border-radius:6px}.auth-link:hover{background:rgba(255,0,255,.12)}
        #projectsContainer{display:grid;grid-template-columns:repeat(var(--grid-cols),minmax(0,1fr));gap:14px;padding:18px}.project-card{display:block;text-decoration:none;color:inherit;background:var(--theme-card);border:1px solid var(--theme-border);border-radius:14px;padding:14px;min-width:0}.project-card:hover{border-color:var(--neon-cyan);transform:translateY(-2px)}.project-icon{height:80px;display:flex;align-items:center;justify-content:center;font-size:45px}.project-icon img{max-width:100%;max-height:80px;border-radius:10px}.project-name{color:var(--neon-cyan);font-size:11px;line-height:1.5;margin-top:7px}.project-desc{color:#aaa;font-size:8px;line-height:1.7;margin-top:6px}.event-badge{margin-left:6px}.filter-btn{border:1px solid #33334d;background:#101022;color:#fff;border-radius:8px;padding:8px;margin:4px;cursor:pointer;font:inherit;font-size:7px}.filter-btn.active{border-color:var(--neon-cyan);color:var(--neon-cyan)}#filtersContainer{padding:10px 14px}.fair-promo-highlight{border-color:#FFD700!important;box-shadow:0 0 40px rgba(255,215,0,.8)!important}

<body>
<header><div class="header-content"><div class="logo-area"><h1 id="mainTitle">TECNOMATH</h1><div class="subtitle">PLATAFORMA DE JUEGOS EDUCATIVOS</div></div><div class="user-area"><span id="userDisplay">Invitado</span><a id="authLink" class="auth-link" href="pages/auth.html">🔑 ACCEDER</a><button id="logoutBtn" class="auth-link" style="display:none;background:none;cursor:pointer">SALIR</button></div></div></header>
<main><div id="filtersContainer"></div><div id="projectsContainer"></div></main>
<script>
const juegosRecomendados=[
{name:'MindMath Arcade',desc:'Matemáticas retro',url:'pages/game.html',imageUrl:'img/mindmath.png',icon:'🧮',category:'mates',deviceCompatibility:'both',evento:null},
{name:'Eco Collector',desc:'Recicla y aprende',url:'pages/eco-collector.html',imageUrl:'',icon:'♻️',category:'eco',deviceCompatibility:'both',evento:null},
{name:'Animalandia',desc:'Aprende sobre animales',url:'pages/animalandia.html',imageUrl:'',icon:'🐾',category:'kids',deviceCompatibility:'both',evento:null},
{name:'Bit Rush',desc:'Runner de conversión numérica',url:'games/jinete11°/index.html',imageUrl:'',icon:'🤖',category:'mates',deviceCompatibility:'both',evento:null}
];
let projects=[...juegosRecomendados],currentActiveFilter='todos',activeEvent=null;
function normalizarJuego(g){if(!g||typeof g!=='object')return null;const name=typeof g.name==='string'?g.name.trim():'';const url=typeof g.url==='string'?g.url.trim():'';if(!name||!url)return null;return{name,desc:typeof g.desc==='string'&&g.desc.trim()?g.desc:'Juego educativo de Tecnomath',url,imageUrl:typeof g.imageUrl==='string'?g.imageUrl:'',icon:typeof g.icon==='string'&&g.icon?g.icon:'🎮',category:typeof g.category==='string'&&g.category?g.category:'otros',deviceCompatibility:'both',evento:typeof g.evento==='string'&&g.evento.trim()?g.evento.trim().toLowerCase():null,submissionId:g.submissionId||null}}
function combinarJuegos(base,extra){const out=[],seen=new Set();[...base,...extra].forEach(r=>{const g=normalizarJuego(r);if(!g)return;const k=(g.name+'|'+g.url).toLowerCase();if(seen.has(k))return;seen.add(k);out.push(g)});return out}
function getFilteredProjects(){return activeEvent?projects.filter(p=>!p.evento||p.evento===activeEvent):projects.filter(p=>!p.evento)}
function actualizarFiltros(){const box=document.getElementById('filtersContainer');if(!box)return;const cats=['todos',...new Set(projects.map(p=>p.category))];box.innerHTML='';cats.forEach(cat=>{const b=document.createElement('button');b.className='filter-btn'+(cat==='todos'?' active':'');b.textContent=cat==='todos'?'🌍 TODOS':cat.toUpperCase();b.onclick=()=>{currentActiveFilter=cat;box.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderProjects(cat)};box.appendChild(b)})}
function renderProjects(filter='todos'){const c=document.getElementById('projectsContainer');if(!c)return;const list=getFilteredProjects().filter(p=>filter==='todos'||p.category===filter);c.innerHTML='';if(!list.length){c.innerHTML='<p style="padding:20px;color:#aaa">No hay juegos disponibles.</p>';return}list.forEach(p=>{const card=document.createElement('a');card.className='project-card';card.href=p.url;card.target=/^(https?:|mailto:|tel:)/i.test(p.url)?'_blank':'_self';if(card.target==='_blank')card.rel='noopener noreferrer';const icon=document.createElement('div');icon.className='project-icon';if(p.imageUrl){const im=document.createElement('img');im.src=p.imageUrl;im.alt=p.name;im.onerror=()=>{im.remove();icon.textContent=p.icon||'🎮'};icon.appendChild(im)}else icon.textContent=p.icon||'🎮';const name=document.createElement('div');name.className='project-name';name.textContent=p.name;const desc=document.createElement('div');desc.className='project-desc';desc.textContent=p.desc;card.append(icon,name,desc);c.appendChild(card)})}
async function cargarJuegos(){projects=combinarJuegos(juegosRecomendados,[]);renderProjects('todos');actualizarFiltros();try{const r=await fetch('./juegos.json',{cache:'no-store'});if(r.ok){const d=await r.json();if(Array.isArray(d)){projects=combinarJuegos(juegosRecomendados,d);renderProjects(currentActiveFilter);actualizarFiltros()}}}catch(e){console.warn('juegos.json opcional:',e.message)}}
function updateUserBar(){const u=firebase.auth().currentUser;const d=document.getElementById('userDisplay'),a=document.getElementById('authLink'),l=document.getElementById('logoutBtn');if(u){d.textContent=u.displayName||u.email||'Usuario';a.href='pages/profile.html';a.textContent='👤 PERFIL';l.style.display='inline-block'}else{d.textContent='Invitado';a.href='pages/auth.html';a.textContent='🔑 ACCEDER';l.style.display='none'}}
firebase.auth().onAuthStateChanged(updateUserBar);document.getElementById('logoutBtn').onclick=()=>firebase.auth().signOut();
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',cargarJuegos,{once:true});else cargarJuegos();
</script>

<script src="/js/published-games.js?v=3"></script>
</body>
