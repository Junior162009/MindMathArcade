<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tecnomath · Portal de Proyectos</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00FFFF; --neon-pink: #FF00FF; --neon-green: #39FF14;
            --neon-yellow: #FFE600; --gold: #FFD700; --retro-bg: #060610; --card-bg: #0d0d1a;
            --grid-cols: 2;
            --card-min-width: 140px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%; overflow-y: auto; background: var(--retro-bg);
            font-family: 'Press Start 2P', cursive; color: white;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(0,68,255,0.07) 0%, transparent 50%),
                            radial-gradient(ellipse at 80% 20%, rgba(255,0,255,0.07) 0%, transparent 50%);
        }
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px);
        }
        header {
            padding: clamp(10px, 2vw, 15px); border-bottom: 2px solid var(--neon-pink);
            background: linear-gradient(90deg, rgba(255,0,255,0.05), transparent, rgba(0,255,255,0.05));
            position: relative;
        }
        .header-content {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: clamp(6px, 1vw, 10px);
        }
        .logo-area { text-align: left; }
        h1 {
            font-size: clamp(12px, 4vw, 22px); color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 30px var(--neon-cyan);
            letter-spacing: 2px; animation: titlePulse 2s ease-in-out infinite; margin: 0;
        }
        @keyframes titlePulse {
            0%,100%{ text-shadow: 0 0 10px var(--neon-cyan), 0 0 30px var(--neon-cyan); }
            50%{ text-shadow: 0 0 20px var(--neon-pink), 0 0 50px var(--neon-pink); }
        }
        .subtitle { font-size: clamp(4px, 1.5vw, 6px); color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); margin-top: 5px; }
        .user-area {
            display: flex; align-items: center; gap: clamp(8px, 2vw, 15px);
        }
        #userDisplay { font-size: clamp(4px, 1.5vw, 6px); color: var(--neon-green); text-shadow: 0 0 6px var(--neon-green); }
        .auth-link {
            font-size: clamp(4px, 1.5vw, 6px); color: var(--neon-pink); text-decoration: none;
            border: 1px solid var(--neon-pink); padding: 4px 8px; border-radius: 4px;
            transition: 0.2s;
        }
        .auth-link:hover { background: rgba(255,0,255,0.1); box-shadow: 0 0 10px var(--neon-pink); }

        .container {
            max-width: 900px; margin: 20px auto; padding: 10px;
            display: grid;
            grid-template-columns: repeat(var(--grid-cols), minmax(var(--card-min-width), 1fr));
            gap: clamp(8px, 2vw, 15px);
        }
        .project-card {
            background: var(--card-bg); border: 2px solid #1a1a2e; border-radius: 12px;
            padding: clamp(10px, 2vw, 15px) clamp(6px, 1.5vw, 10px);
            text-align: center; cursor: pointer; transition: all 0.3s;
            text-decoration: none; display: flex; flex-direction: column; align-items: center;
            gap: clamp(6px, 1.5vw, 10px); opacity: 0; animation: fadeIn 0.6s ease-out forwards;
        }
        .project-card:nth-child(1) { animation-delay: 0.1s; }
        .project-card:nth-child(2) { animation-delay: 0.2s; }
        .project-card:nth-child(3) { animation-delay: 0.3s; }
        .project-card:nth-child(4) { animation-delay: 0.4s; }
        .project-card:nth-child(5) { animation-delay: 0.5s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .project-card:hover {
            border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,255,255,0.3);
            transform: translateY(-5px);
        }
        .project-icon {
            width: clamp(50px, 12vw, 70px); height: clamp(50px, 12vw, 70px);
            background: #0a0a1a; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #333; transition: 0.3s; overflow: hidden;
        }
        .project-card:hover .project-icon {
            border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255,0,255,0.5);
        }
        .project-icon img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 12px;
        }
        .project-icon span { font-size: clamp(24px, 6vw, 36px); }
        .project-name { font-size: clamp(4px, 1.5vw, 6px); color: white; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .project-desc { font-size: clamp(3px, 1vw, 4px); color: #aaa; line-height: 1.4; }

        /* Patrocinadores */
        .sponsors-section {
            max-width: 900px; margin: 20px auto; padding: 10px;
        }
        .sponsors-label {
            font-size: clamp(4px, 1.5vw, 6px); color: #888; text-align: center;
            margin-bottom: 15px; letter-spacing: 2px;
        }
        .sponsors-grid {
            display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(10px, 2vw, 20px);
        }
        .sponsor-card {
            background: var(--card-bg); border: 2px solid #1a1a2e; border-radius: 12px;
            padding: clamp(8px, 1.5vw, 12px); text-align: center;
            width: clamp(100px, 20vw, 140px);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .sponsor-icon {
            width: clamp(40px, 8vw, 60px); height: clamp(40px, 8vw, 60px);
            border-radius: 12px; background: #0a0a1a;
            border: 2px solid #333; display: flex; align-items: center; justify-content: center;
            font-size: clamp(20px, 5vw, 28px); overflow: hidden;
        }
        .sponsor-icon img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 12px;
        }
        .sponsor-name {
            font-size: clamp(3px, 1.2vw, 5px); color: white;
        }
        .sponsor-phone {
            font-size: clamp(3px, 1.2vw, 5px); color: var(--gold); text-decoration: none;
            font-family: 'Orbitron', monospace;
        }

        /* Indicador de dispositivo */
        .device-indicator {
            position: fixed; bottom: 10px; left: 10px;
            font-size: 8px; color: #444; z-index: 10000;
            background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px;
            display: none;
        }
        .device-indicator.show { display: block; }

        footer {
            text-align: center; padding: 15px; color: #444;
            font-size: clamp(3px, 1vw, 5px);
            border-top: 1px solid #1a1a2e; margin-top: 20px;
        }

        /* Media queries para ajustar columnas según dispositivo */
        @media (max-width: 480px) {
            :root {
                --grid-cols: 2;
                --card-min-width: 120px;
            }
            .header-content { flex-direction: column; align-items: flex-start; }
            .user-area { width: 100%; justify-content: space-between; }
        }
        @media (min-width: 481px) and (max-width: 768px) {
            :root {
                --grid-cols: 3;
                --card-min-width: 140px;
            }
        }
        @media (min-width: 769px) {
            :root {
                --grid-cols: 4;
                --card-min-width: 150px;
            }
        }
        @media (min-width: 1200px) {
            :root {
                --grid-cols: 5;
                --card-min-width: 160px;
            }
            .container { max-width: 1100px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-area">
                <h1>TECNOMATH</h1>
                <div class="subtitle">PORTAL DE PROYECTOS</div>
            </div>
            <div class="user-area">
                <span id="userDisplay">Invitado</span>
                <a href="auth.html" class="auth-link">🔑 ACCEDER</a>
            </div>
        </div>
    </header>

    <div class="sponsors-section">
        <div class="sponsors-label">— PATROCINADORES —</div>
        <div class="sponsors-grid" id="sponsorsArea"></div>
    </div>

    <div class="container" id="projectsContainer"></div>

    <div class="device-indicator" id="deviceIndicator"></div>

    <footer>© 2026 Tecnomath · Powered by GitHub Pages</footer>

    <script src="shared.js"></script>

    <script>
        // ═══════════════════════════════════════
        // DETECCIÓN DE DISPOSITIVO
        // ═══════════════════════════════════════
        function detectDevice() {
            const ua = navigator.userAgent;
            const width = window.innerWidth;
            let deviceType = 'desktop';
            let orientation = 'landscape';

            if (width < window.innerHeight) orientation = 'portrait';

            if (/Mobi|Android|iPhone|iPad|iPod|webOS/i.test(ua)) {
                if (/iPad|Tablet|PlayBook/i.test(ua) || (width >= 768 && /Mobile/i.test(ua))) {
                    deviceType = 'tablet';
                } else {
                    deviceType = 'mobile';
                }
            } else if (width < 768) {
                deviceType = 'small-desktop';
            } else if (width >= 1200) {
                deviceType = 'large-desktop';
            }

            document.body.dataset.device = deviceType;
            document.body.dataset.orientation = orientation;

            // Ajustar variables CSS según dispositivo
            const root = document.documentElement;
            switch (deviceType) {
                case 'mobile':
                    root.style.setProperty('--grid-cols', orientation === 'landscape' ? 3 : 2);
                    root.style.setProperty('--card-min-width', '110px');
                    break;
                case 'tablet':
                    root.style.setProperty('--grid-cols', orientation === 'landscape' ? 4 : 3);
                    root.style.setProperty('--card-min-width', '140px');
                    break;
                case 'small-desktop':
                    root.style.setProperty('--grid-cols', 3);
                    root.style.setProperty('--card-min-width', '150px');
                    break;
                case 'large-desktop':
                    root.style.setProperty('--grid-cols', 5);
                    root.style.setProperty('--card-min-width', '160px');
                    break;
                default:
                    root.style.setProperty('--grid-cols', 4);
                    root.style.setProperty('--card-min-width', '150px');
            }

            // Mostrar indicador de dispositivo (solo en desarrollo)
            const indicator = document.getElementById('deviceIndicator');
            if (indicator) {
                indicator.textContent = `${deviceType} · ${orientation} · ${width}px`;
                indicator.classList.add('show');
            }

            return { deviceType, orientation, width };
        }

        const deviceInfo = detectDevice();
        window.addEventListener('resize', () => {
            detectDevice();
            // Re-renderizar patrocinadores con nuevo tamaño si es necesario
            renderSponsors();
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(detectDevice, 300);
        });

        // ═══════════════════════════════════════
        // PATROCINADORES ALEATORIOS CON IMÁGENES
        // ═══════════════════════════════════════
        const allSponsorsPortal = [
            { name: "HappyBander",     phone: "+573001112233", image: "👨‍💼", imageUrl: "img/happybander.jpg" },
            { name: "Gomix",           phone: "+573002223344", image: "👩‍🔬", imageUrl: "img/gomix.png" },
            { name: "Carlos Ruiz",     phone: "+573003334455", image: "👨‍🏫", imageUrl: "" },
            { name: "Laura Díaz",      phone: "+573004445566", image: "👩‍💻", imageUrl: "" },
            { name: "EcoWorld",        phone: "+573006667788", image: "🌱", imageUrl: "" },
            { name: "NeuroLab",        phone: "+573007778899", image: "🧠", imageUrl: "" },
            { name: "Oceanix",         phone: "+573008889900", image: "🌊", imageUrl: "" },
            { name: "GreenTech",       phone: "+573009990011", image: "🌿", imageUrl: "" }
        ];

        function renderSponsors() {
            const selected = [...allSponsorsPortal].sort(() => Math.random() - 0.5).slice(0, 4);
            const area = document.getElementById('sponsorsArea');
            if (!area) return;
            area.innerHTML = '';
            selected.forEach(sponsor => {
                const card = document.createElement('div');
                card.className = 'sponsor-card';

                const icon = document.createElement('div');
                icon.className = 'sponsor-icon';

                if (sponsor.imageUrl && sponsor.imageUrl.trim() !== '') {
                    const img = document.createElement('img');
                    img.src = sponsor.imageUrl;
                    img.alt = sponsor.name;
                    img.onerror = function() {
                        this.remove();
                        icon.textContent = sponsor.image || '🖼️';
                    };
                    icon.appendChild(img);
                } else {
                    icon.textContent = sponsor.image || '🖼️';
                }

                const name = document.createElement('div');
                name.className = 'sponsor-name';
                name.textContent = sponsor.name;

                const phone = document.createElement('a');
                phone.className = 'sponsor-phone';
                phone.href = 'tel:' + sponsor.phone;
                phone.textContent = sponsor.phone;

                card.appendChild(icon);
                card.appendChild(name);
                card.appendChild(phone);
                area.appendChild(card);
            });
        }

        renderSponsors();

        // ═══════════════════════════════════════
        // LISTA DE PROYECTOS
        // ═══════════════════════════════════════
        const projects = [
            {
                name: "MindMath Arcade",
                desc: "Juego de matemáticas retro con 60+ niveles",
                url: "game.html",
                imageUrl: "img/mindmath.png",
                icon: "🧮"
            },
            {
                name: "Eco Recolector",
                desc: "Atrapa agua y reciclables. ODS 6 y 12",
                url: "eco-collector.html",
                imageUrl: "img/ecorecolector.png",
                icon: "🌍"
            },
            {
                name: "Eco-Barrio 2030",
                desc: "Simulador de ciudad sostenible. ODS 11,12,13,7",
                url: "eco-barrio.html",
                imageUrl: "",
                icon: "🏙️"
            },
            {
                name: "Animalandia",
                desc: "Alimenta a los animales. Para niños pequeños",
                url: "animalandia.html",
                imageUrl: "",
                icon: "🐮"
            },
            {
                name: "ODS-2048",
                desc: "Fusiona los 17 ODS. Juego de puzzle adictivo",
                url: "ods-2048.html",
                imageUrl: "",
                icon: "🌐"
            },
            {
                name: "Coral Guardian",
                desc: "Protege el arrecife de basura y especies invasoras",
                url: "coral-guardian.html",
                imageUrl: "",
                icon: "🪸"
            },
            {
                name: "Orbit Cleaner",
                desc: "Limpia el espacio y protege la capa de ozono. ODS 13",
                url: "orbit-cleaner.html",
                imageUrl: "",
                icon: "🛰️"
            },
            {
                name: "Marine Tech Cleaner",
                desc: "USV y ROV para limpiar el océano. ODS 14",
                url: "marine-cleaner.html",
                imageUrl: "",
                icon: "🌊"
            }
        ];

        const container = document.getElementById('projectsContainer');

        projects.forEach(proj => {
            const card = document.createElement('a');
            card.className = 'project-card';
            card.href = proj.url;
            card.target = (proj.url.endsWith('.html') && !proj.url.startsWith('http')) ? '_self' : '_blank';
            card.rel = "noopener";

            const iconDiv = document.createElement('div');
            iconDiv.className = 'project-icon';

            if (proj.imageUrl && proj.imageUrl.trim() !== '') {
                const img = document.createElement('img');
                img.src = proj.imageUrl;
                img.alt = proj.name;
                img.onerror = function() {
                    this.remove();
                    const span = document.createElement('span');
                    span.textContent = proj.icon || '🕹️';
                    iconDiv.appendChild(span);
                };
                iconDiv.appendChild(img);
            } else {
                const span = document.createElement('span');
                span.textContent = proj.icon || '🕹️';
                iconDiv.appendChild(span);
            }

            const nameDiv = document.createElement('div');
            nameDiv.className = 'project-name';
            nameDiv.textContent = proj.name;

            const descDiv = document.createElement('div');
            descDiv.className = 'project-desc';
            descDiv.textContent = proj.desc;

            card.appendChild(iconDiv);
            card.appendChild(nameDiv);
            card.appendChild(descDiv);
            container.appendChild(card);
        });
    </script>

    <script>
        (function updateUserBar() {
            const userDisplay = document.getElementById('userDisplay');
            if (!userDisplay) return;
            const user = Tecnomath.getCurrentUser();
            if (user) {
                const coins = Tecnomath.getCoins();
                userDisplay.textContent = `${user.username} · 💰 ${coins}`;
            } else {
                userDisplay.textContent = 'Invitado';
            }
        })();
    </script>
</body>
</html>
