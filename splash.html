<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MindMath Arcade - Patrocinadores</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00FFFF;
            --neon-pink: #FF00FF;
            --neon-green: #39FF14;
            --neon-yellow: #FFE600;
            --gold: #FFD700;
            --retro-bg: #060610;
            --card-bg: #0d0d1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%; width: 100%; overflow-y: auto;
            background: var(--retro-bg);
            font-family: 'Orbitron', 'Press Start 2P', sans-serif;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        /* Fondos animados */
        body::before {
            content: ''; position: fixed; inset: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(0,255,255,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(255,0,255,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(255,215,0,0.04) 0%, transparent 40%);
            z-index: 0; pointer-events: none;
        }
        body::after {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 999;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 6px);
        }

        .splash-container {
            position: relative; z-index: 1; width: 100%; max-width: 500px;
            padding: 20px 16px; display: flex; flex-direction: column;
            align-items: center; gap: 30px; margin: 20px 0;
            animation: fadeInUp 0.8s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-logo { text-align: center; }
        .main-logo .title {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(18px, 7vw, 28px); color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 30px var(--neon-cyan), 0 0 60px rgba(0,255,255,0.5);
            letter-spacing: 3px; animation: titlePulse 2s ease-in-out infinite;
        }
        @keyframes titlePulse {
            0%,100%{ text-shadow: 0 0 10px var(--neon-cyan), 0 0 30px var(--neon-cyan); }
            50%{ text-shadow: 0 0 20px var(--neon-pink), 0 0 50px var(--neon-pink), 0 0 80px rgba(255,0,255,0.6); }
        }
        .main-logo .subtitle {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(6px, 2.5vw, 10px); color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink); margin-top: 6px; letter-spacing: 2px;
        }

        /* Sección de patrocinadores grandes y centrados */
        .sponsors-section {
            width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        .sponsors-label {
            font-family: 'Press Start 2P', cursive; font-size: 8px; color: #888;
            letter-spacing: 3px; text-transform: uppercase; text-align: center;
        }
        .sponsors-list {
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            width: 100%;
        }
        .sponsor-card {
            width: 90%; max-width: 350px;
            background: var(--card-bg); border: 2px solid #1a1a2e;
            border-radius: 16px; padding: 20px 15px;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            transition: all 0.3s ease; opacity: 0;
            animation: cardFadeIn 0.5s ease-out forwards;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .sponsor-card:nth-child(1) { animation-delay: 0.2s; }
        .sponsor-card:nth-child(2) { animation-delay: 0.4s; }
        .sponsor-card:nth-child(3) { animation-delay: 0.6s; }
        .sponsor-card:nth-child(4) { animation-delay: 0.8s; }
        .sponsor-card:nth-child(5) { animation-delay: 1.0s; }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sponsor-card:hover {
            border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0,255,255,0.3);
            transform: translateY(-3px);
        }

        .sponsor-image {
            width: 80px; height: 80px; border-radius: 20px;
            border: 2px solid #333; background: #0a0a1a;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; overflow: hidden; transition: 0.3s;
        }
        .sponsor-image img { width: 100%; height: 100%; object-fit: cover; }
        .sponsor-card:hover .sponsor-image {
            border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255,0,255,0.5);
        }

        .sponsor-info { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .sponsor-name {
            font-family: 'Press Start 2P', cursive; font-size: 8px; color: white;
            text-shadow: 0 0 5px rgba(255,255,255,0.5); letter-spacing: 1px;
        }
        .sponsor-phone {
            font-family: 'Orbitron', monospace; font-size: 8px; color: var(--gold);
            text-shadow: 0 0 5px var(--gold); text-decoration: none; transition: 0.2s;
            cursor: pointer; letter-spacing: 1px;
        }
        .sponsor-phone:hover { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }

        /* Barra de progreso abajo */
        .loading-section {
            width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .loading-text {
            font-family: 'Press Start 2P', cursive; font-size: 7px; color: #666; letter-spacing: 2px;
        }
        .loading-bar-outer {
            width: 90%; max-width: 350px; height: 8px; background: #111;
            border: 1px solid #333; border-radius: 5px; overflow: hidden;
        }
        .loading-bar-inner {
            height: 100%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-yellow), var(--neon-green));
            background-size: 300% 100%; border-radius: 5px; width: 0%;
            animation: loadProgress 2.5s ease-in-out forwards, barShimmer 1.5s linear infinite;
        }
        @keyframes loadProgress {
            0%{ width:0%; } 20%{ width:35%; } 40%{ width:55%; } 60%{ width:70%; } 80%{ width:90%; } 100%{ width:100%; }
        }
        @keyframes barShimmer {
            0%{ background-position:0% 50%; } 100%{ background-position:300% 50%; }
        }
        .percentage-text {
            font-family: 'Press Start 2P', cursive; font-size: 6px; color: var(--neon-green);
            text-shadow: 0 0 6px var(--neon-green);
        }
        .start-btn {
            font-family: 'Press Start 2P', cursive; font-size: 10px; padding: 16px 35px;
            background: linear-gradient(135deg, var(--neon-pink), #9B00FF);
            color: white; border: none; border-radius: 12px; cursor: pointer;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
            box-shadow: 0 0 25px rgba(255,0,255,0.4); transition: all 0.3s;
            opacity: 0; transform: scale(0.8); pointer-events: none;
            letter-spacing: 2px; margin-top: 10px;
        }
        .start-btn.visible {
            opacity: 1; transform: scale(1); pointer-events: auto;
            animation: btnGlow 1.5s ease-in-out infinite;
        }
        @keyframes btnGlow {
            0%,100%{ box-shadow: 0 0 20px rgba(255,0,255,0.4); }
            50%{ box-shadow: 0 0 40px rgba(0,255,255,0.7), 0 0 70px rgba(255,0,255,0.4); }
        }
        .start-btn:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(255,0,255,0.7); }
        .start-btn:active { transform: scale(0.95); }

        .version-tag {
            font-family: 'Press Start 2P', cursive; font-size: 5px; color: #444;
            position: fixed; bottom: 12px; right: 16px; z-index: 2;
        }

        @media (max-width: 400px) {
            .sponsor-card { padding: 15px 10px; }
            .sponsor-image { width: 65px; height: 65px; font-size: 32px; }
            .sponsor-name { font-size: 7px; }
            .sponsor-phone { font-size: 7px; }
        }
    </style>
</head>
<body>

<div class="splash-container">
    <div class="main-logo">
        <div class="title">MINDMATH</div>
        <div class="subtitle">ARCADE EDITION</div>
    </div>

    <!-- PATROCINADORES GRANDES CENTRADOS -->
    <div class="sponsors-section">
        <div class="sponsors-label">— Patrocinadores oficiales —</div>
        <div class="sponsors-list" id="sponsorsList"></div>
    </div>

    <!-- BARRA DE PROGRESO DEBAJO -->
    <div class="loading-section">
        <div class="loading-text">CARGANDO SISTEMA</div>
        <div class="loading-bar-outer">
            <div class="loading-bar-inner" id="loadBar"></div>
        </div>
        <div class="percentage-text" id="percentText">0%</div>
    </div>

    <button class="start-btn" id="startBtn" onclick="iniciarJuego()">
        ▶ INICIAR JUEGO
    </button>
</div>

<div class="version-tag">v2.3 · ODS SUPREMACY</div>

<script>
    // ═══════════════════════════════════════
    // BANCO DE PATROCINADORES
    // ═══════════════════════════════════════
    const allSponsors = [
        { name: "Juan Pérez",      phone: "+573001112233", image: "👨‍💼", imageUrl: "" },
        { name: "María Gómez",     phone: "+573002223344", image: "👩‍🔬", imageUrl: "" },
        { name: "Carlos Ruiz",     phone: "+573003334455", image: "👨‍🏫", imageUrl: "" },
        { name: "Laura Díaz",      phone: "+573004445566", image: "👩‍💻", imageUrl: "" },
        { name: "Tech Solutions",  phone: "+573005556677", image: "🏢", imageUrl: "" },
        { name: "EcoWorld",        phone: "+573006667788", image: "🌱", imageUrl: "" },
        { name: "NeuroLab",        phone: "+573007778899", image: "🧠", imageUrl: "" },
        { name: "MegaRetro",       phone: "+573008889900", image: "🕹️", imageUrl: "" },
        { name: "AguaViva",        phone: "+573009990011", image: "💧", imageUrl: "" },
        { name: "SolarEnergy",     phone: "+573010001122", image: "☀️", imageUrl: "" },
        { name: "EduPlay",         phone: "+573011112233", image: "🎓", imageUrl: "" },
        { name: "DataSoft",        phone: "+573012223344", image: "💾", imageUrl: "" },
    ];

    // ═══════════════════════════════════════
    // SELECCIÓN ALEATORIA (3-5 patrocinadores)
    // ═══════════════════════════════════════
    const numToShow = Math.floor(Math.random() * 3) + 3; // 3, 4 o 5
    const selectedSponsors = [...allSponsors]
        .sort(() => Math.random() - 0.5)
        .slice(0, numToShow);

    function renderSponsors() {
        const list = document.getElementById('sponsorsList');
        list.innerHTML = '';
        selectedSponsors.forEach(sponsor => {
            const card = document.createElement('div');
            card.className = 'sponsor-card';

            // Imagen
            const imgDiv = document.createElement('div');
            imgDiv.className = 'sponsor-image';
            if (sponsor.imageUrl) {
                const img = document.createElement('img');
                img.src = sponsor.imageUrl;
                img.alt = sponsor.name;
                img.onerror = () => {
                    img.style.display = 'none';
                    imgDiv.textContent = sponsor.image || '🖼️';
                };
                imgDiv.appendChild(img);
            } else {
                imgDiv.textContent = sponsor.image || '🖼️';
            }

            // Info
            const infoDiv = document.createElement('div');
            infoDiv.className = 'sponsor-info';
            const nameDiv = document.createElement('div');
            nameDiv.className = 'sponsor-name';
            nameDiv.textContent = sponsor.name;
            const phoneLink = document.createElement('a');
            phoneLink.className = 'sponsor-phone';
            phoneLink.href = 'tel:' + sponsor.phone.replace(/\s/g, '');
            phoneLink.textContent = sponsor.phone;
            phoneLink.title = 'Llamar a ' + sponsor.name;
            infoDiv.appendChild(nameDiv);
            infoDiv.appendChild(phoneLink);

            card.appendChild(imgDiv);
            card.appendChild(infoDiv);
            list.appendChild(card);
        });
    }

    renderSponsors();

    // ═══════════════════════════════════════
    // BARRA DE PROGRESO
    // ═══════════════════════════════════════
    const loadBar = document.getElementById('loadBar');
    const percentText = document.getElementById('percentText');
    const startBtn = document.getElementById('startBtn');

    let progress = 0;
    const totalDuration = 2500;
    const interval = 40;
    const increment = 100 / (totalDuration / interval);

    const timer = setInterval(() => {
        progress += increment;
        if (progress >= 100) {
            progress = 100;
            clearInterval(timer);
            setTimeout(() => {
                startBtn.classList.add('visible');
                percentText.innerText = '100% · LISTO';
                percentText.style.color = 'var(--neon-pink)';
            }, 200);
        }
        loadBar.style.width = progress + '%';
        percentText.innerText = Math.floor(progress) + '%';
    }, interval);

    // ═══════════════════════════════════════
    // INICIAR JUEGO
    // ═══════════════════════════════════════
    function iniciarJuego() {
        startBtn.style.transform = 'scale(0.9)';
        startBtn.style.opacity = '0.7';
        setTimeout(() => {
            window.location.href = 'index.html'; // Cambia por tu archivo real
        }, 300);
    }

    document.addEventListener('keydown', (e) => {
        if ((e.key === 'Enter' || e.key === ' ') && startBtn.classList.contains('visible')) {
            e.preventDefault();
            iniciarJuego();
        }
    });
</script>
</body>
</html>
