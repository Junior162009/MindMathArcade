<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BanderQuiz · Modo Inverso</title>
<link rel="icon" href="logo.png">
<script src="/js/tecnomath-auth.js"></script><script src="/js/tecnomath-progress.js?v=20260911-10"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Segoe UI,Poppins,system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 30% 15%,#282052,#090c1b 65%);display:grid;place-items:center;padding:18px}.wrap{width:min(760px,100%)}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back,.reset{border:1px solid #ffffff1c;background:#ffffff12;color:#fff;border-radius:12px;padding:9px 13px;font-weight:800;cursor:pointer}.brand{font-weight:900;flex:1}.card{background:#11172edb;border:1px solid #ffffff18;border-radius:28px;padding:24px;box-shadow:0 25px 70px #0008;backdrop-filter:blur(14px)}.hero{text-align:center}.hero img{width:110px;max-width:35vw;filter:drop-shadow(0 10px 22px #0008)}h1{margin:8px 0 4px;font-size:clamp(1.8rem,6vw,2.6rem)}.sub{color:#b8bfd4;margin:0 0 18px}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}.stat{background:#ffffff0d;border:1px solid #ffffff12;border-radius:99px;padding:7px 12px;font-weight:800}.flag{font-size:clamp(5rem,22vw,9rem);text-align:center;line-height:1.1;margin:12px 0 8px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 12px 20px #0008)}.prompt{text-align:center;color:#c5cbe0;font-weight:700;margin-bottom:15px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:2px solid #ffffff14;background:#ffffff0a;color:#fff;border-radius:16px;padding:15px 10px;font-size:1rem;font-weight:800;cursor:pointer;transition:.2s}.answer:hover{transform:translateY(-2px);background:#ffffff16;border-color:#f5c518}.answer.correct{background:#19a66b!important;border-color:#55efad!important}.answer.wrong{background:#d83f5b!important;border-color:#ff8297!important}.answer:disabled{cursor:default}.timer{height:8px;background:#252b43;border-radius:99px;overflow:hidden;margin-top:16px}.fill{height:100%;width:100%;background:linear-gradient(90deg,#f5c518,#e94560);transition:width .2s linear}.msg{text-align:center;min-height:26px;margin-top:12px;font-weight:800}.progress{margin-top:12px;color:#aeb6cf;font-size:.85rem}.bar{height:7px;background:#ffffff12;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e94560,#f5c518);width:0}.overlay{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:18px}.overlay.show{display:grid}.over{width:min(430px,100%);background:#11172e;border:1px solid #ffffff1c;border-radius:26px;padding:28px;text-align:center}.over h2{font-size:2.2rem;margin:0 0 10px}.actions{display:flex;gap:10px;justify-content:center}.actions button{border:0;border-radius:13px;padding:12px 18px;font-weight:900;cursor:pointer}.primary{background:#f5c518;color:#111}.secondary{background:#28314d;color:#fff}@media(max-width:560px){.answers{grid-template-columns:1fr}.card{padding:18px}.top .reset{display:none}}
</style></head>
<body>
<main class="wrap"><div class="top"><button class="back" id="back">← Menú</button><div class="brand">🔄 BanderQuiz · Modo Inverso</div><button class="reset" id="reset">Reiniciar</button></div><section class="card"><div class="hero"><img src="logo.png" alt="BanderQuiz"><h1>Modo Inverso</h1><p class="sub">Ahora te damos el país y tú debes reconocer su bandera.</p></div><div class="stats"><span class="stat">⭐ <b id="score">0</b></span><span class="stat">🔥 <b id="streak">0</b></span><span class="stat">❤️ <b id="lives">3</b></span><span class="stat">🎯 <b id="accuracy">0%</b></span></div><div class="flag" id="flag">🏳️</div><div class="prompt">¿Cuál es la bandera de <b id="country">…</b>?</div><div class="answers" id="answers"></div><div class="timer"><div class="fill" id="timer"></div></div><div class="msg" id="msg">Elige una bandera.</div><div class="progress">Pregunta <b id="question">1</b> · Aciertos <b id="correct">0</b><div class="bar"><i id="bar"></i></div></div></section></main>
<div class="overlay" id="overlay"><div class="over"><h2>🏁 Fin de la partida</h2><p id="summary"></p><div class="actions"><button class="primary" id="retry">🔄 Jugar otra vez</button><button class="secondary" id="menu">🏠 Menú</button></div></div></div>
<script>
const API='https://restcountries.com/v3.1/all?fields=name,cca2,flags,independent,unMember';let countries=[],current=null,score=0,total=0,streak=0,lives=3,locked=false,timer=null,seconds=12;
const $=id=>document.getElementById(id);const emoji=cc=>cc?cc.toUpperCase().replace(/[A-Z]/g,c=>String.fromCodePoint(127397+c.charCodeAt(0))):'🏳️';
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
async function load(){try{const r=await fetch(API);countries=(await r.json()).filter(c=>c.cca2&&c.name?.common&&c.unMember!==false);if(countries.length<100)throw 0;next()}catch(e){$('msg').textContent='No se pudo cargar el mapa de países. Revisa tu conexión.'}}
function next(){locked=false;clearInterval(timer);current=shuffle(countries)[0];const opts=shuffle([current,...shuffle(countries.filter(c=>c.cca2!==current.cca2)).slice(0,3)]);$('country').textContent=current.name.common;$('flag').textContent='❓';$('answers').innerHTML=opts.map(c=>`<button class="answer" data-id="${c.cca2}">${emoji(c.cca2)}</button>`).join('');$('question').textContent=total+1;$('msg').textContent='Elige una bandera.';document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b.dataset.id,b));startTimer()}
function startTimer(){seconds=12;$('timer').style.width='100%';timer=setInterval(()=>{seconds--;$('timer').style.width=Math.max(0,seconds/12*100)+'%';if(seconds<=0){clearInterval(timer);answer('',null)}},1000)}
function answer(id,btn){if(locked)return;locked=true;clearInterval(timer);total++;const ok=id===current.cca2;if(ok){score++;streak++;$('msg').textContent='✅ ¡Correcto!';}else{lives--;streak=0;$('msg').textContent='❌ Era '+emoji(current.cca2)+' '+current.name.common}if(btn)btn.classList.add(ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.dataset.id===current.cca2)b.classList.add('correct')});$('flag').textContent=emoji(current.cca2);update();sync(false);if(lives<=0){setTimeout(gameOver,850);return}setTimeout(next,850)}
function update(){$('score').textContent=score;$('streak').textContent=streak;$('lives').textContent=lives;$('correct').textContent=score;$('accuracy').textContent=(total?Math.round(score/total*100):0)+'%';$('bar').style.width=Math.min(100,score/Math.max(total,1)*100)+'%'}
function sync(completed){try{window.TecnomathProgress?.save('banderquiz-inverso',{mode:'inverso',score,totalQuestions:total,correctAnswers:score,wrongAnswers:total-score,accuracy:total?Math.round(score/total*100):0,streak,lives,completed})}catch(_){} }
function gameOver(){sync(true);$('summary').innerHTML=`Lograste <b>${score}</b> aciertos de <b>${total}</b>.<br>Precisión: <b>${total?Math.round(score/total*100):0}%</b>`;$('overlay').classList.add('show')}
function reset(){clearInterval(timer);score=0;total=0;streak=0;lives=3;$('overlay').classList.remove('show');update();next()}
$('back').onclick=()=>location.href='menu.html';$('menu').onclick=()=>location.href='menu.html';$('retry').onclick=reset;$('reset').onclick=reset;load();
</script></body></html>
