<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>BanderQuiz · Conquista el Mundo · Equal Earth</title>
<link rel="icon" href="../logo.png">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Poppins,system-ui,sans-serif;background:#080b18;color:#fff}body{overflow:hidden}.top{position:fixed;z-index:20;top:12px;left:50%;transform:translateX(-50%);width:min(1100px,calc(100% - 24px));display:flex;align-items:center;gap:14px;background:rgba(13,18,39,.9);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);border-radius:20px;padding:10px 14px;box-shadow:0 15px 45px rgba(0,0,0,.35)}.back{border:0;background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer}.brand{font-weight:900;white-space:nowrap}.beta{font-size:.72rem;padding:4px 8px;border-radius:99px;background:#f5c518;color:#111;font-weight:900}.progress{flex:1;min-width:120px}.progress-line{height:9px;background:#252b43;border-radius:99px;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#f5c518,#ff8a00);transition:width .35s}.progress-text{font-size:.76rem;color:#b9c0d8;margin-top:4px}.stats{display:flex;gap:7px}.stat{background:rgba(255,255,255,.07);padding:8px 10px;border-radius:12px;font-weight:800;white-space:nowrap}.map{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#18234a 0,#0b1024 52%,#050712 100%)}svg{width:100%;height:100%;display:block;touch-action:none}.country{fill:#626979;stroke:#9da5b9;stroke-width:.55;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .2s,filter .2s}.country:hover{fill:#8b93a6;filter:drop-shadow(0 0 5px rgba(245,197,24,.35))}.country.done{fill:#22b573;stroke:#b7f5d8}.hint{position:fixed;z-index:10;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(8,12,28,.86);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:9px 14px;color:#d6dbee;text-align:center;font-size:.86rem;backdrop-filter:blur(10px)}.modal{position:fixed;z-index:30;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.58);backdrop-filter:blur(7px)}.modal.show{display:flex}.card{width:min(440px,100%);background:#11172e;border:1px solid rgba(255,255,255,.13);border-radius:26px;padding:25px;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center}.flag{font-size:78px;line-height:1;margin:5px 0 14px}.eyebrow{color:#aeb7d0;font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:1px}.country-name{font-size:1.7rem;font-weight:900;margin:5px 0 15px}.input{width:100%;border:2px solid #303957;background:#080d20;color:#fff;border-radius:14px;padding:14px;font-size:1.05rem;outline:none}.input:focus{border-color:#f5c518}.actions{display:flex;gap:10px;margin-top:12px}.check,.cancel{flex:1;border:0;border-radius:14px;padding:13px;font-weight:900;cursor:pointer}.check{background:#f5c518;color:#111}.cancel{background:#252d48;color:#fff}.message{min-height:24px;margin-top:12px;font-weight:800}.ok{color:#51e39d}.bad{color:#ff7188}@media(max-width:700px){.top{flex-wrap:wrap}.brand{font-size:.9rem}.progress{order:5;flex-basis:100%}.stats{margin-left:auto}.stat{font-size:.78rem;padding:7px 8px}.hint{bottom:10px;font-size:.75rem;max-width:90%}}
</style>
</head>
<body>
<header class="top"><button class="back" id="back">← Menú</button><div class="brand">🌎 Conquista el Mundo <span class="beta">EQUAL EARTH</span></div><div class="progress"><div class="progress-line"><div class="progress-fill" id="fill"></div></div><div class="progress-text" id="progressText">0 / 195 países conquistados</div></div><div class="stats"><div class="stat">⭐ <span id="score">0</span></div><div class="stat">🔥 <span id="streak">0</span></div></div></header>
<main class="map" id="map"></main><div class="hint">🖐️ Arrastra para explorar · 🔍 rueda o pellizca para zoom · 👆 toca un país</div>
<div class="modal" id="modal"><section class="card"><div class="eyebrow">País seleccionado</div><div class="flag" id="flag">🏳️</div><div class="country-name" id="countryName">País</div><input class="input" id="answer" autocomplete="off" placeholder="Escribe el nombre del país"><div class="actions"><button class="cancel" id="cancel">Cancelar</button><button class="check" id="check">Comprobar ✓</button></div><div class="message" id="message"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
const TOTAL=195,STORAGE='banderquiz_mundo_beta_v1';
const flag={"Colombia":"🇨🇴","Brasil":"🇧🇷","Argentina":"🇦🇷","Chile":"🇨🇱","Perú":"🇵🇪","México":"🇲🇽","Estados Unidos":"🇺🇸","Canadá":"🇨🇦","España":"🇪🇸","Francia":"🇫🇷","Italia":"🇮🇹","Alemania":"🇩🇪","Reino Unido":"🇬🇧","Portugal":"🇵🇹","Japón":"🇯🇵","China":"🇨🇳","India":"🇮🇳","Australia":"🇦🇺","Egipto":"🇪🇬","Sudáfrica":"🇿🇦","Nigeria":"🇳🇬","Marruecos":"🇲🇦","Corea del Sur":"🇰🇷","Turquía":"🇹🇷","Grecia":"🇬🇷","Noruega":"🇳🇴","Suecia":"🇸🇪","Finlandia":"🇫🇮","Polonia":"🇵🇱","Ucrania":"🇺🇦"};
const aliases={"brasil":"Brasil","brazil":"Brasil","peru":"Perú","perú":"Perú","mexico":"México","méxico":"México","estados unidos":"Estados Unidos","usa":"Estados Unidos","eeuu":"Estados Unidos","espana":"España","españa":"España","japon":"Japón","japón":"Japón","reino unido":"Reino Unido","inglaterra":"Reino Unido","sudafrica":"Sudáfrica","sudáfrica":"Sudáfrica","turquia":"Turquía","turquía":"Turquía","corea del sur":"Corea del Sur"};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();let state=JSON.parse(localStorage.getItem(STORAGE)||'{"done":[],"score":0,"streak":0}');let selected=null;
const app=d3.select('#map'),svg=d3.select(document.createElementNS('http://www.w3.org/2000/svg','svg')).attr('viewBox','0 0 1000 600');app.node().appendChild(svg.node());const g=svg.append('g');
const projection=d3.geoEqualEarth().fitSize([1000,600],{type:'Sphere'});const path=d3.geoPath(projection);g.append('path').datum({type:'Sphere'}).attr('d',path).attr('fill','#111936').attr('stroke','#3a4569');
// Navegación limitada: se puede explorar el mapa completo, pero nunca desplazarlo hasta perderlo de la zona visible.
const zoom=d3.zoom().scaleExtent([1,7]).translateExtent([[0,0],[1000,600]]).extent([[0,0],[1000,600]]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom);
function save(){localStorage.setItem(STORAGE,JSON.stringify(state));update()}function update(){document.getElementById('fill').style.width=Math.min(100,state.done.length/TOTAL*100)+'%';document.getElementById('progressText').textContent=`${state.done.length} / ${TOTAL} países conquistados`;document.getElementById('score').textContent=state.score;document.getElementById('streak').textContent=state.streak}function openCountry(name,node){selected={name,node};document.getElementById('flag').textContent=flag[name]||'🏳️';document.getElementById('countryName').textContent='¿Qué país es?';document.getElementById('answer').value='';document.getElementById('message').textContent='';document.getElementById('message').className='message';document.getElementById('modal').classList.add('show');setTimeout(()=>document.getElementById('answer').focus(),80)}function close(){document.getElementById('modal').classList.remove('show');selected=null}function check(){if(!selected)return;const typed=norm(document.getElementById('answer').value);const expected=norm(selected.name);const alias=aliases[typed]||document.getElementById('answer').value.trim();if(norm(alias)===expected){if(!state.done.includes(selected.name)){state.done.push(selected.name);state.score+=100+state.streak*10;state.streak++;selected.node.classed('done',true)}document.getElementById('countryName').textContent=selected.name;document.getElementById('message').textContent='✓ ¡País conquistado! + puntos';document.getElementById('message').className='message ok';save();setTimeout(close,650)}else{state.streak=0;state.score=Math.max(0,state.score-20);document.getElementById('message').textContent='✗ No es correcto. Inténtalo otra vez';document.getElementById('message').className='message bad';save()}}
document.getElementById('check').onclick=check;document.getElementById('cancel').onclick=close;document.getElementById('back').onclick=()=>location.href='../index.html';document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check();if(e.key==='Escape')close()});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>r.json()).then(world=>{const countries=topojson.feature(world,world.objects.countries);g.selectAll('.country').data(countries.features).join('path').attr('class','country').attr('d',path).on('click',(e,d)=>{const name=d.properties?.name;if(name)openCountry(name,d3.select(e.currentTarget))});g.selectAll('.country').classed('done',d=>state.done.includes(d.properties?.name));update();window.addEventListener('resize',()=>svg.call(zoom.transform,d3.zoomIdentity));}).catch(()=>{document.getElementById('progressText').textContent='No se pudo cargar el mapa. Revisa tu conexión.'});
</script></body></html>
