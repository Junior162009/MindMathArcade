<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BanderQuiz · País Misterioso</title>
<link rel="icon" href="logo.png"><script src="/js/tecnomath-auth.js"></script><script src="/js/tecnomath-progress.js?v=20260911-10"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Segoe UI,Poppins,system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 70% 15%,#35234f,#080b18 65%);display:grid;place-items:center;padding:18px}.wrap{width:min(760px,100%)}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.btn{border:1px solid #ffffff1c;background:#ffffff12;color:#fff;border-radius:12px;padding:9px 13px;font-weight:800;cursor:pointer}.brand{font-weight:900;flex:1}.card{background:#11172edd;border:1px solid #ffffff18;border-radius:28px;padding:25px;box-shadow:0 25px 70px #0008;text-align:center}.logo{width:100px;filter:drop-shadow(0 10px 22px #0008)}h1{font-size:clamp(1.8rem,6vw,2.7rem);margin:8px 0 4px}.sub{color:#b8bfd4;margin:0 0 18px}.clues{display:grid;gap:9px;margin:18px 0}.clue{background:#ffffff09;border:1px solid #ffffff12;border-radius:15px;padding:13px;text-align:left;display:flex;gap:10px;align-items:center}.clue strong{color:#f5c518}.clue.hidden{opacity:.35;filter:blur(1px)}.answer{width:100%;border:2px solid #ffffff14;background:#080d20;color:#fff;border-radius:15px;padding:14px;font-size:1.05rem;outline:0}.answer:focus{border-color:#f5c518}.actions{display:flex;gap:10px;margin-top:11px}.actions button{flex:1;border:0;border-radius:14px;padding:13px;font-weight:900;cursor:pointer}.check{background:#f5c518;color:#111}.skip{background:#28314d;color:#fff}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.stat{background:#ffffff0d;border-radius:99px;padding:7px 12px;font-weight:800}.msg{min-height:26px;margin-top:12px;font-weight:900}.score{margin-top:13px;color:#b9c0d8}.overlay{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:18px}.overlay.show{display:grid}.over{width:min(430px,100%);background:#11172e;border:1px solid #ffffff1c;border-radius:25px;padding:28px;text-align:center}.over h2{margin:0 0 10px;font-size:2.2rem}@media(max-width:560px){.card{padding:18px}.top .reset{display:none}}
</style></head>
<body><main class="wrap"><div class="top"><button class="btn" id="back">← Menú</button><div class="brand">🕵️ País Misterioso</div><button class="btn reset" id="reset">Reiniciar</button></div><section class="card"><img src="logo.png" class="logo" alt="BanderQuiz"><h1>¿Qué país es?</h1><p class="sub">Descubre el país usando la menor cantidad de pistas posible.</p><div class="stats"><span class="stat">⭐ <b id="score">0</b></span><span class="stat">🔥 <b id="streak">0</b></span><span class="stat">❤️ <b id="lives">3</b></span></div><div class="clues" id="clues"></div><input id="answer" class="answer" autocomplete="off" placeholder="Escribe el nombre del país…"><div class="actions"><button class="skip" id="skip">💡 Otra pista</button><button class="check" id="check">Comprobar ✓</button></div><div class="msg" id="msg">Cargando países…</div><div class="score">Pista usada: <b id="used">1</b>/5 · Puntos de esta ronda: <b id="round">100</b></div></section></main>
<div class="overlay" id="overlay"><div class="over"><h2>🏆 Partida terminada</h2><p id="summary"></p><button class="check" id="retry">🔄 Jugar otra vez</button> <button class="skip" id="menu">🏠 Menú</button></div></div>
<script>
const APIS=['https://restcountries.com/v3.1/all?fields=name,cca2,capital,region,subregion,population,translations','https://restcountries.com/v3.1/all'];
const CACHE='banderquiz_misterioso_countries_v2';let countries=[],current=null,score=0,streak=0,lives=3,clue=0,round=100,locked=false;
const $=id=>document.getElementById(id);const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").replace(/\s+/g,' ').trim();const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function esName(c){return c?.translations?.spa?.common||c?.name?.common||''}
function aliases(name){const n=norm(name);const m={'estados unidos':'united states','eeuu':'united states','usa':'united states','paises bajos':'netherlands','holanda':'netherlands','reino unido':'united kingdom','inglaterra':'united kingdom','corea del sur':'south korea','corea del norte':'north korea','rusia':'russia','turquia':'turkey','chequia':'czechia'};return [n,m[n]].filter(Boolean)}
function clueData(c){return[{icon:'🏛️',label:'Capital',value:c.capital?.[0]||'Sin capital registrada'},{icon:'🌍',label:'Región',value:c.region||'Desconocida'},{icon:'🧭',label:'Subregión',value:c.subregion||'Desconocida'},{icon:'👥',label:'Población aproximada',value:c.population?new Intl.NumberFormat('es-CO').format(c.population):'Desconocida'},{icon:'🔤',label:'Nombre',value:c.name?.common||'Desconocido'}]}
function renderClues(){const data=clueData(current);$('clues').innerHTML=data.map((x,i)=>`<div class="clue ${i>=clue?'hidden':''}"><span>${x.icon}</span><div><strong>Pista ${i+1} · ${x.label}</strong><br>${i<clue?x.value:'🔒 Pista bloqueada'}</div></div>`).join('');$('used').textContent=Math.max(1,clue);$('round').textContent=round}
function next(){if(!countries.length)return;locked=false;clue=1;round=100;current=shuffle(countries)[0];$('answer').value='';$('msg').textContent='Piensa antes de pedir otra pista.';renderClues()}
function reveal(){if(locked||clue>=5)return;clue++;round=Math.max(20,round-20);renderClues();$('msg').textContent=clue<5?'Se desbloqueó una nueva pista.':'Ya tienes todas las pistas.'}
function check(){if(locked||!current)return;const val=norm($('answer').value);if(!val){$('msg').textContent='Escribe un país primero.';return}const good=aliases(esName(current)).includes(val)||aliases(current.name?.common).includes(val);locked=true;if(good){score+=round;streak++;$('msg').textContent=`✅ ¡Correcto! Era ${esName(current)}.`}else{lives--;streak=0;$('msg').textContent=`❌ No era ese. Era ${esName(current)}.`}update();sync(false);if(lives<=0){setTimeout(gameOver,900);return}setTimeout(next,1100)}
function update(){$('score').textContent=score;$('streak').textContent=streak;$('lives').textContent=lives}
function sync(completed){try{window.TecnomathProgress?.save('banderquiz-misterioso',{mode:'misterioso',score,totalQuestions:0,correctAnswers:0,streak,lives,completed})}catch(_){} }
function gameOver(){sync(true);$('summary').innerHTML=`Puntuación: <b>${score}</b><br>Racha final: <b>${streak}</b>`;$('overlay').classList.add('show')}
function reset(){score=0;streak=0;lives=3;$('overlay').classList.remove('show');update();next()}
async function fetchJson(url){const controller=new AbortController();const t=setTimeout(()=>controller.abort(),9000);try{const r=await fetch(url,{cache:'no-store',signal:controller.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function load(){let data=null;for(const url of APIS){try{const d=await fetchJson(url);if(Array.isArray(d)&&d.length>=100){data=d;break}}catch(e){console.warn('Fuente de países no disponible:',url,e)}}if(!data){try{const cached=JSON.parse(localStorage.getItem(CACHE)||'null');if(Array.isArray(cached)&&cached.length>=100)data=cached}catch(_){} }if(!data){$('msg').textContent='No se pudo cargar los países. Pulsa Reiniciar para volver a intentar.';$('clues').innerHTML='<div class="clue">🌐 El servicio de países no respondió. El juego volverá a intentarlo al reiniciar.</div>';return}countries=data.filter(c=>c?.cca2&&c?.name?.common);try{localStorage.setItem(CACHE,JSON.stringify(countries))}catch(_){}if(countries.length>=100){next()}else{$('msg').textContent='La lista de países llegó incompleta. Pulsa Reiniciar.'}}
$('back').onclick=()=>location.href='menu.html';$('menu').onclick=()=>location.href='menu.html';$('retry').onclick=reset;$('reset').onclick=()=>{if(!countries.length)load();else reset()};$('skip').onclick=reveal;$('check').onclick=check;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});load();
</script></body></html>
