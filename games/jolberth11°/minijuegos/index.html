<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🎮 Reino Pixelado · 100 Minijuegos</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#101820;color:#fff;min-height:100vh}header{padding:14px;text-align:center;background:#162536;border-bottom:3px solid #f8b800;position:sticky;top:0;z-index:5}h1{margin:0 0 6px}.stats{font-weight:bold}main{max-width:900px;margin:auto;padding:18px}.card{background:#1c2a38;border:2px solid #536779;border-radius:18px;padding:22px;text-align:center;box-shadow:0 8px 20px #0005}.question{font-size:clamp(22px,5vw,38px);margin:20px 0;min-height:55px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choices button,.action{border:0;border-radius:13px;padding:15px;background:#f8b800;color:#101820;font-size:19px;font-weight:bold;cursor:pointer}.choices button:active,.action:active{transform:scale(.97)}#feedback{min-height:28px;margin:15px;font-size:20px;font-weight:bold}.bar{height:12px;background:#303c48;border-radius:10px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#f8b800;width:0}select{padding:10px;border-radius:10px;font-size:16px}.hidden{display:none}.tiny{opacity:.75;font-size:13px}.success{outline:3px solid #38d996}.wrong{outline:3px solid #e05252}@media(max-width:520px){main{padding:10px}.choices{gap:8px}.choices button{padding:13px 8px;font-size:16px}}</style></head><body><header><h1>🎮 100 Minijuegos Matemáticos</h1><div class="stats">Juego <span id="num">1</span>/100 · ⭐ <span id="score">0</span> · ❤️ <span id="lives">3</span></div><div class="bar"><i id="progress"></i></div></header><main><div class="card"><div class="tiny" id="type"></div><div class="question" id="q"></div><div class="choices" id="choices"></div><div id="feedback"></div><button class="action hidden" id="next">Siguiente ▶</button></div><p style="text-align:center"><button class="action" id="restart">🔄 Reiniciar</button></p></main><script>(()=>{const $=id=>document.getElementById(id);let n=1,score=0,lives=3,answered=false;const types=['⚡ Cálculo rápido','🎯 Elige el resultado','🧠 Mayor o menor','🔢 Secuencia','➕ Sumas','➖ Restas','✖️ Multiplicaciones','➗ Divisiones','📐 Geometría','🧩 Desafío lógico'];const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function make(i){let t=(i-1)%10+1,a,b,ans,text,opts;if(t===1){a=rand(2,30);b=rand(2,20);ans=a+b;text=`¿Cuánto es ${a} + ${b}?`}if(t===2){a=rand(5,25);b=rand(2,a);ans=a-b;text=`¿Cuánto es ${a} − ${b}?`}if(t===3){a=rand(2,12);b=rand(2,10);ans=a*b;text=`¿Cuánto es ${a} × ${b}?`}if(t===4){b=rand(2,12);ans=rand(2,12);a=b*ans;text=`¿Cuánto es ${a} ÷ ${b}?`}if(t===5){a=rand(10,50);b=rand(10,50);ans=Math.max(a,b);text=`¿Cuál es mayor: ${a} o ${b}?`}if(t===6){a=rand(2,20);b=rand(2,8);ans=a+3*b;text=`Si tienes ${a} y sumas ${b} tres veces, ¿cuánto obtienes?`}if(t===7){a=rand(2,8);ans=a*a;text=`¿Cuál es el cuadrado de ${a}?`}if(t===8){a=rand(2,12);ans=a*2;text=`¿Cuál es el doble de ${a}?`}if(t===9){a=rand(3,12);ans=4*a;text=`Un rectángulo mide ${a} cm de largo y 4 cm de ancho. ¿Perímetro?`}if(t===10){a=rand(3,10);b=rand(3,10);ans=a*b;text=`Una caja tiene ${a} filas de ${b} objetos. ¿Cuántos hay?`}opts=new Set([ans]);while(opts.size<4){let d=rand(-8,8);if(!d)d=1;opts.add(ans+d)}opts=[...opts].sort(()=>Math.random()-.5);return{text,ans,opts}}function render(){answered=false;$('num').textContent=n;$('score').textContent=score;$('lives').textContent=lives;$('progress').style.width=(n-1)+'%';$('type').textContent=types[(n-1)%10]+` · Variante ${Math.ceil(n/10)}`;let g=make(n);$('q').textContent=g.text;$('feedback').textContent='';$('next').classList.add('hidden');$('choices').innerHTML='';g.opts.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(b,v===g.ans);$('choices').appendChild(b)})}function answer(btn,ok){if(answered)return;answered=true;$('choices').querySelectorAll('button').forEach(b=>b.disabled=true);if(ok){score+=10;$('feedback').textContent='✅ ¡Correcto! +10 puntos';btn.classList.add('success')}else{lives--;score=Math.max(0,score-5);$('feedback').textContent='❌ Incorrecto. Era '+makeCurrent().ans+' · −1 ❤️';btn.classList.add('wrong')}$('score').textContent=score;$('lives').textContent=lives;if(lives<=0){setTimeout(()=>{alert('💀 Fin. Puntuación: '+score);reset()},500);return}if(n>=100){setTimeout(()=>{alert('🏆 ¡Completaste los 100 minijuegos! Puntuación: '+score);reset()},500);return}$('next').classList.remove('hidden')}let current=null;function makeCurrent(){if(!current)current=make(n);return current}function reset(){n=1;score=0;lives=3;current=null;render()}$('next').onclick=()=>{n++;current=null;render()};$('restart').onclick=reset;render()})();</script></body></html>
