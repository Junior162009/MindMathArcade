<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>🏰 Reino Pixelado</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;touch-action:none}#gameArea{position:absolute;top:0;left:0;right:0;height:58%;background:#5c94fc;overflow:hidden}#game{display:block;width:100%;height:100%}#hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:94%;padding:6px 8px;display:flex;justify-content:space-around;align-items:center;background:#14141ddd;border:2px solid #f8b800;border-radius:12px;color:#fff;font-weight:bold;font-size:clamp(11px,2.7vw,18px);z-index:5}.btn{position:absolute;border:3px solid #777;background:linear-gradient(#444,#202020);color:#fff;font-weight:bold;touch-action:none;box-shadow:inset 0 2px #888,0 5px #090909}.btn:active,.pressed{transform:translateY(4px)!important;box-shadow:inset 0 2px #333,0 1px #000}.arrow{width:68px;height:68px;border-radius:18px;font-size:31px;top:50%;transform:translateY(-50%)}#left{left:7%}#right{left:calc(7% + 80px)}#jump{right:8%;top:50%;transform:translateY(-50%);width:84px;height:84px;border-radius:50%;background:linear-gradient(#d94a4a,#8d2020);font-size:30px}#pause{right:calc(8% + 100px);top:calc(50% - 92px);width:58px;height:42px;border-radius:12px;font-size:20px}.screen{position:absolute;z-index:30;top:50%;left:50%;transform:translate(-50%,-50%);background:#101820;color:#fff;border:3px solid #f8b800;border-radius:18px;padding:28px;text-align:center;min-width:290px;max-width:90%;box-shadow:0 0 30px #000b}.screen h1,.screen h2{margin-bottom:14px}.screen p{margin:8px 0 16px}.screen button{padding:13px 25px;border:0;border-radius:10px;background:#f8b800;font-size:17px;font-weight:bold}.hidden{display:none!important}#answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}#answers button{padding:12px;border:2px solid #f8b800;border-radius:9px;background:#263241;color:#fff;font-size:17px}#msg{min-height:24px;margin-top:10px;font-weight:bold}@media(max-width:500px){#hud{font-size:11px;width:97%}.arrow{width:62px;height:62px}#left{left:5%}#right{left:calc(5% + 72px)}#jump{right:6%;width:76px;height:76px}#pause{right:calc(6% + 88px)}}
</style>
</head>
<body>
<div id="gameArea"><canvas id="game"></canvas><div id="hud"><span>❤️ <b id="vidas">3</b></span><span>🪙 <b id="monedas">0</b></span><span>⭐ <b id="puntos">0</b></span><span>⏱ <b id="tiempo">300</b></span><span>🌎 <b id="nivel">1</b></span></div></div>
<div id="controls"><button class="btn arrow" id="left">◀</button><button class="btn arrow" id="right">▶</button><button class="btn" id="pause">Ⅱ</button><button class="btn" id="jump">A</button></div>
<div id="startScreen" class="screen"><h1>🏰 Reino Pixelado</h1><p>Corre, salta, derrota enemigos y llega a la bandera.</p><button id="start">Iniciar Aventura</button></div><div id="pauseScreen" class="screen hidden"><h2>⏸ Pausa</h2><button id="resume">Continuar</button></div><div id="gameOverScreen" class="screen hidden"><h2>💀 Fin del juego</h2><p>Puntuación: <b id="finalScore">0</b></p><button id="restart">Reintentar</button></div><div id="winScreen" class="screen hidden"><h2>🏆 ¡Nivel superado!</h2><p>Puntuación: <b id="winScore">0</b></p><button id="next">Siguiente nivel</button></div><div id="questionScreen" class="screen hidden"><h2>🧠 ¡Pregunta!</h2><p>Responde bien para conservar tu corazón.</p><div id="questionBox"></div><div id="answers"></div><div id="msg"></div></div>
<script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),area=document.getElementById('gameArea');let W,H,GROUND_Y,cam=0,running=false,paused=false,level=1,vidas=3,monedas=0,puntos=0,tiempo=300,timer;const keys={left:false,right:false,jump:false};let questionActive=false;const $=id=>document.getElementById(id);const player={x:100,y:0,w:36,h:50,vy:0,dir:1,ground:false,inv:false,invUntil:0,checkpoint:100};const WORLD=5600,pits=[[900,1020],[2200,2330],[3550,3690],[4300,4470]];let blocks=[],coins=[],enemies=[],checkpoints=[850,2100,3400,4250],metaX=WORLD-180;function resize(){W=canvas.width=area.clientWidth;H=canvas.height=area.clientHeight;GROUND_Y=H-82;if(player.ground||player.y>GROUND_Y-player.h)player.y=GROUND_Y-player.h;positionBlocks()}function positionBlocks(){blocks.forEach(b=>{b.y=GROUND_Y-b.baseY})}window.addEventListener('resize',resize);const questions=[['¿Cuánto es 7 + 5?',['10','12','13','14'],1],['¿Cuánto es 9 × 3?',['18','21','27','30'],2],['¿Cuánto es 20 ÷ 4?',['4','5','6','8'],1],['¿Cuánto es 15 − 7?',['6','7','8','9'],2],['¿Cuál es la mitad de 18?',['6','8','9','12'],2]];function build(){blocks=[{x:420,baseY:160,w:42,h:42,t:'brick'},{x:462,baseY:160,w:42,h:42,t:'bonus',used:false},{x:504,baseY:160,w:42,h:42,t:'brick'},{x:1180,baseY:230,w:42,h:42,t:'bonus',used:false},{x:1600,baseY:160,w:42,h:42,t:'brick'},{x:1642,baseY:160,w:42,h:42,t:'brick'},{x:1684,baseY:160,w:42,h:42,t:'bonus',used:false},{x:2600,baseY:210,w:42,h:42,t:'brick'},{x:3000,baseY:160,w:42,h:42,t:'bonus',used:false},{x:3900,baseY:230,w:42,h:42,t:'brick'},{x:3942,baseY:230,w:42,h:42,t:'brick'},{x:4750,baseY:50,w:42,h:50,t:'brick'},{x:4800,baseY:100,w:42,h:100,t:'brick'},{x:4850,baseY:150,w:42,h:150,t:'brick'}];positionBlocks();coins=[];for(let x=280;x<5200;x+=180)if(!pits.some(p=>x>p[0]-30&&x<p[1]+30))coins.push({x,y:GROUND_Y-65,w:22,h:22,taken:false});[[428,215],[470,215],[512,215],[1188,280],[1608,215],[1650,215],[1692,215],[2610,260],[3008,215],[3910,280],[3950,280]].forEach(c=>coins.push({x:c[0],y:GROUND_Y-c[1],w:22,h:22,taken:false}));const types=level===1?['slime']:level===2?['slime','bat']:level===3?['orc','slime']:level===4?['skeleton','orc','bat']:['boss','skeleton','orc'];const base=[650,1450,1950,2950,3350,4600];enemies=base.map((x,i)=>enemy(x,Math.max(450,x-80),x+130,types[i%types.length]));checkpoints=[850,2100,3400,4250];metaX=WORLD-180;player.checkpoint=100}function enemy(x,min,max,type){let size=type==='boss'?55:40;return{x,minX:min,maxX:max,w:size,h:size,y:GROUND_Y-size,vx:(2+level*.18)*(Math.random()<.5?1:-1),dead:false,type}}function coll(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function inPit(x){return pits.some(p=>x>p[0]&&x<p[1])}function hud(){$('vidas').textContent=vidas;$('monedas').textContent=monedas;$('puntos').textContent=puntos;$('tiempo').textContent=tiempo;$('nivel').textContent=level}function tone(f,d=.08){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=.06;o.start();o.stop(a.currentTime+d)}catch(e){}}function move(){let dx=keys.left?-5:keys.right?5:0;if(dx)player.dir=dx>0?1:-1;player.x=Math.max(0,Math.min(WORLD-player.w,player.x+dx));blocks.forEach(b=>{if(coll(player,b)){if(dx>0)player.x=b.x-player.w;else if(dx<0)player.x=b.x+b.w}});if(keys.jump&&player.ground){player.vy=-15;player.ground=false;tone(700)}player.vy+=.72;player.y+=player.vy;player.ground=false;blocks.forEach(b=>{if(coll(player,b)){if(player.vy>0){player.y=b.y-player.h;player.vy=0;player.ground=true}else if(player.vy<0){player.y=b.y+b.h;player.vy=0;if(b.t==='bonus'&&!b.used){b.used=true;monedas++;puntos+=15;tone(1000)}}}});if(!inPit(player.x+player.w/2)&&player.y+player.h>=GROUND_Y){player.y=GROUND_Y-player.h;player.vy=0;player.ground=true}if(player.y>H+100){triggerQuestion();return}checkpoints.forEach(c=>{if(player.x>c)player.checkpoint=c})}function triggerQuestion(){if(questionActive)return;questionActive=true;running=false;showQuestion()}function showQuestion(){let q=questions[Math.floor(Math.random()*questions.length)];$('questionBox').textContent=q[0];$('answers').innerHTML='';$('msg').textContent='';q[1].forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(i===q[2]);$('answers').appendChild(b)});$('questionScreen').classList.remove('hidden')}function answer(ok){$('answers').querySelectorAll('button').forEach(b=>b.disabled=true);if(ok){$('msg').textContent='✅ Correcto. Conservas el corazón.';tone(900);setTimeout(closeQuestion,650)}else{$('msg').textContent='❌ Incorrecto. Pierdes un corazón. No puedes volver a intentarlo.';vidas--;tone(180,.2);setTimeout(()=>{closeQuestion();if(vidas<=0)gameOver();else respawn()},900)}hud()}function closeQuestion(){$('questionScreen').classList.add('hidden');questionActive=false;if(vidas>0){respawn();running=true}}function respawn(){player.x=Math.max(100,player.checkpoint);player.y=GROUND_Y-player.h;player.vy=0;player.inv=true;player.invUntil=performance.now()+1500}function updateEnemies(){enemies.forEach(e=>{if(e.dead)return;e.y=GROUND_Y-e.h;e.x+=e.vx;if(e.x<e.minX||e.x>e.maxX)e.vx*=-1;if(player.inv&&performance.now()>player.invUntil)player.inv=false;if(!player.inv&&coll(player,e)){if(player.vy>0&&player.y+player.h-e.y<24){e.dead=true;player.vy=-8;puntos+=e.type==='boss'?60:20;tone(350)}else triggerQuestion()}})}function collect(){coins.forEach(c=>{if(!c.taken&&coll(player,c)){c.taken=true;monedas++;puntos+=10;tone(1300)}})}function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5c94fc');g.addColorStop(1,'#bfe4ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff9';[200,900,1700,2600,3500,4500,5100].forEach((x,i)=>{let sx=x-cam*.4,y=70+(i%3)*35;ctx.beginPath();ctx.arc(sx,y,25,0,7);ctx.arc(sx+30,y+8,20,0,7);ctx.arc(sx-30,y+8,20,0,7);ctx.fill()});let start=0;pits.forEach(p=>{ctx.fillStyle='#8b5a2b';ctx.fillRect(start-cam,GROUND_Y,p[0]-start,H-GROUND_Y);ctx.fillStyle='#3aa53a';ctx.fillRect(start-cam,GROUND_Y,p[0]-start,12);start=p[1]});ctx.fillStyle='#8b5a2b';ctx.fillRect(start-cam,GROUND_Y,WORLD-start,H-GROUND_Y);ctx.fillStyle='#3aa53a';ctx.fillRect(start-cam,GROUND_Y,WORLD-start,12);blocks.forEach(b=>{let x=b.x-cam;ctx.fillStyle=b.t==='bonus'?(b.used?'#777':'#f8b800'):'#b5651d';ctx.fillRect(x,b.y,b.w,b.h);ctx.strokeStyle='#5b3510';ctx.strokeRect(x,b.y,b.w,b.h);if(b.t==='bonus'&&!b.used){ctx.fillStyle='#fff';ctx.font='24px Arial';ctx.fillText('?',x+13,b.y+29)}});coins.forEach(c=>{if(c.taken)return;let x=c.x-cam,y=c.y+Math.sin(performance.now()/180+c.x)*4;ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(x+11,y+11,11,0,7);ctx.fill()});enemies.forEach(e=>{if(e.dead)return;let x=e.x-cam,y=e.y;ctx.fillStyle=e.type==='boss'?'#6b21a8':e.type==='orc'?'#7f1d1d':e.type==='skeleton'?'#eee':e.type==='bat'?'#4c1d95':'#3fae4a';ctx.beginPath();ctx.ellipse(x+e.w/2,y+e.h/2,e.w/2,e.h/2,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+9,y+12,7,7);ctx.fillRect(x+e.w-16,y+12,7,7)});checkpoints.forEach(c=>{let x=c-cam;ctx.fillStyle='#777';ctx.fillRect(x,GROUND_Y-110,5,110);ctx.fillStyle='#22c55e';ctx.fillRect(x+5,GROUND_Y-105,35,25)});let mx=metaX-cam;ctx.fillStyle='#ccc';ctx.fillRect(mx,GROUND_Y-210,7,210);ctx.fillStyle='#e63946';ctx.beginPath();ctx.moveTo(mx+7,GROUND_Y-205);ctx.lineTo(mx+52,GROUND_Y-185);ctx.lineTo(mx+7,GROUND_Y-165);ctx.fill();if(!(player.inv&&Math.floor(performance.now()/100)%2===0)){let x=player.x-cam;ctx.fillStyle='#2b3a67';ctx.fillRect(x+4,player.y+34,10,16);ctx.fillRect(x+22,player.y+34,10,16);ctx.fillStyle='#e63946';ctx.fillRect(x+2,player.y+18,32,24);ctx.fillStyle='#ffd6a5';ctx.fillRect(x+5,player.y+5,26,20);ctx.fillStyle='#8b4513';ctx.fillRect(x+4,player.y+2,28,9);ctx.fillStyle='#222';ctx.fillRect(x+22,player.y+12,4,4)}}function camera(){cam=Math.max(0,Math.min(WORLD-W,player.x-W/2))}function loop(){if(running&&!paused&&!questionActive){move();if(!questionActive){updateEnemies();collect();camera();if(player.x+player.w>=metaX)win();hud()}}draw();requestAnimationFrame(loop)}function start(){level=1;vidas=3;monedas=0;puntos=0;tiempo=300;build();player.x=100;running=true;paused=false;$('startScreen').classList.add('hidden');clearInterval(timer);timer=setInterval(()=>{if(running&&!paused&&!questionActive&&--tiempo<=0)gameOver();hud()},1000);hud()}function gameOver(){running=false;clearInterval(timer);$('finalScore').textContent=puntos;$('gameOverScreen').classList.remove('hidden')}function win(){running=false;clearInterval(timer);$('winScore').textContent=puntos;$('winScreen').classList.remove('hidden');tone(1000,.25)}function next(){level=level>=5?1:level+1;vidas=3;tiempo=Math.max(180,300-level*20);build();player.x=100;running=true;$('winScreen').classList.add('hidden');hud()}function pause(){if(!running||questionActive)return;paused=!paused;$('pauseScreen').classList.toggle('hidden',!paused)}function bind(id,key){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.classList.add('pressed')});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[key]=false;b.classList.remove('pressed')}))}bind('left','left');bind('right','right');bind('jump','jump');$('pause').onclick=pause;$('start').onclick=start;$('restart').onclick=()=>{$('gameOverScreen').classList.add('hidden');start()};$('resume').onclick=pause;$('next').onclick=next;window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft')keys.left=true;if(e.code==='ArrowRight')keys.right=true;if(e.code==='Space'||e.code==='KeyA'||e.code==='ArrowUp')keys.jump=true;if(e.code==='Escape')pause()});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false;if(e.code==='Space'||e.code==='KeyA'||e.code==='ArrowUp')keys.jump=false});resize();build();hud();requestAnimationFrame(loop)})();
</script>
</body>
</html>
