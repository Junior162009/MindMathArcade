<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>🏰 Reino Pixelado</title><style>*{box-sizing:border-box;margin:0;padding:0;user-select:none}html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial;touch-action:none}#gameArea{height:58%;background:#5c94fc;position:absolute;top:0;left:0;right:0}#game{width:100%;height:100%;display:block}#hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:94%;padding:6px;background:#14141ddd;border:2px solid #f8b800;border-radius:12px;color:#fff;display:flex;justify-content:space-around;font-weight:bold;font-size:clamp(11px,2.7vw,18px)}.btn{position:absolute;border:3px solid #777;background:linear-gradient(#444,#202020);color:#fff;font-weight:bold;box-shadow:inset 0 2px #888,0 5px #090909}.arrow{width:68px;height:68px;border-radius:18px;font-size:31px;top:79%}#left{left:7%}#right{left:calc(7% + 80px)}#jump{right:8%;top:76%;width:84px;height:84px;border-radius:50%;background:linear-gradient(#d94a4a,#8d2020);font-size:30px}#pause{right:calc(8% + 100px);top:calc(76% - 48px);width:58px;height:42px;border-radius:12px}.screen{position:absolute;z-index:30;top:50%;left:50%;transform:translate(-50%,-50%);background:#101820;color:#fff;border:3px solid #f8b800;border-radius:18px;padding:28px;text-align:center;min-width:290px;max-width:90%}.screen button{padding:13px 25px;border:0;border-radius:10px;background:#f8b800;font-size:17px;font-weight:bold}.hidden{display:none!important}#answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}#answers button{padding:12px;border:2px solid #f8b800;border-radius:9px;background:#263241;color:#fff;font-size:17px}</style></head><body><div id="gameArea"><canvas id="game"></canvas><div id="hud">❤️ <b id="vidas">3</b>　🪙 <b id="monedas">0</b>　⭐ <b id="puntos">0</b>　⏱ <b id="tiempo">300</b>　🌎 <b id="nivel">1</b></div></div><button class="btn arrow" id="left">◀</button><button class="btn arrow" id="right">▶</button><button class="btn" id="pause">Ⅱ</button><button class="btn" id="jump">A</button><div id="startScreen" class="screen"><h1>🏰 Reino Pixelado</h1><p>Corre, salta, derrota enemigos, recoge monedas y llega a la bandera.</p><button id="start">Iniciar Aventura</button></div><div id="pauseScreen" class="screen hidden"><h2>⏸ Pausa</h2><button id="resume">Continuar</button></div><div id="gameOverScreen" class="screen hidden"><h2>💀 Fin del juego</h2><p>Puntuación: <b id="finalScore">0</b></p><button id="restart">Reintentar</button></div><div id="winScreen" class="screen hidden"><h2>🏆 ¡Nivel superado!</h2><p>Puntuación: <b id="winScore">0</b></p><button id="next">Siguiente nivel</button></div><div id="questionScreen" class="screen hidden"><h2>🧠 ¡Pregunta!</h2><p>Si respondes bien conservas el corazón.</p><div id="questionBox"></div><div id="answers"></div><p id="msg"></p></div><script src="/js/tecnomath-progress.js?v=4"></script><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),A=document.getElementById('gameArea'),$=i=>document.getElementById(i);let W,H,G,cam=0,run=false,pause=false,lvl=1,lives=3,coins=0,score=0,time=300,timer,q=false,sessionCorrect=0,sessionWrong=0,sessionRecorded=false;const k={l:0,r:0,j:0},P={x:100,y:0,w:36,h:50,vy:0,ground:false,cp:100,inv:0};const pits=[[900,1020],[2200,2330],[3550,3690],[4300,4470]],WORLD=5600,questions=[['¿Cuánto es 7 + 5?',['10','12','13','14'],1],['¿Cuánto es 9 × 3?',['18','21','27','30'],2],['¿Cuánto es 20 ÷ 4?',['4','5','6','8'],1],['¿Cuánto es 15 − 7?',['6','7','8','9'],2]];let blocks,cs,es;function size(){W=c.width=A.clientWidth;H=c.height=A.clientHeight;G=H-82;P.y=G-P.h}function col(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function pit(z){return pits.some(p=>z>p[0]&&z<p[1])}function build(){blocks=[{x:420,b:160,w:42,h:42,t:0},{x:462,b:160,w:42,h:42,t:1,u:0},{x:504,b:160,w:42,h:42,t:0},{x:1180,b:230,w:42,h:42,t:1,u:0},{x:1600,b:160,w:42,h:42,t:0},{x:1642,b:160,w:42,h:42,t:0},{x:1684,b:160,w:42,h:42,t:1,u:0},{x:2600,b:210,w:42,h:42,t:0},{x:3000,b:160,w:42,h:42,t:1,u:0},{x:3900,b:230,w:42,h:42,t:0},{x:3942,b:230,w:42,h:42,t:0}];blocks.forEach(b=>b.y=G-b.b);cs=[];for(let z=280;z<5200;z+=180)if(!pit(z))cs.push({x:z,y:G-65,w:22,h:22,t:0});es=[650,1450,1950,2950,3350,4600].map((z,i)=>({x:z,y:G-40,w:40,h:40,v:(2+lvl*.2)*(i%2?1:-1),m:z-80,M:z+130,dead:0,type:i%lvl}));P.cp=100}function hud(){$('vidas').textContent=lives;$('monedas').textContent=coins;$('puntos').textContent=score;$('tiempo').textContent=time;$('nivel').textContent=lvl}function ask(){if(q)return;q=1;run=0;let z=questions[Math.floor(Math.random()*questions.length)];$('questionBox').textContent=z[0];$('answers').innerHTML='';$('msg').textContent='';z[1].forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(i===z[2]);$('answers').appendChild(b)});$('questionScreen').classList.remove('hidden')}function answer(ok){$('answers').querySelectorAll('button').forEach(b=>b.disabled=1);if(ok){sessionCorrect++;$('msg').textContent='✅ Correcto. Conservas el corazón.';setTimeout(closeQ,650)}else{sessionWrong++;$('msg').textContent='❌ Incorrecto. Pierdes un corazón.';lives--;setTimeout(()=>{closeQ();if(lives<=0)over()},800)}hud()}function closeQ(){$('questionScreen').classList.add('hidden');q=0;if(lives>0){P.x=Math.max(100,P.cp);P.y=G-P.h;P.vy=0;P.inv=90;run=1}}function move(){let d=k.r?5:k.l?-5:0;P.x=Math.max(0,Math.min(WORLD-P.w,P.x+d));if(k.j&&P.ground){P.vy=-15;P.ground=0;k.j=0}P.vy+=.72;P.y+=P.vy;P.y=Math.min(P.y,H+120);P.ground=0;blocks.forEach(b=>{if(col(P,b)){if(P.vy>0){P.y=b.y-P.h;P.vy=0;P.ground=1}else if(P.vy<0){P.y=b.y+b.h;P.vy=0;if(b.t&&!b.u){b.u=1;coins++;score+=15}}}});if(!pit(P.x+18)&&P.y+P.h>=G){P.y=G-P.h;P.vy=0;P.ground=1}if(P.y>H+80)ask();[850,2100,3400,4250].forEach(z=>{if(P.x>z)P.cp=z})}function update(){es.forEach(e=>{if(e.dead)return;e.x+=e.v;if(e.x<e.m||e.x>e.M)e.v*=-1;if(P.inv)P.inv--;if(!P.inv&&col(P,e)){if(P.vy>0&&P.y+P.h-e.y<24){e.dead=1;P.vy=-8;score+=20}else ask()}});cs.forEach(m=>{if(!m.t&&col(P,m)){m.t=1;coins++;score+=10}});cam=Math.max(0,Math.min(WORLD-W,P.x-W/2));if(P.x>WORLD-200)win()}function draw(){x.fillStyle='#5c94fc';x.fillRect(0,0,W,H);x.fillStyle='#fff9';for(let z=100;z<5200;z+=800){let s=z-cam*.4;x.beginPath();x.arc(s,80,25,0,7);x.arc(s+30,88,20,0,7);x.arc(s-30,88,20,0,7);x.fill()}let st=0;x.fillStyle='#8b5a2b';pits.forEach(p=>{x.fillRect(st-cam,G,p[0]-st,H-G);st=p[1]});x.fillRect(st-cam,G,WORLD-st,H-G);x.fillStyle='#3aa53a';x.fillRect(-cam,G,WORLD,12);blocks.forEach(b=>{x.fillStyle=b.t?(b.u?'#777':'#f8b800'):'#b5651d';x.fillRect(b.x-cam,b.y,b.w,b.h);x.strokeStyle='#542';x.strokeRect(b.x-cam,b.y,b.w,b.h);if(b.t&&!b.u){x.fillStyle='#fff';x.font='24px Arial';x.fillText('?',b.x-cam+13,b.y+29)}});cs.forEach(m=>{if(!m.t){x.fillStyle='#ffd23f';x.beginPath();x.arc(m.x-cam+11,m.y+11,11,0,7);x.fill()}});es.forEach(e=>{if(!e.dead){x.fillStyle=['#3fae4a','#4c1d95','#7f1d1d','#eee','#6b21a8'][e.type%5];x.beginPath();x.ellipse(e.x-cam+20,e.y+20,20,20,0,0,7);x.fill()}});x.fillStyle='#ccc';x.fillRect(WORLD-180-cam,G-210,7,210);x.fillStyle='#e63946';x.beginPath();x.moveTo(WORLD-173-cam,G-205);x.lineTo(WORLD-125-cam,G-185);x.lineTo(WORLD-173-cam,G-165);x.fill();if(!P.inv||Math.floor(P.inv/5)%2){let z=P.x-cam;x.fillStyle='#2b3a67';x.fillRect(z+4,P.y+34,10,16);x.fillRect(z+22,P.y+34,10,16);x.fillStyle='#e63946';x.fillRect(z+2,P.y+18,32,24);x.fillStyle='#ffd6a5';x.fillRect(z+5,P.y+5,26,20);x.fillStyle='#8b4513';x.fillRect(z+4,P.y+2,28,9)}}function recordResult(){if(sessionRecorded)return;sessionRecorded=true;if(window.TecnoMathProgress&&sessionCorrect+sessionWrong>0)window.TecnoMathProgress.gameResult('Reino Pixelado',{correct:sessionCorrect,wrong:sessionWrong,games:1,xp:sessionCorrect*25,coins:sessionCorrect*5,topic:'Matemáticas - Reino Pixelado'})}function loop(){if(run&&!pause&&!q){move();if(!q)update()}draw();requestAnimationFrame(loop)}function start(){lvl=1;lives=3;coins=0;score=0;time=300;sessionCorrect=0;sessionWrong=0;sessionRecorded=false;build();run=1;pause=0;$('startScreen').classList.add('hidden');$('gameOverScreen').classList.add('hidden');clearInterval(timer);timer=setInterval(()=>{if(run&&!pause&&!q&&--time<=0)over();hud()},1000);hud()}function over(){if(!run)return;run=0;clearInterval(timer);recordResult();$('finalScore').textContent=score;$('gameOverScreen').classList.remove('hidden')}function win(){if(!run)return;run=0;clearInterval(timer);recordResult();$('winScore').textContent=score;$('winScreen').classList.remove('hidden')}function next(){lvl=lvl>=5?1:lvl+1;lives=3;time=300;build();$('winScreen').classList.add('hidden');run=1;hud()}function pz(){if(!run||q)return;pause=!pause;$('pauseScreen').classList.toggle('hidden',!pause)}[['left','l'],['right','r'],['jump','j']].forEach(([id,key])=>{let b=$(id);b.onpointerdown=e=>{e.preventDefault();k[key]=1};b.onpointerup=b.onpointercancel=()=>k[key]=0});$('pause').onclick=pz;$('start').onclick=start;$('resume').onclick=pz;$('restart').onclick=()=>{$('gameOverScreen').classList.add('hidden');start()};$('next').onclick=next;addEventListener('keydown',e=>{if(e.code==='ArrowLeft')k.l=1;if(e.code==='ArrowRight')k.r=1;if(e.code==='Space'||e.code==='KeyA')k.j=1;if(e.code==='Escape')pz()});addEventListener('keyup',e=>{if(e.code==='ArrowLeft')k.l=0;if(e.code==='ArrowRight')k.r=0;if(e.code==='Space'||e.code==='KeyA')k.j=0});size();build();hud();loop()})()</script></body></html>
