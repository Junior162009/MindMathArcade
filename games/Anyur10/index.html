<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>StudyHub · Materias y Eventos</title>
    <style>
        /* ========== VARIABLES ========== */
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --transition: 0.2s ease;
            --nav-bg: #1e293b;
            --header-bg: #1e293b;
        }
        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #cbd5e1;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --nav-bg: #ffffff;
            --header-bg: #ffffff;
        }
        [data-accent="green"] { --accent: #22c55e; --accent-hover: #16a34a; }
        [data-accent="purple"] { --accent: #8b5cf6; --accent-hover: #7c3aed; }
        [data-accent="orange"] { --accent: #f59e0b; --accent-hover: #d97706; }

        /* ========== RESET ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background var(--transition), color var(--transition);
        }
        #app {
            width: 100%;
            max-width: 480px;
            height: 780px;
            background: var(--bg-secondary);
            border-radius: 32px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: background var(--transition), border-color var(--transition);
        }

        /* ========== HEADER ========== */
        .header {
            background: var(--header-bg);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            transition: background var(--transition);
        }
        .header .brand {
            font-weight: 800;
            font-size: 20px;
            color: var(--accent);
        }
        .header .brand span { color: var(--text-primary); }
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .header-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: color var(--transition);
        }
        .header-actions button:hover { color: var(--accent); }

        /* ========== PÁGINAS ========== */
        .pages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px 10px 18px;
            scroll-behavior: smooth;
        }
        .page {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .page.active { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== NAV ========== */
        .bottom-nav {
            background: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 12px 0;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            transition: background var(--transition);
            flex-wrap: wrap;
        }
        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 12px;
            transition: 0.2s;
        }
        .nav-btn .nav-icon { font-size: 20px; line-height: 1.2; }
        .nav-btn.active {
            color: var(--accent);
            background: var(--bg-input);
            padding: 4px 14px;
        }
        .nav-btn:active { transform: scale(0.92); }

        /* ========== COMPONENTES ========== */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: background var(--transition), border-color var(--transition);
        }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.95); }
        .btn:hover { background: var(--accent-hover); }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-primary);
        }
        .btn-outline:hover { background: var(--bg-input); border-color: var(--accent); }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #22c55e; }
        .btn-success:hover { background: #16a34a; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }

        .input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .input-group input, .input-group select {
            flex: 1;
            min-width: 100px;
            padding: 8px 12px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 13px;
            transition: border-color var(--transition);
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .info { flex: 1; }
        .list-item .info .title { font-weight: 600; }
        .list-item .info .sub { font-size: 13px; color: var(--text-secondary); }
        .list-item .actions { display: flex; gap: 6px; }

        .empty-state {
            text-align: center;
            padding: 20px 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .badge {
            background: var(--accent);
            color: white;
            border-radius: 40px;
            padding: 2px 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-success { background: #22c55e; }
        .badge-danger { background: #ef4444; }

        /* ========== MATERIAS ========== */
        .subject-tag {
            display: inline-block;
            background: var(--bg-input);
            padding: 4px 12px;
            border-radius: 40px;
            margin: 2px 4px 2px 0;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }
        .subject-tag .remove-subject {
            cursor: pointer;
            margin-left: 6px;
            color: var(--text-secondary);
            font-weight: bold;
        }
        .subject-tag .remove-subject:hover { color: #ef4444; }

        /* ========== EVENTOS ========== */
        .event-item {
            border-left: 4px solid var(--accent);
            padding-left: 12px;
            margin-bottom: 10px;
        }
        .event-item .event-title { font-weight: 700; }
        .event-item .event-detail { font-size: 13px; color: var(--text-secondary); }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 500px) {
            #app { height: 100vh; border-radius: 0; max-width: 100%; }
        }
        .pages-container::-webkit-scrollbar { width: 4px; }
        .pages-container::-webkit-scrollbar-track { background: transparent; }
        .pages-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="app">
        <!-- HEADER -->
        <div class="header">
            <div class="brand">Study<span>Hub</span></div>
            <div class="header-actions">
                <button id="themeToggle" title="Tema">🌙</button>
                <button id="accentToggle" title="Color">🎨</button>
            </div>
        </div>

        <!-- PÁGINAS -->
        <div class="pages-container" id="pagesContainer">
            <!-- INICIO -->
            <div class="page active" id="page-home">
                <div class="card">
                    <div class="card-title">📊 Resumen</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:center;">
                        <div><div style="font-size:24px;">📚</div><div><strong id="home-subjects">0</strong> materias</div></div>
                        <div><div style="font-size:24px;">📅</div><div><strong id="home-events">0</strong> eventos</div></div>
                        <div><div style="font-size:24px;">📝</div><div><strong id="home-tasks">0</strong> tareas</div></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title">⏳ Próximos eventos</div>
                    <div id="home-upcoming-events" class="empty-state">No hay eventos próximos.</div>
                </div>
                <div class="card">
                    <div class="card-title">📚 Mis materias</div>
                    <div id="home-subject-list" class="empty-state">No hay materias.</div>
                </div>
            </div>

            <!-- MATERIAS -->
            <div class="page" id="page-subjects">
                <div class="card">
                    <div class="card-title">📚 Materias</div>
                    <div class="input-group">
                        <input type="text" id="subject-input" placeholder="Nueva materia" />
                        <button class="btn btn-sm" id="subject-add-btn">+ Agregar</button>
                    </div>
                    <div id="subject-list"></div>
                    <div style="margin-top:10px; font-size:13px; color:var(--text-secondary);">
                        <span>Materias predefinidas: </span>
                        <span id="predefined-subjects"></span>
                    </div>
                </div>
            </div>

            <!-- EVENTOS -->
            <div class="page" id="page-events">
                <div class="card">
                    <div class="card-title">📅 Eventos</div>
                    <div class="input-group">
                        <input type="text" id="event-title" placeholder="Título (ej: Exposición)" />
                        <select id="event-subject">
                            <option value="">Selecciona materia</option>
                        </select>
                        <input type="date" id="event-date" />
                        <input type="time" id="event-time" />
                        <button class="btn btn-sm" id="event-add-btn">+ Agregar</button>
                    </div>
                    <div id="event-list"></div>
                </div>
            </div>

            <!-- TAREAS (resumen) -->
            <div class="page" id="page-tasks">
                <div class="card">
                    <div class="card-title">📝 Tareas</div>
                    <div class="input-group">
                        <input type="text" id="task-title" placeholder="Título" />
                        <input type="date" id="task-due" />
                        <button class="btn btn-sm" id="task-add-btn">+ Añadir</button>
                    </div>
                    <div id="task-list"></div>
                </div>
            </div>

            <!-- CONFIGURACIÓN -->
            <div class="page" id="page-settings">
                <div class="card">
                    <div class="card-title">⚙️ Configuración</div>
                    <div style="display:flex; flex-direction:column; gap:12px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span>Tema oscuro</span>
                            <label>
                                <input type="checkbox" id="darkModeToggle" checked />
                            </label>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span>Color principal</span>
                            <select id="accent-select" style="background:var(--bg-input); color:var(--text-primary); border:1px solid var(--border-color); border-radius:40px; padding:4px 12px;">
                                <option value="blue">Azul</option>
                                <option value="green">Verde</option>
                                <option value="purple">Púrpura</option>
                                <option value="orange">Naranja</option>
                            </select>
                        </div>
                        <button class="btn btn-danger" id="reset-data-btn">🔄 Restablecer todos los datos</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- NAVEGACIÓN INFERIOR -->
        <div class="bottom-nav">
            <button class="nav-btn active" data-page="home"><span class="nav-icon">🏠</span> Inicio</button>
            <button class="nav-btn" data-page="subjects"><span class="nav-icon">📚</span> Materias</button>
            <button class="nav-btn" data-page="events"><span class="nav-icon">📅</span> Eventos</button>
            <button class="nav-btn" data-page="tasks"><span class="nav-icon">📝</span> Tareas</button>
            <button class="nav-btn" data-page="settings"><span class="nav-icon">⚙️</span> Config</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  STUDYHUB - MATERIAS Y EVENTOS CON NOTIFICACIONES
        // ================================================================

        // ---------- MATERIAS PREDEFINIDAS ----------
        const PREDEFINED_SUBJECTS = [
            'Matemáticas', 'Lengua', 'Ciencias', 'Historia', 'Inglés',
            'Arte', 'Música', 'Educación Física', 'Tecnología',
            'Química', 'Física', 'Biología', 'Geografía', 'Filosofía'
        ];

        // ---------- ESTADO PREDETERMINADO ----------
        const defaultData = {
            subjects: [...PREDEFINED_SUBJECTS],
            events: [],
            tasks: [],
            settings: {
                darkMode: true,
                accent: 'blue'
            }
        };

        let data = loadData();

        function loadData() {
            const raw = localStorage.getItem('studyhubData_v2');
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    // Asegurar que subjects exista y contenga las predefinidas si no tiene
                    if (!parsed.subjects || parsed.subjects.length === 0) {
                        parsed.subjects = [...PREDEFINED_SUBJECTS];
                    }
                    if (!parsed.events) parsed.events = [];
                    if (!parsed.tasks) parsed.tasks = [];
                    if (!parsed.settings) parsed.settings = { darkMode: true, accent: 'blue' };
                    return parsed;
                } catch (e) {
                    return JSON.parse(JSON.stringify(defaultData));
                }
            }
            return JSON.parse(JSON.stringify(defaultData));
        }

        function saveData() {
            localStorage.setItem('studyhubData_v2', JSON.stringify(data));
            updateAllUI();
        }

        // ---------- UTILIDADES ----------
        function todayStr() {
            return new Date().toISOString().split('T')[0];
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
        }

        function formatDateTime(dateStr, timeStr) {
            if (!dateStr || !timeStr) return formatDate(dateStr);
            const d = new Date(dateStr + 'T' + timeStr);
            return d.toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        // ---------- NOTIFICACIONES ----------
        function showNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body, icon: '📚' });
            } else if ('Notification' in window && Notification.permission !== 'denied') {
                Notification.requestPermission();
            }
            // También mostramos alerta si no hay notificaciones
            if (!('Notification' in window) || Notification.permission !== 'granted') {
                alert(`🔔 ${title}\n${body}`);
            }
        }

        // ---------- ACTUALIZACIÓN UI ----------
        function updateAllUI() {
            updateHome();
            updateSubjects();
            updateEvents();
            updateTasks();
            applyTheme();
            updateSubjectSelect();
        }

        // ---------- INICIO ----------
        function updateHome() {
            document.getElementById('home-subjects').innerText = data.subjects.length;
            document.getElementById('home-events').innerText = data.events.length;
            document.getElementById('home-tasks').innerText = data.tasks.filter(t => !t.completed).length;

            // Próximos eventos (próximos 7 días)
            const today = new Date();
            const upcoming = data.events.filter(e => {
                const evDate = new Date(e.date + 'T' + (e.time || '00:00'));
                const diff = (evDate - today) / (1000 * 60 * 60 * 24);
                return diff >= 0 && diff <= 7;
            }).sort((a, b) => new Date(a.date + 'T' + (a.time || '00:00')) - new Date(b.date + 'T' + (b.time || '00:00')));

            const container = document.getElementById('home-upcoming-events');
            if (upcoming.length === 0) {
                container.innerHTML = '<div class="empty-state">No hay eventos próximos.</div>';
            } else {
                container.innerHTML = upcoming.slice(0, 5).map(e =>
                    `<div class="event-item">
                        <div class="event-title">${e.title}</div>
                        <div class="event-detail">${e.subject ? '📚 ' + e.subject : ''} · ${formatDateTime(e.date, e.time)}</div>
                    </div>`
                ).join('');
            }

            // Lista de materias en home
            const subContainer = document.getElementById('home-subject-list');
            if (data.subjects.length === 0) {
                subContainer.innerHTML = '<div class="empty-state">No hay materias.</div>';
            } else {
                subContainer.innerHTML = data.subjects.slice(0, 10).map(s =>
                    `<span class="subject-tag">${s}</span>`
                ).join(' ') + (data.subjects.length > 10 ? ' ...' : '');
            }
        }

        // ---------- MATERIAS ----------
        function updateSubjects() {
            const list = document.getElementById('subject-list');
            if (data.subjects.length === 0) {
                list.innerHTML = '<div class="empty-state">No hay materias. Agrega una.</div>';
                return;
            }
            list.innerHTML = data.subjects.map((s, i) =>
                `<div class="list-item">
                    <span>${s}</span>
                    <button class="btn btn-danger btn-sm" onclick="removeSubject(${i})">✕</button>
                </div>`
            ).join('');

            // Mostrar predefinidas
            const predefinedDiv = document.getElementById('predefined-subjects');
            predefinedDiv.innerHTML = PREDEFINED_SUBJECTS.map(s =>
                `<span class="subject-tag" style="background:var(--bg-card);">${s}</span>`
            ).join(' ');
        }

        window.removeSubject = function(index) {
            const subject = data.subjects[index];
            if (PREDEFINED_SUBJECTS.includes(subject)) {
                if (!confirm(`¿Eliminar la materia predefinida "${subject}"?`)) return;
            }
            data.subjects.splice(index, 1);
            saveData();
        };

        document.getElementById('subject-add-btn').addEventListener('click', function() {
            const input = document.getElementById('subject-input');
            const val = input.value.trim();
            if (!val) return alert('Escribe el nombre de la materia.');
            if (data.subjects.includes(val)) return alert('Ya existe esa materia.');
            data.subjects.push(val);
            input.value = '';
            saveData();
        });

        // ---------- EVENTOS ----------
        function updateEvents() {
            const list = document.getElementById('event-list');
            if (data.events.length === 0) {
                list.innerHTML = '<div class="empty-state">No hay eventos registrados.</div>';
                return;
            }
            // Ordenar por fecha
            const sorted = [...data.events].sort((a, b) => new Date(a.date + 'T' + (a.time || '00:00')) - new Date(b.date + 'T' + (b.time || '00:00')));
            list.innerHTML = sorted.map((e, i) => {
                const idx = data.events.indexOf(e);
                return `<div class="list-item">
                    <div class="info">
                        <div class="title">${e.title}</div>
                        <div class="sub">${e.subject ? '📚 ' + e.subject : ''} · ${formatDateTime(e.date, e.time)}</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-danger btn-sm" onclick="removeEvent(${idx})">✕</button>
                    </div>
                </div>`;
            }).join('');
        }

        window.removeEvent = function(index) {
            data.events.splice(index, 1);
            saveData();
        };

        document.getElementById('event-add-btn').addEventListener('click', function() {
            const title = document.getElementById('event-title').value.trim();
            const subject = document.getElementById('event-subject').value;
            const date = document.getElementById('event-date').value;
            const time = document.getElementById('event-time').value;
            if (!title || !date || !time) return alert('Completa todos los campos (título, fecha y hora).');
            if (!subject) return alert('Selecciona una materia.');

            data.events.push({ title, subject, date, time });
            document.getElementById('event-title').value = '';
            document.getElementById('event-date').value = '';
            document.getElementById('event-time').value = '';
            saveData();

            // Notificación inmediata si el evento es hoy
            if (date === todayStr()) {
                showNotification(`📅 Evento hoy: ${title}`, `Materia: ${subject} a las ${time}`);
            }
            // Recordatorio: si el evento es mañana, notificar ahora (simulado)
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            if (date === tomorrow.toISOString().split('T')[0]) {
                showNotification(`📅 Recordatorio: ${title} mañana`, `Materia: ${subject} a las ${time}`);
            }
        });

        function updateSubjectSelect() {
            const select = document.getElementById('event-subject');
            const current = select.value;
            select.innerHTML = '<option value="">Selecciona materia</option>' +
                data.subjects.map(s => `<option value="${s}">${s}</option>`).join('');
            if (current && data.subjects.includes(current)) select.value = current;
        }

        // ---------- TAREAS (básico) ----------
        function updateTasks() {
            const list = document.getElementById('task-list');
            if (data.tasks.length === 0) {
                list.innerHTML = '<div class="empty-state">No hay tareas.</div>';
                return;
            }
            list.innerHTML = data.tasks.map((t, i) =>
                `<div class="list-item">
                    <div class="info">
                        <div class="title" style="${t.completed ? 'text-decoration:line-through; color:var(--text-secondary);' : ''}">${t.title}</div>
                        <div class="sub">📅 ${t.due ? formatDate(t.due) : 'Sin fecha'}</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-success btn-sm" onclick="toggleTask(${i})">${t.completed ? '↩️' : '✅'}</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteTask(${i})">✕</button>
                    </div>
                </div>`
            ).join('');
        }

        window.toggleTask = function(index) {
            data.tasks[index].completed = !data.tasks[index].completed;
            saveData();
        };

        window.deleteTask = function(index) {
            data.tasks.splice(index, 1);
            saveData();
        };

        document.getElementById('task-add-btn').addEventListener('click', function() {
            const title = document.getElementById('task-title').value.trim();
            const due = document.getElementById('task-due').value;
            if (!title) return alert('Escribe un título.');
            data.tasks.push({ title, due, completed: false });
            document.getElementById('task-title').value = '';
            document.getElementById('task-due').value = '';
            saveData();
        });

        // ---------- TEMAS ----------
        function applyTheme() {
            const dark = data.settings.darkMode;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            document.getElementById('darkModeToggle').checked = dark;
            document.getElementById('themeToggle').innerText = dark ? '🌙' : '☀️';

            const accent = data.settings.accent || 'blue';
            document.documentElement.setAttribute('data-accent', accent);
            document.getElementById('accent-select').value = accent;
        }

        document.getElementById('themeToggle').addEventListener('click', function() {
            data.settings.darkMode = !data.settings.darkMode;
            saveData();
        });

        document.getElementById('darkModeToggle').addEventListener('change', function() {
            data.settings.darkMode = this.checked;
            saveData();
        });

        document.getElementById('accent-select').addEventListener('change', function() {
            data.settings.accent = this.value;
            saveData();
        });

        document.getElementById('accentToggle').addEventListener('click', function() {
            const colors = ['blue', 'green', 'purple', 'orange'];
            const current = data.settings.accent || 'blue';
            const idx = colors.indexOf(current);
            const next = colors[(idx + 1) % colors.length];
            data.settings.accent = next;
            document.getElementById('accent-select').value = next;
            saveData();
        });

        // ---------- REINICIAR ----------
        document.getElementById('reset-data-btn').addEventListener('click', function() {
            if (confirm('¿Seguro que quieres borrar todos los datos?')) {
                localStorage.removeItem('studyhubData_v2');
                data = JSON.parse(JSON.stringify(defaultData));
                saveData();
                alert('Datos restablecidos.');
                location.reload();
            }
        });

        // ---------- NAVEGACIÓN ----------
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const pageId = this.dataset.page;
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + pageId).classList.add('active');
                document.getElementById('pagesContainer').scrollTop = 0;
                updateAllUI();
            });
        });

        // ---------- INICIALIZACIÓN ----------
        // Pedir permiso de notificaciones
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Verificar eventos del día al cargar
        function checkTodayEvents() {
            const today = todayStr();
            data.events.forEach(e => {
                if (e.date === today) {
                    showNotification(`📅 Evento hoy: ${e.title}`, `Materia: ${e.subject} a las ${e.time}`);
                }
            });
        }

        saveData();
        checkTodayEvents();

        console.log('📚 StudyHub v2 con materias y eventos cargado.');
    </script>
</body>
</html>
