<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🍪 Cookie Clicker · TecnoMath</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#33200f,#100b07 55%,#050403);color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}.wrap{width:min(1050px,100%);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#17100b;border:2px solid #8b5a2b;border-radius:18px;padding:14px 16px;box-shadow:0 0 25px #000}.title{font-weight:900;font-size:clamp(20px,5vw,34px);color:#ffd166;text-shadow:0 3px #6b3d16}.user{font-size:13px;color:#ddd}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;background:#ffd166;color:#3b210c}.btn.secondary{background:#2a211b;color:#fff;border:1px solid #8b5a2b}.status{font-size:12px;margin-top:5px;color:#8dff9a}.layout{display:grid;grid-template-columns:1fr 360px;gap:18px;margin-top:18px}.panel{background:rgba(25,15,8,.95);border:2px solid #70451f;border-radius:20px;padding:20px;box-shadow:0 15px 40px #0008}.counter{text-align:center}.cookies{font-size:clamp(30px,8vw,58px);font-weight:900;color:#ffd166}.persec{color:#c9b9a5;margin:8px 0 18px}.cookie{width:min(280px,75vw);aspect-ratio:1;border:0;border-radius:50%;font-size:120px;cursor:pointer;background:radial-gradient(circle at 34% 30%,#d99045,#a75d27 60%,#6f3718);box-shadow:inset -18px -20px 0 #713717,0 16px 0 #3c1f0e,0 22px 35px #0009;transition:transform .08s}.cookie:active{transform:scale(.94) translateY(5px);box-shadow:inset -18px -20px 0 #713717,0 10px 0 #3c1f0e}.float{position:fixed;pointer-events:none;font-weight:900;color:#ffd166;text-shadow:0 2px #5d3212;animation:up .8s ease-out forwards;z-index:20}@keyframes up{to{transform:translateY(-90px);opacity:0}}h2{margin:0 0 14px;color:#ffd166}.shop{display:grid;gap:10px}.upgrade{width:100%;text-align:left;background:#21150d;color:#fff;border:1px solid #6d431f;border-radius:14px;padding:13px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.upgrade:hover{border-color:#ffd166;background:#2b1b0e}.upgrade:disabled{opacity:.4;cursor:not-allowed}.upgrade b{color:#ffd166}.small{font-size:12px;color:#bba996;line-height:1.45}.login{text-align:center;margin-top:15px;padding:12px;background:#20160e;border-radius:14px;border:1px dashed #8b5a2b}.save{font-size:12px;color:#9fc9ff;margin-top:8px;min-height:16px}.danger{margin-top:12px;color:#ff9a9a;background:#351414}.back{display:inline-block;color:#ffd166;text-decoration:none;margin-top:15px}@media(max-width:780px){.layout{grid-template-columns:1fr}.panel{padding:16px}.cookie{font-size:90px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div><div class="title">🍪 COOKIE CLICKER</div><div class="small">TecnoMath · Tu progreso viaja contigo</div></div><div class="user"><span id="userText">No has iniciado sesión</span><br><button class="btn" id="googleBtn">🔐 GUARDAR CON GOOGLE</button><button class="btn secondary" id="logoutBtn" hidden>CERRAR SESIÓN</button><div id="authStatus" class="status"></div></div></header>
<main class="layout">
<section class="panel counter"><div id="cookies" class="cookies">0 🍪</div><div id="perSec" class="persec">0 cookies por segundo</div><button id="cookieBtn" class="cookie" aria-label="Hacer una cookie">🍪</button><div id="saveStatus" class="save">Progreso local activo.</div><a class="back" href="../../index.html">← Volver a TecnoMath</a></section>
<section class="panel"><h2>🛒 Mejoras</h2><div class="shop" id="shop"></div><div class="login"><div class="small">Con Google puedes cerrar el juego, cambiar de dispositivo y recuperar automáticamente tus cookies.</div></div><button class="btn danger" id="resetBtn">Reiniciar partida</button></section>
</main></div>
<script>
const firebaseConfig={apiKey:'AIzaSyCfY0VT4fQ5emX4R2LdUXU3FxjBTtY7Gzc',authDomain:'tecnomath-sync-6058a.firebaseapp.com',databaseURL:'https://tecnomath-sync-6058a-default-rtdb.firebaseio.com',projectId:'tecnomath-sync-6058a',storageBucket:'tecnomath-sync-6058a.firebasestorage.app',messagingSenderId:'237823560752',appId:'1:237823560752:web:adc1e5b396b5a0e0d671f5'};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();
const KEY='tecnomath_cookie_clicker_v1';
const defaults={cookies:0,total:0,cps:0,clickPower:1,owned:{}};
const upgrades=[
{id:'cursor',name:'👆 Cursor',desc:'+1 cookie por segundo',base:15,cps:1},
{id:'grandma',name:'👵 Abuela',desc:'+8 cookies por segundo',base:100,cps:8},
{id:'farm',name:'🌾 Granja',desc:'+45 cookies por segundo',base:600,cps:45},
{id:'factory',name:'🏭 Fábrica',desc:'+250 cookies por segundo',base:3500,cps:250},
{id:'click',name:'💪 Click poderoso',desc:'+1 cookie por clic',base:250,click:1}
];
let game=loadLocal(),currentUser=null,saveTimer=null,lastTick=Date.now();
function loadLocal(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}'),owned:{...(JSON.parse(localStorage.getItem(KEY)||'{}').owned||{})}}}catch(e){return {...defaults,owned:{}}}}
function normalize(g){g={...defaults,...g};g.owned={...(g.owned||{})};return g}
function fmt(n){if(n<1000)return Math.floor(n).toLocaleString('es-CO');const units=['K','M','B','T','Qa','Qi'];let i=-1;while(n>=1000&&i<units.length-1){n/=1000;i++}return n.toFixed(n<10?2:n<100?1:0)+units[i]}
function price(u){return Math.floor(u.base*Math.pow(1.15,game.owned[u.id]||0))}
function render(){document.getElementById('cookies').textContent=fmt(game.cookies)+' 🍪';document.getElementById('perSec').textContent=fmt(game.cps)+' cookies por segundo';const shop=document.getElementById('shop');shop.innerHTML='';upgrades.forEach(u=>{const count=game.owned[u.id]||0,p=price(u),b=document.createElement('button');b.className='upgrade';b.disabled=game.cookies<p;b.innerHTML='<span><b>'+u.name+'</b><br><span class="small">'+u.desc+' · '+count+' compradas</span></span><strong>'+fmt(p)+' 🍪</strong>';b.onclick=()=>buy(u);shop.appendChild(b)})}
function persistLocal(){localStorage.setItem(KEY,JSON.stringify(game))}
function scheduleCloudSave(){if(!currentUser)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveCloud,700)}
async function saveCloud(){if(!currentUser)return;try{await db.ref('userProgress/'+currentUser.uid+'/cookieClicker').set({...game,updatedAt:firebase.database.ServerValue.TIMESTAMP});document.getElementById('saveStatus').textContent='☁️ Guardado en tu cuenta Google';}catch(e){document.getElementById('saveStatus').textContent='⚠️ No se pudo guardar en la nube; seguimos guardando localmente.'}}
async function loadCloud(user){const snap=await db.ref('userProgress/'+user.uid+'/cookieClicker').once('value');if(snap.exists()){game=normalize(snap.val());persistLocal();render();document.getElementById('saveStatus').textContent='☁️ Progreso recuperado de Google';}else{await saveCloud();}}
function buy(u){const p=price(u);if(game.cookies<p)return;game.cookies-=p;game.owned[u.id]=(game.owned[u.id]||0)+1;if(u.cps)game.cps+=u.cps;if(u.click)game.clickPower+=u.click;persistLocal();render();scheduleCloudSave()}
document.getElementById('cookieBtn').addEventListener('click',e=>{game.cookies+=game.clickPower;game.total+=game.clickPower;persistLocal();render();scheduleCloudSave();const f=document.createElement('span');f.className='float';f.textContent='+'+game.clickPower+' 🍪';f.style.left=e.clientX+'px';f.style.top=e.clientY+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),800)});
setInterval(()=>{const now=Date.now(),seconds=(now-lastTick)/1000;lastTick=now;if(game.cps>0){game.cookies+=game.cps*seconds;game.total+=game.cps*seconds;persistLocal();render();scheduleCloudSave()}},1000);
document.getElementById('googleBtn').onclick=async()=>{try{document.getElementById('authStatus').textContent='Conectando…';const provider=new firebase.auth.GoogleAuthProvider();await auth.signInWithPopup(provider)}catch(e){document.getElementById('authStatus').textContent='No se pudo iniciar con Google: '+(e.code||e.message)}};
document.getElementById('logoutBtn').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async user=>{currentUser=user;if(user){document.getElementById('userText').textContent='👤 '+(user.displayName||user.email);document.getElementById('googleBtn').hidden=true;document.getElementById('logoutBtn').hidden=false;document.getElementById('authStatus').textContent='Cuenta conectada';try{await loadCloud(user)}catch(e){document.getElementById('saveStatus').textContent='⚠️ No se pudo cargar la nube; usando partida local.'}}else{document.getElementById('userText').textContent='No has iniciado sesión';document.getElementById('googleBtn').hidden=false;document.getElementById('logoutBtn').hidden=true;document.getElementById('authStatus').textContent=''}});
document.getElementById('resetBtn').onclick=async()=>{if(!confirm('¿Reiniciar todas las cookies y mejoras?'))return;game={...defaults,owned:{}};persistLocal();render();if(currentUser){await db.ref('userProgress/'+currentUser.uid+'/cookieClicker').remove();document.getElementById('saveStatus').textContent='☁️ Partida reiniciada en la nube';}};
render();
</script>
</body></html>
