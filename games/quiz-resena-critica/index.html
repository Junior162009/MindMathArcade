<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>TecnoMath · Quiz</title><style>*{box-sizing:border-box}html{background:#040a12}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#17385b,#07111f 45%,#040a12);color:#f5f7fb}.wrap{max-width:900px;margin:auto;padding:30px 16px}.brand{font-weight:900;color:#45d6a5;letter-spacing:.08em;margin-bottom:16px}.card{background:#0d1b2ef5;border:1px solid #24405f;border-radius:22px;box-shadow:0 24px 70px #0008;overflow:hidden}.intro,.question,.result{padding:34px}.intro h1{font-size:clamp(32px,6vw,52px);margin:0 0 15px}.muted{color:#9db0c8;line-height:1.6}.namebox{margin-top:25px}.namebox label{display:block;font-weight:800;margin-bottom:8px}.namebox select{width:100%;padding:15px;border:1px solid #24405f;border-radius:12px;background:#081526;color:#fff;font-size:17px}.btn{border:0;border-radius:12px;padding:13px 18px;background:#45d6a5;color:#062017;font-weight:900;cursor:pointer;margin-top:20px}.btn:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.head{padding:17px 22px;border-bottom:1px solid #24405f;display:flex;gap:14px;align-items:center}.progress{height:8px;background:#06101d;border-radius:99px;overflow:hidden;flex:1}.progress span{display:block;height:100%;background:#45d6a5;width:0}.counter,.timer{font-weight:900}.timer{color:#ffc857}.qnum{color:#45d6a5;font-weight:900;font-size:13px}.question h2{font-size:clamp(23px,4vw,34px);line-height:1.25;margin:10px 0 25px}.answers{display:grid;gap:12px}.answer{width:100%;text-align:left;padding:16px;border:1px solid #24405f;border-radius:14px;background:#12243b;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.answer.sel{border-color:#45d6a5;background:#45d6a516}.foot{display:flex;justify-content:space-between;align-items:center}.score{font-size:64px;font-weight:1000;col
