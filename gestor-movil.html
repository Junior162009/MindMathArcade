<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Agregar Juego · Tecnomath</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script src="shared.js"></script>
    <style>
        :root { --neon-cyan:#00FFFF; --neon-pink:#FF00FF; --gold:#FFD700; --bg:#060610; --card:#0d0d1a; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:white; font-family:'Press Start 2P', cursive; padding:10px; max-width:500px; margin:0 auto; }
        h1 { text-align:center; color:var(--neon-cyan); font-size:14px; margin:15px 0; }
        .form-card { background:var(--card); padding:15px; border-radius:12px; }
        .form-card input, .form-card select { 
            width:100%; padding:8px; margin:6px 0; background:#0a0a1a; border:2px solid #333; 
            color:var(--neon-green); font-family:'Press Start 2P', cursive; font-size:7px; border-radius:8px;
        }
        .btn { font-family:'Press Start 2P', cursive; font-size:7px; padding:10px 16px; border:none; border-radius:8px; cursor:pointer; color:white; box-shadow:0 4px 0 rgba(0,0,0,0.3); }
        .btn-add { background:#4CAF50; width:100%; margin-top:10px; }
        .status { text-align:center; font-size:7px; color:var(--gold); margin-top:10px; }
    </style>
</head>
<body>
    <h1>➕ Agregar juego</h1>
    <div class="form-card">
        <input type="text" id="nombre" placeholder="Nombre del juego">
        <input type="text" id="descripcion" placeholder="Descripción breve">
        <input type="text" id="url" placeholder="URL o archivo local (ej: snake.html)">
        <input type="text" id="icono" placeholder="Emoji (ej: 🐍)">
        <select id="categoria">
            <option value="retro">retro</option>
            <option value="mates">mates</option>
            <option value="eco">eco</option>
            <option value="kids">kids</option>
            <option value="puzzle">puzzle</option>
            <option value="runners">runners</option>
            <option value="otros">otros</option>
        </select>
        <input type="text" id="imagen" placeholder="Imagen (opcional, ej: img/snake.png)">
        <button class="btn btn-add" onclick="agregarJuego()">➕ Agregar juego</button>
    </div>
    <div class="status" id="statusMsg"></div>

    <script>
        const OWNER = 'Junior162009';
        const REPO = 'MindMathArcade';
        const FILE = 'index.html';
        const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;
        const BRANCH = 'main';
        let token = localStorage.getItem('tecnomath_github_token');
        if (!token) {
            token = prompt('Token de GitHub:');
            if (!token) { document.body.innerHTML = '<h2 style="color:red;">Token requerido</h2>'; throw new Error('Token'); }
            localStorage.setItem('tecnomath_github_token', token);
        }
        let currentSHA = null;

        async function agregarJuego() {
            const nombre = document.getElementById('nombre').value.trim();
            const descripcion = document.getElementById('descripcion').value.trim();
            const url = document.getElementById('url').value.trim();
            const icono = document.getElementById('icono').value.trim();
            const categoria = document.getElementById('categoria').value;
            const imagen = document.getElementById('imagen').value.trim();

            if (!nombre || !url || !icono) { alert('Completa nombre, URL y emoji'); return; }

            try {
                // Obtener contenido actual
                const resp = await fetch(API, { headers: { Authorization: `token ${token}` } });
                const data = await resp.json();
                currentSHA = data.sha;
                let contenido = atob(data.content);

                const nuevaEntrada = `        {
            name: "${nombre}",
            desc: "${descripcion}",
            url: "${url}",
            imageUrl: "${imagen}",
            icon: "${icono}",
            category: "${categoria}"
        }`;

                const patron = /(const projects = \[)([\s\S]*?)(\];)/;
                const match = contenido.match(patron);
                if (!match) throw new Error('No se encontró projects');

                let proyectos = match[2];
                if (proyectos.trim()) {
                    proyectos = proyectos.rstrip() + ',\n' + nuevaEntrada + '\n    ';
                } else {
                    proyectos = '\n' + nuevaEntrada + '\n    ';
                }
                const nuevoContenido = contenido.slice(0, match.index) + match[1] + proyectos + match[3] + contenido.slice(match.index + match[0].length);

                const body = {
                    message: `Agregar juego ${nombre} desde gestor móvil`,
                    content: btoa(unescape(encodeURIComponent(nuevoContenido))),
                    sha: currentSHA,
                    branch: BRANCH
                };
                const putResp = await fetch(API, {
                    method: 'PUT',
                    headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!putResp.ok) throw new Error('Error al guardar');
                const putData = await putResp.json();
                currentSHA = putData.content.sha;
                document.getElementById('statusMsg').textContent = `✅ "${nombre}" agregado correctamente`;
                // Limpiar campos
                ['nombre','descripcion','url','icono','imagen'].forEach(id => document.getElementById(id).value = '');
            } catch (e) {
                document.getElementById('statusMsg').textContent = '❌ Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
